<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKF Bundle Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Boldonse&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.0/dist/cytoscape.min.js"></script>
<!-- fcose force layout (needs layout-base -> cose-base first) -->
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.5/lib/marked.umd.min.js"></script>
<!-- render ```mermaid fences inside the detail panel -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>
<style>
:root{
  --bg:#f4ecdb; --fg:#1d180f; --muted:#877a5e; --rule:#d6c8a8; --accent:#b45309;
  --panel:#efe5cf; --code:#e8dcc0;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"Boldonse","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a1610; --fg:#ede1c4; --muted:#8c7d5f; --rule:#34291c; --accent:#f5b041;
         --panel:#201b13; --code:#2a2318; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;display:flex;flex-direction:column;height:100vh}

/* Top bar */
body>header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 1rem;border-bottom:1px solid var(--rule);flex-wrap:wrap}
body>header .title{display:flex;align-items:baseline;gap:.75rem;white-space:nowrap}
body>header .title strong{font-family:var(--serif);font-weight:400;font-size:.95rem;color:var(--accent)}
.muted{color:var(--muted)}
.controls{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.controls input,.controls select,.controls button{font-family:var(--mono);font-size:.8rem;background:transparent;color:var(--fg);border:1px solid var(--rule);border-radius:4px;padding:.35rem .55rem}
.controls input{min-width:15rem}
.controls input::placeholder{color:var(--muted)}
.controls button{cursor:pointer}
.controls button:hover,.controls input:focus,.controls select:focus{border-color:var(--accent);outline:none}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.home{margin-right:.25rem;text-decoration:none;color:var(--accent)}
.home:hover{text-decoration:underline}

/* Graph + detail */
main{display:flex;flex:1;min-height:0}
#graph{flex:2;min-width:0;position:relative}
#detail{flex:1;max-width:460px;min-width:320px;border-left:1px solid var(--rule);padding:1rem 1.25rem 2rem;overflow:auto;background:var(--panel);line-height:1.55}

/* Legend: sits in the graph corner; each row is a filter toggle */
#legend{position:absolute;left:.75rem;bottom:.75rem;z-index:2;display:flex;flex-direction:column;gap:.2rem;padding:.5rem .6rem;border:1px solid var(--rule);border-radius:6px;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(3px);font-size:.75rem}
#legend button{display:flex;align-items:center;gap:.5rem;background:none;border:0;color:var(--fg);font:inherit;padding:.15rem .2rem;border-radius:4px;cursor:pointer;text-align:left}
#legend button:hover,#legend button.active{background:color-mix(in srgb, var(--accent) 14%, transparent)}
#legend button:focus-visible{outline:2px solid var(--accent)}
#legend .swatch{width:.7rem;height:.7rem;border-radius:50%;flex:none;border:1px solid color-mix(in srgb, var(--fg) 25%, transparent)}
#legend .swatch.square{border-radius:2px}
#legend .count{color:var(--muted);margin-left:auto;padding-left:.75rem}
#legend .hint{color:var(--muted);margin-top:.3rem;padding-top:.3rem;border-top:1px solid var(--rule)}
#legend .hint i{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;border:1.5px dashed var(--muted);vertical-align:-.1rem;margin-right:.35rem}

/* Detail panel */
.detail-header{margin-bottom:.5rem}
.detail-meta{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem}
.type-chip,.status-chip{display:inline-block;padding:.1rem .45rem;border-radius:4px;font-size:.7rem;letter-spacing:.02em}
.type-chip{color:#fff;border:1px solid transparent}
.status-chip{border:1px solid var(--rule);color:var(--muted)}
.status-chip.speculative{border-style:dashed}
.status-chip:empty{display:none}
#detail h1{font-family:var(--serif);font-weight:400;color:var(--accent);font-size:1.15rem;line-height:1.3;margin:.2rem 0 .15rem}
.detail-id{font-size:.75rem;word-break:break-all}
.open-page{display:inline-block;margin-top:.5rem;padding:.2rem .55rem;border:1px solid var(--rule);border-radius:4px;background:transparent;font-size:.75rem;text-decoration:none;color:var(--fg)}
.open-page:hover{border-color:var(--accent);color:var(--accent)}
.frontmatter{margin:.75rem 0;font-size:.85rem}
.frontmatter dt{color:var(--muted);font-size:.7rem;letter-spacing:.04em;margin-top:.55rem}
.frontmatter dd{margin:.1rem 0 0;word-break:break-word}
.tag{display:inline-block;margin:.1rem .3rem .1rem 0;padding:.05rem .4rem;border:1px solid var(--rule);border-radius:999px;font-size:.72rem;color:var(--muted)}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--rule);margin:1rem 0}

#detail-body{font-size:.85rem}
#detail-body h1,#detail-body h2,#detail-body h3,#detail h2{font-family:var(--serif);font-weight:400;color:var(--accent);line-height:1.3}
#detail-body h1{font-size:1rem;margin:1.2rem 0 .5rem}
#detail-body h2,#detail h2{font-size:.9rem;margin:1.2rem 0 .45rem}
#detail-body h3{font-size:.85rem;margin:1rem 0 .4rem}
#detail-body p,#detail-body ul,#detail-body ol{margin:.5rem 0}
#detail-body li{margin:.2rem 0}
#detail-body code{font-size:.8em;background:var(--code);padding:.05rem .3rem;border-radius:3px}
#detail-body pre{background:var(--code);padding:.6rem .75rem;border-radius:5px;overflow:auto;font-size:.75rem;line-height:1.45}
#detail-body pre code{background:none;padding:0;font-size:inherit}
#detail-body table{border-collapse:collapse;font-size:.78rem;display:block;overflow-x:auto}
#detail-body th,#detail-body td{border:1px solid var(--rule);padding:.25rem .5rem;text-align:left}
#detail-body blockquote{margin:.5rem 0;padding:.1rem .75rem;border-left:3px solid var(--rule);color:var(--muted)}
#detail-body img{max-width:100%}
/* Flowcharts are wide; keep them legible and let the block scroll sideways. */
#detail-body .mermaid{margin:.75rem 0;overflow-x:auto}
#detail-body .mermaid svg{min-width:640px;width:100%!important;max-width:none!important;height:auto}
#links-list,#backlinks-list{list-style:none;padding:0;margin:.25rem 0;font-size:.82rem}
#links-list li,#backlinks-list li{margin:.2rem 0}
#links-list a,#backlinks-list a{cursor:pointer}
#links-list .kind-dot,#backlinks-list .kind-dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.45rem;vertical-align:0}

@media (max-width: 900px){
  main{flex-direction:column}
  #graph{flex:1 1 55vh;min-height:320px}
  #detail{max-width:none;min-width:0;flex:1 1 45vh;border-left:0;border-top:1px solid var(--rule)}
  .controls input{min-width:10rem}
  body>header .title{white-space:normal}
  #graph-stats{display:none}
  #legend{flex-direction:row;flex-wrap:wrap;gap:.1rem .6rem;left:.5rem;right:.5rem;bottom:.5rem;padding:.35rem .5rem}
  #legend .count{margin-left:.25rem;padding-left:0}
  #legend .hint{flex-basis:100%;margin-top:.1rem;padding-top:.2rem}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

</style>
</head>
<body>
<header>
  <div class="title">
    <a class="home" href="." target="_top">← let-go-wiki</a>
    <strong id="bundle-name">Knowledge graph</strong>
    <span class="muted" id="graph-stats"></span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Find a page or tag" aria-label="Find a page or tag">
    <select id="filter-type" aria-label="Show only one kind of page">
      <option value="">Every kind</option>
    </select>
    <select id="layout" aria-label="Layout">
      <option value="fcose">Force layout</option>
      <option value="concentric">Concentric</option>
      <option value="breadthfirst">Tree</option>
      <option value="circle">Circle</option>
      <option value="grid">Grid</option>
    </select>
    <button id="reset">Fit to view</button>
  </div>
</header>

<main>
  <section id="graph">
    <div id="legend" aria-label="Legend"></div>
  </section>
  <section id="detail">
    <div id="detail-empty" class="muted">Select a node to read the page. Its neighbours light up; everything else fades.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <div class="detail-meta">
          <span class="type-chip" id="detail-type"></span>
          <span class="status-chip" id="detail-status"></span>
        </div>
        <h1 id="detail-title"></h1>
        <div class="detail-id muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-links" hidden>
        <h2>Links to</h2>
        <ul id="links-list"></ul>
      </section>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

<script>
window.BUNDLE_NAME = "let-go-wiki";
window.BUNDLE = {"nodes": [{"data": {"id": "concepts/block-interface-and-liveness", "label": "Block Interface and Liveness", "type": "Concept", "kind": "Concept", "status": "stable", "description": "Block-args as the stack VM's substitute for locals, the shared per-block liveness analysis, the block-arg classifier and its census (rematerialize, slot, thread), the cross-block rejection in the bytecode lowering, and the measured cost that motivates erasing block-args.", "resource": "https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/liveness.lg", "tags": ["compiler", "vm", "bytecode"], "url": "concepts/block-interface-and-liveness/", "color": "#2e7d80", "colorDark": "#6cc0c3", "size": 34, "citedBy": 5}}, {"data": {"id": "concepts/bytecode-compiler", "label": "Bytecode Compiler", "type": "Concept", "kind": "Concept", "status": "stable", "description": "How let-go compiles source code to bytecode: the reader, Indexed-RPN IR intermediate form, and code emission pipeline.", "resource": "https://github.com/nooga/let-go/tree/main/pkg/compiler", "tags": ["compiler", "bytecode", "vm"], "url": "concepts/bytecode-compiler/", "color": "#2e7d80", "colorDark": "#6cc0c3", "size": 44, "citedBy": 18}}, {"data": {"id": "concepts/bytecode-lowering", "label": "Bytecode Lowering", "type": "Concept", "kind": "Concept", "status": "stable", "description": "How ir.lower turns an optimized IR function into stack bytecode: source-order emission with stable slots and DUP_NTH for reuse, cheap-load re-emission, junk-below accounting and the agreement rule, RPO emission order, tail-call fusion, the def+name* seam, and the shape ratchet that pins what it emits.", "resource": "https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower.lg", "tags": ["compiler", "bytecode", "vm"], "url": "concepts/bytecode-lowering/", "color": "#2e7d80", "colorDark": "#6cc0c3", "size": 42, "citedBy": 7}}, {"data": {"id": "concepts/compile-paths", "label": "Compile Paths", "type": "Concept", "kind": "Concept", "status": "stable", "description": "The three ways a let-go form becomes executable: the direct bytecode compiler, the IR path behind *ir-compile*, and Go lowering; the hybrid fallback between them and how coverage is measured.", "resource": "https://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg", "tags": ["compiler", "bytecode", "vm", "go"], "url": "concepts/compile-paths/", "color": "#2e7d80", "colorDark": "#6cc0c3", "size": 44, "citedBy": 12}}, {"data": {"id": "concepts/concurrency-model", "label": "Concurrency & Dynamic Binding Model", "type": "Concept", "kind": "Concept", "status": "active", "description": "Goroutine-local dynamic bindings and scoped async supervision for concurrent namespace and binding isolation.", "resource": "https://github.com/nooga/let-go/blob/main/pkg/vm/exec_context.go", "tags": ["runtime", "lisp", "vm"], "url": "concepts/concurrency-model/", "color": "#2e7d80", "colorDark": "#6cc0c3", "size": 22, "citedBy": 2}}, {"data": {"id": "concepts/debug-info", "label": "Debug Info & Source Maps", "type": "Concept", "kind": "Concept", "status": "active", "description": "Mapping bytecode back to source locations and local variable names for readable crash traces and error reporting.", "resource": "https://github.com/nooga/let-go/blob/main/pkg/vm/source.go", "tags": ["compiler", "bytecode", "vm", "tooling"], "url": "concepts/debug-info/", "color": "#2e7d80", "colorDark": "#6cc0c3", "size": 30, "citedBy": 4}}, {"data": {"id": "concepts/deftype-and-protocols", "label": "deftype & Protocols", "type": "Concept", "kind": "Concept", "status": "speculative", "description": "Custom types and protocol-based polymorphism in let-go, unifying Clojure's deftype/defprotocol with native Go lowering.", "resource": "https://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg", "tags": ["clojure", "runtime", "stdlib"], "url": "concepts/deftype-and-protocols/", "color": "#2e7d80", "colorDark": "#6cc0c3", "size": 14, "citedBy": 0}}, {"data": {"id": "id": "sources/docs-regenerating-generated-artifacts__concepts/generated-artifacts", "source": "sources/docs-regenerating-generated-artifacts", "target": "concepts/generated-artifacts"}}, {"data": {"id": "sources/docs-regenerating-generated-artifacts__concepts/runtime-image", "source": "sources/docs-regenerating-generated-artifacts", "target": "concepts/runtime-image"}}, {"data": {"id": "sources/epic-574-ir-normalization__ideas/ir-representation-roadmap", "source": "sources/epic-574-ir-normalization", "target": "ideas/ir-representation-roadmap"}}, {"data": {"id": "sources/epic-574-ir-normalization__concepts/structurize", "source": "sources/epic-574-ir-normalization", "target": "concepts/structurize"}}, {"data": {"id": "sources/epic-574-ir-normalization__concepts/bytecode-lowering", "source": "sources/epic-574-ir-normalization", "target": "concepts/bytecode-lowering"}}, {"data": {"id": "sources/epic-574-ir-normalization__concepts/op-catalog", "source": "sources/epic-574-ir-normalization", "target": "concepts/op-catalog"}}, {"data": {"id": "sources/epic-575-block-interface__concepts/block-interface-and-liveness", "source": "sources/epic-575-block-interface", "target": "concepts/block-interface-and-liveness"}}, {"data": {"id": "sources/epic-575-block-interface__ideas/ir-representation-roadmap", "source": "sources/epic-575-block-interface", "target": "ideas/ir-representation-roadmap"}}, {"data": {"id": "sources/epic-575-block-interface__concepts/bytecode-lowering", "source": "sources/epic-575-block-interface", "target": "concepts/bytecode-lowering"}}, {"data": {"id": "sources/guide-clojure-compatibility__references/clojure-compat", "source": "sources/guide-clojure-compatibility", "target": "references/clojure-compat"}}, {"data": {"id": "sources/guide-embedding-in-go__concepts/go-interop", "source": "sources/guide-embedding-in-go", "target": "concepts/go-interop"}}, {"data": {"id": "sources/guide-resources-and-source-paths__entities/let-go", "source": "sources/guide-resources-and-source-paths", "target": "entities/let-go"}}, {"data": {"id": "sources/guide-resources-and-source-paths__sources/let-go-readme", "source": "sources/guide-resources-and-source-paths", "target": "sources/let-go-readme"}}, {"data": {"id": "sources/guide-resources-and-source-paths__sources/design-runtime-image", "source": "sources/guide-resources-and-source-paths", "target": "sources/design-runtime-image"}}, {"data": {"id": "sources/guide-usage__entities/let-go", "source": "sources/guide-usage", "target": "entities/let-go"}}, {"data": {"id": "sources/guide-usage__concepts/bytecode-compiler", "source": "sources/guide-usage", "target": "concepts/bytecode-compiler"}}, {"data": {"id": "sources/guide-usage__projects/lgx", "source": "sources/guide-usage", "target": "projects/lgx"}}, {"data": {"id": "sources/guide-usage__concepts/wasm-compilation", "source": "sources/guide-usage", "target": "concepts/wasm-compilation"}}, {"data": {"id": "sources/issue-786-compiler-namespaces__ideas/compiler-namespace-architecture", "source": "sources/issue-786-compiler-namespaces", "target": "ideas/compiler-namespace-architecture"}}, {"data": {"id": "sources/issue-786-compiler-namespaces__concepts/generated-artifacts", "source": "sources/issue-786-compiler-namespaces", "target": "concepts/generated-artifacts"}}, {"data": {"id": "sources/issue-786-compiler-namespaces__concepts/go-backend", "source": "sources/issue-786-compiler-namespaces", "target": "concepts/go-backend"}}, {"data": {"id": "sources/let-go-readme__entities/let-go", "source": "sources/let-go-readme", "target": "entities/let-go"}}, {"data": {"id": "sources/let-go-readme__concepts/bytecode-compiler", "source": "sources/let-go-readme", "target": "concepts/bytecode-compiler"}}, {"data": {"id": "sources/let-go-readme__concepts/wasm-compilation", "source": "sources/let-go-readme", "target": "concepts/wasm-compilation"}}, {"data": {"id": "sources/let-go-readme__ideas/nrepl-in-browser", "source": "sources/let-go-readme", "target": "ideas/nrepl-in-browser"}}, {"data": {"id": "sources/let-go-source-code__concepts/stack-vm", "source": "sources/let-go-source-code", "target": "concepts/stack-vm"}}, {"data": {"id": "sources/let-go-source-code__concepts/bytecode-compiler", "source": "sources/let-go-source-code", "target": "concepts/bytecode-compiler"}}, {"data": {"id": "sources/let-go-source-code__concepts/ir-pipeline", "source": "sources/let-go-source-code", "target": "concepts/ir-pipeline"}}, {"data": {"id": "sources/let-go-source-code__concepts/nrepl-server", "source": "sources/let-go-source-code", "target": "concepts/nrepl-server"}}, {"data": {"id": "sources/let-go-source-code__concepts/exec-context", "source": "sources/let-go-source-code", "target": "concepts/exec-context"}}, {"data": {"id": "sources/plan-clojurelike-refactor__ideas/clojurelike-refactor", "source": "sources/plan-clojurelike-refactor", "target": "ideas/clojurelike-refactor"}}, {"data": {"id": "sources/plan-jvm-compat__ideas/jvm-compat", "source": "sources/plan-jvm-compat", "target": "ideas/jvm-compat"}}, {"data": {"id": "sources/plan-jvm-compat__references/clojure-compat", "source": "sources/plan-jvm-compat", "target": "references/clojure-compat"}}, {"data": {"id": "sources/plan-master__ideas/master-plan-roadmap", "source": "sources/plan-master", "target": "ideas/master-plan-roadmap"}}, {"data": {"id": "sources/pr-catalog-dispatch__concepts/op-catalog", "source": "sources/pr-catalog-dispatch", "target": "concepts/op-catalog"}}, {"data": {"id": "sources/pr-catalog-dispatch__ideas/ir-representation-roadmap", "source": "sources/pr-catalog-dispatch", "target": "ideas/ir-representation-roadmap"}}, {"data": {"id": "sources/pr-ir-lowering-seams__concepts/bytecode-lowering", "source": "sources/pr-ir-lowering-seams", "target": "concepts/bytecode-lowering"}}, {"data": {"id": "sources/pr-ir-lowering-seams__concepts/compile-paths", "source": "sources/pr-ir-lowering-seams", "target": "concepts/compile-paths"}}, {"data": {"id": "sources/pr-ir-lowering-seams__concepts/block-interface-and-liveness", "source": "sources/pr-ir-lowering-seams", "target": "concepts/block-interface-and-liveness"}}, {"data": {"id": "sources/pr-ir-lowering-seams__concepts/perf-ratchet", "source": "sources/pr-ir-lowering-seams", "target": "concepts/perf-ratchet"}}, {"data": {"id": "sources/pr-lgb-format-evolution__concepts/lgb-bytecode-format", "source": "sources/pr-lgb-format-evolution", "target": "concepts/lgb-bytecode-format"}}, {"data": {"id": "sources/pr-lgb-format-evolution__concepts/debug-info", "source": "sources/pr-lgb-format-evolution", "target": "concepts/debug-info"}}, {"data": {"id": "sources/pr-native-entry-gate__concepts/go-backend", "source": "sources/pr-native-entry-gate", "target": "concepts/go-backend"}}, {"data": {"id": "sources/pr-native-entry-gate__concepts/compile-paths", "source": "sources/pr-native-entry-gate", "target": "concepts/compile-paths"}}, {"data": {"id": "sources/pr-native-hoist-stack__concepts/native-primitives", "source": "sources/pr-native-hoist-stack", "target": "concepts/native-primitives"}}, {"data": {"id": "sources/pr-native-hoist-stack__concepts/generated-artifacts", "source": "sources/pr-native-hoist-stack", "target": "concepts/generated-artifacts"}}, {"data": {"id": "sources/pr-native-hoist-stack__concepts/namespaces-and-vars", "source": "sources/pr-native-hoist-stack", "target": "concepts/namespaces-and-vars"}}, {"data": {"id": "sources/ref-block-param-irs__concepts/indexed-rpn-ir", "source": "sources/ref-block-param-irs", "target": "concepts/indexed-rpn-ir"}}, {"data": {"id": "sources/ref-carbon-sem-ir__concepts/indexed-rpn-ir", "source": "sources/ref-carbon-sem-ir", "target": "concepts/indexed-rpn-ir"}}, {"data": {"id": "sources/ref-indexed-rpn-emir__concepts/indexed-rpn-ir", "source": "sources/ref-indexed-rpn-emir", "target": "concepts/indexed-rpn-ir"}}, {"data": {"id": "sources/testing-and-conformance__references/testing-conformance", "source": "sources/testing-and-conformance", "target": "references/testing-conformance"}}], "bodies": {"concepts/block-interface-and-liveness": "\n# Block Interface and Liveness\n\nA block in the [IR](concepts/indexed-rpn-ir/) takes parameters, and every value that crosses a block boundary is threaded through a branch-target argument. That is how block-parameter SSA works, and it is also an accommodation: the [stack VM](concepts/stack-vm/) has no writable frame slots, so the only way a value can reach another block is on the operand stack in a known position. EPIC-018 (#575) is Norman's programme to make the block interface carry shared liveness metadata, give the VM real locals, and then erase the block-args that a single-source value makes redundant. The foundation half is done; the backend half is pending behind a design gate.\n\n## The convention\n\nLiveness (`passes/liveness.lg`) is per-block backward dataflow over instruction ids, reading structure and mutating nothing. Its load-bearing convention is that a block's parameters are inputs, not definitions: a parameter used in its block is live-in to that block, which is what makes the predecessor's edge argument live. Only instruction results are block-local definitions. In the file's own notation:\n\n```\nreads[B]    = inst-refs(B) \u222a (terminator-refs(B) \u2212 edge-args(B))\nresults[B]  = inst-results(B)                          ; not params\nlive-in[B]  = (reads[B] \u222a live-out[B]) \u2212 results[B]\nlive-out[B] = \u22c3 over targets t of\n                {v \u2208 live-in[t] : v \u2209 params(t)} \u222a {arg[i] : param[i] \u2208 live-in[t]}\n```\n\nResults are memoised on a content-based structural signature, never on object identity. `lower_go`'s own `live-nids` was the one genuine duplicate of this analysis and was relocated onto it (#575, STORY-0069). The file also owns `reachable-nids`, the read-set the Go lowering's dead-code elimination uses: backward reachability from value-reading terminators and calls through refs and block-arg edges. Since #675 it skips the instructions [structurize](concepts/structurize/) folded into a `:switch`, and `ir.passes.pipeline` hands it to `lower_go` through a setter at load time (`set-reachable-nids-fn!`) rather than a `:require`, deferring the reference to runtime so bootstrap load order does not matter.\n\n## Classifying block-args\n\n`passes/blockarg.lg` decides, without changing anything, how each block-arg's value would cross its boundary once a slot lowering exists:\n\n- `:rematerialize`: a single-value arg whose source is a ref-free cheap load (`:const`, `:load-arg`, `:load-closed`), recomputable at the use site. `:load-var` is deliberately excluded, because a mutable var root must be materialised once, matching `lower.lg`'s cross-block gate.\n- `:slot`: a single-value arg from any other source, which wants durable storage.\n- `:thread`: a genuine merge with distinct reaching values, where the block-arg is the channel.\n\nIt sees through single-value block-args with `ir/resolve-single-source`, which traces an arg to its unique source when every in-edge agrees (STORY-0070, scoped to single value rather than single source). `classify-census` counts the three buckets over a function; the first two are the spurious copies, the third the real merges (STORY-0071).\n\n## What the bytecode lowering does today\n\n`lower.lg`'s `check-cross-block!` walks every use and rejects a cross-block direct reference unless the definition is a cheap-load op other than `:load-var` (re-emitted at the use site by `materialize!`) or the use is a branch-target argument. That rejection is why the not-on-stack bucket in the #580 census exists (535 of 713 bytecode-path failures on 2026-07-24): the IR already holds every operand as an index, but the lowering discards the index for a stack depth, and a value defined in another block has no computable depth. It is also why the AOT inline splice is unusable on the bytecode path, so fold-unroll ships an outline-to-sibling workaround instead of inlining.\n\nThe cost was measured on 2026-07-18: IR-lowered bytecode ran about twice the instruction count of the direct compiler on branch-heavy code, with roughly 67% of the excess being branch-arg `DUP_NTH` shuffle, and #579 put numbers on two fixtures (`fib` 24 versus 18 instructions with six `DUP_NTH`; a `loop`/`recur` sum spending 8 of 18 on shuffle). The junk-below bookkeeping that locals would remove is also the source of a class of latent miscompiles, now guarded by fallback at the cost of coverage (see [bytecode lowering](concepts/bytecode-lowering/)).\n\n## The plan and its gate\n\n| Story | State | What |\n|---|---|---|\n| 0068 | done | shared per-block liveness |\n| 0069 | done | relocate ad-hoc reachability helpers onto it |\n| 0070 | done | single-value resolver |\n| 0071 | done | block-arg classification and census |\n| 0072 | pending | `OP_LOAD_LOCAL` / `OP_STORE_LOCAL` in the stack VM |\n| 0073 | pending | `lower.lg` consumes cross-block refs via locals; retires `check-cross-block!` and the junk-below class |\n| 0074 | pending | retire the fold-outline workaround; the general inliner unblocks on the bytecode path |\n\nThe pending tail is held until the EPIC-016 re-check verdict on an index-RPN mainline VM: if that flips to go, the stack-VM half is superseded, because a VM that executes the indexed IR directly never performs the index-to-depth conversion at all (the #580 body makes the same point from fmpl's `values[i]` frame). #558's accessor-stable side table is what keeps this work rebase-safe over instruction-layout changes, and #712 finished closing the accessor seam.\n\n## Citations\n\n**Resource:** [pkg/rt/core/ir/passes/liveness.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/liveness.lg): the analysis and its equations\n\n**Related:**\n- [pkg/rt/core/ir/passes/blockarg.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/blockarg.lg): `classify-block-arg`, `classify-census`\n- [pkg/rt/core/ir/lower.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower.lg): `check-cross-block!`\n- Issues and PRs: [#575](https://github.com/nooga/let-go/issues/575), [#574](https://github.com/nooga/let-go/issues/574), [#580](https://github.com/nooga/let-go/pull/580), [#579](https://github.com/nooga/let-go/pull/579)\n\nSee also: [Structurize](concepts/structurize/), [Compile Paths](concepts/compile-paths/), [IR Passes](concepts/ir-passes/), [IR representation roadmap](ideas/ir-representation-roadmap/), [let-go](entities/let-go/)\n", "concepts/bytecode-compiler": "\n# Bytecode Compiler\n\nThe let-go compiler transforms source code into bytecode that runs on the [stack VM](concepts/stack-vm/). The pipeline reads Clojure source, lowers it through an Indexed-RPN intermediate form, applies optimizations, and emits bytecode. Compiled bytecode is serialized to `.lgb` files, bundled into standalone binaries with `lg -b`, or compiled to WASM with `lg -w`.\n\n## Compilation Pipeline\n\n```mermaid\nflowchart LR\n    S[\"Clojure<br/>source\"] --> R[Reader]\n    R --> AST[AST]\n    AST --> IR[\"Indexed-RPN<br/>IR\"]\n    IR --> O[Optimizations]\n    O --> E[\"Bytecode<br/>Emission\"]\n    E --> LGB[\".lgb module\"]\n```\n\n1. **Reader** (`pkg/compiler/reader.go`): Parses Clojure source into `vm.Value` AST nodes. Supports reader macros, `:lg` conditionals for let-go-only code, and syntax validation. Returns symbols, keywords, lists, vectors, and maps that drive compilation.\n\n2. **Indexed-RPN IR** (`pkg/ir` via `.lg` source): Source is lowered to an SSA-equivalent intermediate form using indexed reverse Polish notation. Each operation's identity is its position on an implicit evaluation stack; values flow exactly once from producer to consumer, enabling efficient analysis without explicit variable renaming. This is the canonical form for optimization and code generation. See [Indexed-RPN IR](concepts/indexed-rpn-ir/) for details.\n\n3. **Optimizations**: The IR is analyzed and transformed:\n   - Constant folding: evaluate pure operations with constant operands at compile time\n   - Dead code elimination: remove operations with no consumers\n   - Common subexpression elimination (CSE): hoist redundant computations\n   - Dominance analysis and type inference: guide dispatch decisions\n   - Inlining: expand small functions inline when profitable\n\n4. **Bytecode Emission** (`pkg/bytecode`): IR is lowered to stack machine instructions. A `CodeChunk` groups bytecode, local variable slots, and a constant pool. Opcodes like `OP_LOAD_CONST`, `OP_INVOKE`, `OP_TAIL_CALL`, and `OP_RETURN` drive the [stack VM](concepts/stack-vm/) interpreter. The emitter manages stack depth, closure capture, and frame reuse for tail calls.\n\n5. **Serialization** (`pkg/bytecode/encoder.go`): Bytecode, constants, and metadata are encoded to binary format. Constants include scalars, persistent collections, symbols, and function closures; they are interned to a shared constant pool. The serialized form is a `.lgb` module file.\n\n## Invocation Paths\n\n**`lg -c app.lgb app.lg`**: Compile source to bytecode  \nReads the source file, runs the full pipeline, and writes a `.lgb` file. This bytecode can be run standalone without recompilation: `lg app.lgb`.\n\n**`lg -b myapp app.lg`**: Bundle into a standalone binary  \nCompiles to bytecode as above, then appends the bytecode (and resource files) to a copy of the `lg` executable using a trailer format. The binary is self-contained and runs anywhere. Trailer versions (legacy, v2 with resources, v3 with storage IDs) are in `pkg/bundle/bundle.go`.\n\n**`lg -w site app.lg`**: Compile to a self-contained WASM web app  \nCompiles to bytecode and bundles it into a `index.html` file. The WASM blob is inlined and gzipped (~6MB). A service worker handles COOP/COEP headers for SharedArrayBuffer. Programs using the `term` namespace get xterm.js terminal emulation. Run via `open site/index.html` in the browser.\n\n**`lg app.lg`**: Direct evaluation  \nSource is compiled in-memory and executed immediately in the VM. REPL compilation follows the same pipeline.\n\n# Citations\n\n[1] **pkg/compiler**: Reader, compilation context, and source evaluation  \nhttps://github.com/nooga/let-go/tree/main/pkg/compiler\n\n[2] **pkg/bytecode**: Encoder/decoder, module serialization, `.lgb` format  \nhttps://github.com/nooga/let-go/tree/main/pkg/bytecode\n\n[3] **pkg/bundle**: Standalone binary and WASM bundling  \nhttps://github.com/nooga/let-go/tree/main/pkg/bundle\n\n[4] **docs/guide/usage.md**: Compilation flags and build modes  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/usage.md\n\n[5] **Indexed-RPN IR** (this wiki)  \n[indexed-rpn-ir.md](concepts/indexed-rpn-ir/)\n\n[6] **Stack VM** (this wiki)  \n[stack-vm.md](concepts/stack-vm/)\n\n---\n\nSee also: [let-go](entities/let-go/)\n", "concepts/bytecode-lowering": "\n# Bytecode Lowering\n\n`ir.lower` (`pkg/rt/core/ir/lower.lg`) is the backend the [IR path](concepts/compile-paths/) drives at load time: it takes an optimized IR function and emits a `vm.CodeChunk` for the [stack VM](concepts/stack-vm/). It began as a function-for-function Lisp port of the Go `pkg/ir/lower.go`, with byte-identical output as the convergence criterion of the retire-`pkg/ir` work, and the 2026 changes to it are about making a stack machine a good target for an IR that was designed with indices, not depths.\n\n## Strategy\n\nThe header of the file states it:\n\n- Body-emit every node in source order and record a stable stack slot at each definition site.\n- A multi-use value lands at its slot and later uses `DUP_NTH` from there; a single-use value consumed at the top of the stack is used in place.\n- Cheap loads (`Const`, `LoadArg`, `LoadVar`, `LoadClosed`, the `cheap?` column of the [op catalog](concepts/op-catalog/)) defer to use-site re-emission when single-use and not the consumer's first reference, which matches the direct compiler's natural layout. A `:const` whose aux is a `:fn-template` or `:multi-fn-template` is the exception since #779 (merged 2026-09-06, a32767d): a function literal is an allocation with observable identity, so it is materialised once per lowering site and every reuse goes through `DUP_NTH`; re-running the template made `(let [f (fn [x] x) g f] (identical? f g))` false under `*ir-compile*` and true under the direct compiler.\n- Branch terminators recognise two fast paths: arguments already at the target positions, and arguments already at the top of the stack.\n\nThe lowerer's state is one atom holding a map; every mutation is a `swap!`.\n\n## Junk below and the agreement rule\n\nA `BRANCH_F` leaves the predecessor's stack pointer one below the target's parameters, while a clean `BRANCH` or `OP_RECUR` leaves nothing. So each block carries a \"junk-below\" count, the values still on the runtime stack beneath its parameters at entry, populated by predecessor terminators and used to compute the true runtime stack pointer for `maxStack`. #648 made every fall-through predecessor agree: the junk is baked into the target's `OP_RECUR` drop counts, so a path entering with a different count over- or under-drops the stack, observed as `slice bounds out of range` underflows. The old rule took the maximum, which was harmless only while mismatching shapes could not lower at all; the deferral and RPO fixes in the same PR let them lower, so a disagreement now aborts the function's lowering and the `defn` hybrid falls back to the direct compiler. `RECUR`-edge predecessors report zero junk, and that zero is recorded so a disagreement with a non-zero predecessor is caught rather than silently accepted. The same PR moved block emission to reverse post-order (a true-target that is next in emission order falls through, otherwise it jumps) and rebaselined the coverage ratchet with 223 newly lowering forms and 79 more in the block-arg bucket, a deliberate trade of coverage for soundness.\n\n## Cross-block references\n\n`check-cross-block!` rejects any cross-block direct reference unless the definition is a cheap-load op other than `:load-var` (a mutable root must be materialised once; the function's own docstring still lists `:load-var` among the exempt ops, its body does not), or the use is a branch-target argument. This is the single rule behind most of what the bytecode path cannot lower; [block interface and liveness](concepts/block-interface-and-liveness/) covers why and what would retire it. #579 removed one avoidable case: `lower.lg` had excluded every `:load-var` from cheap-load re-emission, so a var used twice was materialised once and copied per extra use. Only `set!`-target vars need that, because two loads could otherwise straddle the `set!` and read different roots; ordinary var loads are now re-emitted per use as the direct compiler does. That retired the whole `:validate/cross-block-ref` bucket (8) and took ir-stress native failures from 20 to 11, with runtime unchanged.\n\n## Tail-call fusion\n\n#649 emits `TAIL_CALL` for a single-use `:call` in return position, so the frame is reused. Its test covers bytecode/IR parity, an opcode falsifier, and try-frame isolation, and its ratchet numbers were neutral to slightly better (compiler init and IR compile within 2.5%).\n\n## The def+name* seam\n\nGrammar-style rule definitions of the shape `(def NAME (name* ... (fn ...) ...))` did not reach the IR path at all, because `name*` is just a call to the direct compiler. #647 routes them through `compile-def-fn-value`, and proves the seam ran with a strict-mode test: under `*ir-compile-strict*` a multi-arity `name*`-wrapped function throws naming `multi-arity`, whereas silence would mean the seam never fired. It also unwraps return-hinted arity vectors before testing for single arity, aligned with #661.\n\n## The shape ratchet\n\n`test/ir_lower_stack_discipline_test.lg` pins what the backend emits, not only what it computes: `fib` at most 23 instructions and 4 `DUP_NTH`, a `loop`/`recur` sum at most 18 and 8, with the direct compiler's 18 and 16 (and no shuffle) as the targets, and non-`set!` var loads re-emitted per use. Upper bounds, so an improvement passes and then tightens the numbers in the same commit, the same discipline as the other two [ratchets](concepts/perf-ratchet/). The residual shuffle is emission order: a call argument is computed before the callee is loaded, so it must be copied above it, and that traces to `lower.lg` never having received the [structural level](concepts/structurize/).\n\n## Citations\n\n**Resource:** [pkg/rt/core/ir/lower.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower.lg): strategy header, `record-block-junk!`, `check-cross-block!`, RPO emission\n\n**Related:**\n- [test/ir_lower_stack_discipline_test.lg](https://github.com/nooga/let-go/blob/main/test/ir_lower_stack_discipline_test.lg): the shape ratchet\n- [pkg/rt/core/core.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg): the `defn` hybrid fallback that catches an aborted lowering\n- PRs: [#579](https://github.com/nooga/let-go/pull/579), [#648](https://github.com/nooga/let-go/pull/648), [#649](https://github.com/nooga/let-go/pull/649), [#647](https://github.com/nooga/let-go/pull/647), [#580](https://github.com/nooga/let-go/pull/580)\n\nSee also: [Compile Paths](concepts/compile-paths/), [IR Pipeline](concepts/ir-pipeline/), [Stack VM](concepts/stack-vm/), [let-go](entities/let-go/)\n", "concepts/compile-paths": "\n# Compile Paths\n\nA form in let-go can become executable three ways. Only the first runs by default; the other two are opt-in, and the second falls back to the first when it cannot handle a function. Knowing which path a function took explains most performance and coverage questions, because the paths differ in what they can lower and in what they cost.\n\n```mermaid\nflowchart TB\n  src[source form] --> reader[reader]\n  reader --> direct[\"direct compiler<br/>pkg/compiler (Go)\"]\n  reader -->|\"*ir-compile* true\"| build[\"ir.build<br/>+ ir.passes.pipeline\"]\n  build -->|\"*target* :bytecode\"| lower[\"ir.lower\"]\n  build -->|\"*target* :go\"| lowergo[\"ir.lower-go\"]\n  direct --> chunk[\"vm.CodeChunk\"]\n  lower --> chunk\n  lower -. \"fallback on failure\" .-> direct\n  lowergo --> gosrc[\"Go source\"] --> toolchain[\"go build<br/>-tags gogen_ir\"] --> native[\"NativeFn overrides\"]\n  chunk --> vm[stack VM]\n  native --> vm\n```\n\n## Path 1: the direct compiler\n\n`pkg/compiler` is a Go compiler from reader output straight to [stack VM](concepts/stack-vm/) bytecode. It is what `lg script.lg`, `lg -e`, the REPL, and `lg -c` use for every form unless something routes a function elsewhere. It walks the form in post-order and emits stack operations as it goes, so it never has to reconstruct a stack layout; that property matters below. The [bytecode compiler](concepts/bytecode-compiler/) page covers its stages and the [`.lgb` format](concepts/lgb-bytecode-format/) covers what it writes.\n\n## Path 2: the IR path at load time\n\nThe [IR pipeline](concepts/ir-pipeline/) is written in let-go and sits behind one dynamic var. When `*ir-compile*` is true, the `defn` macro in `core.lg` hands the whole `(defn ...)` form to `ir.passes.pipeline/compile-form`, which builds IR, runs the optimization passes, and lowers through `ir.lower` to a `vm.CodeChunk`. The result is the same kind of chunk the direct compiler produces, so the VM does not know which path made it.\n\nFour vars govern the path:\n\n| Var | Default | Effect |\n|---|---|---|\n| `*ir-compile*` | `false` | Route `defn` bodies through the IR pipeline. `ir.passes.pipeline` must already be required; the macro throws otherwise. Set with `set!`, not an environment variable. |\n| `*ir-compile-verbose*` | `false` | Print one line per fallback and append `[name error]` to `*ir-compile-fallback-log*`. |\n| `*ir-compile-strict*` | `false` | Throw, naming the `defn`, instead of falling back. Added in #580 so a coverage loss can fail a test or a census. |\n| `ir.passes.pipeline/*target*` | `:bytecode` | `:go` sends `compile-form` through `ir.lower-go` instead of `ir.lower` (path 3). |\n\nThe core comment above `*ir-compile*` still says only single-arity `defn`s take the IR path. The macro body hands multi-arity forms to `compile-form` as well and defines the returned multi-arity value directly, and a two-arity `defn` compiles under strict mode without falling back (checked 2026-09-05 at `0911118`). Treat the comment as historical.\n\n### The hybrid fallback\n\nIf `compile-form` throws, or returns something that is not a chunk, the macro expands to the ordinary `(def name (fn ...))` and the direct compiler takes over. This is deliberate: without it a single unlowerable function would abort a whole file, and `*ir-compile*` would be an all-or-nothing switch that collapses on real code. The cost is that by default a fallback is silent. You pay the IR compile and run bytecode anyway, and nothing says so.\n\n```\n$ lg -e \"(do (require 'ir.passes.pipeline) (set! *ir-compile* true) (set! *ir-compile-verbose* true)\n         (eval '(defn g [x] (try (inc x) (catch e 0))))\n         (deref *ir-compile-fallback-log*))\"\nir-compile: defn g fell back to direct compile: ir/lower: unsupported op for lowering: :try\n[[g \"ir/lower: unsupported op for lowering: :try\"]]\n```\n\nUnder `*ir-compile-strict*` the same `defn` throws, so a test asserting that a form lowers can gate on it. The `ir-stress` harness binds strict mode for exactly that reason: with the default settings a downgrade to bytecode would score as a pass.\n\n### What does not lower to bytecode\n\nThe first census of the bytecode path (#580, 2026-07-24) measured what `*ir-compile*` actually achieves, against the Go path that had been the only thing measured until then:\n\n| backend | coverage | failures |\n|---|---|---|\n| `lower-go` (path 3) | 99.5% | 11 / 2432 |\n| `lower` (path 2) | 70.7% | 713 / 2432 |\n\nTwo buckets held most of the 713: `:lower/not-on-stack/*` (535) and `:lower/unsupported-op/:try` (144). Both come from one cause. The IR is indexed RPN, so every operand is already an instruction index, but `ir.lower` discards the index and reconstructs a stack depth, and a value defined in another block or displaced by an earlier materialization has no computable depth. The stack VM gives lowering nowhere to spill: its addressing is `LOAD_ARG`, `LOAD_CLOSEDOVER`, and depth-relative `DUP_NTH`, with no writable frame slots. `try` has no emission case for the same reason, because a value cannot survive a handler boundary the stack cannot express. The direct compiler never meets the problem: a post-order walk maps onto a stack by construction. The same cause produces the extra `DUP_NTH` shuffle measured in #579 (`fib` at 23 instructions against the direct compiler's 18). Those numbers are from that date; re-run the census before quoting them as current.\n\n### When path 2 pays\n\nPipeline load plus per-function compile is a one-time cost. The design doc's measurement on #555 found it pays back only on allocation-bound work: persistent maps, transducers, and `reduce` saw roughly 5 to 12 times fewer allocations, about 13% less wall-clock per run once heap churn dominates, breaking even around 64 runs on the persistent-map case. Compute-bound code such as `fib` or `loop`/`recur` is a small net loss with nothing to amortize against. Most of the win is the pipeline removing per-element boxing, not fusion. See [IR optimizations](concepts/ir-optimizations/) for the passes involved.\n\n## Path 3: Go lowering\n\nWith `*target*` bound to `:go`, `compile-form` runs `ir.lower-go`, which turns the optimized IR into Go source: block-parameter control flow becomes mutable locals with labels and gotos, typed arithmetic stays unboxed where [type inference](concepts/type-inference/) proved it, and calls into other lowered functions can be direct Go calls. The Go toolchain then compiles that source. Two deployments use it:\n\n- **The core itself.** `make generate` lowers `pkg/rt/core/**/*.lg` into `pkg/rt/core_go_lowered/`, a gitignored tree of Go files regenerated beside the committed `core_compiled.lgb` (`make check-lowered-fresh` flags a stale one). A build with `-tags gogen_ir` links that tree, and each lowered package's `init` registers its functions with `rt.RegisterGoOverrides`. When the runtime finishes loading a namespace from bytecode, `ApplyGoOverrides` replaces the vars the bytecode defined with the native implementations. Without the tag the registry stays empty and the hook is one map lookup.\n- **Programs.** `scripts/lg-compile` (with `--entry-frame`) lowers a whole program and its dependencies to a Go package tree; `--target=go` is `cmd/lgbgen`'s flag and applies to the core only. [lg-compile](concepts/lg-compile/) covers the driver, and `docs/design/go-aot-backend.md` the design.\n\n`ir.lower-go` has two modes of its own: strict, where an unsupported op or shape throws, and bridge, where an unsupported function falls back at whole-function granularity. `*strict-structured?*` (seeded from `LG_STRICT_STRUCTURED`) makes structured-control-flow drift throw rather than emit a possibly mislowered `goto` body. Note that it only sees the Go backend; a bytecode-path lowering failure is invisible to it, which is why `*ir-compile-strict*` exists separately.\n\n## Measuring coverage\n\nEvery knob above changes which forms convert, so a change to one is a coverage change until measured. `scripts/ir-stress.lg` drives a corpus through a chosen path and buckets each `defn` (`:ok`, `:lower/not-on-stack/<op>`, `:validate/no-term`, `:stress/timeout`, and so on), so a regression shows as a bucket that moved.\n\n| Command | Measures |\n|---|---|\n| `make ir-stress` | native-lowering pass rate over the committed corpus |\n| `make ir-stress-gate` | the same, ratcheted against `docs/perf/ir-stress-baseline.edn`; fails if failures grew |\n| `make ir-stress-bytecode-gate` | the bytecode path (`LG_STRESS_BACKEND=lower`) against its own baseline |\n| `make parity-full` | the Clojure test suite, ir-stress `lower-go`, ir-stress `ir-compile`, and the deftype fixtures, each run untagged and under `-tags gogen_ir`; fails if pass/fail counts or failure-bucket distributions differ between the two builds |\n\n`LG_STRESS_BACKEND` selects `lower-go` (default), `lower`, or `ir-compile`; the last evals each `defn` under `*ir-compile*` with strict mode bound, which is what users hit at load time. A `trace` mode drills into one `defn` with per-pass timings.\n\n## Citations\n\n**Resource:** [pkg/rt/core/core.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg): `*ir-compile*`, `*ir-compile-verbose*`, `*ir-compile-fallback-log*`, `*ir-compile-strict*`, and the `defn` macro's hybrid fallback  \n**Related:**\n- [docs/design/ir-dynamic-vars.md](https://github.com/nooga/let-go/blob/main/docs/design/ir-dynamic-vars.md): every dynamic var the pipeline reads, with defaults and the amortization measurement\n- [scripts/ir-stress.md](https://github.com/nooga/let-go/blob/main/scripts/ir-stress.md): harness modes, environment variables, bucket meanings\n- [pkg/rt/core/ir/lower.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower.lg): IR to bytecode, with the stack-slot strategy in its header\n- [pkg/rt/core/ir/lower_go.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg): IR to Go, strict and bridge modes\n- [pkg/rt/gogen_override.go](https://github.com/nooga/let-go/blob/main/pkg/rt/gogen_override.go): `RegisterGoOverrides` and `ApplyGoOverrides`, including the init-order hazard they guard\n- [pkg/compiler](https://github.com/nooga/let-go/tree/main/pkg/compiler): the direct compiler\n- PRs: [#580](https://github.com/nooga/let-go/pull/580) strict mode and the first bytecode-path census, [#579](https://github.com/nooga/let-go/pull/579) lowering-shape ratchet, [#555](https://github.com/nooga/let-go/pull/555) dynamic vars reference\n\nSee also: [IR Pipeline](concepts/ir-pipeline/), [IR Passes](concepts/ir-passes/), [Indexed-RPN IR](concepts/indexed-rpn-ir/), [Stack VM](concepts/stack-vm/), [let-go](entities/let-go/)\n", "concepts/concurrency-model": "\n## Overview\n\nlet-go runs Lisp code on real Go goroutines (`future`, `pmap`, async go-blocks, channel pipes). The **concurrency & dynamic binding model** ensures three guarantees:\n\n1. **Per-namespace thread-safety:** each `Namespace` carries an internal `sync.RWMutex`, preventing data races on concurrent `def`/`require`/resolve across goroutines.\n2. **Goroutine-local dynamic bindings:** dynamic vars (like `*ns*`, `*out*`, user-defined) are thread-local, not process-global \u2014 so `(binding [*ns* ...] ...)` on one goroutine is invisible to others. Every execution carries an `ExecContext` with its own binding stack; goroutine boundaries propagate it explicitly.\n3. **Scoped async supervision:** a `with-scope` resource block spawns child goroutines that inherit the parent's bindings and scope, and can be cancelled independently via a structured concurrency tree.\n\nTogether, these resolve two critical concurrency defects (F-1: namespace races, F-4: global `*ns*` mutation) and enable safe, deterministic cleanup of concurrent work.\n\n## Namespace Thread-Safety (Part A)\n\n### The Problem\n\nThe `Namespace` type holds four unprotected maps (`registry`, `refers`, `aliases`, `excludes`) that are mutated by `Def`, `LookupOrAdd`, `Refer`, `Alias`, and read by `Lookup`. Under concurrent `pmap`/`future` spawns from different namespaces, reads and writes race without synchronization, causing map corruption or panics.\n\n### The Solution\n\nEach `Namespace` carries an unexported `sync.RWMutex`. The governing invariant is: **never hold one namespace's lock while acquiring another's.** This prevents deadlock because:\n\n- `Lookup` reads other namespaces' registries (for refers/aliases) but *composes* individual read operations without holding a lock across them.\n- Accessors (`localVar`, `referFor`, `aliasFor`, `isExcluded`) each acquire their namespace's `RLock`, return copies/pointers, and release.\n- Writers (`Def`, `DefStub`, `Refer`, `Alias`, `ImportVar`) each acquire their own `Lock`, modify one map, and release \u2014 fast, fits bulk-load.\n\nNo lock is held across a multi-namespace hop, so readers see a consistent chain of snapshots; no cycle forms.\n\n### Trade-offs\n\n- **Write-heavy bulk-load fits:** `Lock` is cheap (single map op), not a copy-on-write clone.\n- **Hot path (compiled code):** doesn't call `Lookup` \u2014 compiled bytecode holds direct `*Var` references, so the runtime rarely consults namespaces.\n- **Deadlock-free by design:** only multi-namespace interaction is read-only (following refers/aliases) and never holds a lock across the next acquisition.\n\n## Goroutine-Local Dynamic Bindings (Part B)\n\n### The Problem\n\nThe old model was a process-global `Var.bindings` stack guarded by a global `bindingsMu`. A `(binding [*ns* ...] ...)` on goroutine A was *visible to goroutine B*, violating Clojure's thread-local semantics. Also, `NewCompiler` and resolver code mutated the *root* of `*ns*`, clobbering every goroutine's current namespace \u2014 F-4.\n\n### The New Model: ExecContext-Threaded Binding Stacks\n\nInstead of goroutine-ID keying (the earlier design), the implementation threads an **`ExecContext`** through every execution: the VM's `Frame`, every builtin call, and every goroutine spawn. The `ExecContext` owns both the dynamic-var binding stack *and* the structured-concurrency scope.\n\n- **Storage:** each `ExecContext` carries a `bindingStack` (an immutable, persistent stack of (var, value) pairs). The stack is owned by the context; no internal lock needed for single-writer access.\n- **Hot path (eval loop):** `OP_LOAD_VAR` / `OP_SET_VAR` call `f.ec.deref(v)` where `f` is the `Frame` and `ec` is its `ExecContext`. The deref path: checks `isDynamic.Load()` (an atomic), and if true, walks the binding stack in `ec.bindings`. If no active binding, returns the var's root value. No goroutine-ID lookup, no map indirection.\n- **Entry points:** the interpreter loop always has a frame with an `ec`; hand-written builtins receive `ec` via the `InvokeCtx` interface (a small set of context-aware natives); lowered `.lg` functions receive `ec` as a threaded parameter.\n- **Context inheritance:** when a frame calls another frame within the same goroutine, the child frame inherits the parent's `ec` pointer. Binding operations (push/pop) mutate the same stack; only goroutine spawn creates a fresh context.\n\n### Conveyance (Scope.Go and Spawn Integration)\n\nWhen a parent goroutine spawns a child (via `Scope.Go`, the single integration point), the child is handed an `ExecContext` seeded from a snapshot of the parent's:\n\n```\nsnap := parent.ec.BindingSnapshot()    // parent reads its OWN context (no race)\ngo func() {\n    childEC := NewExecContextFrom(snap) // child gets a fresh context with parent's bindings snapshot\n    fn(childEC)                         // run the thunk with explicit context\n}()\n```\n\n- The parent reads its own context, so there's no race.\n- The child receives a fresh `ExecContext` with the parent's bindings snapshotted in \u2014 no goroutine-ID parse on spawn.\n- Each goroutine's `ExecContext` is stack-local to it (returned to GC when the goroutine exits); no global registry to leak.\n\n### Resolution of F-4\n\n- `NewCompiler` and resolver no longer call `rt.CurrentNS.SetRoot(...)` (global mutation).\n- They set the **goroutine-local** `*ns*` binding instead (via `binding [*ns* ...]` macro).\n- The constructor side effect is now goroutine-scoped, so it doesn't clobber other goroutines.\n- The global root of `*ns*` remains the bootstrap default; conveyance snapshots the parent's binding for scoped spawns.\n\n### Performance\n\n- **Hot path carries no goroutine-ID cost.** The eval loop's `OP_LOAD_VAR`/`OP_SET_VAR` call `f.ec.deref()` which is: `isDynamic.Load()` (atomic), then if true, a binding stack walk. Non-dynamic vars or a nil binding skip to root in the atomic check.\n- **No global registry.** Each `ExecContext` is stack-local; the root context is process-global but binding operations on it are serialized by the goroutine that drives the frame.\n- **Portability:** no `runtime.Stack` parsing in the hot path. Threading `ec` through the `Frame` is the core idea, and it generalizes to WASM and other runtimes.\n\n## Scoped Async Supervision (Part C)\n\n### The Problem\n\nThe VM has a goroutine supervision tree (`Scope`), but blocking async ops (`<!`, `>!`, `alts!`, `sleep`) consult the *global root* context, and all spawns go into the root. Cancelling a sub-scope has no effect on goroutines parked inside it.\n\n### The Solution: with-scope Resource Block\n\nA `with-scope` is a structured-concurrency resource block. Its lifecycle:\n\n```clojure\n(with-scope [s]\n  (go (println \"got\" (<! ch))))   ; s is the child scope; parked under s\n;; exit: cancel s \u2192 parked (<! ch) unblocks; goroutine exits\n```\n\n- **Open:** `(scope-open)` creates a child scope of the current scope and installs it on the running `ExecContext` for the dynamic extent.\n- **Body:** goroutines spawned inside (via `go*` or `future*`) and blocking ops inside them all read the current scope from the `ExecContext`.\n- **Close (finally):** `(scope-close! s timeout-ms)` cancels the scope's context (cascading to the subtree), awaits the goroutines up to `timeout-ms`, logs a warning if stragglers remain, and restores the prior scope. **Bounded teardown:** no hang.\n\n### Explicit Scope Threading (Part of ExecContext)\n\nThe `ExecContext` carries the scope; when code needs to know its current scope, it reads it from `ec.Scope()` (which normalizes `nil` to the root `Goroutines` scope). When a goroutine spawns a child, it captures the current scope from its `ExecContext` and hands it to the child's fresh context.\n\n- **No registry lookup.** A goroutine doesn't parse its ID to discover its scope; the `ExecContext` it's executing in already knows it.\n- **Two operation paths:** synchronous `with-scope` (same goroutine, same frame, but changing `ec.scope` for the dynamic extent), and asynchronous spawn (child gets a fresh `ExecContext` with the parent's scope copied to it).\n\n### Guarantees\n\n1. **Independence:** goroutines under one sub-scope are cancelled independently; siblings and root keep running.\n2. **No orphans:** every scope is owned by exactly one `with-scope` and cleaned up on block exit. No unbounded `children` growth; no leaked context-tree `cancel`.\n3. **No hangs:** bounded drain with timeout; stragglers are logged and left running (leak is visible and bounded).\n\n### Rewiring the Ops\n\n| Lisp operation | Change |\n|---|---|\n| `go*` / `future*` | spawn with `Scope.Go(child_ec)` where `child_ec` carries the parent scope |\n| `<!` / `>!` / `alts!` / `sleep` | select on `ec.Context()` (from the `ExecContext`) instead of root context |\n\nThe pipeline CSP internals (`async.go`) remain root-wired (no user-facing scope); bulk root drain stays correct.\n\n## Implementation Hook Points\n\n- **ExecContext:** `pkg/vm/exec_context.go` \u2014 the unified context carrying bindings + scope; `deref()`, `pushBinding()`, `popBinding()`, threading through spawns.\n- **Binding:** `pkg/rt/core/core.lg` \u2014 `binding` macro (line ~582), `bound-fn*` macro; operates on the `ExecContext` passed by the eval loop.\n- **Scope:**  `pkg/rt/lang.go` \u2014 `scope-open` and `scope-close!` native functions; `go*` and `future*` rewired to spawn via `Scope.Go(childEC)`.\n- **Frame & eval loop:** `pkg/vm/vm.go` \u2014 `Frame.ec *ExecContext` field; `OP_LOAD_VAR` / `OP_SET_VAR` call `f.ec.deref()`.\n- **Binding stack:** `pkg/vm/binding_stack.go` \u2014 immutable stack data structure, snapshots for conveyance.\n- **Scope tree:** `pkg/vm/scope.go` \u2014 `Scope`, `Scope.Go()`, `Scope.Context()` for cancellation; wired to `ExecContext.Scope()`.\n\n## Testing Strategy\n\n- **Go race tests:** `-race` flag on namespace concurrent `Def`/`Lookup`, binding isolation (each goroutine sees only its own value), conveyance (child inherits parent, siblings don't leak), and concurrent compile.\n- **Lisp conformance:** `pmap`/`future` rebind `*ns*` per worker and assert isolation; `with-scope` / `sleep` / `go*` tests assert cancellation and bounded drain.\n- **Performance gate:** `make test-race` target; bench-ratchet regression tests on dynamic-var-heavy benchmarks.\n\n## Citations\n\n- **ExecContext (core impl):** [pkg/vm/exec_context.go](https://github.com/nooga/let-go/blob/main/pkg/vm/exec_context.go) \u2014 the unified `ExecContext` struct carrying bindings and scope, threading through execution.\n- **Frame & eval loop:** [pkg/vm/vm.go](https://github.com/nooga/let-go/blob/main/pkg/vm/vm.go) (`Frame` struct, `OP_LOAD_VAR` / `OP_SET_VAR` opcodes) \u2014 how `ec` is carried through interpretation.\n- **Binding macros:** [pkg/rt/core/core.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg) (`binding` macro ~line 582, `bound-fn*`) \u2014 the user-facing binding APIs.\n- **Design history:** [docs/design/exec-context-threading.md](local, 2026-06-13) \u2014 the design decision to replace goroutine-ID keying with explicit `ExecContext` threading. Supersedes the earlier goroutine-local scope registry design.\n- **Original specs:** [docs/superpowers/specs/2026-06-05-concurrent-namespaces-and-dynamic-bindings-design.md](local) and [docs/superpowers/specs/2026-05-30-scoped-async-supervision-design.md](local) \u2014 the initial design approach using goroutine-ID keying, revised by the exec-context-threading design.\n", "concepts/debug-info": "\n# Debug Info & Source Maps\n\nWhen the [stack VM](concepts/stack-vm/) encounters an error or crash, a readable stack trace must answer four questions: **which source file?** **which function?** **which line?** **which local variables were in scope?** Debug info (source maps, symbol tables, and forms indices) enable [bytecode](concepts/bytecode-compiler/) to remain self-describing under bundle execution\u2014especially in WASM and precompiled `.lgb` artifacts where the original source is not available at runtime.\n\nThe system is organized in tiers by cost, sensitivity, and deployment model:\n\n## Tier 0: Always In \u2014 File, Function, Line (+ Local Names Captured)\n\nTier 0 debug data (source file, function name, line/column) is serialized into every `.lgb` bundle by default and exposes only identifiers, not values. The design doc's figure was about 20 KB (+4.7%) on the 2026-05-30 bundle; at `0911118` (2026-09-05) `cmd/lgbstat` measures the source maps at 47,476 bytes and the local-variable tables at 7,745, together about 18% of a 308,176-byte core bundle.\n\nAs of PR #131 (merged 2026-06-01), **local variable names** are also captured and stored, enabling future rendering in error traces. The data layer is complete; rendering is planned.\n\n**Implementation:**\n- **SourceInfo** (`pkg/vm/source.go`): Struct tracking file, line, column, and optional symbol (variable name). Populated at read time by `vm.FormSource`, keyed by form object identity.\n- **SourceMap** (`pkg/vm/source.go`): Maps bytecode instruction-pointer (IP) offsets to SourceInfo entries. The VM's `Lookup(ip)` finds the nearest source location for any instruction.\n- **Local variable tables** (PR #131, `pkg/bytecode`): Each `CodeChunk` carries a table of **(slot, name)** pairs. A slot maps to a runtime stack frame position; the name is the original identifier from source. Serialized under `FlagLocalVars` in the `.lgb` format, decoded and reconstructed into each chunk at bundle load time. Available via `CodeChunk.LocalVars()`, but not yet rendered by error formatters.\n\n**Usage in Error Reporting:**\nTier 0 data is fully captured and serialized: local variable names are stored in each `CodeChunk` via `LocalVars()` (populated by PR #131). However, rendering these names into stack traces is not yet implemented. Currently, the VM's `FormatError` function (in `pkg/vm/errfmt.go`) displays source location, file, line, and function name when rendering a frame, but does not yet query the `LocalVars` table. Wiring local-variable rendering into `FormatError` is a planned next step: the design doc describes it as \"a natural next increment after #131.\" As of 2026-09-05 no non-test code outside `pkg/bytecode` reads `CodeChunk.LocalVars()` (the one other reader is `pkg/compiler/localvars_test.go`); the names are still stored and not shown.\n\n**Planned rendering** (not yet shipped):\n```\nfunction div/2 at app.lg:42:8\n  locals: numerator, denominator\n  42 | (/ numerator denominator)\n       ^\n```\n\nTier 0 data capture is enabled by default and requires no deployment changes. Tier 0 rendering (displaying locals in error output) is planned.\n\n## Split debug companion \u2014 Tier 0 data, externalized (shipped)\n\nSince #624 (merged 2026-09-04) the Tier 0 tables no longer have to travel inside the shipped artifact. `lg -strip -c app.lgb app.lg` writes `app.lgb` without its source maps and local-variable tables plus `app.lgb.debug`, a companion that restores them; `lg -strip -b myapp app.lg` does the same for a standalone bundle, and `-debug-output <path>` picks another location. The stripped artifact carries `FlagDebugSplit` in its [`.lgb` header](concepts/lgb-bytecode-format/).\n\nWhat the companion is:\n\n- A small binary (`LGD\\x01`, version 1) holding the SHA-256 of the exact stripped payload, a string table, and per chunk the source-map entries and `(slot, name)` local-variable pairs. On the fib sample it is 201 bytes against a 1,421-byte runtime artifact; on the core bundle the debug sections are about 20% of the file.\n- **Digest-bound.** A companion whose digest does not match the artifact is rejected rather than symbolizing a trace with the wrong tables. This is the build-id matching the Tier 1 design asked for, applied to Tier 0 data.\n- **Optional at run time.** `lg app.lgb`, a standalone bundle, and `lg-runtime` load `<artifact>.debug` from beside the artifact when it exists; `LG_DEBUG_FILE=<path>` loads one from elsewhere, and `LG_DEBUG_FILE=` (empty) disables loading. Without a companion the program runs and reports frames without source locations.\n\nWhat it is not: it contains no source text and no forms index, so it symbolizes to file, function, and line, not to highlighted form context. The embedded core and the `-w`/WASI paths are not stripped.\n\n## Tier 1: Opt-In \u2014 Forms Index, Source Text, Build-ID Matching (Design)\n\nTier 1 (under design as of 2026-05-30) adds richer context for offline symbolization: a **forms index** (byte offsets and extents for each top-level form), optional compressed source text, and stable **build-id** linking to ensure traces are symbolized with the correct debug data.\n\n**Planned Design:**\n\nA **.lgsym sidecar** (debug-only artifact, shipped separately from the `.lgb`) carries:\n- **Magic + version header** for forward compatibility\n- **Build-id** (16-byte content hash of the bundle code + constants): Must match the bundle's build-id; the symbolizer refuses to symbolize on mismatch, preventing mismatched traces.\n- **Forms index**: One entry per top-level form, recording start line, start column, byte offset in the source blob, and end byte. Keyed by chunk reference (chunk index / function ID).\n- **Source blob**: Compressed via `flate` (single shared stream across all form texts for better compression than per-entry deflate). Indexed by form byte ranges, sliced by the forms index.\n\n**Symbolizer tool** (planned): Takes a raw trace (chunk index + IP, or function ID) and the `.lgsym`, verifies build-id, and renders rich traces offline. Mirrors JavaScript source-map recovery or native `atos`/`addr2line` workflows.\n\n**Deployment:**\n- `lg -c` (compile) or `lgbgen`/`buildWasm` gains `--debug` flag:\n  - `--debug`: embed Tier 1 inline in `.lgb` (rich live traces, no sidecar needed)\n  - default: emit lean `.lgb` + separate `.lgsym` sidecar (keep source code out of shipped artifact)\n  - `--no-symmap`: omit Tier 1 entirely (smallest bundle, no offline symbolization)\n\n**Rationale for a custom binary format (not ZIP):**\n- **Compression:** Single shared `flate` stream over concatenated form texts compresses ~3.8\u00d7; per-entry deflate yields ~2.9\u00d7, plus per-entry headers add up (30 B local + 46 B central-dir per entry). Custom format achieves denser packing.\n- **Integration:** Reuses `.lgb` Reader/Writer primitives, varint encoding, string-table interning, and build-id/versioning machinery\u2014no parallel mechanism needed.\n- **Granularity:** ZIP forces per-file entries; custom format keeps compression at the level of the entire form corpus.\n\nThe forms index makes source **highlighting** practical: store a base line/column per form, express all inner `SourceInfo` relative to that base, and slice the exact form text from the blob\u2014no need to load or search the whole source file.\n\nTier 1 is not shipped as designed: no `.lgsym` sidecar, forms index, or source blob exists in the tree as of 2026-09-05. The digest-bound companion above took over the build-id and sidecar roles for Tier 0 data; the forms index and source text remain open.\n\n## Tier \"Values\": Never Default\n\nVariable **values** in traces are a well-known security footgun: a frame holding `password`, `api_key`, or a token leaks it into logs and error trackers. By design:\n\n- Default output shows **names only** (e.g., `locals: numerator, denominator, ratio`).\n- **Values are never rendered by default.** If ever surfaced, it requires an explicit flag **and** a redaction pass:\n  - Deny-list name patterns (`*pass*`, `*secret*`, `*token*`).\n  - Length and entropy caps to block large or suspicious values.\n\nThe `.lgsym` sidecar is kept private (not shipped), so production operators cannot reconstruct the program from traces\u2014debug data is joined to stack traces offline only by trusted processes.\n\n## Integration with Crash Reporting\n\nWhen a bundle-loaded program crashes (WASM or precompiled bytecode), the exception handler produces a **raw trace**: bytecode offsets, chunk indices, and frame stack. The raw trace is small and safe (no source exposure).\n\nIf Tier 1 debug info is available (either embedded or via `.lgsym`), a **symbolizer** (or integrated error reporter) enriches the raw trace with:\n1. Verify build-id (bundle \u2194 `.lgsym` match).\n2. Resolve chunk index \u2192 function name (already in Tier 0).\n3. Resolve IP \u2192 line/column in source file (Tier 0, SourceMap).\n4. Slice the top-level form from the source blob (Tier 1, forms index + source blob).\n5. Highlight the relevant line and column in the form's context (Tier 1, relative line/column).\n6. Render named local bindings (Tier 0, local-var tables).\n\nResult: a readable, context-rich trace indistinguishable from source-level debugging\u2014without embedding source in the shipped binary.\n\n## Security & Deployment Trade-offs\n\n| Tier | Contents | Status | Cost | In Bundle? | Sensitivity | Use Case |\n|---|---|---|---|---|---|---|\n| **0 (file, function, line)** | source location | shipped | ~47 KB (15%) of the core bundle at 0911118 | always | low | live REPL, self-describing errors |\n| **0 (local names, data layer)** | local var names captured | shipped (PR #131) | included | always | low | future trace rendering |\n| **0 (local names, rendering)** | display locals in errors | planned | \u2014 | \u2014 | \u2014 | richer live debugging |\n| **0, split** (`-strip`) | source maps + local names moved to `.debug` | shipped (#624) | \u22129% (fib), \u221220% (core) | companion, digest-bound | low | smaller deploy artifact, symbol store |\n| **1 (forms index, source text)** | forms index, source blob | design only | ~50\u2013100 KB | opt-in / sidecar | medium | offline symbolization, web deployment |\n| **values** | variable values | never (out of scope) | varies | never | high | redaction / explicit flag only |\n\nProduction deployments can ship a stripped `.lgb` and keep the `.debug` companion in build artifacts or a symbol store. Local development and REPLs benefit from embedded Tier 1 for instant, detailed traces.\n\n# Citations\n\n[1] **Debug Info & Symbol Maps \u2014 Design Doc**  \n`docs/superpowers/specs/2026-05-30-debug-info-and-symmap-design.md` (local, 2026-07-02)\n\n[2] **SourceInfo and SourceMap \u2014 Core Types**  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/source.go\n\n[3] **Bytecode Decoder \u2014 Local Variable Deserialization**  \nhttps://github.com/nooga/let-go/blob/main/pkg/bytecode/decoder.go\n\n[4] **Local Variable Tables \u2014 Roundtrip Tests**  \nhttps://github.com/nooga/let-go/blob/main/pkg/bytecode/localvars_test.go\n\n[5] **Error Formatting \u2014 Trace Rendering**  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/errfmt.go\n\n[6] **Split debug: strip, companion, loader**  \nhttps://github.com/nooga/let-go/blob/main/pkg/bytecode/strip.go  \nhttps://github.com/nooga/let-go/blob/main/pkg/bytecode/debug_companion.go  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/run.go  \nhttps://github.com/nooga/let-go/pull/624\n\n[7] **Bytecode Compiler** (this wiki)  \n[bytecode-compiler.md](concepts/bytecode-compiler/)\n\n[8] **Stack VM** (this wiki)  \n[stack-vm.md](concepts/stack-vm/)\n\n---\n\nSee also: [let-go](entities/let-go/)\n", "concepts/deftype-and-protocols": "\n# deftype & Protocols\n\n## When it matters\n\n**deftype** and **defprotocol** are let-go's primary tools for defining custom types and protocol-based polymorphism, mirroring Clojure's abstractions. Protocols enable open extension\u2014any type can implement any protocol via `extend-type`\u2014while deftypes bundle immutable structured data with inline method implementations. Together, they form the foundation for libraries that rely on type-driven dispatch (malli validators, dynaload-style delays, custom callables).\n\nThe work to **native-lower deftype/defprotocol** to Go types and interfaces is in-flight and foundational: it moves protocol dispatch from boxed runtime tables to compiled Go method calls where the concrete type is known, and makes IR ops themselves deftypes to eliminate hand-duplicated op handlers scattered across the compiler pipeline.\n\n## Deftype: typed fields + methods\n\n```clojure\n(deftype Square [side]\n  Shape\n  (area [this] (* side side)))\n\n(area (->Square 3))  ; => 9\n```\n\n`deftype` creates three artifacts:\n\n1. **The type itself** \u2014 a value representing the type for protocol dispatch.\n2. **Constructor `->TypeName`** \u2014 a positional function `(fn [fields...] ...)` creating instances.\n3. **Method implementations** \u2014 any protocols named in the form receive inline implementations, rewritten by the macro to wire field access via receiver.\n\nFields are **immutable** and accessed via `.field-name` syntax (a get method, not mutation). Mutable fields (marked `^:mutable` or `^:unsynchronized-mutable`) are read via bare symbols in method bodies (rewritten to `.field recv`) and mutated with `(set! field v)` (rewritten to `(set-field! recv 'field v)`).\n\n**Closure** \u2014 method bodies capture the receiver's fields, shadowing any outer bindings with the same name. For example, in `(area [this] (* side side))`, the bare `side` refers to the field, not an outer variable.\n\n## Defrecord: typed fields + map API\n\n```clojure\n(defrecord Point [x y])\n\n(->Point 1 2)       ; positional ctor\n(map->Point {:x 1 :y 2})  ; map ctor\n```\n\n`defrecord` is like `deftype` but adds **map semantics**: instances are also maps, supporting `(x point-val)` keyword lookup, `assoc`, `seq`, and `count`. It generates both a positional constructor (`->`) and a map constructor (`map->`).\n\nRecords are lighter-weight than arbitrary maps when you need both structured data and occasional map operations; deftypes are used when you need only the structure and methods, not map interface.\n\n## Defprotocol: open method dispatch\n\n```clojure\n(defprotocol Shape\n  (area [this]))\n\n(extend-type Square Shape\n  (area [this] (* (.x this) (.y this))))\n```\n\n`defprotocol` defines a protocol\u2014a named set of method signatures. Implementing a protocol on a type happens in two ways:\n\n1. **Inline** (in the deftype/defrecord form): `(deftype Square [...] Shape (area [this] ...))`\n2. **Open extension** (anywhere, anytime): `(extend-type Square Shape (area [this] ...))`\n\nAt a dispatch site like `(area (->Square 3))`, the VM looks up the type of the receiver and dispatches to the implementing method. For **known-concrete types** (e.g., the ctor is a literal `->Square`), the compiler can emit a **direct native call** when lowering to Go; for dynamic types, it routes through the runtime protocol table.\n\n## Reify: anonymous inline types\n\n```clojure\n(reify\n  Shape\n  (area [this] 42))\n```\n\n`reify` creates a nameless type on-the-fly, implementing the named protocols. Each call to `reify` produces a fresh type. Useful for one-off implementations, particularly in higher-order functions.\n\n## IFn & IDeref protocols (standard library)\n\nTwo core indirection protocols are provided:\n\n- **`IFn`** \u2014 `(-invoke [this args])`. A type implementing IFn is callable: `(x arg1 arg2)` dispatches to `(-invoke x [arg1 arg2])`. This enables custom callables and libraries like malli to ship validators as functions.\n- **`IDeref`** \u2014 `(-deref [this])`. A type implementing IDeref works with `@x` / `(deref x)`, enabling delays, promises, and custom lazy-evaluation types.\n\nBoth are wired by the runtime after core loads. See [value-representation](concepts/value-representation/) for how the VM coerces invokable/derefable custom types into native Go function/reference wrappers on the bytecode path.\n\n## Native lowering (in-flight)\n\nThe compiler is being restructured to lower deftype/defprotocol to Go structs and interfaces, replacing runtime table dispatch with compiled code. This happens in three stages:\n\n1. **S0** \u2014 `deftype` \u2192 Go `struct` + field access + constructor.\n2. **S1** \u2014 `defprotocol` \u2192 Go `interface`; protocol methods become Go methods; `extend-type` routes to interface implementations.\n3. **S2** \u2014 Typeinfer learns \"satisfies protocol P\" to devirtualize broad call sites.\n\nCurrently **S0+S1 are in the walking-skeleton phase**: a single protocol (Shape) and type (Square) are being proven end-to-end through the bytecode **and** native (`-tags gogen_ir`) paths in parallel. The IR op-catalog unification (moving all 27 IR ops into deftypes with protocol-based behavior facets) rides on S0+S1 to eliminate the currently-scattered op handlers.\n\n## Citations\n\n[core.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg) \u2014 macro implementations of `deftype`, `defrecord`, `defprotocol`, `extend-type`, `reify`. Also defines core protocols `IFn` and `IDeref`.\n", "concepts/exec-context": "\n# Execution Context and Threading\n\nThe let-go runtime maintains per-execution state: structured concurrency (cancellation trees), dynamic-variable bindings (like `*out*`, `*err*`, `*ns*`), and the current namespace. Historically, this state was stored in goroutine-ID-keyed maps. This design moves to an **explicitly-threaded `ExecContext`** carried through the call stack, eliminating goroutine-ID lookups and fixing goid reuse hazards.\n\n## The Problem with Goroutine-ID Keying\n\nThe original design had two parallel goroutine-ID-keyed stores:\n\n1. **Scope GLS** (`pkg/vm/scope_gls.go`): carries the cancellation tree and `context.Context` for blocking operations.\n2. **Dynamic-variable binding store** (`pkg/vm/binding_frames.go`): carries the stack of bindings for `Var.Deref` and binding pushes.\n\nGoroutine IDs have inherent problems:\n\n- **The goid footgun**: When a goroutine exits with a live bin
