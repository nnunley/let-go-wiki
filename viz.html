ding (panic without recover, or a binding meant to outlive it), the frame leaks. Go reuses goids, so a later goroutine on that ID sees the dead one's state, causing silent corruption.\n- **Cost**: `goID()` parses a stack trace on every miss\u2014expensive on the fast path.\n- **Duplication**: Two parallel maps solve the same problem twice.\n\nPer-goroutine binding isolation is **load-bearing**: `pmap` (parallel map) and lgbgen's concurrent lowering workers each bind registries and type caches via dynamic bindings. Without per-goroutine isolation, parallel workers corrupt each other's registries, causing nondeterministic lowering.\n\n## The Design: One ExecContext, Explicitly Threaded\n\nReplace the two goid-keyed maps with a single `ExecContext` that carries both concerns:\n\n```go\ntype ExecContext struct {\n    scope    *Scope           // structured concurrency + cancellation tree\n    bindings *bindingStack    // dynamic-variable stack (not goid-keyed)\n}\n```\n\n**Threading**: The `ExecContext` lives on the VM eval `Frame` (already threaded through the interpreter loop). Child frames inherit the pointer. When a new dynamic extent occurs (a `binding` form, `with-scope`), it pushes onto the carried stacks. Goroutine spawns capture a snapshot and seed the child frame's `ExecContext`; the child's context dies with the goroutine\u2014no map entry to forget, no goid reuse hazard, no leak.\n\n## How Builtins Access the Context\n\n`Fn.Invoke([]Value)` is context-free. Only ~17 builtins (plus scope ops) need context; hundreds are pure. So the migration is **additive**:\n\n```go\ntype CtxFn interface { \n    InvokeCtx(ec *ExecContext, args []Value) (Value, error) \n}\n```\n\n- The VM calls `InvokeCtx(currentEC, args)` when the function implements `CtxFn`, else falls back to `Invoke(args)`.\n- Pure builtins need **zero changes**.\n\nThe consolidation already in place (PR #206) groups I/O operations behind three chokepoints: `WriteToOut(ec, s)`, `WriteToErr(ec, s)`, and `resolveIOHandleVar(ec, name)`. This shrinks the dig-in significantly: only the ~5 print builtins need to forward `ec`, not scattered across 17 sites.\n\n## Three Surfaces\n\n| Surface | Mechanism | Artifact? |\n|---|---|---|\n| Interpreter eval loop | `ec` on the `Frame` | No (VM) |\n| Hand-written NativeFns (~17) | `InvokeCtx` convention | No (VM) |\n| Lowered gogen_ir functions | `ec` threaded through emitted signatures | **Yes (IR lowering)** |\n\nLowered code (gogen_ir functions) is native Go. When lowered let-go code reads a dynamic var or calls a context-needing builtin, it too needs `ec`. The lowering must thread `ec` through lowered function signatures: `func f(ec *vm.ExecContext, ...)` emitted by `lower_go.lg`, forwarded at call sites.\n\n## Why It Matters\n\nExplicit threading replaces goroutine-local state with call-stack plumbing. This:\n\n- **Eliminates goid reuse hazards**: No leaked frames, no corruption from ID reuse.\n- **Improves performance**: A threaded pointer is cheaper than a `goID()` parse.\n- **Enables correctness**: Parallel workers (lowering, pmap) work without global state corruption.\n- **Enables determinism**: The type cache for parallel lowering relies on context isolation.\n\nThe change is mechanical for most code (pure builtins see no change), and the blast radius is proportional to the actual set of context-dependent operations, not the whole function surface.\n\n# Citations\n\n[1] **pkg/vm/exec_context.go**: Execution-context threading and per-goroutine scope  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/exec_context.go\n\n[2] **pkg/vm/binding_stack.go**: Dynamic-binding stack storage  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/binding_stack.go\n\n[3] **pkg/rt/iort.go**: I/O routing through `WriteToOut`, `WriteToErr`  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/iort.go\n\n[4] **pkg/vm/value.go**: `Fn.Invoke` calling convention  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/value.go\n\n[5] **PR #206**: Print and error routing through I/O vars  \nhttps://github.com/nooga/let-go/pull/206\n\n---\n\nSee also: [Stack VM](concepts/stack-vm/), [IO/Host Decoupling](concepts/io-host-decoupling/), [IR Pipeline](concepts/ir-pipeline/)\n", "concepts/generated-artifacts": "\n# Generated Artifacts\n\nThe runtime does not compile `core.lg` at startup. It loads committed artifacts generated from the `.lg` sources, and a Go build cannot regenerate them: Go has no build-time codegen hook, so an edit under `pkg/rt/core/` has no effect until `make generate` runs. Everything on this page exists to make that fact safe: a manifest that says which artifact is stale, gates that refuse to build or commit against a stale one, and a build tag that lets the generator compile core from source without trusting the bundle inside the binary that runs it.\n\n## The outputs\n\n`pkg/rt/generated.manifest` declares seven outputs. Six are committed; the lowered Go tree is gitignored and rebuilt locally. Each is regenerated by a stage of `scripts/generate.lg`, run as `make generate`.\n\n| Output | Generated from | Loaded by |\n|---|---|---|\n| `pkg/rt/core_compiled.lgb` | every embedded `.lg` under `pkg/rt/core/`, compiled by `cmd/lgbgen` | the default runtime, at boot (see [runtime image](concepts/runtime-image/)) |\n| `pkg/rt/core_go_lowered/` (gitignored) | the same sources, lowered to Go by `cmd/lgbgen --target=go` | builds with `-tags gogen_ir` (see [compile paths](concepts/compile-paths/)) |\n| `pkg/ir/op_generated.go` | `pkg/ir/ir_ops.lg` via `scripts/generate.lg` | the Go side of the [IR](concepts/indexed-rpn-ir/): op table and catalog |\n| `pkg/rt/ir_bridge_generated.go` | `pkg/ir/ir_bridge.lg` | the Go bridge primitives the [IR pipeline](concepts/ir-pipeline/) calls |\n| `pkg/rt/core/ir/data/generated.lg` | `pkg/ir/ir_data.lg` | the IR data accessors, on the Lisp side |\n| `pkg/rt/zz_primitives_generated.go` | `//lg:native` annotations in `pkg/rt` via `cmd/lgprimgen` | the runtime's own primitive registrar (see [native primitives](concepts/native-primitives/)) |\n| `pkg/rt/corefns/zz_primitives_generated.go` | annotations in `pkg/rt/corefns` | the contribute-mode registrar |\n\nThe three IR generators run in process: `generate.lg` `load-string`s each `.lg` generator, capturing stdout with `with-out-str` for the op and bridge tables and writing the return value of the data generator's final form, because shelling out to a second `lg` dropped trailing bytes nondeterministically. It shells out to `lgprimgen` for the two registrars and once to `go run -tags bootstrap ./cmd/lgbgen --target=both`, one core compile feeding both the bundle and the lowered tree so the untagged and `gogen_ir` runtimes cannot drift apart.\n\n## Staleness is content, not time\n\n`make build` and the older `check-*-fresh` targets compared modification times, and mtimes lie after a `git` or `jj` checkout: the VCS writes arbitrary times, so a stale bundle can look newer than the source that should have rebuilt it. `pkg/genmanifest` hashes content instead.\n\nThe manifest is a list of edges, one per line: `<output> <input> <kind> <sha256>`, where `kind` is `input` (a domain source such as `ir_ops.lg`), `generator` (a file of the generator's own implementation), or `output` (the declared output's last generated bytes). `pkg/rt/generated.sums` holds a single digest of the manifest and is the value the gates compare. Generator edges come from `go list -deps -json -tags bootstrap ./cmd/lgbgen`, so a change to the bytecode encoder or the compiler counts as a reason to regenerate the bundle, and the manifest lists every non-test build source across platform and tag variants so it is stable on Linux, macOS, and Windows (#641).\n\nTwo separate questions are asked of it:\n\n- **Are the inputs fresh?** A recorded input or generator digest that differs from the file on disk means someone edited a source without regenerating.\n- **Is the output ready?** For a file output, do its bytes still match the recorded output edge; for the lowered tree, is the sentinel present. `cmd/lgbgen` writes `pkg/rt/core_go_lowered/`'s tree manifest as the last step of a successful install and deletes it first on reinstall, so a crash mid-install can never leave a valid sentinel over a torn tree.\n\n`make generate` reruns only stages whose inputs changed or whose outputs are disturbed, and requeries staleness after the IR generators run so a change that propagates into `lgbgen`'s inputs is picked up in the same pass. A staleness query that fails is an error, not an empty clean set.\n\n## Where a stale artifact is caught\n\n| Gate | What it does |\n|---|---|\n| `make check-generated-manifest` | non-mutating front gate: fails on a manifest mismatch before any target could refresh the digest |\n| `make check-generated` | runs the front gate, then regenerates the registrars and bundle in place and `cmp`s them against saved copies of the committed files; a failing run leaves the regenerated bytes in the tree |\n| `go test ./...` | `TestGeneratedArtifactsAreFresh` in `pkg/genmanifest` fails when a source changed without `make generate` |\n| pre-commit hook | `scripts/pre-commit` blocks a commit with stale artifacts once installed; `jj` runs no git hooks, so `jj` users rely on the test and the make target |\n| merge drivers | `make install-hooks` registers `merge.lgb` and `merge.sums`, which regenerate `core_compiled.lgb` and recompute `generated.sums` after the `.lg` sources have merged as text, so a rebase that touches `core.lg` does not end in a binary conflict |\n\nThe merge drivers live in `.git/config`, registered by `make install-hooks`; the pre-commit hook is a manual symlink into `.git/hooks/`. Neither is shared, so each clone sets them up once.\n\n## The bootstrap tag\n\n`cmd/lgbgen` is built with `-tags bootstrap`. Under that tag `pkg/rt/core_embed_bootstrap.go` replaces the `//go:embed core_compiled.lgb` in `core_embed.go`, so the generator compiles core from source and never consults the bundle embedded in whatever `lg` is running the build. A stale embedded bundle therefore cannot taint regeneration. `scripts/generate.lg` itself runs on `./lg`, the bundle-built binary, and shells out to the bootstrap build for the one heavy stage; without the tag `cmd/lgbgen` is a stub.\n\nThe embedded-core tree (`//go:embed all:core`) is also the universe the self-hosting bootstrap walks when it derives the Go-lowering order, topologically sorting every `(ns ...)` by its `:require` edges plus one synthetic edge: `ir.build` must load after every optimization and inference pass, because the passes register state at load time and lowering before that state exists emits untyped arithmetic. Adding a source to that tree changes what the bootstrap lowers. That is why `gogen`, the Go-emission macro layer the AOT path requires, is embedded from `pkg/rt/gogen/` through a separate `//go:embed` gated `!bootstrap` and served as an auxiliary embedded source (#557): a shipped `lg` can `(require 'gogen)` from any working directory, while the bootstrap resolves it from the classpath as before, keeping cold and hot lowering byte-identical. The exception is `gogen`'s alone and transitional. Norman's decision on #735 (2026-09-02) is that the compiler orchestration namespace, `lg.compiler`, enrolls in the standard embedded and generated set immediately (`EmbeddedNSNames` plus the genmanifest source specs) with no temporary auxiliary embed, and his proposal for the compiler namespaces (#786) names moving `gogen` itself into the bootstrap universe as a step that must first resolve that fixpoint rather than simply enroll the file.\n\n## Working with them\n\n- Edit anything under `pkg/rt/core/**/*.lg`, `pkg/ir/ir_*.lg`, or an annotated Go primitive, then `make generate` and commit the regenerated committed outputs (bundle, sums, manifest, registrars, IR tables) with the change; the lowered tree stays local. `make check-generated` before pushing.\n- A PR that regenerates `core_compiled.lgb` or `generated.sums` will conflict with any other such PR on rebase; regenerate after the text merge rather than resolving the binary or the digest by hand.\n- `go generate ./cmd/lgbgen` runs the two `//go:generate` directives (bundle, then `--target=go`); prefer `make generate`, which also runs the IR generators and the registrars and passes the exact resolved `go` and `lg`, recording both in a local provenance file (`pkg/rt/generated.provenance`, gitignored) and reporting `lg` version drift from the previous run in the build log (the Go version is recorded but not compared).\n\n## Citations\n\n**Resource:** [docs/regenerating-generated-artifacts.md](https://github.com/nooga/let-go/blob/main/docs/regenerating-generated-artifacts.md): the contributor-facing rules  \n**Related:**\n- [pkg/genmanifest/manifest.go](https://github.com/nooga/let-go/blob/main/pkg/genmanifest/manifest.go), [depmanifest.go](https://github.com/nooga/let-go/blob/main/pkg/genmanifest/depmanifest.go), [tree.go](https://github.com/nooga/let-go/blob/main/pkg/genmanifest/tree.go): content hashing, edge kinds, the lowered-tree sentinel\n- [scripts/generate.lg](https://github.com/nooga/let-go/blob/main/scripts/generate.lg): the orchestrator, in-process generators, provenance record\n- [cmd/lgbgen/main.go](https://github.com/nooga/let-go/blob/main/cmd/lgbgen/main.go) and [generate.go](https://github.com/nooga/let-go/blob/main/cmd/lgbgen/generate.go): the bootstrap compiler, lowering-order derivation, `//go:generate` directives\n- [pkg/rt/core_embed.go](https://github.com/nooga/let-go/blob/main/pkg/rt/core_embed.go) and [core_embed_bootstrap.go](https://github.com/nooga/let-go/blob/main/pkg/rt/core_embed_bootstrap.go): the tag-gated embed\n- [Makefile](https://github.com/nooga/let-go/blob/main/Makefile): `generate`, `check-generated`, `install-hooks`\n- PRs: [#641](https://github.com/nooga/let-go/pull/641) provenance manifest and selective regeneration, [#557](https://github.com/nooga/let-go/pull/557) gogen self-containment; issue [#786](https://github.com/nooga/let-go/issues/786) compiler namespace consolidation\n\nSee also: [.lgb Bytecode Format](concepts/lgb-bytecode-format/), [Runtime Image](concepts/runtime-image/), [lg-compile](concepts/lg-compile/), [let-go](entities/let-go/)\n", "concepts/go-backend": "\n# Go Backend\n\nThe design in `docs/design/go-aot-backend.md` proposed two tiers: embed bytecode as Go data, then lower functions to real Go. What shipped is the second tier, on the [IR pipeline](concepts/ir-pipeline/): `ir.lower-go` turns an optimized IR function into Go source that keeps the runtime's `Value` and `Var` model, so lowered code and interpreted code call each other through the same vars and dynamic `eval` keeps working. This page is about that shipped backend; [lg-compile](concepts/lg-compile/) covers the whole-program driver's command line, and [compile paths](concepts/compile-paths/) where the backend sits relative to the other two.\n\n## What the lowering produces\n\nEach lowered `defn` becomes a Go function whose first parameter is the `*vm.ExecContext` and whose remaining parameters and result are either `vm.Value` or a Go type that [type inference](concepts/type-inference/) proved (`int`, `int64`, `float64`, `bool`, `string`). Block-parameter control flow from `structurize` becomes mutable locals with labels and gotos; arithmetic on proven types stays unboxed; self-recursion (`:recur-fn`) lowers to a labelled loop. #649's `TAIL_CALL` fusion is a bytecode-lowerer optimization with no counterpart here. The header of `lower_go.lg` lists the supported ops and the two modes: strict, where an unsupported op or shape throws, and bridge, where an unsupported function falls back at whole-function granularity and stays on bytecode.\n\nSource text is not built with string templates. The `gogen` namespace constructs `go/ast` nodes from let-go: a `(gquote (func ...))` form expands at macro time into constructor calls, those evaluate to boxed AST nodes, and `gogen/render` prints them with `go/format.Node`, so every generated file is gofmt-canonical. `gogen` is embedded in shipped binaries as an auxiliary source outside the core lowering universe (#557); see [generated artifacts](concepts/generated-artifacts/) for why it must stay outside.\n\n## Direct calls and the trampoline\n\nThe point of the backend is that lowered code can call other lowered code, and native primitives, as plain Go calls. Whether a function qualifies is decided per function:\n\n- **Direct-callable** (`override-coercible?` in `lower_go.lg`): non-variadic, and every parameter and result type is one a call site can coerce soundly. A typed sibling such as `func F(ec, x int) int` is recorded with its actual specs, so a caller with a proven-`int` argument emits `F(ec, intval)` with no boxing; a caller that cannot prove the type falls back to the trampoline for that call.\n- **Override-eligible**: the shape that gets an override wrapper registered on the var, so interpreted code calling the var lands on the Go function: uniform `vm.Value` in and out, or `vm.Value` parameters with a primitive return the wrapper can box (`bool`, `int`, `float64`, `string`, `vm.Char`).\n\nEverything else, variadic functions above all, goes through `rt.CachedVarFn` and `ec.Invoke`: a var lookup, a boxed argument slice, and a dynamic dispatch. The per-namespace direct-call registry is seeded from the [native primitive](concepts/native-primitives/) registry and from lowered siblings, and `lower-all-ns-to-go` merges every package's exports into a cross-package registry so a call into another lowered package resolves to `pkg.LG_<name>(ec, ...)` with the matching import.\n\nOne escape hatch keeps direct calls honest: `*direct-calls-disabled?*`, bound at lowering time, forces every call through the trampoline so runtime `alter-var-root` overrides are observed. `pkg/vm` also maintains a process-wide deviation counter for guarded native-primitive vars (`GuardedRootsIntact`), but at `0911118` only the `rt/native-prims-intact?` diagnostic reads it; emitted call sites do not consult it (see [namespaces and vars](concepts/namespaces-and-vars/)).\n\n## Two deployments\n\n**The core.** `make generate` lowers the embedded core into `pkg/rt/core_go_lowered/` (gitignored), and a build with `-tags gogen_ir` links it: each lowered package's `init` queues overrides, and the runtime applies them onto the vars after each namespace loads from bytecode. `bench-ratchet` measures both variants, and the [ratchet doc](concepts/perf-ratchet/) is candid that lowered core code still boxes most cross-namespace calls, so it can allocate more than bytecode; direct-call coverage is the lever.\n\n**Programs.** `./lg scripts/lg-compile [--entry-frame] <out-dir> <import-prefix> <file.lg>...` lowers a set of files to one Go package per namespace with direct calls wired between them. That script is the compatibility shim; the orchestration it wraps is to live behind `lg.compiler` (#735, open, being revised to Norman's decision on #786 and his 2026-09-02 comment there). With `--entry-frame` it also emits `main.go`, the native-entry frame from `passes/entry_frame.lg`: boot core, publish `*command-line-args*`, decode the program bundle, load its namespaces (draining overrides after each), replay the main chunk once so top-level forms and VM-backed vars exist, then call the lowered entry. The entry is `main` or `-main` with arity `[]`, `[argv]`, or `[& args]`; other shapes fail generation with a source-level diagnostic. The orchestrator (gloat, or a Makefile) owns `go.mod`, `go build`, and placing `program.lgb` beside `main.go`. `examples/aot/native-entry` builds `fib` and `-main` this way and reports about 16 times the VM's speed on `fib(34)`.\n\n## The runtime-only binary\n\n`cmd/lg-runtime` executes precompiled bytecode with no reader, compiler, or resolver linked in; the guarantee is structural, enforced by a test that the package never imports `pkg/compiler` or `pkg/resolver`, so there is no `eval`, `read-string`, or dynamic source `require`. `lg -b myapp -bundle-base lg-runtime app.lg` appends a program to a copy of it for a standalone, compiler-free bundle. It also loads a split debug companion beside the artifact (see [`.lgb` format](concepts/lgb-bytecode-format/)). `-tags lg_no_http` (#658) drops `net/http` and the TLS and x509 packages behind it, which the linker could never prove unused because the HTTP namespace registers from an `init`; on darwin/arm64 that cut `lg-runtime` from 17.6 MB to 12.2 MB. A build tag is the stopgap; the direction Norman set on #652 (2026-07-31) is a tree-shaker driven by the AOT that decides which runtime subpackages link, with dead-code elimination surfacing the dependencies as it generates imports, once the interop consolidation lands.\n\n## Gates and open defects\n\n`make native-entry-gate` (#729) proves that lowered entries execute as generated Go rather than through a silent fallback. Each fixture under `test/native-entry/` carries an exact `.expect` stdout and a structural `.goexpect.json` contract, and a missing sidecar fails rather than skips. Building the gate found a real defect: for a single-file program `lg -c` emits a bundle with an empty namespace table, so the frame's namespace load ran nothing and every namespace-level var stayed undefined, which only worked while every reachable callee lowered to a direct call. The frame now runs the main chunk after loading namespaces, idempotently.\n\nOpen at 2026-09-05: #783, a lowered function whose own inline lambda is lambda-lifted (`mapv (fn [f] (f)) fs`) emits `ec.Deref(rt.LookupVar(ns, \"fn__lifted0\"))`, and in an entry-frame binary that var is nil at first deref, so the binary panics where the VM runs the same program. The reported cause is the same empty-namespace-table path: the lifted var's override is queued but never drained before use. Also #607, an AOT bundle rejected by its own runtime over a capability-mask mismatch, tracked separately.\n\n## Citations\n\n**Resource:** [pkg/rt/core/ir/lower_go.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg): the lowering, strict and bridge modes, `override-coercible?`, the direct-call registry entries  \n**Related:**\n- [pkg/rt/core/ir/passes/pipeline.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/pipeline.lg): `lower-ns-to-go`, `lower-all-ns-to-go`, the cross-package registry vars\n- [pkg/rt/core/ir/passes/entry_frame.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/entry_frame.lg): the native-entry frame\n- [pkg/rt/gogen/gogen.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/gogen/gogen.lg): Go AST construction and rendering\n- [scripts/lg-compile](https://github.com/nooga/let-go/blob/main/scripts/lg-compile): the whole-program driver\n- [cmd/lg-runtime/main.go](https://github.com/nooga/let-go/blob/main/cmd/lg-runtime/main.go): the runtime-only binary\n- [examples/aot/README.md](https://github.com/nooga/let-go/blob/main/examples/aot/README.md): the cross-package, native-entry, and YAMLScript examples\n- [docs/design/go-aot-backend.md](https://github.com/nooga/let-go/blob/main/docs/design/go-aot-backend.md): the proposal (also summarised in [sources/design-go-aot-backend](sources/design-go-aot-backend/))\n- PRs and issues: [#557](https://github.com/nooga/let-go/pull/557), [#613](https://github.com/nooga/let-go/pull/613), [#658](https://github.com/nooga/let-go/pull/658), [#729](https://github.com/nooga/let-go/pull/729), [#783](https://github.com/nooga/let-go/issues/783), [#607](https://github.com/nooga/let-go/issues/607)\n\nSee also: [Compile Paths](concepts/compile-paths/), [lg-compile](concepts/lg-compile/), [Self-hosting AOT](ideas/self-hosting-aot/), [let-go](entities/let-go/)\n", "concepts/go-interop": "\n# Go Interop\n\nlet-go provides two-way interoperability with Go: embed let-go as a scripting layer in Go programs, call Go functions from let-go code, pass Go structs as records, and share channels between systems. The interop layer uses Go reflection and type registration to bridge the two runtimes seamlessly.\n\n## Embedding let-go in Go\n\nUse `pkg/api.NewLetGo` to create a let-go runtime instance, define Go values as let-go variables, and execute let-go code:\n\n```go\nimport \"github.com/nooga/let-go/pkg/api\"\n\nc, _ := api.NewLetGo(\"myapp\")\n\n// Define Go functions and values\nc.Def(\"greet\", func(name string) string {\n    return \"Hello, \" + name\n})\nc.Def(\"x\", 42)\n\n// Execute let-go code against these definitions\nv, _ := c.Run(`(greet \"world\")`)  // => \"Hello, world\"\nv, _ := c.Run(`(+ x 8)`)           // => 50\n```\n\nEach `LetGo` instance has its own namespace (`\"myapp\"`), constant pool, and compiler context. Multiple instances can run concurrently in different goroutines (with caveats; see below).\n\n## Go Functions as let-go Functions\n\nGo functions passed via `Def` are wrapped as let-go native functions. They are callable using the normal invocation syntax:\n\n```clojure\n(defn compute [a b]\n  (my-fn a b))\n\n(my-fn 10 20)\n```\n\nThe let-go runtime uses Go reflection to:\n- Inspect the function signature (arity, parameter types)\n- Convert let-go arguments to Go types on the call\n- Box the Go result back to a let-go `Value`\n\nType conversions follow these rules:\n- Numeric types (`int`, `float64`, `int64`, etc.) convert bidirectionally\n- Strings convert to/from let-go strings\n- Slices of `T` convert to/from let-go sequences; lazy seqs are realized automatically\n- Maps convert to/from let-go maps (keyed by string or keyword)\n\n## Go Structs as Records\n\nRegister a Go struct type once, then pass instances to let-go and work with them as records:\n\n```go\ntype Item struct {\n    Name  string\n    Price float64\n    Qty   int\n}\n\nvm.RegisterStruct[Item](\"myapp/Item\")\n\nc.Def(\"item\", Item{Name: \"Widget\", Price: 9.99, Qty: 5})\n```\n\nIn let-go:\n```clojure\n(:name item)           ; => \"Widget\"\n(:price item)          ; => 9.99\n(assoc item :qty 10)   ; => new record with Qty=10\n(count item)           ; => 3 (field count)\n(contains? item :name) ; => true\n```\n\n**Unmutated roundtrip**: When a struct is passed to let-go and returned unchanged, it is unboxed directly via `Unbox()` (fast path).\n\n**Mutated roundtrip**: When a struct is modified in let-go (e.g., via `assoc`), the resulting record is reconstructed back to Go via `vm.ToStruct[T]` on the Go side:\n\n```go\nv, _ := c.Run(`(assoc item :qty 10)`)\nmutated, _ := vm.ToStruct[Item](v.(*vm.Record))\nfmt.Println(mutated.Qty) // 10\n```\n\n## Go Channels as let-go Channels\n\nGo channels and let-go channels are mutually transparent. Define a channel in Go and use it in let-go's `go` / `<!` / `>!`:\n\n```go\ninch := make(chan int)\noutch := make(vm.Chan)\nc.Def(\"in\", inch)\nc.Def(\"out\", outch)\n\nc.Run(`\n  (go (loop [i (<! in)]\n        (when i\n          (>! out (inc i))\n          (recur (<! in)))))\n`)\n\ngo func() {\n    for i := range 10 {\n        inch <- i\n    }\n    close(inch)\n}()\n\nfor v := range outch {\n    fmt.Println(v)  // 1, 2, 3, ..., 10\n}\n```\n\nChannels are first-class in let-go's `core.async` and integrate naturally with goroutines spawned by `go` blocks.\n\n## I/O Customization\n\nThe `pkg/api` Options pattern allows embedders to customize I/O and runtime behavior per instance:\n\n- `WithStdout(w)` / `WithStderr(w)`: Route output to custom writers (capture, logging, etc.)\n- `WithEmit(fn)`: Handle `(js/emit event-name data)` calls from guest code\n- `WithKeySource(ks)`: Supply keyboard input for terminal programs without a real terminal\n- `WithStorage(store)`: Provide backend storage for `(storage/...)` calls\n\nEach option is pushed as a dynamic binding during `Run()` and popped afterward. This allows different embedder instances to have different I/O routing without global state.\n\n### Concurrency Caveat\n\nlet-go's `Var` bindings are stored in a process-global binding stack. If two goroutines call `Run` on different `LetGo` instances concurrently, their I/O bindings will interleave on the same stack. For deterministic isolation, serialize `Run` calls or run instances in separate processes.\n\n## lginterop Code Generator\n\nFor large Go packages, hand-wrapping every function and struct is tedious. The `lginterop` tool generates let-go bindings from Go source:\n\n```\nlginterop -pkg mypackage -output mypackage.lg\n```\n\nThis produces a `.lg` file with wrapped functions and struct registrations, reducing boilerplate.\n\n# Citations\n\n[1] **pkg/api** \u2014 embedding API and options  \nhttps://github.com/nooga/let-go/tree/main/pkg/api\n\n[2] **pkg/api/interop_test.go** \u2014 comprehensive interop examples  \nhttps://github.com/nooga/let-go/blob/main/pkg/api/interop_test.go\n\n[3] **docs/guide/embedding-in-go.md** \u2014 embedding guide  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/embedding-in-go.md\n\n[4] **pkg/vm** \u2014 type registration and struct roundtripping  \nhttps://github.com/nooga/let-go/tree/main/pkg/vm\n\n[5] **README.md** \u2014 interop overview  \nhttps://github.com/nooga/let-go#embedding-in-go\n\n---\n\nSee also: [let-go](entities/let-go/), [Stack VM](concepts/stack-vm/)\n", "concepts/go-structs": "\n# Go Structs via defgostruct\n\n`defgostruct` is a Lisp macro that bridges Go-defined struct types into let-go, generating compile-time bridge code that creates field accessors, constructors, predicates, and setters. Rather than hand-writing hundreds of lines of Go bridge code, you declare the struct once in Lisp and the compiler produces the full interop layer.\n\n## Problem & Design\n\nGo structs (like `*ir.Function`, `*ir.Block`, `*ir.Inst`) need Lisp-side primitives to access and modify their fields. Before `defgostruct`, these primitives were hand-written in Go \u2014 error-prone and brittle when struct definitions changed. The macro inverts this: **the Lisp declaration is the source of truth; the Go code is generated from it**.\n\nThis applies the same pattern that let-go already uses for IR operations (`examples/go-gen/ir_ops.lg` \u2192 `pkg/ir/op_generated.go`).\n\n## Usage: Declaring a Go Struct\n\nDefine a Go struct in the `defgostruct` macro by specifying:\n- The fully-qualified Go type\n- A Lisp namespace and short-name for generated primitives\n- Field map in kebab-case (auto-converted to PascalCase for Go)\n- Optional mutable fields and extra methods\n\n```clojure\n(defgostruct ir.Function\n  :type \"github.com/nooga/let-go/pkg/ir.Function\"\n  :ns \"ir\"\n  :short-name \"fn\"\n  \n  :fields\n    {:name          String\n     :arity         Int\n     :is-variadic   Bool\n     :insts         [Inst]\n     :blocks        [Block]\n     :entry         BlockID}\n  \n  :mutable [:insts :blocks]\n  \n  :extras [{:name \"dump\" :args (Self) :returns (String) :calls \"ir.Dump\"}\n           {:name \"add-block\" :args (Self) :returns (Int) :calls \"AddBlock\"}])\n```\n\n## Generated Primitives\n\nThe macro generates primitives on the declared namespace (`:ns \"ir\"`) with the short-name prefix (`:short-name \"fn\"`):\n\n| Primitive                    | Kind       | Maps to Go                              |\n|------------------------------|------------|------------------------------------------|\n| `ir/new-fn`                  | constructor| `ir.NewFunction(name, arity, variadic, nil)` |\n| `ir/fn?`                     | predicate  | Type check: `_, ok := v.Unbox().(*ir.Function)` |\n| `ir/fn-name`                 | getter     | `f.Name` \u2192 string                       |\n| `ir/fn-arity`                | getter     | `f.Arity` \u2192 int                         |\n| `ir/fn-variadic?`            | getter     | `f.IsVariadic` \u2192 boolean                |\n| `ir/fn-insts`                | getter     | `f.Insts` \u2192 vector of boxed `*Inst`     |\n| `ir/fn-blocks`               | getter     | `f.Blocks` \u2192 vector of boxed `*Block`   |\n| `ir/fn-entry`                | getter     | `int(f.Entry)`                          |\n| `ir/fn-set-insts!`           | setter     | `f.Insts = newSlice; f.MarkUsesDirty()` |\n| `ir/fn-set-blocks!`          | setter     | `f.Blocks = newSlice; f.MarkUsesDirty()` |\n| `ir/fn-dump`                 | extra      | `ir.Dump(f)`                            |\n| `ir/fn-add-block`            | extra      | `f.AddBlock()`                          |\n\n**Boolean field naming**: Fields with Go type `bool` automatically get a `?` suffix in the Lisp name (`IsVariadic` \u2192 `ir/fn-variadic?`).\n\n**Slice access helpers**: For slice-of-struct fields like `:insts [Inst]`, the macro also emits:\n- `ir/fn-inst-at` \u2014 getter by index: `(ir/fn-inst-at f 3)` \u2192 boxed `*Inst` for `f.Insts[3]`\n- `ir/fn-inst-count` \u2014 length: `len(f.Insts)`\n\nWhen a slice field is in `:mutable`, also generates:\n- `ir/fn-add-inst!` \u2014 append a new `*Inst` to the slice\n\n## Type Conversions\n\n**Simple types** (`String`, `Int`, `Bool`, `Float`) convert directly between Go and [value-representation](concepts/value-representation/).\n\n**Go type aliases** (`type BlockID int32`) are handled as primitive integers. The macro accepts them as field types and translates them to integers on the Lisp side.\n\n**Slice fields** (`[Inst]`) are returned as Lisp vectors of boxed pointers, enabling iteration with `map`, `reduce`, etc.\n\n## Field Mutability and Side Effects\n\nFields marked in `:mutable` get setter primitives (e.g., `ir/fn-set-insts!`) that:\n1. Replace the Go field with a new slice\n2. Call `MarkUsesDirty()` on the struct if it tracks changes\n\nThis bridges let-go's immutable semantics (setters return modified values) to Go's mutable structs (fields are replaced in-place).\n\n## Extra Methods\n\nThe `:extras` list adds primitives for methods that don't map to single fields. Each entry specifies:\n- `:name` \u2014 the Lisp function name suffix\n- `:args` \u2014 Go types (use sentinel `Self` for the receiver)\n- `:returns` \u2014 Go return types (supports `(T1 error)` for error returns)\n- `:calls` \u2014 the Go expression to invoke (bare name = method; dotted = function)\n\nExample:\n```clojure\n{:name \"dump\" :args (Self) :returns (String) :calls \"ir.Dump\"}\n; generates: (ir/fn-dump f) \u2192 calls ir.Dump(f)\n```\n\nThe generator automatically unboxes/boxes arguments and results based on type.\n\n## Current State\n\nThe feature is **speculative** (design awaiting approval, not yet shipped). When implemented:\n\n1. The macro and generator will live in `examples/go-gen/ir_bridge.lg`\n2. A new `make generate-ir-bridge` target will regenerate `pkg/rt/ir_bridge_generated.go`\n3. Hand-written bridge code in `pkg/rt/lang.go` will be replaced with a call to the generated `installIRBridgeBuiltins()` function\n\nThe IR types (`Function`, `Block`, `Inst`) are the initial scope; the macro is designed to extend to other Go structs later.\n\n## Relationship to Clojure Interop\n\nAs part of the clojure-interop alignment effort, let-go also gains `.getBytes()` method support on strings and improved hex literal handling, enabling cross-platform code sharing between let-go and Clojure JVM. (See sources for design doc details.)\n\n# Citations\n\n[1] **defgostruct design** \u2014 spec for codegen-driven Go-struct \u2194 Lisp bimap  \n(local, 2026-05-22)\n\n[2] **lginterop generator** \u2014 Go package reflection and wrapper generation (moved from `scripts/lginterop.lg` to `cmd/lginterop` in #773)  \nhttps://github.com/nooga/let-go/blob/main/cmd/lginterop/lginterop.lg\n\n[3] **clojure-interop-alignment design** \u2014 Clojure JVM compatibility improvements  \n(local, 2026-05-21)\n\n---\n\nSee also: [Go Interop](concepts/go-interop/), [lginterop](concepts/lginterop/), [value-representation](concepts/value-representation/), [let-go](entities/let-go/)\n", "concepts/indexed-rpn-ir": "\n# Indexed-RPN IR\n\nThe let-go compiler generates an intermediate representation using **indexed reverse Polish notation (RPN)** \u2014 a postfix encoding where a value's identity is determined by its position (index) on the RPN evaluation stack. This is an SSA-equivalent form: each value flows exactly once from producer to consumer, enabling program analysis without resorting to explicit SSA renaming. Control flow is managed through **block parameters**, which provide an SSA-style channel for values crossing block boundaries. Together, indexed-RPN encoding and block-parameter control flow form a compact, analyzable IR suitable for bytecode generation and Go code emission.\n\n## Encoding\n\nIndexed-RPN encodes computation as a sequence of operations that work on an implicit postfix stack during a single linear walk. Each operation pops a fixed number of operand values (its **stack-in** arity) and pushes either zero or one result value. A value's identity is its **position** \u2014 the index of the instruction that produced it \u2014 not an explicit name. This indexing scheme gives indexed-RPN its SSA-equivalence: the producer of a value is implicit (the defining instruction), and consumers simply reference the index.\n\nEach operation in let-go's IR is catalogued in `pkg/ir/ir_ops.lg` and generated into `pkg/ir/op_generated.go`. The catalogue defines four properties per operation:\n\n- **`name`** \u2014 human-readable operation kind (e.g., `Add`, `Call`, `Return`)\n- **`stackIn`** \u2014 number of operand values popped from the stack (or `-1` for variable arity)\n- **`stackOut`** \u2014 number of result values pushed (0 or 1)\n- **`pure`** \u2014 boolean flag controlling whether this operation is eligible for common subexpression elimination (CSE), constant folding, or loop hoisting\n\n### Representative Operations\n\n**OpConst** (stack-in: 0, stack-out: 1, pure: true)  \nPushes a constant value. The constant itself is stored in the operation's `Aux` field as a `vm.Value`. Lowering materializes it as `OP_LOAD_CONST` with an interned pool index.\n\n**OpAdd, OpSub, OpMul** (stack-in: 2, stack-out: 1, pure: true)  \nBinary arithmetic operations. Pop two operands from the stack, push their computed result. Marked `pure` so optimization passes may fold constant operands, hoist invariant arithmetic out of loops, or eliminate redundant computations via CSE.\n\n**OpCall** (stack-in: -1, stack-out: 1, pure: false)  \nInvokes a function with a variable number of arguments. The function operand and arguments are in `Refs`; the arity is in `Aux`. Marked not pure (side-effecting), so optimization passes will not eliminate or relocate calls.\n\n**OpReturn, OpBranch, OpBranchIf** (stack-out: 0, terminator: true)  \nControl-flow operations that end basic blocks. `OpReturn` pops a value and exits the function; `OpBranch` and `OpBranchIf` direct control to successor blocks (potentially with arguments).\n\n## Block-Parameter Control Flow\n\nWhile indexed-RPN encoding provides value numbering within a block, **block parameters** handle values that cross block boundaries. When a block is branched into, its entry parameters receive values from the predecessor's branch arguments. This mirrors SSA \u03c6 functions but is expressed structurally: a block's parameter list is a sequence of entry points, each bound to an argument passed by a branching predecessor.\n\nIn contrast to the indexed-RPN encoding (where producers and consumers are in the same linear sequence), block parameters create a distinct channel: a value produced in block A may flow to block B via a branch with arguments, where it is bound as a parameter in B's entry sequence and accessed via `OpBlockArg`. This design cleanly separates **intra-block computation** (indexed RPN) from **inter-block value flow** (block parameters), both grounded in SSA principles but avoiding the explicit renaming overhead of full SSA.\n\n## Citations\n\n[1] **Burak Emir, \"Indexed Reverse Polish Notation\"**  \nhttps://burakemir.ch  \nThe foundational design for positional value numbering in postfix form.\n\n[2] **Carbon Language Semantic IR**  \nhttps://github.com/carbon-language/carbon-lang/tree/trunk/toolchain/sem_ir  \nA reference implementation of block-parameter SSA.\n\n[3] **Swift SIL, Cranelift, MLIR**  \nAll employ block-parameter control flow for cross-block SSA-style value threading.\n\n[4] **let-go IR source (op catalogue)**  \n[pkg/ir/ir_ops.lg](https://github.com/nooga/let-go/blob/main/pkg/ir/ir_ops.lg) \u2014 the operations are defined here (in let-go), and generated into `pkg/ir/op_generated.go` (which carries the design-references header).\n\n---\n\nSee also: [Stack VM](concepts/stack-vm/), [let-go](entities/let-go/)\n", "concepts/io-host-decoupling": "\n# Runtime I/O and Host Decoupling\n\nThe let-go runtime originally hardcoded I/O to platform-specific sinks: `os.Stdout` on native, `fs.writeSync` shims in WASM. This coupling required each host to maintain its own shims. The design decouples I/O by exposing **seams**\u2014small, typed boundaries where each host binds the concrete stream.\n\n## The Problem: Parallel I/O Paths\n\nThere were four distinct paths for \"write a string from `.lg` code\":\n\n- **native `lg`** \u2192 `os.Stdout` \u2192 terminal\n- **`lg -w` bundle** \u2192 `os.Stdout` \u2192 `fs.writeSync` shim \u2192 `LetGoHost._output` \u2192 the page\n- **WASM track** \u2192 `os.Stdout` \u2192 `wasm_exec.js` default \u2192 DevTools console\n- **`lg -b` native** (third-party CLIs) \u2192 `os.Stdout` \u2192 terminal\n\nEach host inserted itself at a different layer and maintained its own shim. The solution: finish what was half-built\u2014make the runtime consult dynamic variables for I/O instead of hardcoding sinks.\n\n## The Model: One Contract, Multiple Bindings\n\nThe runtime already had the right abstraction partially in place: `*in*`, `*out*`, `*err*` are dynamic variables holding an `IOHandle`, which wraps an `io.Writer` and/or `io.Reader`. The design finishes it:\n\n- **native** \u2192 the handle wraps `os.Stdout` / `os.Stdin`\n- **embedder** (Go via `pkg/api`) \u2192 constructor options (`WithStdout`, `WithStderr`) push per-`Run` bindings\n- **WASM** \u2192 a `HostWriter` / `HostReader` adapter forwards to the JS host\n\nTwo rules keep the boundary honest:\n\n1. **Host-bound capabilities live in `pkg/rt`, never `pkg/vm`**: The guest names the capability (`println`, `read-key`, `emit`); the host supplies the backend. The VM core stays host-agnostic.\n2. **The seam is as thin as the operation allows**: Output is a byte stream (`io.Writer`); input is a small capability set; no richer interface earns its keep.\n\n## I/O Seams Shipped\n\nThe decoupling is complete as of 2026-06-17:\n\n| Step | Seam | State |\n|---|---|---|\n| print \u2192 `*out*` | Print fns consult dynamic binding, not `os.Stdout` | #206 (merged) |\n| embedder options | `WithStdout` / `WithStderr` per-`Run` bindings | #207 (merged) |\n| ANSI ops \u2192 `*out*` | Terminal control ops join the same path | #223 (merged) |\n| WASM host writer | `*out*` / `*err*` bound to `HostWriter`; `fs` shim retired | #231 (merged) |\n| input seam | `read-key` / `key-pending?` via `KeySource` / `HostReader` | #244 (merged) |\n| emit seam | `js/emit` via typed `HostEmitter`, off raw `_lgEmit` | #241 (merged) |\n\nOutput, input, and emit now reach the host through one configurable seam per stream. The browser bundle no longer intercepts file descriptors.\n\n## Design Decisions\n\n**Input shape**: `read-key` / `key-pending?` are capability ops backed by a host-supplied `KeySource` (a small interface), not a generic `io.Reader`. Interactive keys are event-shaped (one keystroke = one unit), blocking, and need interruption; `io.Reader` fits them awkwardly. Generic stdin (byte streaming) is a separate, later seam.\n\n**Blocking + wake**: The native runtime interrupts a blocked `read-key` with a self-pipe wake-byte (returns `BEL` on resize). This is explicit in the seam: \"a blocked read is interruptible by resize/EOF/stop.\" Both platforms already solve the interrupt, so codifying it is cheaper than rewriting.\n\n**ANSI plain-vs-color**: Gated at emission (ops consult an `*ansi?*` flag), not stripped downstream. This avoids generating-then-parsing-out escapes. The host can set the flag automatically by checking `isatty` at startup.\n\n**Terminal seam minimalism**: Keep output as an `io.Writer`; input as a small capability set. A rich TUI library like ratatui can sit on top of the writer seam, not replace it.\n\n**Adapters in `pkg/rt`**: Build-tagged JS-aware adapters (`HostWriter`, `HostReader`, emit bridge) stay in `pkg/rt` as thin shims. The seam is the `io.Writer`/`io.Reader` boundary; adapters bridge host-specific code to it.\n\n## Why It Matters\n\nDecoupling I/O enables:\n\n- **One runtime, multiple hosts**: The same bytecode runs natively, in WASM, and on custom hosts without modification.\n- **No downstream shims**: Embedders don't maintain `fs.writeSync` patches; the host binds a stream at startup.\n- **Composability**: A TUI library, analytics layer, or shell can wrap the writer seam without touching the runtime.\n- **Client ownership**: Projects like xsofy can provide their own shells and I/O backends without patches to let-go.\n\nThe pattern generalizes: peer capabilities (graphics, audio, input) follow the same shape\u2014guest-named, host-supplied, decoupled.\n\n# Citations\n\n[1] **pkg/rt/iort.go**: I/O routing and `IOHandle`  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/iort.go\n\n[2] **pkg/api**: Embedder API with `WithStdout` / `WithStderr`  \nhttps://github.com/nooga/let-go/blob/main/pkg/api\n\n[3] **PR #206**: Print and error routing through `*out*` / `*err*`  \nhttps://github.com/nooga/let-go/pull/206\n\n[4] **PR #231**: WASM host writer (`HostWriter`)  \nhttps://github.com/nooga/let-go/pull/231\n\n[5] **PR #244**: Input seam (`KeySource`, `HostReader`)  \nhttps://github.com/nooga/let-go/pull/244\n\n[6] **PR #241**: Emit seam (`HostEmitter`)  \nhttps://github.com/nooga/let-go/pull/241\n\n[7] **nooga/let-go#255**: Peer capabilities (graphics, audio, controller)  \nhttps://github.com/nooga/let-go/issues/255\n\n---\n\nSee also: [WASM Compilation](concepts/wasm-compilation/), [Execution Context](concepts/exec-context/), [Stack VM](concepts/stack-vm/)\n", "concepts/ir-optimizations": "\n## What they are\n\nLambda lifting and higher-order specialization are two complementary IR optimization passes designed to eliminate the overhead of dynamic dispatch and closure allocation in higher-order combinator code. Together, they transform code that passes functions as values (common in parser combinators and DSLs) into efficient direct-call recursive descent.\n\n**Lambda lifting** hoists inner function literals (`:make-closure` closures over IR.Function templates) to top-level IR.Functions, making them nameable and eligible for direct-call registry entry. Lifted functions remain semantically identical but become independently callable.\n\n**Higher-order specialization** (via inlining and partial evaluation) then inlines small combinator functions when their function-typed arguments are statically known, unrolling variadic loops over known argument sequences and replacing dynamic trampoline dispatch with straight-line recursive-descent calls.\n\n## When they matter\n\nCombinator-based code\u2014particularly parser combinators and DSLs that build parse trees from small, reusable building blocks\u2014suffers from two structural overheads:\n\n1. **Dynamic dispatch** \u2014 Rules passed as opaque function values via `call` trampolines (evaluating a rule re-allocates the entire combinator tree per invocation)\n2. **Per-node closure allocation** \u2014 Every combinator invocation allocates a fresh closure-wrapped function value\n\nThe yamlstar YAML parser (212 grammar rules implemented as closures) is a proving corpus: interpreted at ~36 ms, but naive native lowering still ~55 ms (slower than interpreted!) because lowering the rule bodies to native Go left the hot path untouched\u2014the dispatch-bound combinator invocation cost dominates.\n\nThese passes apply only to Go-target (AOT) compilation; bytecode VM paths are unchanged.\n\n## Lambda Lifting\n\nLambda lifting runs inside `compile-form*`, between `ir.build/build-fn` (source \u2192 IR) and `optimize-fn` (optimization pipeline).\n\n### Transform per function\n\n1. **Find candidates:** `:make-closure` instructions whose `:ref[0]` is a function-template `:const`.\n2. **Compute free variables** \u2014 values referenced via `:load-closed`:\n   - **Capture-free** (e.g., yamlstar rule bodies referencing only `parser`) \u2014 lift the body verbatim to a new top-level IR.Function.\n   - **Capturing** \u2014 lift with captured values as explicit leading parameters; update every use-site to pass those captured arguments. (Yamlstar mostly hits capture-free.)\n3. **Rewrite closure sites:**\n   - **Direct calls** \u2192 direct call to the lifted sibling with captured args.\n   - **Escapes as a value** (stored in `def`, passed to combinators) \u2192 reference to the lifted sibling (if capture-free) or a thin partial-application closure (if capturing). The lifted function is now independently direct-callable.\n4. **Deterministic naming:** `<outer-go-name>__lifted<ordinal>`, ordered by build-deterministic first-occurrence of the `:make-closure` instruction. No global gensym counter (avoids known nondeterminism).\n\n### Multi-decl threading\n\nLifted functions are lowered independently through the optimization pipeline and lowering, producing one `{:status :lowered :decl \u2026}` result per function. These are emitted as a `:multi-fn-template`-shaped result (reusing the existing multi-arity flattening path), so the framework's existing `registry-entry-from-result` registers each lifted sibling in the direct-call registry, making it callable across sites.\n\n## Higher-Order Specialization (Inlining + Partial Evaluation)\n\nSpecialization runs inside `optimize-fn`, before type inference, so inlined bodies are type-inferred and become direct-callable.\n\n### Three mechanisms\n\n1. **Inline-eligible call inlining.** When the callee resolves to a known IR.Function (lifted sibling or registered `defn`) and passes eligibility gates, inline the body with arguments substituted.\n2. **Partial evaluation / loop unrolling over known sequences.** Combinators loop over variadic `& funcs` arguments. When that arg list is statically known (typical for literal combinator expressions), unroll into a fixed sequence of straight-line iterations. After unrolling, each `(call p f)` has a known target \u2192 rewrites to a direct call.\n3. **Constant folding of matcher arguments** \u2014 delegated to the existing `constfold` pass (e.g., `(first \"-\")` \u2192 character constant).\n\n### Eligibility (automatic, no user annotations)\n\nDerived from existing analyses:\n\n- **Safety gate** (`mutability.lg` `rebinds-var-roots?`) \u2014 callee must not mutate var roots (same gate as direct calls).\n- **Purity** (`purity.lg`) \u2014 informs whether post-inline cleanup (constant folding, common-subexpression elimination, dead-code elimination) is safe.\n- **Size/recursion heuristic** \u2014 small, non-recursive (or boundedly recursive), and inlining enables a direct call.\n- **`name*` transparency** falls out automatically: small wrappers inline and fold by the same rule\u2014no special case needed.\n\nNothing in these criteria names yamlstar; yamlstar benefits because its combinators are small and its grammar is static\u2014the exact profile these passes target.\n\n### Seeing through `call`\n\nThe `call` trampoline is large (state push/pop, receivers, trace, meta, trampoline-on-returned-value, boolean type check). The inliner does **not** wholesale-inline `call`. Once a `(call p f)` has a statically-known `f`, it rewrites to a **direct call to `f`** wrapped only in the semantically-required envelope (return-value trampoline and boolean check). Receiver/trace/state-stack bookkeeping (event/debug machinery) is trimmed in a later stage.\n\n## Multi-Block Inlining (Redesign)\n\nOriginal inlining handled single-block callees. Multi-block callees (those with loops or branches) require handling the cross-block-ref invariant: a reference must be in the same block, except via block parameters and cheap loads (`:const`/`:load-arg`/`:load-closed`, not `:load-var`). Values must flow through positional block `:params` + branch-target `:args` (indexed-RPN model).\n\n### Tail-position multi-block inlining\n\nInline a multi-block callee when the call result feeds the caller's `:return` (tail position):\n\n1. **Precondition check:** the caller block's terminator is `:return` whose operand is the call result (tail position).\n2. **Clone callee blocks:** for each callee block, create fresh blocks; record block and instruction maps.\n3. **Remap intra-block refs** through the instruction map.\n4. **Entry wiring:** the callee entry block's `:load-arg i` instructions become `:block-arg i`; terminate the caller block with a `:branch` to the cloned entry, passing call operands as branch `:args`.\n5. **Terminator remap:** each cloned terminator's branch targets go through the block map; `add-pred!` for each edge.\n6. **Return rewiring:** each cloned `:return v` becomes the caller's `:return` (callee returns become caller returns).\n7. **Validate:** `validate-fn!` ensures the cross-block-ref invariant is satisfied.\n\nWhy tail-position is safe: there is no continuation block and no value defined-before-call-used-after, so no live-across threading. The invariant is satisfied purely by remapping intra-callee refs and routing operands via entry block-args.\n\n### Fold-over-rest specialization and loop unrolling\n\nAt a call to a variadic fold-over-rest combinator with N known rest operands:\n\n1. **Recognize the idiom:** structurally match a tail-loop whose sole loop variable initializes to the rest-arg, each iteration consumes `(first loopvar)` and recurs with `(rest loopvar)`, terminating on `(empty? loopvar)`.\n2. **Specialize to fixed arity:** replace the rest-seq `:load-arg` with N explicit parameters; unroll the fold loop into N straight-line iterations (e.g., `any` \u2192 `(if (call\u2080) true (if (call\u2081) true (if (call\u2082) false)))`).\n3. **Unroll cap:** bounded by `max-unroll`; over-cap leaves the call generic (no silent truncation).\n4. **Inline the specialized clone** via tail-position multi-block inlining (now acyclic and tail-shaped at the rule site).\n5. **Direct calls emerge:** each unrolled iteration's `((first xs) p)` becomes a direct call to the rule sub-function.\n\nFor `any`/`all`, the unrolling is straightforward pure short-circuit logic. `rep` (min/max-bounded repetition) is harder and may be a follow-on.\n\n## Verification and Determinism\n\nEvery PR must:\n- `make generate` + `make check-generated` clean (regenerates `core_compiled.lgb` + `core_go_lowered/` + checksums).\n- **gogen-parity** \u2014 lowered Go output runs identically to interpreted.\n- **Determinism test** \u2014 lifted-sibling names and inlining order driven by structural order, never hash-map iteration.\n- Full `go test ./pkg/ir/ -v` green (these passes mutate IR; broad regression scope).\n- **yamlstar parse benchmark** \u2014 measured native parse time vs 36 ms interpreted baseline.\n\n## Citations\n\n**Resource:** [pkg/rt/core/ir/passes/pipeline.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/pipeline.lg) \u2014 pass orchestrator and integration point for lifting and specialization.\n\n**Related passes** (in `pkg/rt/core/ir/passes/`):\n- `mutability.lg` \u2014 mutation analysis (inlining safety gate)\n- `purity.lg` \u2014 effect analysis (cleanup eligibility, loop unroll safety)\n- `constfold.lg` \u2014 constant folding (post-inline cleanup)\n- `cse.lg` \u2014 common-subexpression elimination (post-inline cleanup)\n- `dce.lg` \u2014 dead-code elimination (post-inline cleanup)\n- `typeinfer.lg` \u2014 type inference (refines types after inlining)\n- `licm.lg` \u2014 loop-invariant code motion (reference for block-parameter threading)\n\n**Design docs** (local, planning/approval stage):\n- `docs/superpowers/specs/2026-06-28-lambda-lift-and-higher-order-specialization-design.md` \u2014 stages 1+2, lambda lifting and single-block inlining\n- `docs/superpowers/specs/2026-06-28-multiblock-inliner-and-loop-unroll-design.md` \u2014 redesign of stage 2 for multi-block inlining and loop unrolling\n\n**Related concepts** (this wiki):\n- [IR Passes](concepts/ir-passes/) \u2014 the optimization pass pipeline and DSL\n- [IR Pipeline](concepts/ir-pipeline/) \u2014 build, optimize, lower architecture\n- [Indexed-RPN IR](concepts/indexed-rpn-ir/) \u2014 the IR data model\n- [Bytecode Compiler](concepts/bytecode-compiler/) \u2014 lowering to bytecode\n", "concepts/ir-passes": "\n## What they are\n\nIR optimization passes are a pipeline of Lisp-implemented transformations that operate on [let-go](entities/let-go/)'s semantic intermediate representation (sem-IR). Each pass is a self-contained optimization: constant folding, dead-code elimination, loop hoisting, type inference. They run sequentially on a Function, mutating it in place, before the IR is lowered to bytecode or Go.\n\nIndividual pass implementations live in `/pkg/rt/core/ir/passes/` (constfold.lg, cse.lg, dce.lg, licm.lg, etc.), with the core DSL definition `passes.lg` at `/pkg/rt/core/ir/passes.lg`. All are written entirely in let-go's own dialect \u2014 a departure from the bytecode compiler (which is Go), and a step toward self-hosting.\n\n## When they matter\n\nOptimizations improve runtime performance by eliminating redundant computation. A trivial form like `(+ 1 2)` folds to the constant `3` at compile time. A loop that loads the same value repeatedly has that value hoisted outside the loop. Dead instructions from aggressive inlining get pruned away. Collectively, these passes can reduce the bytecode output significantly and improve the quality of the [indexed-rpn-ir](concepts/indexed-rpn-ir/) that feeds the [stack-vm](concepts/stack-vm/).\n\nOptimization is mandatory in the production pipeline: every function built via compile-form* unconditionally chains `ir.build/build-fn` with `optimize-fn` (see `pkg/rt/core/ir/passes/pipeline.lg` lines 455, 466, 479). There is no runtime flag to disable passes for debugging.\n\n## Pass DSL and structure\n\nAll passes use a unified macro called `(defpass ...)`, defined in `passes.lg`. The macro abstracts away the zipper-based traversal logic and provides three helpers:\n\n- `(replace-refs! refs)` \u2014 rewrite an instruction's operand references\n- `(replace-aux! aux)` \u2014 change auxiliary data (constants, jump targets, etc.)\n- `(remove!)` \u2014 drop the current instruction from its block\n\nA pass author writes only the pattern-matching and rewrite logic:\n\n```clojure\n(defpass my-optimization\n  \"One-sentence summary.\"\n  [inst]                    ; inst is the current InstId\n  (let [f  ir.passes/*current-fn*\n        op (ir/op inst f)]\n    (when (= op :some-op)\n      ;; analyze inst, then mutate it via helpers above\n      )))\n```\n\nInside the body, three dynamic variables are bound: `*current-fn*` (the Function being transformed), `*current-inst*` (the InstId of this instruction), and `*current-zip*` (the zipper cursor for multi-block traversals).\n\n## The standard pipeline\n\nThe production optimization pipeline (`optimize-fn` in `passes/pipeline.lg`) runs in this order:\n\n1. **Type inference** (`typeinfer` + `infer-arg-types`) \u2014 abstract-interpret types across the function\n2. **Constant folding** \u2014 fold arithmetic over constants and apply algebraic identities like `(+ x 0) \u2192 x`\n3. **Common-subexpression elimination (CSE)** \u2014 within a block, reuse the result of identical expressions\n4. **Constant folding** (again) \u2014 CSE may expose new foldable patterns\n5. **Loop-invariant code motion (LICM)** \u2014 hoist pure instructions out of loops to pre-headers\n6. **Constant folding** (again) \u2014 LICM rearrangement may enable new folds\n7. **Dead-code elimination (DCE)** \u2014 remove effect-free instructions with no uses\n8. **Type inference** (again) \u2014 refine types after all rewriting\n\nMultiple constant-folding passes exploit a key insight: CSE and LICM rearrange code in ways that create new folding opportunities. Running fold multiple times catches these cascading optimizations without explicit fixed-point iteration.\n\n## Key passes\n\n### Constant folding\n\nReduces Const-to-Const operations at compile time. Three strategies, tried in order:\n\n1. **Primitive fold**: `(+ 3 5)` \u2192 `8`\n2. **Algebraic identities**: `(* x 1)` \u2192 `x`, `(+ x 0)` \u2192 `x`, `(* x 0)` \u2192 `0`\n3. **Commutative canonicalization**: `(+ 5 x)` \u2192 `(+ x 5)` (constants shift right for stable comparison)\n\nImplemented in `passes/constfold.lg`.\n\n### Dead-code elimination (DCE)\n\nRemoves effect-free instructions that have no uses. DCE is iterative: removing one instruction can make its operands dead. Uses the purity analysis (`purity.lg`) to determine which instructions are safe to remove.\n\nImplemented in `passes/dce.lg`.\n\n### Common-subexpression elimination (CSE)\n\nWithin a single block, if two instructions have the same opcode and operands, only compute once and reuse the result. CSE deliberately stays within block boundaries \u2014 cross-block CSE would require dominance-based analysis and is deferred.\n\nImplemented in `passes/cse.lg`.\n\n### Loop-invariant code motion (LICM)\n\nFor instructions whose operands never change within a loop, hoist them to the loop pre-header (the unique block that dominates the loop entry and is not part of the loop). LICM uses dominance analysis and is the key proof that block-arg threading (cross-block value threading via branch arguments) works correctly.\n\nImplemented in `passes/licm.lg` and requires dominance computation from `dominance.lg`.\n\n### Type inference\n\nAbstract-interprets the types of values through the function, tracking whether each instruction is an integer, function, vector, etc. Type inference is two-phase: first pass over block arguments to infer parameter types, then a general forward pass. Results are stored in each instruction's `:type` field and inform other passes (e.g., DCE uses type stability to determine if a load is safe to remove).\n\nImplemented in `passes/typeinfer.lg` and `passes/infer-arg-types.lg` with lattice operations in `lattice.lg`.\n\n## IR mutation invariants\n\nAll passes obey these rules:\n\n- **Instruction identity is stable.** Once `ir/add-inst` assigns an InstId, that ID never refers to a different instruction in the same Function. Removals mark the slot invalid but don't compact the array (following the Carbon language design).\n- **Uses cache invalidates on mutation.** Any mutation (rewrite, remove) flips a dirty flag. The next call to `ir/uses` rebuilds the def\u2192use index.\n- **Span union on replacement.** When an instruction is replaced, its source-info spans are merged with the spans of the new instruction (preserving debugging fidelity).\n- **Mutations are side-effects in place.** IR is mutable; passes return the same Function atom, now transformed.\n\n## IR data layer\n\nPasses interact with the IR through accessor functions defined in `data.lg` and exposed under the `ir/` namespace:\n\n- **Inspection**: `ir/op`, `ir/refs`, `ir/aux`, `ir/blocks`, `ir/block-insts`, `ir/block-params`, `ir/block-preds`\n- **Mutation**: `ir/replace-op!`, `ir/set-refs!`, `ir/set-aux!`, `ir/replace-all-uses!`, `ir/remove-inst!`\n- **Uses index**: `ir/uses`, `ir/invalidate-uses!`\n\nThe Function is represented as a Lisp atom holding a map with `:name`, `:arity`, `:insts` (vector of instructions), `:blocks` (vector of blocks), and metadata. Each instruction is a tuple `[op refs aux block source-infos type]`.\n\n## Design notes\n\nThe pass pipeline was redesigned (spec in `2026-05-22-sem-ir-passes-design.md`) to solve a critical limitation in the prior implementation: block-arg threading. The old design couldn't express cross-block value flow (e.g., a loop-hoisted instruction used in multiple blocks). The new design makes block arguments first-class in the IR, allowing passes like LICM to express their transformations correctly and for Lower to emit correct bytecode.\n\nWriting passes in Lisp (not Go) is part of a longer self-hosting trajectory: eventually, the entire compilation pipeline (Build, passes, lowering) will live in let-go's dialect, with Go providing only the VM substrate and interop bridges.\n\n# Citations\n\n**Resource**: [pkg/rt/core/ir/passes/pipeline.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/pipeline.lg) \u2014 the main pipeline driver and pass composition.\n\n**Passes** (each in `pkg/rt/core/ir/passes/`):\n- `constfold.lg` \u2014 constant folding + algebraic identities\n- `cse.lg` \u2014 per-block common-subexpression elimination\n- `dce.lg` \u2014 dead-code elimination (iterative)\n- `licm.lg` \u2014 loop-invariant code motion with dominance\n- `typeinfer.lg` and `infer-arg-types.lg` \u2014 type inference\n- `purity.lg` \u2014 effect analysis (used by DCE and others)\n\n**Infrastructure**:\n- `passes.lg` \u2014 `defpass` macro and pass-author helpers\n- `data.lg` \u2014 IR data structure and accessor functions\n- `zipper.lg` \u2014 block-order cursor over instructions\n- `dominance.lg` \u2014 immediate dominators and postdominators\n- `dump.lg` \u2014 debugging dump format\n\n**Design doc**: `docs/superpowers/specs/2026-05-22-sem-ir-passes-design.md` (local, 2026-07-02) \u2014 comprehensive spec covering architecture, per-pass detail, phasing, and testing strategy.\n", "concepts/ir-pipeline": "\n# IR Pipeline\n\nlet-go's intermediate representation (IR) sits between the source compiler and the bytecode VM. It is an SSA-equivalent form with block-parameter-style control flow, and **the entire IR framework is written in let-go**\u2014demonstrating the language's capability for meta-programming and compiler construction.\n\nThe pipeline transforms source forms through IR stages, applies optimizations, and emits bytecode. Go provides only a small substrate (op table, chunk emission, value constructors) via bridge primitives in the `ir/` namespace; all algorithms and data structures live in Lisp.\n\n## Pipeline Overview\n\n```\n    forms\n      \u2502\n      \u25bc\nir.build/build-fn  \u2500\u2500\u25ba  Lisp-atom IR Function  \u2500\u2500\u25ba  ir.passes.pipeline/optimize-fn\n                                                           \u2502\n                                                           \u25bc\n                                                    optimized IR Function\n                                                           \u2502\n                                                           \u25bc\n                                                      ir.lower/lower\n                                                           \u2502\n                                                           \u25bc\n                                                     vm.CodeChunk (bytecode)\n```\n\n## Architecture\n\nThe IR framework spans multiple let-go files in `pkg/rt/core/ir/`:\n\n| File | Role |\n|------|------|\n| `data.lg` | IR data layer: Function/Block/Inst atom shape, constructors, structural mutators, def\u2192use cache |\n| `data/generated.lg` | Mechanical field accessors (generated from Go spec) |\n| `zipper.lg` | Fn-scoped cursor over instructions in block-order |\n| `build.lg` | `ir.build/build-fn` \u2014 transforms source Lisp form to IR Function |\n| `dump.lg` | Text dump for debugging |\n| `dominance.lg` | Cooper/Harvey/Kennedy immediate-dominator analysis |\n| `lower.lg` | IR \u2192 bytecode via chunk-emission bridge primitives |\n| `passes.lg` | `defpass` DSL; binds `*current-fn*`, `*current-inst*`, `*current-zip*` |\n| `passes/dce.lg` | Dead-code elimination |\n| `passes/constfold.lg` | Constant folding + algebraic identities + commutative canonicalization |\n| `passes/cse.lg` | Per-block common-subexpression elimination |\n| `passes/licm.lg` | Loop-invariant code motion |\n| `passes/thread-block-args.lg` | Pre-lower fixup for cross-block direct refs |\n| `passes/typeinfer.lg` | Abstract-interpretation type inference |\n| `passes/pipeline.lg` | Orchestrates passes; defines `compile-form` (end-to-end entry point) |\n\n## Compilation Pipeline\n\n**Step 1: Build**\n\n```clojure\n(ir.build/build-fn '(defn add [a b] (+ a b)))\n; => Lisp atom with :name :arity :entry :blocks :insts :consts fields\n```\n\nThe builder lowers Clojure forms into IR primitives: constants, block arguments, arithmetic ops, calls, and control-flow terminators.\n\n**Step 2: Optimize**\n\n```clojure\n(ir.passes.pipeline/optimize-fn f)\n; Applies: dce, constfold, cse, licm, typeinfer, thread-block-args in sequence\n; Returns: optimized IR Function (same atom)\n```\n\nEach pass is defined with the `defpass` DSL, which binds a cursor over instructions and provides helpers like `replace-refs!`, `replace-aux!`, and `remove!`. Passes run in a fixed order, with some iterating until a fixed point.\n\n**Step 3: Lower**\n\n```clojure\n(ir.lower/lower f)\n; => boxed *vm.CodeChunk (bytecode)\n```\n\nLowers the optimized IR to stack-machine bytecode via chunk-emission primitives (`ir/chunk-emit`, `ir/chunk-emit-with-arg`, etc.).\n\n## Passes (via defpass DSL)\n\nEach pass is a let-go function using the `defpass` macro:\n\n```clojure\n(defpass my-pass\n  \"Brief description.\"\n  [inst]  ; binds inst to the current InstId\n  (let [f  ir.passes/*current-fn*\n        op (ir/op inst f)]\n    (when (= op :add)\n      ;; mutate or replace the current inst\n      )))\n```\n\nThe `defpass` macro binds:\n- `*current-fn*` \u2014 the IR Function being optimized\n- `*current-inst*` \u2014 the instruction ID\n- `*current-zip*` \u2014 cursor for in-order block traversal\n\nHelpers available:\n- `replace-refs!` \u2014 change operand references\n- `replace-aux!` \u2014 change auxiliary data\n- `remove!` \u2014 delete the instruction\n\nBuilt-in passes include:\n\n- **DCE** \u2014 Remove unused instructions (marked non-pure, or with no consumers)\n- **Constant Folding** \u2014 Evaluate pure ops with constant operands at compile time\n- **CSE** \u2014 Eliminate redundant subexpressions within a block\n- **LICM** \u2014 Hoist loop-invariant computations using dominance analysis\n- **Type Inference** \u2014 Abstract-interpret types to guide dispatch decisions\n- **Thread Block Args** \u2014 Pre-lower fixup to handle cross-block references\n\n## IR Data Model\n\nAn IR Function is a Lisp atom:\n\n```clojure\n(ir/fn-name f)          ; => symbol\n(ir/fn-arity f)         ; => int\n(ir/fn-variadic? f)     ; => bool\n(ir/fn-entry f)         ; => block-id (entry block)\n(ir/fn-blocks f)        ; => vector of block-ids\n(ir/block-insts bid f)  ; => vector of instruction-ids in order\n(ir/block-term bid f)   ; => terminator instruction-id\n```\n\nNever reach into `@f` directly; use the accessor functions\u2014they maintain abstraction and enable future optimizations.\n\n## Extension: Adding an Optimization Pass\n\nCreate a new pass file, e.g., `passes/my-optimization.lg`:\n\n```clojure\n(ns ir.passes.my-optimization\n  (:require [ir.passes :refer [defpass replace-refs!]]))\n\n(defpass my-optimization\n  \"My new optimization.\"\n  [inst]\n  (let [f  ir.passes/*current-fn*\n        op (ir/op inst f)]\n    (when (some-condition? op)\n      (replace-refs! [new-ref1 new-ref2]))))\n```\n\nThen add it to `passes/pipeline.lg`:\n\n```clojure\n(defn optimize-fn [f]\n  ...\n  (my-optimization f)\n  ...\n  f)\n```\n\nWire it into the runtime bundle via `pkg/rt/irpasses.go` and `cmd/lgbgen/main.go`.\n\n## Bridge Primitives (Go \u2194 Lisp)\n\nGo provides only the op-table queries and chunk-emission primitives:\n\n- **Op Table**: `ir/op-terminator?`, `ir/op-pure?`, `ir/op-cheap-load?`, `ir/op-stack-out`\n- **Chunk Emission**: `ir/chunk-emit`, `ir/chunk-emit-with-arg`, `ir/chunk-update!`, `ir/chunk-length`, `ir/chunk-max-stack!`\n- **Value Constructors**: `ir/new-fn`, `ir/new-block`, `ir/new-inst`\n\nEverything else (data structures, passes, analysis) is implemented in Lisp.\n\n## Loading Order\n\nThe IR layer's load-time dance is normally invisible but worth knowing:\n\n- `data.lg` is **not** loaded from the precompiled bundle; it loads from source. Its `;; lgbgen:skip` directive keeps it out of the bundle's namespace list, because the intern block at the bottom needs live function values to register accessors.\n- The rest of the family is excluded by a second, separate rule. `cmd/lgbgen`'s `isIRBundleSkipped` matches `ir` and every `ir.` descendant, so no other pipeline namespace is compiled into `core_compiled.lgb`. The stated reason is startup cost: the pipeline is more source than the rest of core, a plain `lg` script never touches it, and decoding it on every process start measured about 6 ms. It stays embedded as *source* and loads on demand.\n- The skip has to happen before the bundle is encoded, not merely be filtered out of the namespace order. `EncodeBundleOrdered` emits every const in the pool and each func const drags its chunk in, so a skipped namespace must never enter the pool ahead of `writeBundle`. `compileIRForLowering` compiles the `ir.*` set afterwards, so the Go-lowering target can still resolve them.\n- `data.lg` is the exception to that ordering, and it leaks. `lgbgen` bootstraps it into the shared const pool first (phase 0) so downstream namespaces can resolve `ir/*` symbols, and that pool is what the bundle serialises. `cmd/lgbstat` on the shipped bundle at `a9c183f9` attributes 111 of 937 chunks (4,773 of 49,821 code int32s) to `<embedded:ir.data:lgbgen-bootstrap>`: the namespace is not in the bundle's list, but its compiled functions are in the file.\n- `ir.build` declares `(:require ir.data)`, so loading build automatically triggers data's source load.\n\nIf you see \"nil is not a function\" errors during compilation, the most likely cause is that `data.lg` didn't finish loading before the caller compiled. Add `ir.data` to a `:require` clause or load it explicitly.\n\n## Citations\n\n[1] **IR framework README**  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/README.md\n\n[2] **ir/ source code** (let-go implementations)  \nhttps://github.com/nooga/let-go/tree/main/pkg/rt/core/ir\n\n[3] **ir/lower_go.lg** \u2014 IR \u2192 Go AST lowering (for AOT compilation)  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg\n\n[4] **Indexed-RPN IR** (this wiki)  \n[indexed-rpn-ir.md](concepts/indexed-rpn-ir/)\n\n[5] **Bytecode Compiler** (this wiki)  \n[bytecode-compiler.md](concepts/bytecode-compiler/)\n\n[6] **Stack VM** (this wiki)  \n[stack-vm.md](concepts/stack-vm/)\n\n[7] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n---\n\nSee also: [Indexed-RPN IR](concepts/indexed-rpn-ir/), [Bytecode Compiler](concepts/bytecode-compiler/), [Stack VM](concepts/stack-vm/), [let-go](entities/let-go/)\n", "concepts/lg-compile": "\n# lg-compile\n\n`lg-compile` is a let-go script that AOT-compiles a set of `.lg` source files into Go packages. Unlike the standard bytecode compiler (which produces `.lgb` files or standalone binaries), `lg-compile` generates a tree of `.go` files with **direct inter-package function calls** (`pkg.Fn(ec, ...)` in Go) instead of runtime trampoline indirection.\n\nThis is useful for embedding let-go-authored code as native Go libraries, reusing let-go logic from Go programs, or compiling multi-file let-go projects to a Go package hierarchy.\n\n## Usage\n\n```bash\n./lg scripts/lg-compile <out-dir> <import-prefix> <file.lg>...\n```\n\n**Parameters:**\n\n- `<out-dir>` \u2014 output directory for the generated Go package tree\n- `<import-prefix>` \u2014 Go import path prefix (each package is `<import-prefix>/<reldir>`)\n- `<file.lg>...` \u2014 one or more `.lg` files to compile\n\n**Example:**\n\n```bash\n./lg scripts/lg-compile /tmp/out github.com/example/generated-api \\\n  api/core.lg api/handlers.lg\n```\n\nEach `.lg` file's namespace becomes a Go package under `<out-dir>`. For example:\n\n- `api/core.lg` (ns `api.core`) \u2192 `<out-dir>/api/core/core.go` (package `core`)\n- `api/handlers.lg` (ns `api.handlers`) \u2192 `<out-dir>/api/handlers/handlers.go` (package `handlers`)\n\nThe generated Go packages are importable:\n\n```go\nimport \"github.com/example/generated-api/api/core\"\n\n// Call compiled let-go functions directly\nresult, err := core.MyFunction(ec, arg1, arg2)\n```\n\n## Compile Paths Comparison\n\n| Path | Command | Output | Use Case |\n|------|---------|--------|----------|\n| **Bytecode** | `lg -c app.lgb app.lg` | `.lgb` (binary module) | Distribute bytecode, run with `lg app.lgb` |\n| **Standalone binary** | `lg -b myapp app.lg` | Self-contained executable | Single-file distribution, no let-go runtime needed |\n| **WASM** | `lg -w site app.lg` | `index.html` (~6MB, embedded bytecode + WASM) | Web apps, browser deployment |\n| **Go package** | `lg scripts/lg-compile <out> <prefix> app.lg` | `.go` package tree | Embed in Go programs, direct function calls |\n\n## How It Works\n\n`lg-compile` (a let-go script) orchestrates the full-program lowering pipeline:\n\n1. **Parse** each `.lg` file into source forms\n2. **Intern** all namespaces (so cross-namespace symbol resolution works)\n3. **Compile** each form through the standard IR pipeline (`ir.passes.pipeline/compile-form`)\n4. **Lower to Go AST** using `ir.lower-go/lower` (converting IR to Go code)\n5. **Emit `.go` files** organized by namespace/package, with:\n   - Go function stubs for each let-go defn (accepting `*ExecutionContext` as first argument)\n   - Direct inter-package calls where both functions are in the generated tree\n   - Fallback trampolines for functions not eligible for direct calls (e.g., variadic functions)\n   - Necessary imports and Go build scaffolding\n\nThe generated code is valid Go that can be imported and linked into any Go program. Functions accept an `*ExecutionContext` (runtime state) and return `(vm.Value, error)`.\n\n## Cross-Package Calls\n\nWhen function A (in package `api.core`) calls function B (also in the generated tree, in package `api.handlers`), `lg-compile` emits a direct Go call:\n\n```go\nresult, err := handlers.MyFunction(ec, arg1, arg2)  // direct call, not trampoline\n```\n\nThis avoids runtime Var lookups and enables inlining by Go's compiler. Functions not eligible for direct calls (e.g., variadic) fall back to cached-var trampolines at runtime.\n\n## Citations\n\n[1] **lg-compile** \u2014 AOT compiler to Go packages (let-go script)  \nhttps://github.com/nooga/let-go/blob/main/scripts/lg-compile\n\n[2] **ir.lower-go** \u2014 IR \u2192 Go AST lowering (let-go module)  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg\n\n[3] **Bytecode Compiler** (this wiki)  \n[bytecode-compiler.md](concepts/bytecode-compiler/)\n\n[4] **WASM Compilation** (this wiki)  \n[wasm-compilation.md](concepts/wasm-compilation/)\n\n[5] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n---\n\nSee also: [Bytecode Compiler](concepts/bytecode-compiler/), [WASM Compilation](concepts/wasm-compilation/), [let-go](entities/let-go/)\n", "concepts/lgb-bytecode-format": "\n## What is `.lgb`?\n\nThe `.lgb` format is let-go's binary bytecode representation. It encodes compiled modules (code chunks, constants, namespace tables, and optional debug tables) in a compact, versioned wire format. `lg -c` emits `.lgb` files, `lg -b` appends one to a copy of the `lg` binary, and the runtime loads either through `DecodeToExecUnit`. The core library ships the same way: `pkg/rt/core_compiled.lgb` is the bytecode the runtime boots from instead of compiling
