 `core.lg` (see [runtime image](concepts/runtime-image/)).\n\n## When it matters\n\n- **Startup speed**: decoding is faster than recompiling, so bytecode caching trades compile time for decode time.\n- **Version skew**: the header carries enough to refuse a bundle from a different `lg` before any instruction runs. The costly failure this prevents is an opcode enum that moved between the compiling tree and the running tree, which used to surface deep in execution as `unknown instruction op=37`.\n- **Artifact size**: compression and split debug information are both opt-in trades of size against convenience.\n\n## Header\n\n```\nMagic          [4]byte   \"LGB\\x01\"\nVersion        uint16    1, 2, or 3\nFlags          uint16    see below\n[Capabilities] uint32    only when FlagCapabilities is set\n[OpcodeSet]    varint count + uint64 FNV-64a   only when CapOpcodeSet is set\n```\n\nEverything in the header stays plaintext, including in compressed bundles, so version, flag, and capability checks run before any inflate.\n\n### Format versions\n\n| Version | Written when | Adds |\n|---|---|---|\n| 1 | never (read only) | original encoding; decoded by a frozen `decodeToExecUnitV1` path |\n| 2 | default | per-tag versioning, batch collection decode, local-variable tables |\n| 3 | `-z` is passed | compressed-body framing; the body is one DEFLATE stream |\n\nThe encoder picks the lowest version that admits the module's flags, so a plain bundle stays byte-identical to what a pre-compression `lg` wrote. `lg -v` reports both numbers: `lgb: format 2 (default write), 3 (max)`.\n\n### Flags\n\nBits are positional in declaration order, and each version admits only the flags that existed when it was defined. A flag from a later version is rejected at the header with `unsupported LGB flags 0x%04x for version %d (supported: 0x%04x)`.\n\n| Flag | Since | Meaning |\n|---|---|---|\n| `FlagConstsBase` | v1 | a `ConstsBase` field is present in the consts section |\n| `FlagCapabilities` | v1 | a capability mask follows the header |\n| `FlagLocalVars` | v2 | per-chunk local-variable tables follow the NS table |\n| `FlagCompressed` | v3 | the body after the header is a declared-size, codec-tagged compressed stream |\n| `FlagDebugSplit` | v3 | source maps and local-variable tables were moved to an external `.debug` companion |\n\n### Capability mask and opcode-set signature\n\nThe capability mask reserves bits for features a decoder must understand to run the bundle at all. One bit is defined:\n\n- `CapOpcodeSet` (bit 0, since v1.12.0): the mask is followed by the producer's opcode count and an FNV-64a hash of the opcode mnemonics in enum order. The decoder compares it with the running VM's `vm.OpcodeSetSignature()` and rejects a mismatch:\n\n```\nopcode set mismatch: bundle compiled with 52 opcodes (signature 8c6f19e2a4b07d31), runtime has 44 (ecde554a791d0f51) \u2014 recompile the bundle with a matching lg\n```\n\n(The bundle side is illustrative; the runtime side is what `lg -v` reports at `0911118`.)\n\nUnknown capability bits are rejected too. The message names the unsupported bits (known ones with the `lg` release that introduced them, unknown ones as `unknown bit N`), then the runtime's supported set, then the minimum `lg` version when one is known, so a \"recompile or upgrade\" decision can be made from the error alone. `lg -v` and `lg-runtime -v` print the supported mask and the local opcode signature.\n\n## Body\n\nSections in order:\n\n1. **String table**: deduplicated string pool; later sections reference strings by index.\n2. **Chunks**: one entry per `CodeChunk` with its instruction words, `maxStack`, and source map.\n3. **Consts**: value constants (literals, functions, types). A function constant names its chunk by index; the encoder uses the module builder's live `*vm.CodeChunk` pointer index for that mapping, because two functions can have identical bytecode and different source metadata (#745).\n4. **NS table**: namespace name to chunk index, in load order.\n5. **Local-variable tables** (only with `FlagLocalVars`): per chunk, `(slot, name)` pairs in chunk-index order.\n\n### Tag encoding\n\nEach value's tag byte is `0bVV_TTTTTT`: two bits of tag version and a six-bit tag ID. Every tag was version 0, byte-identical to v1, until #781 (merged 2026-09-06, b0397f6) added the first version-1 tag: `TagDefMetaPairs = TagIDMap | TagVer1` carries a var's metadata as alternating keys and values in the map payload shape, so the decoder can keep the pairs and build the map on first use instead of eagerly at load. A v2 decoder from before #781 sees the non-zero version bits and rejects the byte rather than reading the pairs as an ordinary map. That is what the version bits are for: when a tag's semantics change, its version increments, and an old decoder fails instead of misreading the payload.\n\nTag IDs: scalars `0x00`\u2013`0x0C` (nil, true, false, int, float, string, keyword, symbol, char, big-int, void, UUID, instant), code `0x10`\u2013`0x11` (func, var-ref), collections `0x20`\u2013`0x24` (empty-list, list, vector, map, set), user types `0x30`\u2013`0x33` (record-type, record, regex, atom). `0x34`\u2013`0x3F` are reserved (`TagIDReserved0`\u2013`TagIDReserved11`).\n\n### Batch collection construction (v2)\n\nCollections decode through batch constructors rather than per-element `Assoc`: a vector preallocates its slice, and a map or set accumulates its entries and calls `NewPersistentMap` or `NewPersistentSet` once. This removed the per-element persistent copies that dominated decode time for large literals.\n\n## Compression (v3)\n\n`lg -c app.lgb -z app.lg` and `lg -b myapp -z app.lg` write a version-3 bundle whose body is one raw DEFLATE stream (`compress/flate`, chosen because it is stdlib and works under TinyGo and wasip1). After the plaintext header come a varint with the exact uncompressed body size and a codec byte (`1` = flate; the byte is a value rather than a flag bit so a future codec such as zstd costs no flag space). The decoder caps the declared size at 256 MiB and rejects a stream that stops short of, or runs past, the declaration. A version-2 decoder rejects the bundle by version before touching the stream.\n\nThe embedded core bundle can be compressed the same way at `lgbgen` time; that is off by default (#502).\n\n## Split debug information (v3)\n\n`lg -strip -c app.lgb app.lg` writes `app.lgb` without its source maps and local-variable tables plus `app.lgb.debug`, a companion that can restore them. `lg -strip -b myapp app.lg` does the same for a bundle (`myapp` + `myapp.debug`), and `-debug-output <path>` picks another location. On the fib sample the stripped runtime artifact is about 9% smaller; on the core bundle the debug sections are about 20%.\n\nThe companion (`LGD\\x01`, version 1) stores the SHA-256 of the exact stripped payload, a string table, and per chunk the source-map entries (`StartIP`, file, line, column, end line, end column) and local-variable `(slot, name)` pairs. A companion whose digest does not match is rejected rather than producing misleading tracebacks. `SplitDebug` also re-decodes the stripped output and checks chunk count, code, and `maxStack` against the original before emitting a companion.\n\nAt load time `lg app.lgb`, a standalone bundle, and `lg-runtime` look for `<artifact>.debug` beside the artifact; `LG_DEBUG_FILE=<path>` loads one from elsewhere, and `LG_DEBUG_FILE=` (empty) disables loading. Without a companion the stripped artifact runs and reports frames without source locations. Stripping applies to program bytecode from `-c` and `-b`; the embedded core and the `-w`/WASI paths are not stripped. See [debug info](concepts/debug-info/) for what the tables hold.\n\n## Implementation\n\nThe [bytecode package](https://github.com/nooga/let-go/tree/main/pkg/bytecode) provides:\n\n- `Encode(w, m *Module)` and `Decode(r) (*Module, error)`: serialize and deserialize.\n- `DecodeToExecUnit(r, resolve VarResolver) (*ExecUnit, error)`: decode ready to run.\n- `StripDebug` and `SplitDebug`: produce the stripped artifact and its companion; `HasSplitDebug` is the cheap header probe the loaders use.\n- `DescribeCapabilities` and `FormatVersionReport`: the human-readable capability and version text used by reject errors and `lg -v`.\n\n`pkg/rt/core_compiled.lgb` is regenerated by `make generate` whenever `pkg/rt/core/**/*.lg` changes; `make check-generated` verifies it is in sync.\n\n## Citations\n\n**Resource:** [pkg/bytecode/tags.go](https://github.com/nooga/let-go/blob/main/pkg/bytecode/tags.go): magic, versions, flags, capability bits, tag layout  \n**Related:**\n- [pkg/bytecode/encoder.go](https://github.com/nooga/let-go/blob/main/pkg/bytecode/encoder.go): version selection, section order, compressed framing\n- [pkg/bytecode/decoder.go](https://github.com/nooga/let-go/blob/main/pkg/bytecode/decoder.go): per-version flag admission, dual v1/v2 paths, batch collection decode\n- [pkg/bytecode/capabilities.go](https://github.com/nooga/let-go/blob/main/pkg/bytecode/capabilities.go): capability registry and `lg -v` report\n- [pkg/bytecode/strip.go](https://github.com/nooga/let-go/blob/main/pkg/bytecode/strip.go) and [debug_companion.go](https://github.com/nooga/let-go/blob/main/pkg/bytecode/debug_companion.go): split debug\n- [pkg/rt/run.go](https://github.com/nooga/let-go/blob/main/pkg/rt/run.go): `LoadDebugCompanion` and `LG_DEBUG_FILE`\n- [docs/guide/usage.md](https://github.com/nooga/let-go/blob/main/docs/guide/usage.md): `-z`, `-strip`, `-debug-output`\n- PRs: [#443](https://github.com/nooga/let-go/pull/443) opcode-set signature, [#608](https://github.com/nooga/let-go/pull/608) and [#622](https://github.com/nooga/let-go/pull/622) capability reject messages, [#501](https://github.com/nooga/let-go/pull/501) compression, [#502](https://github.com/nooga/let-go/pull/502) compressed embedded core, [#745](https://github.com/nooga/let-go/pull/745) chunk identity, [#624](https://github.com/nooga/let-go/pull/624) split debug\n\n**Design doc:** the v2 design spec (`docs/superpowers/specs/2026-05-23-lgb-v2-design.md`, local) covers format versioning, migration from v1, and the allocation and startup success criteria.\n", "concepts/lginterop": "\n# lginterop\n\n`lginterop` is a code generator that wraps Go packages so their functions become callable from let-go. Given a Go package path, it inspects the package's public exports and generates a `.go` file with:\n\n1. **Wrapper functions** for each exported function (adapted with `vm.MustBox` by default, or with explicit type-specific unboxing/boxing under `-smart`)\n2. **Struct registrations** for exported types (or opaque boxed handles under `-opaque-structs`)\n3. **An installer function** that registers everything on a let-go namespace at runtime\n\nThis eliminates hand-wrapping boilerplate when integrating external Go libraries into let-go programs.\n\nSince #773 (2026-09-06, `f19e9f8a`) the tool is a Go binary, `cmd/lginterop`, that links the let-go runtime and runs its emitter in the same process. It needs neither a let-go checkout nor an `lg` binary, so `go run github.com/nooga/let-go/cmd/lginterop@<version>` works from any module. Before #773 it was a script, `scripts/lginterop.lg`, that had to be run by an `lg` built inside a checkout and could only emit files that compile as part of `pkg/rt`.\n\n## Usage\n\nThe in-tree form, which is how `pkg/rt/interop_xxh3.go` is produced:\n\n```bash\ngo run ./cmd/lginterop -packages github.com/zeebo/xxh3 -opaque-structs -build-tags '!tinygo' -out pkg/rt\n```\n\nThe out-of-tree form, for a third-party module:\n\n```bash\ngo run github.com/nooga/let-go/cmd/lginterop@<version> -packages github.com/mattn/go-sqlite3 -out-pkg interop -out ./interop\n```\n\n`-out-pkg <name>` is what makes the output usable outside the let-go tree; without it the generator emits `package rt`. The generated file's header records the invocation (flags, non-default aliases, and the `@<version>` when one was used), so regenerating from the header round-trips byte-identically; `test/e2e/lginterop_regen_test.go` holds `interop_xxh3.go` to that.\n\nOnce the file is in the build, the functions are available under a namespace named after the package:\n\n```clojure\n(require '[hash])\n\n(hash/xxh3-64 (byte-array [1 2 3]))  ; => uint64 hash value\n```\n\n`pkg/rt/core/hash.lg` is the veneer over the generated `xxh3` namespace:\n\n```clojure\n(def xxh3-64 xxh3/Hash)  ; wrapper function from lginterop output\n```\n\n## How it Works\n\n`cmd/lginterop` is a two-stage pipeline:\n\n1. **`main.go` scans the package** with `go/types` and catalogs its exports into a compact vector format:\n   ```clojure\n   [:func \"Hash\" [] [\"[]uint8\" \"uint64\"] false]  ; name, type-params, params, results, variadic?\n   ```\n2. **The embedded `lginterop.lg` emitter renders Go source** using the `gogen` library. The binary evaluates the script through the runtime it already links (`gogen` registers via `pkg/rt`'s installer queue, so any binary importing `rt` has the emitter). It is compiled with `CompileMultiple` rather than `pkg/api`'s `Run`, because the script is a sequence of top-level forms and `Run` compiles only the first.\n\nThe generated `.go` file contains:\n\n- **Wrapper functions** that unbox let-go `Value` arguments to Go types, call the original Go function, and box the result back to a let-go `Value`\n- **Struct registration** (for types matching let-go's record protocol) using `vm.RegisterStruct`, unless `-opaque-structs` keeps them as `vm.Boxed` handles with reflective method dispatch, which xxh3 needs for `Hasher`\n- **An installer function** (`install<Alias>NS`) that creates the namespace, `Def`s each wrapper on it, registers structs, and calls `RegisterNS`\n\nHow the installer is invoked is the load-bearing difference between the two forms. In-tree output calls `RegisterInstaller(install<Alias>NS)` from `init()`, so the namespace joins `rt`'s installer queue and is installed in order with the rest of core boot. Out-of-tree output calls `install<Alias>NS()` directly from `init()`: `rt` drains its installer queue during its own package init, and Go runs an imported package's `init` before the importer's, so a `RegisterInstaller` from outside the tree would enqueue after the drain and silently never run.\n\nAt runtime, calling `(xxh3/Hash bytes)` from let-go invokes the wrapper, which converts bytes to Go `[]uint8`, calls the real `Hash`, and returns the result as a let-go number.\n\n## Smart Wrappers\n\nWith `-smart`, a function whose parameters and results are all simple types (`string`, `int`, `float64`, `bool`, `error`, `interface{}`) and whose result arity fits `NativeFnType.Wrap` (zero or one result, or two where the second is `error`) gets an explicit wrapper with type-specific unboxing and boxing instead of a `vm.MustBox` adapter (`smartable?` in `lginterop.lg`). Anything else falls back to `vm.MustBox` even under the flag.\n\n## Citations\n\n[1] **cmd/lginterop** \u2014 the generator: `main.go` scanner and embedded `lginterop.lg` emitter  \nhttps://github.com/nooga/let-go/tree/main/cmd/lginterop\n\n[2] **docs/guide/go-interop.md** \u2014 usage, flag reference, and out-of-tree generation  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/go-interop.md\n\n[3] **PR #773** \u2014 self-contained interop packages and an importable pkg/cli (merged 2026-09-06)  \nhttps://github.com/nooga/let-go/pull/773\n\n[4] **interop_xxh3.go** \u2014 generated example (xxh3 package wrapping)  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/interop_xxh3.go\n\n[5] **hash.lg** \u2014 user-facing API wrapping lginterop-generated functions  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/hash.lg\n\n[6] **Go Interop** (this wiki)  \n[go-interop.md](concepts/go-interop/)\n\n---\n\nSee also: [Go Interop](concepts/go-interop/), [let-go](entities/let-go/)\n", "concepts/lgx-build-model": "\n# lgx Build & Dependency Model\n\n[lgx](projects/lgx/) is a package and project manager for [let-go](entities/let-go/) that orchestrates three key responsibilities: **dependency resolution** via git-based coords and local paths, **compilation and execution** by invoking the `lg` runtime with resolved source paths, and **artifact bundling** through let-go's `-b` (build) flag. This page covers how lgx resolves dependencies, drives compilation, manages state, and runs programs\u2014everything needed to understand the workflow from `lgx install` through `lgx build`.\n\n## Dependency Resolution\n\n### Git-based and Local Coordinates\n\nlgx dependencies are declared in `lgx.edn` under `:deps` as a map of lib names to **coordinates**. Each coord is either:\n\n- **Git source**: `:git/url \"https://github.com/owner/repo\"` plus one of `:git/sha` (specific commit) or `:git/tag` (semantic version tag). HTTPS only; SSH forms are not supported.\n- **Local path**: `:local/root \"../my-lib\"` (relative to project root for direct deps, or relative to the declaring dependency for transitive ones). Local coords bypass the gitlibs cache entirely.\n\nBoth forms support `:deps/root <relative-path>` to name a source subdirectory inside the dependency (defaults to `src` if present, else the repo root). This matches the Clojure `tools.deps` convention and handles libraries that ship sources under non-standard locations like `org.clojure/tools.cli` with `:deps/root \"src/main/clojure\"`.\n\n### Gitlibs Cache and Atomic Cloning\n\nWhen lgx encounters a git coord, it computes a cache reference:\n- For `:git/sha` coords, the ref is the commit SHA itself\n- For `:git/tag` coords, the ref is the tag name with `/` replaced by `_`\n\nlgx checks `$LGX_HOME/gitlibs/<host>/<owner>/<repo>/<ref>/` for an existing cache entry. If present, it reuses the cached directory (idempotent\u2014calling `lgx install` twice on the same deps does not re-clone). If missing, it clones atomically: clone into a temp directory, check out the SHA or tag, drop the `.git/` directory, and rename atomically to the final cache path. This atomic approach ensures no partial states are visible to concurrent operations.\n\nLocal deps are never cached; they resolve directly from disk.\n\n### Transitive Dependency Resolution\n\nAfter fetching a dep, lgx reads its own `lgx.edn` (if present) and resolves only the `:deps` entries recursively\u2014never `:paths`, `:main`, `:tasks`, or other top-level keys. Resolution is **breadth-first and first-wins**: the first coord seen for a library name is kept, and a later different coord is skipped with a warning. Direct deps override transitive ones of the same name. This strategy is identical to Clojure's `tools.gitlibs` and prevents diamond-dependency conflicts.\n\nCycles are detected and terminated by the seen-libs set, so a circular dependency chain does not cause infinite recursion.\n\n## Compilation and Execution\n\n### Invoking the lg Runtime\n\nlgx never compiles or executes user code itself. Instead, it shells out to the `lg` binary\u2014either on `PATH` or pointed to by the `LGX_LG` environment variable\u2014and invokes it with resolved source and resource paths. Two separate `lg` runtimes coexist:\n\n1. **Embedded runtime**: The lgx binary itself is a let-go bytecode bundle (`lg -b lgx.lg bin/lgx`), embedding a pinned `lg` VM. This runs lgx's own project-management logic.\n2. **User runtime**: A separate `lg` binary (user-supplied or from PATH) executes the user's script with the resolved dependency paths.\n\nThis separation decouples lgx's release cycle from let-go's: upgrading let-go does not force rebuilding lgx, and vice versa.\n\n### Source and Resource Path Resolution\n\nFor commands that run or test (`lgx run`, `lgx test`, `lgx repl`, `lgx nrepl`), lgx:\n\n1. Resolves `:paths` from `lgx.edn` (project source directories, relative to project root) to absolute paths. Missing entries print a warning but are still passed to `lg`.\n2. Appends the gitlibs cache paths from all resolved dependencies, maintaining project-first precedence (project namespaces shadow library namespaces).\n3. Joins the paths with the OS separator and passes them to `lg` as the `-source-paths` argument.\n\nSimilarly, `:resource-paths` (asset roots for `io/resource \"\u2026\"`) are resolved and passed as `-resource-paths`. Resource paths are project-only\u2014dependencies never contribute resource directories\u2014but are embedded into the binary by `lgx build` so bundled apps resolve resources with no files alongside the executable.\n\n### The `lgx run` Workflow\n\n`lgx run` resolves the project basis (deps + paths), then decides the `lg` invocation by parsing its arguments structurally:\n\n- If args contain `--` before any positional, the user is driving `lg` (e.g., `lgx run other.lg` or `lgx run -e '(...)'`); `:main` is not injected.\n- If no `--` and `:main` is set, lgx injects `:main` and any postional args become `*command-line-args*` in the script.\n- If no `--`, no `:main`, and args remain, lgx errors (`lgx run: -- forwards args to :main, but no :main is set \u2026`).\n- If bare `lgx run` with no `:main`, lgx errors and suggests `lgx repl`.\n\nlgx execs `lg -source-paths <paths> -resource-paths <roots> [args...]` via inherited stdio (using let-go \u2265 1.10.0's `os/exec*`), so live output and interactive programs (REPL, prompts) work. The spawned process sees `LGX_RUN=1`, allowing code to detect dev mode.\n\n### Build and Bundling\n\n`lgx build` performs a similar basis resolution, then:\n\n1. Reads `:main` and `:targets/:bin` from `lgx.edn`. Both are required; missing either causes a clear error.\n2. Verifies the `:main` script exists on disk.\n3. Creates the parent directory of `:targets/:bin/:out` (recursive, idempotent).\n4. Execs `lg -source-paths <paths> -resource-paths <roots> [forwarded-args...] -b <abs-out> <abs-main>`.\n\nThe `-b` flag instructs `lg` to bundle the script into a standalone executable: the let-go VM and compiled bytecode are embedded in one binary, along with all resources under `:resource-paths`. The result is a portable executable that requires no separate `lg` binary or source files.\n\nExtra arguments before `-b` (e.g., `-bundle-base /path/to/lg` for cross-OS builds) are forwarded verbatim to `lg`, allowing fine-grained control over bundling.\n\n### Testing with Generated Harness\n\n`lgx test` walks `test/` recursively for `*_test.lg`, `*_test.cljc`, and `*_test.clj` files, generates a one-shot test harness, and runs every `deftest` against the project's resolved source paths.\n\nThe harness is written to `$LGX_HOME/test-runner/lgx-test-<version>.lg` and:\n\n1. `:require`s every discovered test namespace plus core test utilities.\n2. Defines a test plan (file \u2192 namespace mapping).\n3. Iterates each namespace's entries in `*registered-tests*` (let-go's built-in registry).\n4. Runs each `deftest` under `with-out-str` (suppresses assertion chatter) while tracking results.\n5. Prints a summary: `N tests, M assertions, K failures`.\n6. Exits 0 if all pass, 1 if any fail.\n\nIf a test file fails to load (compile/syntax/runtime error), `lg` prints a diagnostic to stderr but does not throw. lgx detects this by scanning stderr for `error: failed to load <path>: \u2026` before the harness-ready marker, and forces a failure exit if found (otherwise the harness would report 0 failures).\n\n## State Layout\n\nlgx organizes all persistent state under `$LGX_HOME` (default `~/.lgx`):\n\n```\n$LGX_HOME/\n  gitlibs/<host>/<owner>/<repo>/<ref>/\n    src/                      (when :deps/root \"src\" or default probing finds it)\n    ...                       (or other :deps/root directory)\n  templates/<host>/<owner>/<repo>/<sha>/\n    ...                       (cached template checkout, reused by `lgx new`)\n  test-runner/\n    lgx-test-<version>.lg     (generated test harness, rewritten on each `lgx test`)\n  let-go/source/<version>/    (optional; populated by LGX_FETCH_LET_GO_SOURCE)\n```\n\n- **`gitlibs/` cache**: Read-only worktree per coord. Each leaf is the checked-out dependency at the specified ref (sha or tag). The `src/` probe applies the default source-root logic.\n- **`templates/` cache**: Sha-pinned template checkouts, reused after first clone by `lgx new`. Parallels gitlibs structure but uses only sha keying.\n- **`test-runner/` harness**: Single generated harness file per lgx version, overwritten on each test run.\n- **`let-go/source/` source cache** (optional): Populated when `LGX_FETCH_LET_GO_SOURCE=1` is set during `lgx install`, enabling editor LSP navigation into let-go's standard library.\n\nAll paths are portable (no shell-specific characters) and idempotent. Missing `.git/` in cached repos prevents accidental git operations on the cached checkouts.\n\n## Contexts: Layered Path and Dependency Overlays\n\nThe `:contexts` map in `lgx.edn` defines named overlays of `:extra-paths`, `:extra-resource-paths`, and `:extra-deps`. These allow projects to layer dev/test dependencies without polluting production artifacts.\n\n**Auto-context convention**:\n- `:dev` context (if defined) auto-applies to `lgx run` only.\n- `:test` context (if defined) auto-applies to `lgx test` only.\n- Both `:dev` and `:test` auto-apply to `lgx repl` and `lgx nrepl`.\n- `lgx build` and `lgx install` never auto-apply contexts; use `lgx --with dev build` to explicitly apply contexts to build.\n\nContexts can also be applied manually via `lgx --with dev,test <command>` or via a task's `:with` vector. The layering order (lowest to highest precedence) is:\n\n1. Project `:deps` / `:paths` / `:resource-paths`\n2. Auto context (if applicable)\n3. Task `:with` contexts (in order)\n4. CLI `--with` contexts (in order)\n5. Task `:extra-deps` / `:extra-paths` / `:extra-resource-paths` (highest)\n\nDeps follow last-wins precedence (a higher layer's coord replaces a lower one's). Paths concatenate in order (project first, so project namespaces shadow library ones) and deduplicate keep-first. Resource paths layer identically but never pick up dependency directories.\n\n## External Dependencies\n\nlgx depends on:\n\n- **`git` on `PATH`**: Used for clone, fetch, and checkout operations. lgx never bundles git.\n- **`lg` binary**: On `PATH` or `LGX_LG`. `lgx run` fails loudly if `lg` is missing; `lgx install` does not require it. lgx sets `LG_READ_CLJ=1` before every `lg` invocation to enable `.clj` library file resolution and Clojure reader conditionals.\n- **Default template repo**: `lgx new` pulls from `https://github.com/abogoyavlensky/lgx-template-base` (sha-pinned), overridable via `LGX_TEMPLATE_BASE_URL` and `LGX_TEMPLATE_BASE_SHA`.\n\n## Component Architecture\n\nThe lgx source is organized into stateless helper namespaces:\n\n- **`lgx.main`**: Entry point and subcommand dispatch; wires basis/overlay resolution.\n- **`lgx/cli.lg`**: Pure argv parsing (program-prefix strip, leading `--verbose`/`--with`, nrepl `--port`).\n- **`lgx/config.lg`**: Schema-as-data validation, `lgx.edn` loading and normalization (runs once per invocation).\n- **`lgx/cache.lg`**: Gitlibs cache layout and fetch orchestration via `git`.\n- **`lgx/runner.lg`**: Locates `lg`, invokes with `-source-paths` / `-resource-paths`, handles interactive vs. captured stdio.\n- **`lgx/tasks.lg`**: Executes project tasks from `:tasks` in `lgx.edn`.\n- **`lgx/new.lg`**: Scaffolds new projects from templates (built-in or URL).\n\nThese modules are stateless and deterministic: the same `lgx.edn` + CLI args always produce the same invocation, cache layout, and exit code.\n\n---\n\n# Citations\n\n- **Primary resource**: [Architecture \u2014 abogoyavlensky/lgx](https://github.com/abogoyavlensky/lgx/blob/master/docs/ARCHITECTURE.md) \u2014 Runtime model, Components, Data flow, State layout, External dependencies sections detail lgx's invocation strategy, dependency resolution, and cache layout.\n- **README** \u2014 [lgx](https://github.com/abogoyavlensky/lgx) \u2014 Command reference and `lgx.edn` configuration grammar.\n", "concepts/namespaces-and-vars": "\n# Namespaces and Vars\n\nA var is the unit of definition and the boundary every [compile path](concepts/compile-paths/) agrees on: bytecode, IR-compiled, and Go-lowered code all resolve a name to a `*vm.Var` and read its root. A namespace is the table that resolves the name. Both live in `pkg/vm`, and the [execution context](concepts/exec-context/) owns the dynamic bindings that used to live on the var.\n\n## Namespace\n\n`vm.Namespace` is a name plus five maps behind one `RWMutex`: `registry` (the vars this namespace owns), `refers` (vars visible unqualified from other namespaces), `aliases` (`(:require [x :as y])`), `excludes` (names kept out of the `clojure.core` auto-refer), and `unmapped` (names removed with `ns-unmap`, hidden from refers too). The governing invariant is that no code holds one namespace's lock while taking another's, so cross-namespace reads snapshot or use the target's own brief accessors and the lock graph has no cycles.\n\n### Lookup order\n\n`Lookup` takes a symbol and follows Clojure's precedence:\n\n1. **Unqualified**: the namespace's own var, then explicit refers (`:refer [syms]`, `:refer :all`, `use`), then the auto-referred baseline (`clojure.core` and `let-go.core`) only when no explicit refer provides the name. An explicit refer therefore shadows core.\n2. **Alias-qualified** (`s/join`): the aliased namespace's own var, then that namespace's refers. An alias may point at a placeholder created before its source finished loading; on a miss the lookup re-resolves the namespace by name through the runtime's loader, caches the real one on the alias, and retries.\n3. **Fully qualified**: the global namespace registry, via the `nsLookup` hook `pkg/rt` installs.\n\nPrivacy is enforced only on bare qualified references. `LookupIncludingPrivate` backs the `var` special form, so `#'ns/sym` reaches a private var in any namespace, as in Clojure.\n\n```\n$ lg -e \"(do (require '[clojure.string :as core]) (core/join \\\",\\\" [1 2]))\"\n\"1,2\"\n```\n\nThat transcript is #548's regression: the compiler used to short-circuit any symbol whose namespace part was literally `core` to `clojure.core` before consulting aliases, so `core/join` failed to resolve. Aliases now win, and the core shortcut remains only as a fallback for `(ns ...)` expansion before refers exist. #610 fixed the sibling guard: a require-alias collision is detected by comparing namespace names, because two loads of the same namespace can present distinct pointers.\n\n### Short names for the standard namespaces\n\nThe canonical name of `clojure.core` is `core`. `pkg/rt` keeps a table (`nsAliases`) mapping `clojure.core`, `clojure.string`, `clojure.test`, `clojure.set`, `clojure.walk`, `clojure.edn`, `clojure.zip`, and `clojure.data` to `core`, `string`, and so on; both names resolve to the same `*Namespace`. `LookupOrRegisterNS` resolves the alias before touching the registry, which matters for the generated [primitive registrar](concepts/native-primitives/): it registers under `\"clojure.core\"`, and without canonicalisation it would create a second, invisible namespace. The short name is what the runtime prints:\n\n```\n$ lg -e \"(resolve 'inc)\"\n#'core/inc\n$ lg -e \"(find-ns 'clojure.string)\"\n<ns string>\n```\n\n### The `ns` macro\n\n`ns` is a macro in `core.lg`. It strips a metadata wrapper or docstring from the namespace symbol, hoists `(:refer-clojure :exclude [...])` into `exclude-in-current-ns` before any body form so the shadow check sees it, and expands each `:require` entry into `require` (load without referring), then `alias` for `:as`, `refer` for `:refer :all`, `refer-list` for `:refer [syms]`, and a rename step. Loading before referring is deliberate: `use` refers everything, which would leak every public of an `:as`-aliased library into the unqualified namespace.\n\n### The shadow warning\n\n`warnOnCoreShadow` prints Clojure's `WARNING: x already refers to: #'clojure.core/x` when a definition shadows a name referred in from core, with guards for core itself, `:exclude`, unmapped names, and a suppression flag. Both intern paths call it: `Def`, the Go-side path, and `LookupOrAdd`, which the `def` special form uses. Until #734 (merged 2026-09-06, 928c217) only `Def` checked, so the warning had never fired for user code. The transcript below is from 0911118, before the fix:\n\n```\n$ lg -e '(do (def inc 5) inc)'\n5\n```\n\nNo warning was printed. #734 factored the check into `warnOnCoreShadow`, calls it from both intern paths, matches Clojure JVM in warning only on shadow-of-refer (a namespace that never referred the name stays silent), and declares the one intentional shadow it uncovered (`edn/read-string`) with `:refer-clojure :exclude`.\n\n## Var\n\n`vm.Var` holds the root binding in an `atomic.Pointer`, so `Deref`, the hottest var operation, is a lock-free load. Around it: the owning namespace and name, metadata and watches behind a mutex, an atomic `isDynamic` flag (read on the hot path while a concurrent `binding` may set it), a private flag, and two things worth explaining.\n\n### Two binding chains\n\nDynamic bindings no longer live on the var. Each [`ExecContext`](concepts/exec-context/) owns a `bindingStack`: a persistent stack of immutable `(var, value)` frames behind an atomic head. A `binding` pushes a frame; the topmost frame for a var is its current value and the frames beneath are the shadowed outer bindings. Readers walk the chain from an atomically loaded head without locking, and a child context shares its parent's chain by pointer, which is how bindings convey into `future` and `go` blocks (see [concurrency model](concepts/concurrency-model/)). The root context keeps a second, per-var chain (`rootBind`) for bindings established outside any child context, plus a registry of vars with a live root binding so a snapshot can enumerate them without walking anything on the deref path.\n\n```\n$ lg -e \"(do (def ^:dynamic *x* 1) (defn f [] *x*) [(f) (binding [*x* 2] (f)) (f)])\"\n[1 2 1]\n$ lg -e \"(do (defn g [] 1) [(with-redefs [g (fn [] 2)] (g)) (g)])\"\n[2 1]\n$ lg -e \"(do (def y 1) (alter-var-root #'y inc) y)\"\n2\n```\n\n### Guarded roots\n\nLowered Go code may call a native primitive directly instead of dereferencing its var, which is only correct while the var still holds the native. `GuardRoot` records a var's canonical root, `GuardDeviated` says whether the current root differs, and `SetRoot` keeps a process-wide deviation counter (`GuardedRootsIntact`, one atomic load) that any `with-redefs`, `alter-var-root`, or re-`def` of a guarded var moves off zero and restoring the root moves back. The comment above it describes emitted direct-call sites consulting it and falling back to the trampoline; at `0911118` that is aspiration, since the only reader is the runtime's `rt/native-prims-intact?` diagnostic, and when that returns false `LG_GUARD_DEBUG` makes it print which guarded vars deviated. The switch that actually governs direct calls is `*direct-calls-disabled?*` at lowering time. See [native primitives](concepts/native-primitives/) and [compile paths](concepts/compile-paths/).\n\n### Metadata\n\nVars defined from source carry `:line`, `:file`, and `:column`; embedded core vars report `<embedded:core>` as their file. `:arglists` is not attached to the embedded core's vars at `0911118`:\n\n```\n$ lg -e \"(meta #'map)\"\n{:line 374 :file \"<embedded:core>\" :column 1}\n```\n\n#781 (merged 2026-09-06, b0397f6) changed how that metadata is stored in the core bundle. Before it, `InitFromLGB` eagerly built a map for each of the 485 vars that carried metadata at 0911118; now the bundle writes the pairs under the version-1 `TagDefMetaPairs` tag (see [.lgb format](concepts/lgb-bytecode-format/)) and the map is built on first use, which its measurement put at about half the boot allocations.\n\n## Citations\n\n**Resource:** [pkg/vm/namespace.go](https://github.com/nooga/let-go/blob/main/pkg/vm/namespace.go): the five maps, `lookup`, refer and alias precedence, `Def` and the shadow check  \n**Related:**\n- [pkg/vm/var.go](https://github.com/nooga/let-go/blob/main/pkg/vm/var.go): `Var`, the atomic root, `GuardRoot` and `GuardedRootsIntact`\n- [pkg/vm/binding_stack.go](https://github.com/nooga/let-go/blob/main/pkg/vm/binding_stack.go) and [root_bindings.go](https://github.com/nooga/let-go/blob/main/pkg/vm/root_bindings.go): the two binding chains\n- [pkg/rt/lang.go](https://github.com/nooga/let-go/blob/main/pkg/rt/lang.go): `nsAliases`, `LookupOrRegisterNSNoLoad`, `NameCoreNS`\n- [pkg/rt/core/core.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg): the `ns` macro\n- PRs: [#548](https://github.com/nooga/let-go/pull/548), [#610](https://github.com/nooga/let-go/pull/610) alias resolution; [#734](https://github.com/nooga/let-go/pull/734) shadow warning (merged); [#781](https://github.com/nooga/let-go/pull/781) lazy var metadata (merged)\n\nSee also: [Execution Context](concepts/exec-context/), [Concurrency Model](concepts/concurrency-model/), [Runtime Image](concepts/runtime-image/), [let-go](entities/let-go/)\n", "concepts/native-primitives": "\n# Native Primitives\n\nMost of `clojure.core` is Go. A native primitive is a plain Go function that the runtime binds to a var, and since #639 and #640 the binding is declared by an annotation on the function rather than by a hand-written `ns.Def` call. The annotations feed a generator that emits a committed registrar per package, the registrar registers the functions at init, and a small lifecycle keeps the native implementation in place when a namespace's Lisp source loads on top of it. The same registry tells the [Go backend](concepts/compile-paths/) which calls it may emit as direct Go calls.\n\n## The annotation surface\n\nA primitive is any exported Go function carrying `//lg:native` in its doc comment:\n\n```go\n// Subs returns a substring from index start to the end.\n// Mirrors clojure.core/subs with 2 arguments \u2014 `(subs s start)`.\n//\n//lg:native\n//lg:name subs\nfunc Subs(s string, start int) (string, error) { ... }\n```\n\n| Directive | Meaning |\n|---|---|\n| `//lg:native` | this function is a primitive |\n| `//lg:name <n>` | the let-go name; defaults to the Go identifier kebab-cased (`UpperCase` becomes `upper-case`) |\n| `//lg:ns <ns>` | the target namespace; defaults to `clojure.core` |\n| `//lg:private` | parsed into `primSpec.Private` but not read by the emitter, so it has no effect on registration at `0911118` |\n| `//lg:bind` | package-level marker selecting own mode for the whole package (below) |\n\nThe scanner reads parameter and result types from the Go signature, so a primitive can take `string` and `int` and return `(string, error)`; the generated adapter does the boxing and the argument-count check. A variadic `...vm.Value` signature registers with arity `-1`.\n\n## The generator\n\n`go run ./cmd/lgprimgen -primitives <dir> -go-pkg <import> -primitives-out <file>` scans one package and writes its `zz_primitives_generated.go`. Two things about it are deliberate:\n\n- **It imports nothing that boots the runtime.** `internal/primgen` scans with `go/ast`, builds the output by string concatenation, and formats it in process with `go/format` (#654). The registrar it emits is what lets the next runtime boot, so a generator that booted the current runtime would depend on the artifact it is about to produce. That matters mid-migration: with closures moved out of `installLangNS` but the registrar not yet regenerated, the runtime cannot start, and the generator is what makes it consistent again.\n- **The output is committed and content-gated.** `make generate` regenerates both registrars (`pkg/rt` and `pkg/rt/corefns`) and `make check-generated` fails when either is out of date, as it does for `core_compiled.lgb` (see [runtime image](concepts/runtime-image/)).\n\n## Two modes\n\nThe registrar's job depends on where the package sits.\n\n- **Own mode** (`//lg:bind` present; `pkg/rt` itself): the registrar emits an adapter per primitive, `Def`s each adapter into its namespace, and registers the direct-call metadata. `pkg/rt`'s registrar holds 247 entries as of `0911118` (2026-09-05), registered as two modules, `clojure.core` and `clojure.string`, 222 of them from the #639 hoist, and runs through the runtime's installer queue (`RegisterInstaller`), the same mechanism every `install*NS` in `pkg/rt` uses, so ordering against the rest of core boot is explicit.\n- **Contribute mode** (no marker; `pkg/rt/corefns`): the registrar only calls `rt.RegisterNativeModule` with the metadata. The vars already exist, defined by `core.lg` or by `pkg/rt`; what the package contributes is a typed Go entry point the Go backend can call directly. `corefns` migrated off a hand-written `NativeModule` this way in #640, and its generated file is six entries (`seq`, `first`, `second`, `next`, `rest`, `count`) that self-register from `init`.\n\nOwn-mode registration for an external package (`rt.BindGeneratedPrimitive`) is exported but not yet wired to a consumer.\n\n## The direct-call registry\n\nEvery registration lands in a registry keyed by namespace and name, and it is readable from Lisp:\n\n```\n$ lg -e '(rt/native-direct \"clojure.core\" \"count\")'\n{:variadic? false :needs-error? true :param-specs [\"vm.Value\"] :go-ident \"Count\" :result-spec \"vm.Value\" :arity 1 :needs-ec? false :lg-name \"count\"}\n$ lg -e '(sort (keys (rt/native-modules)))'\n(\"clojure.core\" \"clojure.string\")\n```\n\n`ir.passes.pipeline/lower-ns-to-go-result` seeds `ir.lower-go/*lowered-registry*` from `(rt/native-modules)`, so a call to a registered primitive lowers to `pkg.GoIdent(args)` instead of a var lookup and a boxed invoke. #613 direct-linked the hot `clojure.core` surface this way and measured about 3.5% less time and 5.6% fewer allocations on the IR-compile benchmark. The var-dispatch boundary stays overridable: `with-redefs`, `^:dynamic`, and `^:redef` vars are exempt, and `*direct-calls-disabled?*` forces every call back through the trampoline when runtime `alter-var-root` overrides must be observed (see [compile paths](concepts/compile-paths/)).\n\n## The reapply lifecycle\n\nA namespace whose Lisp source loads after runtime init, such as `clojure.string` on its first `require`, re-runs its `defn`s, and a bootstrap `(defn upper-case ...)` would overwrite the native adapter with a closure. Each generated `Def` is therefore recorded, and `reapplyGeneratedPrimitives` re-`Def`s the adapters right after an on-demand load completes. Explicit user redefinition still wins, because it happens after the load and the reapply fires only on the load itself.\n\n```\n$ lg -e \"(do (require 'clojure.string) [(rt/native-prims-intact?) (clojure.string/upper-case :a)])\"\n[true \":A\"]\n```\n\n`rt/native-prims-intact?` answers whether every generated primitive still resolves to its adapter; it is the boot-time and post-`require` gate the hoist PRs used. Two environment variables help when it says `false`: `LG_REGPRIM_DEBUG` logs every generated registration with the namespace it landed in (grep for `landed-canonical=false`), and `LG_GUARD_DEBUG` names a var whose root deviated from the native.\n\n## How the hoist was done\n\n`cmd/hoist-natives` is the codemod that lifted the inline closures out of `lang.go`. It hoists only sites it can prove safe: no capture of an enclosing local (package-level references and parameters are fine) and a discoverable name from an `ns.Def(\"<name>\", <var>)` site. Five categories are reported and left alone: multi-name aliases, duplicate `//lg:native` names, `.Lookup`-by-name registrations, names a stdlib `.lg` file redefines, and closures whose variable is still referenced by surviving code (a second registration, a helper, or a skipped closure). Capturing an enclosing local is the base safety criterion, checked before those five. Its default is a dry run that prints the classification and the proposed function; `-apply` rewrites. Of 292 closures, 222 were classified safe and hoisted (#639); the rest still register the old way, and Norman's review of #686 named the hand-registered methods that shadowed generated ones as a gap in that migration, tracked under #531 (consolidating the native-behaviour mechanisms).\n\nThe three wins the codemod was built for: stack traces name `rt.CorePlus` instead of `installLangNS.func42`; registration is declarative; and a named function with a Go signature can narrow toward typed parameters over time, which is what makes it direct-callable.\n\n## Citations\n\n**Resource:** [internal/primgen/generate.go](https://github.com/nooga/let-go/blob/main/internal/primgen/generate.go): the runtime-free scanner and emitter, with the p0/p1 bootstrap argument in its header  \n**Related:**\n- [internal/primgen/prims_scan.go](https://github.com/nooga/let-go/blob/main/internal/primgen/prims_scan.go): directive parsing (`lg:native`, `lg:private`, `lg:ns`, `lg:name`) and the `//lg:bind` marker\n- [cmd/lgprimgen/main.go](https://github.com/nooga/let-go/blob/main/cmd/lgprimgen/main.go): why the generator imports nothing that boots the runtime\n- [cmd/hoist-natives/main.go](https://github.com/nooga/let-go/blob/main/cmd/hoist-natives/main.go): the codemod and its safety analysis\n- [pkg/rt/native_prims.go](https://github.com/nooga/let-go/blob/main/pkg/rt/native_prims.go): annotated primitives (`Name`, `UpperCase`, `Subs`, and others)\n- [pkg/rt/corefns/corefns.go](https://github.com/nooga/let-go/blob/main/pkg/rt/corefns/corefns.go): the contribute-mode package; its registrar and `pkg/rt`'s are generated from these annotated sources into `zz_primitives_generated.go` in each package\n- [pkg/rt/native_prims_lifecycle.go](https://github.com/nooga/let-go/blob/main/pkg/rt/native_prims_lifecycle.go): reapply after on-demand load, `LG_REGPRIM_DEBUG`, `LG_GUARD_DEBUG`\n- [pkg/rt/native_direct.go](https://github.com/nooga/let-go/blob/main/pkg/rt/native_direct.go): `NativeModule`, `NativeDirectFn` (including `NeedsEC`), `RegisterNativeModule` (latest registration wins), `LookupNativeDirect`\n- [pkg/rt/native_direct_install.go](https://github.com/nooga/let-go/blob/main/pkg/rt/native_direct_install.go): `rt/native-modules`, `rt/native-direct`, `rt/native-prims-intact?`\n- [pkg/rt/installers.go](https://github.com/nooga/let-go/blob/main/pkg/rt/installers.go): the installer queue\n- [Makefile](https://github.com/nooga/let-go/blob/main/Makefile): the `lgprimgen` invocations under `generate` and `check-generated`\n- PRs: [#639](https://github.com/nooga/let-go/pull/639) hoist, [#640](https://github.com/nooga/let-go/pull/640) per-package surface, [#654](https://github.com/nooga/let-go/pull/654) in-process formatting, [#613](https://github.com/nooga/let-go/pull/613) direct-call natives\n\nSee also: [Go Interop](concepts/go-interop/), [lginterop](concepts/lginterop/), [Value Representation](concepts/value-representation/), [let-go](entities/let-go/)\n", "concepts/nrepl-server": "\n# nREPL Server\n\nA network REPL server exposing let-go's compiler and runtime via bencode-framed messages over TCP (127.0.0.1 by default). Enables interactive development in editors, the REPL, and tooling without rebuilding let-go itself.\n\n## Core Implementation\n\nThe base server in `pkg/nrepl/server.go` implements the nREPL 1.0 protocol. A client starts it via `lg -n -p <port>` or calls `NewNreplServer(ctx).Start(port)` directly from Go.\n\nThe server is **single-threaded at the protocol layer** (bencode frames over TCP, one message at a time per connection) but spawns one goroutine per accepted client connection. Each client connection is isolated via a session ID; multiple clients can connect to the same server instance.\n\n### Session Model\n\nEach nREPL session is a lightweight wrapper around a shared `*compiler.Context`:\n\n```go\ntype session struct {\n  id  string                      // UUID\n  ctx *compiler.Context\n}\n```\n\nSessions are created on-demand (via the `clone` operation) and destroyed explicitly. All sessions in a server share the same namespace state (the same `*rt.Namespace` objects), so `def`s in one session are visible to all others\u2014matching Clojure's process-global namespace architecture.\n\n### Wire Format\n\nMessages are bencode dictionaries, each sent as a byte sequence:\n\n```\nd2:id4:abc123:opevaln/a  \u2192 {\"id\": \"abc\", \"op\": \"eval\", ...}\n```\n\nResponses are also bencode dictionaries streamed back to the client. The protocol is synchronous: for each request, the server sends one or more response frames (each a separate bencode message) culminating in a `\"done\"` status.\n\n## Supported Operations\n\n- **`eval`** \u2014 Compile and execute Lisp code. Captures output via dynamic-binding interception of `*out*`, returning stdout frames, value/error results, and a final done frame. Code is evaluated against the session's compiler context, so all top-level forms execute with shared defs.\n- **`load-file`** \u2014 Evaluate a code string (convenience operation; converted to `eval` internally).\n- **`clone`** \u2014 Create a new session with a fresh UUID. The new session shares the parent's namespace.\n- **`close`** \u2014 Destroy a session by ID.\n- **`describe`** \u2014 Advertise supported operations and version info (let-go 1.0, nREPL 1.0).\n- **`completions` / `complete`** \u2014 Symbol completion via fuzzy namespace lookup.\n- **`info` / `lookup`** \u2014 Metadata and binding info for a symbol.\n- **`ls-sessions`** \u2014 List all active session IDs.\n- **`interrupt`** \u2014 Placeholder; returns `session-idle` (no cancellation implemented yet).\n\n## Output Capture\n\nThe `eval` operation captures stdout by binding `*out*` to a per-eval `bytes.Buffer`, executed on the call stack (not OS-level file descriptor swapping). This avoids cross-platform I/O decoupling issues that plagued earlier implementations.\n\n**Concurrency caveat:** The binding stack is process-global, not per-goroutine. Concurrent evals interleave bindings, so stdout from parallel evals can mix. Suitable for interactive single-client loops; not suitable for a multi-client production server without serialization.\n\n## Future Extensions (Design Phase)\n\n### Incremental Lowering\n\n**Status:** design phase (not yet integrated).\n\n**Design goal:** A `--serve` flag in `cmd/lgbgen` would warm-boot the full IR pipeline (Phase-1 compilation of core) once, then keep the compiler context alive and expose it over nREPL. Clients could then re-lower individual namespaces in seconds (vs. the ~76s cold-start cost). Design spec at `/Users/ndn/development/let-go/docs/superpowers/specs/2026-06-14-incremental-lowering-nrepl-server-design.md`. Experimental prototype exists in a development branch; not yet in main.\n\n### Browser Inspector Bridge\n\n**Status:** design only; not yet integrated into `pkg/nrepl/server.go`.\n\nA JSON variant of nREPL for WASM runtimes, streaming structured responses with per-form compilation artifacts (IR, bytecode, lowered Go). See `/Users/ndn/development/let-go/docs/superpowers/specs/2026-06-29-browser-inspector-nrepl-bridge-design.md`.\n\n---\n\n# Citations\n\n[1] [nREPL Server implementation](https://github.com/nooga/let-go/blob/main/pkg/nrepl/server.go) \u2014 bencode protocol, session management, operation dispatch.\n\n[2] Incremental lowering design \u2014 local spec `/Users/ndn/development/let-go/docs/superpowers/specs/2026-06-14-incremental-lowering-nrepl-server-design.md`.\n\n[3] Browser Inspector nREPL bridge design \u2014 local spec `/Users/ndn/development/let-go/docs/superpowers/specs/2026-06-29-browser-inspector-nrepl-bridge-design.md`.\n", "concepts/op-catalog": "\n# Op Catalog\n\nThe [IR](concepts/indexed-rpn-ir/) has a small vocabulary of ops (39 at `0911118`), and each op has facts: how many operands it pops, whether it pushes a result, whether it is pure, whether it terminates a block, which bytecode it maps to, how it is typed, how it lowers to Go. Norman's 2026 refactors (#612, #666, #667, #712, under the consolidation epic #268) moved those facts out of the `cond` arms in `build.lg`, `lower.lg`, `lower_go.lg`, and `typeinfer.lg` into catalogs that every consumer queries, and added checks that fail the build when a catalog and a consumer disagree. The design rule they share: a fact about an op lives in one column, and a consumer that needs it asks rather than repeating it.\n\n## The op table\n\n`pkg/ir/ir_ops.lg` holds one vector per op, and order is load-bearing because the Go enum is positional. Columns:\n\n| Column | Meaning |\n|---|---|\n| `name`, `display`, `comment` | generates `Op<name>` and the `opTable` row |\n| `stk-in`, `stk-out` | operands popped (`-1` variadic) and results pushed (0 or 1) |\n| `pure?` | safe to CSE, fold, or hoist |\n| `term?` | ends a basic block |\n| `bytecode` | the `vm.OP_*` the [bytecode lowering](concepts/bytecode-lowering/) emits, or `nil` |\n| `cheap?` | `materialize!` may re-emit it at the use site (`Const`, `LoadArg`, `LoadVar`, `LoadClosed`) |\n| `local-carry?` | the Go lowering materializes its result into a Go local (#612 \u00a71) |\n| `infer?`, `lower?` | the op's type-inference and Go-lowering facets are reified on an `ir.ops` op-type |\n\nRunning the file generates `pkg/ir/op_generated.go` (a [generated artifact](concepts/generated-artifacts/)): the `Op` type, the `iota` constant block, `opInfo`, `opTable`, and the `Op` methods, all built through `gogen`'s `gquote`. #612 \u00a72b added a generated `opByKeywordExact` string switch so the canonical keyword-to-op lookup is a `switch` rather than a scan; the PR measured it at 57 ns to 2.1 ns and allocation-free, with non-canonical spellings falling through to the lenient scan.\n\n## Reified op facets\n\n`ir.ops` (in `pkg/rt/core/ir/ops.lg`) defines an `IROp` protocol and one `deftype` per reified op, co-locating that op's `infer` and `lower-stmts` behaviour instead of scattering them across `typeinfer.lg` and `lower_go.lg`. `op-registry` maps the keyword to the instance. The dispatch sites consult the catalog's `infer?` and `lower?` columns first and fall back to their legacy `cond` arm for ops not yet reified.\n\nCoherence is enforced at load time: the facet columns are the closed member set, and the check at the end of `ops.lg` throws when the columns and `op-registry` drift; `infer-op` and `lower-op` throw rather than return `nil` when asked for a facet'd op they cannot dispatch. Adding a facet is a red build until catalog column, registry entry, and dispatch arm all agree. `ir.ops` is a leaf namespace that requires only `ir.data` and `ir.lattice`, which keeps it below `typeinfer` and `lower-go` in the load order.\n\n#666 applied the same shape to one more fact: whether a lowered function needs runtime access (`function-needs-rt?`) used to be several scattered conditionals, and is now `op-contributes-rt?`, a per-op contribution rule folded with OR over the function's instructions, with regression gates that turn red if either conditional case is flattened.\n\n## The form-head catalog\n\nThe source side has its own catalog. `form_heads.lg` lists the 14 special-form heads `build-list` handles, each with whether `free-vars` and `captures-of` need an explicit handler for it (#667). `build-list` dispatches through a catalog-keyed handler lookup instead of a hardcoded `cond` chain, and the two scope functions derive their membership sets from catalog queries, precomputed once at load. The coherence check is bidirectional: a form missing from the catalog, or a catalogued form without a handler, fails generation naming the form. The check announces itself whenever the pipeline loads:\n\n```\n$ lg -e \"(require 'ir.passes.pipeline)\"\nir.form-heads catalog loaded (catalog validation passed)\nir.form-heads catalog loaded (bidirectional coherence check passed)\n```\n\n## The accessor seam\n\nThe catalogs describe ops; the function's shape is a separate representation, and #712 closed the last thirteen places that reached past `ir.data` into `(:insts @f)` and `(:blocks @f)` directly. It added the accessors that were missing (`all-insts`, `raw-blocks`, `all-types`, documented as representation-shaped and a last resort) and moved every caller onto them, so no `@f` remains outside the data layer. That is the precondition for the representation work in [the IR roadmap](ideas/ir-representation-roadmap/): packed instruction records can only move underneath callers that never touched the flat tables. One trap the PR recorded: a `defn` added to `ir/data.lg` is invisible until it is also listed in the intern block at the bottom of the file, and forgetting it fails at namespace load with a message naming an unrelated pass.\n\n## Citations\n\n**Resource:** [pkg/ir/ir_ops.lg](https://github.com/nooga/let-go/blob/main/pkg/ir/ir_ops.lg): the op table and the generator\n\n**Related:**\n- [pkg/rt/core/ir/ops.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/ops.lg): `IROp`, `op-registry`, the load-time coherence check\n- [pkg/rt/core/ir/form_heads.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/form_heads.lg): the form-head catalog\n- [pkg/rt/core/ir/lower_go.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg): `op-contributes-rt?`\n- PRs: [#612](https://github.com/nooga/let-go/pull/612), [#666](https://github.com/nooga/let-go/pull/666), [#667](https://github.com/nooga/let-go/pull/667), [#712](https://github.com/nooga/let-go/pull/712); epic [#268](https://github.com/nooga/let-go/issues/268)\n\nSee also: [Indexed-RPN IR](concepts/indexed-rpn-ir/), [IR Pipeline](concepts/ir-pipeline/), [IR Passes](concepts/ir-passes/), [let-go](entities/let-go/)\n", "concepts/perf-ratchet": "\n# Performance Ratchet\n\nlet-go has three ratchets, and they share one rule: the bar only moves one way. A benchmark that gets faster tightens the baseline; a benchmark that gets slower fails the gate until someone explains it. The word covers a timing ratchet (`bench-ratchet`), a lowering-coverage ratchet (`ir-stress-gate`), and a lowering-shape ratchet (a test that pins instruction counts). All three run before a push, not only in CI.\n\n## bench-ratchet: anchor-relative timing\n\nThe problem it solves is that CI does not run on the hardware developers benchmark on. `cmd/bench-ratchet` therefore reports every benchmark as a multiple of a frozen calibration loop, `BenchmarkRatchetAnchor` in `pkg/vm`, which has no allocations and no project code. That ratio is roughly stable within a CPU family, so a baseline captured on one machine still flags a regression on another, and `benchstat`'s two-runs-on-one-machine model is not needed for the gate (it still composes for same-machine investigation).\n\nTwo phases, separately invokable:\n\n1. **capture** runs `go test -bench` per package and streams each result as one JSON line to a `.jsonl` file, fsynced as it goes, so a later benchmark that hangs cannot lose the earlier results.\n2. **aggregate** normalizes against the anchor and writes `docs/perf/baseline.json`. `check`, `update`, and `show` are wrappers over capture then aggregate; `snapshot` writes an immutable timeline file instead.\n\nThe check is, per benchmark, `delta = current.ratio_to_anchor / baseline.ratio_to_anchor - 1`, with a default budget of 5%: over budget is a regression and a non-zero exit, under is improvement, a benchmark in the baseline but not the run is `MISSING`, and one in the run but not the baseline is `NEW`. Sampling discards warmup and takes the median (#561, #564), and the report warns when the anchor itself drifted.\n\nThe default scope is narrow on purpose: the anchor; the Clojure test-suite exec and total benchmarks under three variants (bytecode, IR-compiled bytecode, and `gogen_ir`); `BenchmarkIRCompile` under two; and `BenchmarkInitFromLGB`, the one `pkg/compiler` benchmark gated, for core-bundle decode and replay. The broad `pkg/compiler` and `pkg/bytecode` fleets are excluded so a slow compile change does not trip a runtime gate. `-full` adds the whole `pkg/vm` fleet for a manual deep dive.\n\n### Deterministic bars\n\nAllocations and bytes per operation do not depend on the machine, so they are gated as absolute bars against the global minimum across every profile in the baseline, at a fixed 2% (`allocBudget` in `cmd/bench-ratchet/main.go`), the bar #791 reports `IRCompile` bytes/op crossing. A forced rebaseline resets these bars too since #780; before that a `-force` update carried stale bars forward.\n\n### The baseline and the ratchet\n\n`baseline.json` (version 2) holds one profile per machine key: the anchor's sampled `ns_per_op`, and per benchmark the raw numbers for same-machine eyeballing plus `ratio_to_anchor`, which is what `check` compares. `make bench-ratchet-update` merges rather than overwrites: each `(benchmark, metric)` becomes the minimum of baseline and current, so a faster run is adopted, a slower one is pinned at the baseline and reported, a new benchmark is adopted as is, and a benchmark missing from the run is kept so a rename cannot release its bar. `-force` writes current numbers as they are; the doc's rule is that a forced rebaseline needs a paper trail and must not ride along with the change being measured.\n\nThe active baseline is seeded from CI (`seed-baseline`). Since #684 (merged 2026-09-07, `a6763e77`) it reduces a window of the five most recent amd64 snapshots per explicit machine key (`-seed-window`) to a median in ratio space, rather than trusting the newest one: one snapshot is one CI run, and seeding from it set a fifth of the floors from a single observation. A key with fewer than three snapshots is skipped (`-seed-min-window`); a snapshot whose ratios sit off the rest of its window is rejected as a mixed capture, but one whose anchor merely drifted is kept, because the anchor exists to divide host speed back out. `captured_at_sha` names the newest surviving snapshot. The result is merged with the existing Apple M3 profile so local gating stays free of runner noise. Apple M1 virtual runners are excluded on purpose after #651 found 27% of their benchmark entries moving more than 10% between reps of identical code (4 to 5% on the amd64 runners); they fall back to deterministic-only gating. `docs/perf/historical/` holds one frozen file, `v1.8.0.json`; #740 added `perf-release-baseline.yml`, which freezes `historical/<tag>.json` on every `v*` tag through an auto-opened PR, and as of `0911118` no tag since has been frozen or backfilled. `-baseline docs/perf/historical/v1.8.0.json check` answers \"how far have we drifted since that release\" with no ratchet logic involved.\n\n### Where it runs\n\n| Where | What |\n|---|---|\n| pre-push (`.pre-commit-config.yaml`, `always_run`) | `make bench-ratchet` on every push, because a runtime, generated-bundle, or policy change can regress a metric with no benchmark file in the diff (#780) |\n| PR CI, opt-in | `perf-pr.yml` runs the A/B only when the PR carries the `perf` label and touches `pkg/**` or `cmd/**` |\n| `main` | `perf-timeline.yml` snapshots every non-docs push to the `perf-data` branch; `pages.yml` fetches that branch on deploy and renders the \"are we fast yet\" page with `cmd/perf-page` from the committed baseline, the historical files, and the timeline |\n\nA run needs a quiet machine. `cmd/bench-baton` (#795, open at the time of writing) is a per-machine lease with an exclusive `bench` lane and a shared `build` lane, so a test suite running beside the ratchet cannot produce a number the gate mistakes for a regression.\n\n### What it caught\n\n#791 is the worked example. After #780 recaptured the baseline on 2026-09-02, the pre-push gate went red on `main` itself. Bisecting on an M3 attributed it: #727's `PrepareCall` allocates an argument slice, a frame, and a struct on every `reduce`, about 1,900 extra allocations per `BenchmarkIRCompile` iteration (+2.4% bytes/op, over the deterministic bar), and #723 and #730 each added several percent of time to both compiler benchmarks. #794 (merged 2026-09-06, 3ae0a08) removed the `PrepareCall` allocations for native fold loops. The same report recorded two false positives worth knowing: macOS Low Power Mode moved the anchor 74%, so `pmset -g | grep lowpowermode` is the first check when the anchor shifts on the same machine class; and the bytes/op bar is not architecture-dependent, since an amd64 build under Rosetta allocated the same as arm64.\n\n## ir-stress-gate: lowering coverage\n\nThe second ratchet measures what the IR pipeline can lower, not how fast it runs. `scripts/ir-stress.lg` drives every shipped, test, and example `.lg` through a backend and buckets each `defn`; `docs/perf/ir-stress-baseline.edn` records the failure count (11 of 2,429 for the Go path when last captured on 2026-07-21) and `make ir-stress-gate` fails when failures grow or the corpus total drifts. The bytecode path has its own baseline and gate (`ir-stress-bytecode-gate`), added with #580. Rebaselining is tool-maintained (`make ir-stress-rebaseline`, never hand-edited) and only tightens; the file's own note says a loosening is always a real regression. It runs pre-push, and deliberately not in CI, because it takes about a minute. See [compile paths](concepts/compile-paths/) for the modes and buckets.\n\n## The lowering-shape ratchet\n\nThe third pins the shape of what the bytecode backend emits. `test/ir_lower_stack_discipline_test.lg` (#579) asserts upper bounds on instruction count and `DUP_NTH` count for two fixtures (`fib` at most 23 instructions and 4 `DUP_NTH`; a `loop`/`recur` sum at most 18 and 8; the direct compiler's 18 and 16 with no shuffle are the targets), and that ordinary var loads are re-emitted per use. Upper bounds rather than equalities, following the other two: an improvement passes with room, then the numbers tighten in the same commit.\n\n## Citations\n\n**Resource:** [docs/perf/ratchet.md](https://github.com/nooga/let-go/blob/main/docs/perf/ratchet.md): architecture, baseline format, check semantics, seeding, `-force` policy  \n**Related:**\n- [cmd/bench-ratchet](https://github.com/nooga/let-go/tree/main/cmd/bench-ratchet): the tool\n- [docs/perf/baseline.json](https://github.com/nooga/let-go/blob/main/docs/perf/baseline.json) and [docs/perf/ir-stress-baseline.edn](https://github.com/nooga/let-go/blob/main/docs/perf/ir-stress-baseline.edn): the two committed baselines\n- [.pre-commit-config.yaml](https://github.com/nooga/let-go/blob/main/.pre-commit-config.yaml): the `bench-ratchet` and `ir-stress-gate` pre-push stages\n- [.github/workflows/perf-timeline.yml](https://github.com/nooga/let-go/blob/main/.github/workflows/perf-timeline.yml): timeline snapshots on `main`\n- [scripts/ir-stress.md](https://github.com/nooga/let-go/blob/main/scripts/ir-stress.md): the coverage harness\n- PRs and issues: [#561](https://github.com/nooga/let-go/pull/561), [#564](https://github.com/nooga/let-go/pull/564) sampling; [#740](https://github.com/nooga/let-go/pull/740) per-release baseline; [#780](https://github.com/nooga/let-go/pull/780) deterministic rebaseline and pre-push gate; [#579](https://github.com/nooga/let-go/pull/579) shape ratchet; [#795](https://github.com/nooga/let-go/pull/795) bench-baton; [#791](https://github.com/nooga/let-go/issues/791) the caught regression; [#651](https://github.com/nooga/let-go/issues/651) CI noise measurement\n\nSee also: [Compile Paths](concepts/compile-paths/), [Stack VM](concepts/stack-vm/), [IR Optimizations](concepts/ir-optimizations/), [let-go](entities/let-go/)\n", "concepts/pods": "\n# Pods\n\nlet-go loads **Babashka pods** \u2014 external processes that expose Clojure functions over a simple EDN-based RPC protocol. Pods open the whole pod ecosystem (SQLite, AWS, Docker, file watching, and more) without requiring JVM interop or shipping as a monolithic binary.\n\n## What are pods?\n\nA pod is an external process speaking the Babashka pods protocol: stdio-based EDN message exchange with a request/response model. The host (let-go) spawns a pod, asks it to describe its exported namespaces and functions, and then invokes those functions on demand. Data flows as EDN (vectors, maps, keywords, symbols) serialized to newline-delimited JSON or EDN.\n\n## Protocol\n\nPods communicate via newline-delimited EDN messages:\n\n- **`:describe` operation** \u2192 pod returns a map of namespaces, each with vars, arglists, and optional metadata.\n- **`:invoke` operation** \u2192 caller sends `{:op :invoke :var \"ns/name\" :args [...] :id N}`, pod responds with `{:id N :value result}` or `{:id N :ex error-type :err message}`.\n- **`:shutdown` operation** \u2192 graceful pod termination.\n\nlet-go maintains request/response correlation by ID, enforces timeouts, and maps results back to let-go values.\n\n## Loading pods\n\n```clojure\n(require '[pods :as pods])\n\n; Load a pod from a local path or URL\n(pods/load \"/path/to/sqlite-pod\")\n\n; Invoke a function from the pod's exposed namespace\n(sqlite/query \"SELECT * FROM table\")\n\n; List active pods\n(pods/list)\n\n; Unload and stop a pod\n(pods/unload \"sqlite-alias\")\n```\n\n## Data mapping\n\n| EDN type | let-go type |\n|----------|-------------|\n| `nil`, booleans, ints, strings, chars | scalars (identity mapping) |\n| Keywords, symbols | keywords, symbols |\n| Vectors, lists | `PersistentVector`, `List` |\n| Maps (string/keyword/symbol keys) | `PersistentHashMap` |\n| Sets | `PersistentHashSet` |\n| Errors | let-go exceptions with pod-provided message and optional data |\n\n## Host architecture\n\n**Pod manager** (`pkg/rt/pods.go`):\n- `Start(path, opts)` spawns the pod process with pipes, sends a `:describe` request, and installs proxy vars.\n- Maintains a background goroutine reading and dispatching responses by ID.\n- Each request carries a timeout context; cancellation sends SIGTERM to the pod.\n- `Stop()` (graceful) and `Kill()` (forceful) handle shutdown.\n\n**Proxy namespace**:\n- For each function described by the pod, a let-go `Var` is installed that acts as an `Fn`.\n- Invoking the proxy serializes arguments to EDN, sends an `:invoke` request, awaits the response (or timeout), and returns the mapped result.\n- Errors are raised as let-go exceptions.\n\n## Ergonomics\n\nThe `pods` namespace provides:\n\n- `(pods/load path & {:as opts})` \u2014 loads and installs a pod; returns or assigns an alias namespace.\n- `(pods/unload alias)` \u2014 stops the pod and removes proxies.\n- `(pods/list)` \u2014 returns active pods with PIDs and descriptors.\n\nCLI helpers (planned):\n\n- `lg pods describe <path>` \u2014 prints the pod's descriptor.\n- `lg pods run <path> -- <args>` \u2014 quick test runner.\n\n## Security and resource limits\n\nPods run as external processes, so they inherit OS-level isolation:\n\n- Allowlist/denylist of pod executables to prevent arbitrary code execution.\n- Resource limits per pod (CPU timeout, memory soft limits, max concurrent calls).\n- For stricter sandboxing, pods can be run in containers (Docker, VM, etc.).\n\n## Why pods\n\n- **Ecosystem reuse**: Babashka's growing pod collection is instantly available.\n- **No JVM dependency**: let-go stays a lean single binary; interop code runs in a separate process.\n- **Safe isolation**: each pod is a process boundary; failures are contained.\n- **Portable**: EDN + stdio means pods can be written in any language.\n\n## Planned extensions\n\n- **TCP transport** for remote pods.\n- **Streaming and binary encoding** (transit) for large payloads.\n- **Retry logic and reconnection** for resilient long-running pods.\n\n# Citations\n\n[1] **pkg/rt/pods.go**: Pod manager, stdio transport, request/response routing  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/pods.go\n\n[2] **docs/design/pods.md**: Detailed design, protocol spec, implementation plan  \nhttps://github.com/nooga/let-go/blob/main/docs/design/pods.md\n\n[3] **Babashka pods**: Protocol documentation and existing pod ecosystem  \nhttps://github.com/babashka/pods\n\n[4] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n---\n\nSee also: [go-interop](concepts/go-interop/), [stack-vm](concepts/stack-vm/)\n", "concepts/reader": "\n# Reader\n\nThe reader is the first stage of every [compile path](concepts/compile-paths/): `LispReader` in `pkg/compiler/reader.go` turns a character stream into `vm.Value` forms, and everything downstream (macros, the direct compiler, the IR pipeline) sees only those forms. It is a hand-written recursive reader in Go with two dispatch tables, one for the macro characters and one for what follows `#`. It also records where each collection and function literal came from, keyed by form identity in `vm.FormSource`, which is how [debug info](concepts/debug-info/) gets file and line for a chunk.\n\n## Dispatch\n\n`Read` skips whitespace (a comma counts as whitespace, as in Clojure), then: a digit starts a number; a macro character dispatches through the table; `+` or `-` followed by a digit is a number; anything else is a token, interpreted as a symbol, keyword, `nil`, `true`, or `false`.\n\n| Character | Reads |\n|---|---|\n| `(` `[` `{` | list, vector, map (an unmatched closer is an error naming the delimiter) |\n| `\"` | string, with `\\t \\r \\n \\b \\f \\\\ \\\"` and `\\uXXXX` escapes |\n| `\\` | character: `\\a`, `\\newline`, `A` |\n| `'` `` ` `` `~` `~@` `@` | `(quote x)`, syntax-quote, unquote, unquote-splicing, `(deref x)` |\n| `;` | line comment (a no-value form, see below) |\n| `^` | metadata prefix |\n| `#` | second table |\n\n| After `#` | Reads |\n|---|---|\n| `#'x` | `(var x)` |\n| `#_form` | discard (a no-value form) |\n| `#(...)` | anonymous function: `'#(+ % %2)` reads as `(fn* [%1 %2] (+ %1 %2))` |\n| `#{...}` | set literal (see divergences) |\n| `#\"...\"` | regex |\n| `#?(...)` and `#?@(...)` | reader conditional, plain and splicing |\n| `##Inf` `##-Inf` `##NaN` | symbolic float values |\n| `#tag form` | tagged literal: `#uuid` and `#inst` are built in; any other tag returns its form unchanged |\n\n`IsTokenBoundary` is exported so the REPL completer scans a line with the reader's own rule for where a symbol ends, rather than an approximation that could drift.\n\n### No-value forms and VOID\n\nA line comment, a `#_` discard, and a reader conditional with no matching branch all read as the `VOID` sentinel rather than as nothing. This is load-bearing: the collection readers call `Read` in element position and rely on seeing `VOID` to drop an orphaned map key or splice nothing, so `{:a #_ 1 :b 2}` reads as `{:b 2}`. The skip covers an orphaned entry, not a form inside one: a discard between a key and its value, `{:a #_[:x] 1}`, fails with `map literal must contain even number of forms` at `a6763e77` (2026-09-08). The one `reader.go` change since `0911118`, in #787, makes a `#_` skip a line comment or a nested discard before the form it drops, so `[#_ ;; note\\n [:x] [:y]]` reads as `[[:y]]` as in Clojure; the map-interior gap is untouched. Norman filed that gap, with metadata on map literals, as #801 (2026-09-06). `ReadSkipNoValue` is the single-form entry point `read-string` uses; it loops past leading no-value forms and never returns `VOID`.\n\n```\n$ lg -e \"(read-string \\\";c\\n(1)\\\")\"\n(1)\n$ lg -e \"'#_ignored 42\"\n42\n```\n\n## Reader conditionals\n\n`#?(...)` reads its key/value pairs and takes the first key that matches: `:lg` always, `:default` always, `:clj` only when `LG_READ_CLJ` is set or `(set-read-clj! true)` has been called, and `:bb` under `LG_READ_BB` or `set-read-bb!`. The `:clj` opt-in exists because the `:clj` branch of many libraries reaches JVM-only code; the Clojure compatibility suite reads through the `:clj` lens, ordinary programs do not.\n\n```\n$ lg -e '#?(:lg :lg-branch :clj :clj-branch :default :dflt)'\n:lg-branch\n$ lg -e '(read-string \"#?(:clj 1 :default 2)\")'\n2\n$ lg -e '(do (set-read-clj! true) (read-string \"#?(:clj 1 :default 2)\"))'\n1\n```\n\nAn unmatched branch is skipped, not read, by `skipReaderForm`, which counts balanced delimiters and knows the prefix forms (`^meta x`, `'x`, `#tag x`) consume the form after them. It has to, because a skipped `:clj` branch may hold syntax let-go cannot parse, and each of those prefix cases was once a bug where the trailing form desynchronised the surrounding conditional and swallowed the rest of the file. A comment between a branch key and its value is tolerated for the same reason.\n\n## Numbers\n\n`readNumber` handles, in this order: a `N` suffix for `BigInt` and `M` for `BigDecimal`, hex (`0x1F`, promoted to `BigInt` past `Long/MAX_VALUE` as on the JVM), octal with a leading zero (`0377` is 255), radix literals `2r101` through base 36, ratios (`1/2` reads as a `Ratio`, simplified when it reduces to an integer), then plain integers with promotion to `BigInt` on overflow, and floats.\n\n```\n$ lg -e '[0x1F 2r101 36rZZ 1N 1.5M (type 1/2) 0377 ##Inf]'\n[31 5 1295 1N 1.5M let-go.lang.Ratio 255 +Inf]\n```\n\n## Where it diverges from Clojure\n\nThese hold at `a6763e77` (2026-09-08); three are the subject of open PRs.\n\n- **Set literals read as a call.** `'#{1 2 3}` reads as `(hash-set 3 2 1)`, so `(set? (read-string \"#{1}\"))` is false. Evaluation is unaffected. #736 (open) makes `#{}` read as a set, as maps and vectors already do.\n- **Metadata reads as a form.** `'^:foo bar` reads as `(with-meta bar {:foo true})` rather than the symbol `bar` carrying metadata, so `(meta (eval ''^:foo bar))` is `nil`. Consumers that need the name, such as `defn` and the wiki's own enumeration tooling, unwrap that form. #801 (2026-09-06) reports the same behaviour on map literals, where `(meta (read-string \"^{:doc 1} {:a 1}\"))` is `nil`, as a bug for configuration data read with `read-string`.\n- **Unknown tags pass through.** `#foo/bar 1` reads as `1`; there is no `*data-readers*` or `*default-data-reader-fn*`. #770 (open, approved 2026-09-08) adds a Clojure-compatible `*data-readers*` and a per-compiler registry for embedders, and #768 (open; depends on #770 and carries its commits, though its PR base is `main`) adds a raw `#go{...}` reader that preserves Go source verbatim.\n- **Namespaced map syntax is not supported.** `#:a{:b 1}` fails with `invalid hash macro`.\n- **Duplicate map keys do not throw.** `'{:a 1 :a 2}` reads as `{:a 2}`; Clojure rejects the literal.\n- **A leading zero that is not valid octal falls through to decimal.** `08` reads as `8`; Clojure rejects it.\n\n## Entry points\n\n`read-string` reads one form (skipping no-value forms), `read-all-string` reads every form, and `load-string` reads and evaluates; all three are defined in `pkg/compiler/eval.go` beside `set-read-clj!` and `set-read-bb!`. Embedders get the same reader through the compiler API, and `lg -e`, scripts, and the REPL feed it the same way.\n\n## Citations\n\n**Resource:** [pkg/compiler/reader.go](https://github.com/nooga/let-go/blob/main/pkg/compiler/reader.go): the reader, both dispatch tables, `readConditional`, `skipReaderForm`, `readNumber`, `readTaggedLiteral`  \n**Related:**\n- [pkg/compiler/eval.go](https://github.com/nooga/let-go/blob/main/pkg/compiler/eval.go): `read-string`, `read-all-string`, `load-string`, `set-read-clj!`, `set-read-bb!`\n- [docs/guide/clojure-compatibility.md](https://github.com/nooga/let-go/blob/main/docs/guide/clojure-compatibility.md): the tagged-literal and numeric-tower notes\n- PRs (open at 2026-09-05): [#736](https://github.com/nooga/let-go/pull/736) set literals, [#770](https://github.com/nooga/let-go/pull/770) custom data readers, [#768](https://github.com/nooga/let-go/pull/768) raw Go fragments\n\nSee also: [Bytecode Compiler](concepts/bytecode-compiler/), [Clojure Compatibility](references/clojure-compat/), [let-go](entities/let-go/)\n", "concepts/runtime-image": "\n# Runtime Image and Stdlib Cache\n\nLet-go achieves millisecond cold startup by precompiling
