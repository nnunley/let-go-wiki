the standard library and serializing the runtime state to a **runtime image**\u2014a self-contained snapshot of code, heap, and namespace metadata. Instead of reading source, analyzing, and compiling on boot, the runtime loads and deserializes this image in a fraction of the time.\n\n## What a Runtime Image Contains\n\nA runtime image is a persistent snapshot of:\n\n- **Namespaces**: the registry, aliases, and current `*ns*` binding\n- **Variables**: symbol \u2192 root value, metadata, macro flags\n- **Code**: `Func` and `Closure` objects with `CodeChunk` (bytecode, stack depth, const refs) and closed-over values\n- **Constant pool**: de-duplicated `Value`s (ints, strings, booleans, nil, symbols, keywords, vectors, lists, maps, sets)\n- **Intern tables**: for symbols and keywords to preserve identity sharing across deserialization\n\nExcluded from the image (they are rebound or rejected on load):\n\n- `NativeFn` and `Boxed` host pointers (Go values): represented as **externs** by symbol and resolved from a host registry at load\n- Non-serializable effects: channels, OS handles, goroutines, time values\n\n## The Image Format\n\nThe binary format is structured in sections:\n\n- **Header**: magic number, schema version, runtime version, endianness, feature flags\n- **String table**: unique strings for symbols, keywords, and value interning\n- **Atoms**: typed sections for nil, booleans, ints, chars, strings\n- **Collections**: vectors, lists, maps, sets (encoded recursively; persistent encodings like BPTR/HAMT for determinism)\n- **Const pool**: indices into value sections\n- **Code**: functions with `maxStack`, bytecode, const refs, closed-over const refs\n- **Namespaces**: table mapping ns name \u2192 alias map \u2192 var table\n- **Variables**: name \u2192 const-id (root), flags\n- **Trailer**: checksum/hash and optional signature\n\n## Workflows: Build-Time and Boot-Time\n\n**Precompiled stdlib cache**:\n\n1. **Build step**: Compile the standard library once; emit `stdlib.img`.\n2. **App boot**: Load `stdlib.img` with the host's `HostRegistry`. If invalid or mismatched, compile sources and regenerate.\n\n**Full runtime image (REPL freeze)**:\n\n1. Develop in the REPL, loading stdlib and evaluating app code.\n2. Save the entire heap and namespace: `(image/save \"app.img\")`.\n3. Deploy: embed or ship `app.img` and load it at startup.\n\n## Host and Native Binding\n\nDuring image load, the loader is provided a `HostRegistry` that maps core symbols to their `NativeFn` implementations. Extern placeholders (representing natives and boxed values) are resolved against this registry at load time. This ensures:\n\n- Natives are rebound to the running host's implementations (which may differ between platforms).\n- Signature/arity mismatches are caught immediately; no silent corruption.\n- The image is platform-independent; the host binding makes it work on any platform.\n\n## Layering and Versioning\n\n- **Base image**: stdlib only, enabling fast cold start universally\n- **App layer**: app-specific code; can be loaded atop the base image without reloading stdlib\n- **Optional**: multiple layers chained with conflict checks\n\nThe image carries metadata for validation:\n\n- **Schema version**: format compatibility\n- **Runtime/VM version**: bytecode interpreter compatibility\n- **Content hash**: of stdlib sources, to detect staleness\n- The loader rejects incompatible versions and regenerates on mismatch\n\n## Why It Matters\n\nRuntime images enable:\n\n- **Fast cold start**: Millisecond startup times. Compile-on-boot overhead is eliminated.\n- **Reproducible deployments**: Freeze a known-good REPL state into a bytecode snapshot; deploy it anywhere.\n- **Embedding**: Ship a precompiled image inside a Go binary (via `go:embed`), making the binary completely self-contained and independent of filesystem layout.\n- **Deterministic CI/CD**: The same image loaded on every machine gives identical behavior.\n\nFor let-go's bootstrap workflow (3-minute lowering of the core library), image caching for the stdlib alone saves significant time in development and CI.\n\n## Security Considerations\n\nRuntime images are treated as **untrusted input**:\n\n- Section sizes and offsets are validated.\n- Content hashes are checked.\n- Signatures can be verified before load.\n- Extern placeholders are **only** resolved against an explicit host registry; no pointer deserialization happens blindly.\n\n# Citations\n\n[1] **pkg/rt/core/core.lg**: Standard library source  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n\n[2] **pkg/rt/lang.go**: Runtime initialization; image loader called first, fallback to Eval  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/lang.go\n\n[3] **pkg/compiler/eval.go**: Compilation path (source \u2192 bytecode)  \nhttps://github.com/nooga/let-go/blob/main/pkg/compiler/eval.go\n\n[4] **pkg/vm/func.go**: `Func`, `Closure`, `CodeChunk` encoding  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/func.go\n\n[5] **pkg/vm/value.go**: `Value` serialization interface  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/value.go\n\n[6] **pkg/vm/native_func.go**: Extern resolution via `HostRegistry`  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/native_func.go\n\n---\n\nSee also: [Bytecode Compiler](concepts/bytecode-compiler/), [Stack VM](concepts/stack-vm/), [IR Pipeline](concepts/ir-pipeline/)\n", "concepts/stack-vm": "\n# Stack VM\n\nThe [bytecode compiler](concepts/bytecode-compiler/) lowers each function to a `CodeChunk`, and this stack machine executes it. There are no registers: instructions push and pop [values](concepts/value-representation/) on a per-call operand stack, and every instruction operates on the top of that stack. It is the execution substrate for [let-go](entities/let-go/) programs once the [IR pipeline](concepts/ir-pipeline/) has emitted their bytecode.\n\nThe interpreter lives in `pkg/vm/vm.go`: an opcode table, the `CodeChunk` container, the `Frame` (one per function activation), and `Frame.Run` \u2014 the dispatch loop.\n\n# Bytecode encoding\n\nA `CodeChunk` holds a flat `[]int32` instruction array, a constant pool, `maxStack` (the stack depth the compiler computed for the function), a source map, and a local-variable debug table:\n\n```go\ntype CodeChunk struct {\n    maxStack  int\n    consts    *Consts\n    code      []int32      // opcode words + inline args, packed end to end\n    length    int\n    sourceMap *SourceMap\n    localVars []LocalVar\n}\n```\n\nInstructions are **variable width**. The first `int32` of each is the opcode word; zero or more `int32` argument words follow:\n\n| Width | Opcodes |\n|-------|---------|\n| 1 word (no args) | `NOOP`, `POP`, `RETURN`, `THROW`, `TRY_POP`, the arithmetic/comparison ops, \u2026 |\n| 2 words (1 arg) | `LOAD_CONST`, `LOAD_ARG`, `LOAD_VAR`, `INVOKE`, `JUMP`, `BRANCH_TRUE`/`BRANCH_FALSE`, `POP_N`, `DUP_NTH`, `TAIL_CALL`, \u2026 |\n| 3 words (2 args) | `TRY_PUSH` (catchOffset, finallyOffset) |\n| 4 words (3 args) | `RECUR` (offset, argc, \u2026) |\n\nOnly the low byte of the opcode word is the opcode \u2014 `inst & 0xff`. The high 16 bits carry a stack-depth hint (`(op >> 16) & 0xffff`), used by the disassembler and tooling. Arguments are indices (into the constant pool or argument vector), branch offsets, or arities. `CodeChunk.Debug` walks the array with exactly this width table to disassemble a chunk.\n\n# Opcode families\n\nThe ~37 opcodes group into a small number of roles:\n\n- **Loads** \u2014 `LOAD_CONST` (constant pool), `LOAD_ARG` (argument vector), `LOAD_VAR` / `SET_VAR` (var roots), `LOAD_CLOSEDOVER` (captured value).\n- **Stack shuffling** \u2014 `POP`, `POP_N` (save top, drop n), `DUP_NTH` (duplicate the nth-from-top).\n- **Control flow** \u2014 `JUMP`, `BRANCH_TRUE`, `BRANCH_FALSE`, all by signed offset.\n- **Calls & return** \u2014 `INVOKE` (arity arg), `TAIL_CALL` (reuses the frame), `RETURN`, plus `RECUR` / `RECUR_FN` for `loop`/`recur` and self-recursion.\n- **Closures** \u2014 `MAKE_CLOSURE`, `PUSH_CLOSEDOVER`, `MAKE_MULTI_ARITY`.\n- **Exceptions** \u2014 `TRY_PUSH`, `TRY_POP`, `THROW`.\n- **Specialized arithmetic/comparison** \u2014 `ADD`, `SUB`, `MUL`, `LT`, `LTE`, `GT`, `GTE`, `EQ`, `INC`, `DEC`, `QUOT`, `DIV` (see below).\n\n# The frame\n\nEach function activation gets a `Frame`, which owns the operand stack and the interpreter's registers:\n\n```go\ntype Frame struct {\n    stack       []Value      // operand stack (len = maxStack)\n    args        []Value      // this call's arguments\n    closedOvers []Value      // captured values (closures)\n    consts      *Consts      // constant pool\n    code        *CodeChunk\n    ip          int          // instruction pointer (index into code.code)\n    sp          int          // stack pointer (next free slot)\n    handlers    []exHandler  // active exception handlers; nil when unused\n    ec          *ExecContext // dynamic bindings for this execution\n}\n```\n\n`push`/`pop`/`nth`/`mult`/`drop` are thin helpers over `stack` and `sp`. Dynamic bindings and function dispatch route through `ec` \u2014 the [exec context](concepts/exec-context/).\n\n**Frame pooling.** Frames are reused from a mutex-guarded LIFO (cap 256), not allocated per call. The source comment records why: `sync.Pool` cost ~25% of CPU on `fib(30)` because its per-P bookkeeping dominates let-go's tiny per-call work, so a plain mutex-guarded stack is faster for the common single-goroutine case and still safe across goroutines.\n\n# The dispatch loop\n\n`Frame.Run` is a `for` loop around a `switch inst & 0xff`. Each case does its work, adjusts the stack, and advances `ip` by the instruction's width:\n\n```go\nfor {\n    inst := f.code.code[f.ip]\n    switch inst & 0xff {\n    case OP_LOAD_CONST:\n        idx := f.code.code[f.ip+1]\n        f.push(f.consts.get(int(idx)))\n        f.ip += 2\n    case OP_LOAD_ARG:\n        idx := f.code.code[f.ip+1]\n        f.push(f.args[idx])\n        f.ip += 2\n    case OP_RETURN:\n        return f.pop()\n    // ...\n    }\n}\n```\n\n`OP_INVOKE` reads the arity, pops that many arguments plus the callee, dispatches through `f.ec.Invoke`, drops the consumed slots, and pushes the result. `OP_RETURN` pops the top value and returns it, ending the frame. Branch opcodes assign `f.ip` directly instead of stepping.\n\n# Specialized fast-path opcodes\n\nThe compiler emits the dedicated arithmetic/comparison opcodes for known binary calls to core operators, so hot code skips generic function dispatch. Each inlines the `int64` path and falls back to the boxed numeric tower only for other types. `OP_ADD`:\n\n```go\ncase OP_ADD:\n    b := f.stack[f.sp-1]\n    a := f.stack[f.sp-2]\n    if ai, ok := a.(Int); ok {\n        if bi, ok := b.(Int); ok {\n            r, ok := checkedAddInt(ai, bi)   // overflow-checked\n            if !ok { /* raise integer overflow */ }\n            f.stack[f.sp-2] = r\n            f.sp--\n            f.ip++\n            continue\n        }\n    }\n    r, err := NumAdd(a, b)                    // generic numeric tower\n    // ...\n```\n\nThese opcodes avoid `NativeFn.Invoke`, interface boxing, and panic-based error recovery on the common path. The `int64` path is overflow-checked, but overflow does **not** promote: `ADD`, `SUB`, `MUL`, `INC`, and `DEC` raise an `\"integer overflow\"` error. Promotion to the wider numeric tower happens only when an operand is not an `Int`, via the generic `NumXxx` fallback.\n\n# Recursion, tail calls, and exceptions\n\n- **`recur`** compiles to `RECUR` for a `loop` back-edge and to `RECUR_FN` for function self-recursion \u2014 either way a slot-rebinding jump, so iteration runs in constant stack space rather than growing Go frames.\n- **`TAIL_CALL`** reuses the current `Frame` only when the callee is a direct `*Func`; other callable types (native fns, and anything else) still dispatch through `ec.Invoke` and get their own frame.\n- **Exceptions** use a per-frame handler stack. `TRY_PUSH` records a catch IP and the stack pointer to restore. When an error surfaces at a site that consults the handler stack, the loop unwinds to the innermost handler *in this frame*, resets `sp` to `savedSP`, pushes the error value, and jumps to the catch IP \u2014 no Go-stack unwinding within the frame. Two caveats: an error raised in a nested call propagates the ordinary way (each `Invoke` returns it up the Go stack) until some frame's handler catches it, so cross-frame propagation *does* unwind Go frames; and not every interpreter error consults the handler stack \u2014 some (e.g. out-of-bounds const/arg lookups) return directly.\n\n# Debug info\n\n`CodeChunk` carries a `SourceMap` (`ip` \u2192 source location), which error construction consults via `LookupSource` to attach source positions to crash traces \u2014 including for code loaded from a precompiled bundle under WASM. It also carries a `localVars` table (stack slot \u2192 binding name); that table is compiled and serialized into the [lgb format](concepts/lgb-bytecode-format/), but the runtime does not yet read it when formatting errors \u2014 only the `SourceMap` is consumed today, so traces name source positions but not local variables. See [debug info & source maps](concepts/debug-info/).\n\n# Examples\n\nValues the VM computes, via `lg -e`:\n\n```clojure\n(+ 1 2)\n;; => 3          ; OP_LOAD_CONST 1, OP_LOAD_CONST 2, OP_ADD, OP_RETURN\n```\n\n```clojure\n(defn add [a b] (+ a b))\n(add 3 4)\n;; => 7          ; OP_LOAD_ARG 0, OP_LOAD_ARG 1, OP_ADD, OP_RETURN\n```\n\n```clojure\n(loop [i 0 acc 0]\n  (if (< i 5) (recur (inc i) (+ acc i)) acc))\n;; => 10         ; OP_LT + OP_BRANCH_FALSE drive the loop; OP_RECUR is the back-edge\n```\n\n```clojure\n(let [f ((fn [x] (fn [y] (+ x y))) 10)] (f 5))\n;; => 15         ; inner fn is a closure over x; x arrives via OP_LOAD_CLOSEDOVER\n```\n\n# Citations\n\n[1] **pkg/vm** (VM package)\nhttps://github.com/nooga/let-go/tree/main/pkg/vm\n\n[2] **pkg/vm/vm.go** \u2014 opcode table, `CodeChunk`, `Frame`, `Frame.Run`\nhttps://github.com/nooga/let-go/blob/main/pkg/vm/vm.go\n\n[3] **Bytecode Compiler** (this wiki)\n[bytecode-compiler.md](concepts/bytecode-compiler/)\n\n[4] **IR Pipeline** (this wiki)\n[ir-pipeline.md](concepts/ir-pipeline/)\n\n[5] **Exec Context** (this wiki)\n[exec-context.md](concepts/exec-context/)\n\n---\n\nSee also: [Bytecode Compiler](concepts/bytecode-compiler/), [IR Pipeline](concepts/ir-pipeline/), [Indexed-RPN IR](concepts/indexed-rpn-ir/), [lgb Bytecode Format](concepts/lgb-bytecode-format/), [Value Representation](concepts/value-representation/), [Debug Info](concepts/debug-info/), [let-go](entities/let-go/)\n", "concepts/structurize": "\n# Structurize\n\n`build.lg` only ever emits `if` and `loop`/`recur` shapes, so the CFG the [IR](concepts/indexed-rpn-ir/) carries is reducible. `ir.structurize` (Norman's pass, `pkg/rt/core/ir/structurize.lg`) walks that CFG and returns a control tree that no backend has to rediscover: a Go backend can emit `if`/`for`/`break`/`continue`, a wasm backend could emit its structured blocks, and a stack backend could know consumer order. Which backends actually use it is the interesting part.\n\n## The tree\n\n| Node | Meaning |\n|---|---|\n| `[:return bid]` | block `bid`'s terminator is `:return` |\n| `[:tail bid]` | terminator is `:recur-fn`, the function-level recur back-edge |\n| `[:seq bid edge next]` | an unconditional `:branch`, then `next` |\n| `[:if bid tt et then else cont]` | `:branch-if`; `tt`/`et` are the branch targets carrying block-args, `cont` the structured join region or `nil` |\n| `[:loop bid body cont]` | `bid` is a loop header; `body` uses `:continue` and `:break`; `cont` follows the loop |\n| `[:continue bid edge]` | back-edge to the enclosing loop header |\n| `[:break bid edge]` | exits the enclosing loop |\n| `[:fallthrough bid]` | the region rejoins an enclosing continuation |\n| `[:goto bid]` | fallback for an unstructurable transfer |\n\nThe `bid` leaves let the backend emit each block's instructions and edge copies. Join regions come from post-dominators: the file carries a copy of `dominance.lg`'s Cooper, Harvey, and Kennedy algorithm parameterised by successor and predecessor functions so it can run on the reversed graph. `:goto` is the escape hatch that keeps correctness independent of coverage: a `:fallbacks` counter ratchets toward zero on the real corpus rather than the pass having to be complete on day one.\n\n## Who consumes it\n\n`lower_go.lg` is the consumer (`[ir.structurize :as st]`), and `structurize.lg` itself requires `ir.dominance`; the Go backend walks the tree to emit mutable locals with labels and gotos where it must and structured control flow where it can. `lower.lg`, the [bytecode lowering](concepts/bytecode-lowering/), does not: it still walks raw blocks by stack position. #579 named that as the reason for the residual `DUP_NTH` shuffle in IR-lowered bytecode, because without the tree the stack backend cannot know consumer order or that a value is dead after a use in a sibling arm, so it copies defensively. #574 (EPIC-017) records the same fact as the single root cause behind the cross-block splice rejection and `:try` being unlowerable on the bytecode path, and lists \"bytecode adopts structurize\" as an unscheduled story.\n\n## Two known gaps\n\n- **`:try` is not a structural node.** try/catch leaks to the op level, and `lower_go` special-cases it outside the tree walk. Capturing the guarded region once at the structural level is the other unscheduled EPIC-017 story.\n- **Keyword-cond chains.** `case` and `cond` over keywords lowered to nested `if`/`else` in Go until #675 (merged 2026-09-06, b7e04d6), which teaches structurize to absorb a chain into a `:switch` node. The Go backend emits it as a type switch on `vm.Keyword` guarding an inner `switch` on the keyword's full name (namespace included, so `:foo/a` and `:bar/a` stay distinct), with any non-keyword discriminant falling to the default arm. The fold is gated to the maximally conservative shape: at least three arms testing one canonical discriminant (single-predecessor block-arg copies are followed back to the root value), every absorbed test block with zero block params and only pure `:const` and `:eq` instructions, each owned by the previous test's false edge, and none of them a loop header, continue target, or break target. Anything else falls back to nested `:if`. The pass reports what it folded as `:absorbed-blocks` and `:absorbed-insts`, and `reachable-nids` in [liveness](concepts/block-interface-and-liveness/) skips those instructions so the folded loads and comparisons are not emitted as dead code. That gate excludes the canonical `(cond (= x :a) 1 (= x :b) 2 ...)`, whose discriminant `build.lg` threads through block params; #674 tracks the boundary analysis needed to admit it, with the two Go-compile failure signatures (`declared and not used`, `undefined: step_*`) as the adversarial test set, after several attempts oscillated between under- and over-rejection.\n\n## Citations\n\n**Resource:** [pkg/rt/core/ir/structurize.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/structurize.lg): the pass and the tree grammar in its header\n\n**Related:**\n- [pkg/rt/core/ir/lower_go.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg): the only consumer at `a9c183f9`\n- [pkg/rt/core/ir/lower.lg](https://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower.lg): the backend that has not adopted it\n- Issues and PRs: [#574](https://github.com/nooga/let-go/issues/574), [#674](https://github.com/nooga/let-go/issues/674), [#675](https://github.com/nooga/let-go/pull/675), [#579](https://github.com/nooga/let-go/pull/579)\n\nSee also: [IR Passes](concepts/ir-passes/), [Go Backend](concepts/go-backend/), [Block Interface and Liveness](concepts/block-interface-and-liveness/), [IR representation roadmap](ideas/ir-representation-roadmap/), [let-go](entities/let-go/)\n", "concepts/type-inference": "\n# Type Inference and the Type Cache\n\nThe let-go compiler infers types during lowering to optimize dispatch and reduce runtime overhead. When a function's input and return types are known, the compiler can emit direct native dispatch instead of slower generic calls. For large standard libraries, type inference is the slowest part of the bootstrap. The solution is a **mergeable type-discovery cache** that makes parallel lowering both fast *and* deterministic.\n\n## The Lowering Challenge\n\nThe `lgbgen` tool lowers every function in the core namespace from let-go source to Go bytecode. This is the bottleneck in the bootstrap (~3 minutes). The per-function work is embarrassingly parallel:\n\n```\nexpand \u2192 build IR \u2192 optimize \u2192 type-infer \u2192 lower \u2192 emit\n```\n\nEach step is independent across functions, but **type inference creates two problems**.\n\n### Problem 1: Wall-Clock Budget Non-Determinism\n\nType inference uses a **wall-clock budget** (`*typeinfer-budget-ms*`, typically 2000 ms per function). When the budget runs out, the function returns a sound lower bound in the type lattice\u2014a partial result.\n\nUnder parallel load (N workers contending for CPU), each typeinfer call gets less wall-time, hits the budget sooner, and bails with *less* type information. A function that qualifies for direct native dispatch sequentially falls back to generic dispatch in parallel\u2014changing the imports and emitted Go code **run-to-run**. This non-determinism is unacceptable for reproducible builds.\n\n**A time-based budget is inherently non-deterministic under variable CPU load.**\n\n### Problem 2: Parallel Binding Overhead\n\nEarly attempts at parallel lowering with `pmap` (future-based parallel map) showed zero speedup, even with the gensym race fixed. The cause: every `future` calls `SnapshotBindings` + `RunWithBindings`, which copy every active dynamic binding per spawn. With ~50 lowering workers, this copying overhead serializes the work.\n\nThe fix came in two parts:\n\n- **Lock-free `Var.Deref`** (atomic `root`/`curr` instead of global `bindingsMu`): dynamic-var reads no longer serialize.\n- **`pmapv`** \u2014 an eager, synchronous parallel map that doesn't capture and reinstate the binding scope per spawn. Workers read the caller's bindings via the lock-free `Deref`, and the work becomes truly parallel.\n\nResult: sequential 193 s \u2192 `pmapv` 155 s (1.24\u00d7 speedup, ~1.9 effective cores).\n\n## The Solution: A Mergeable Type-Discovery Cache\n\nRather than a deterministic *iteration* budget (which caps precision permanently), cache the type discoveries and **merge** them across runs.\n\n### Why It's Sound\n\nType inference is **monotone**: `set-type-if-changed!` is a lattice **join**\u2014types only move up (`:unknown \u2192 :int \u2192 :number \u2192 :any`), never down. The budget bails with a lower bound. Therefore:\n\n- A cache entry is a point in the type lattice.\n- Merging two entries is the **least upper bound** (LUB / join).\n- Join is commutative, associative, idempotent \u21d2 **merge order is irrelevant**.\n\nTwo parallel runs that each got partway merge to a result at least as precise as either, deterministically. Workers contribute discoveries to a shared cache, and the converged result is independent of scheduling.\n\n### Shape and Convergence\n\n- **Key**: A content hash of the function's IR (stable across runs; auto-invalidates when source changes).\n- **Value**: Inferred signature (arg types, result type) \u00b1 per-instruction types.\n- **Merge**: Per-field lattice join; concurrent writers compare-and-join per key.\n- **Convergence**: Interprocedural\u2014F's inference improves when its callees' cached signatures improve. Iterate to a whole-program fixpoint. Monotone + finite lattice height \u21d2 terminates.\n- **Committed artifact**: Like the lowered tree, commit the converged cache. A \"warm to fixpoint\" step (sequential, unbudgeted, correctness-over-speed) produces it; `make generate` runs it. Lowering then *reads* the cache\u2014fast, parallel, reproducible.\n\n### Comparison\n\n| Approach | Deterministic? | Full precision? | Parallel-safe? | Decouples discovery from use? |\n|---|---|---|---|---|\n| Wall-clock budget (today) | No | Sometimes | \u2014 | No |\n| Deterministic iteration budget | Yes | No (capped) | Yes | No |\n| Mergeable type cache | Yes (once converged) | Yes | Yes | Yes |\n\n## Why It Matters\n\nThe mergeable cache achieves:\n\n- **Determinism**: Two lowering runs produce byte-identical Go code, enabling reproducible builds and CI/CD.\n- **Full precision**: No permanent cap on type inference; the cache accumulates discoveries across runs.\n- **Parallel speedup**: Workers contribute to the cache lock-free; `pmapv` + lock-free derefs enable real parallelism.\n- **Separation of concerns**: Discovery (a background, unbudgeted phase) is separated from use (lowering reads the cache fast).\n\nFor the ~3-minute bootstrap, this unlocks parallel lowering as a production technique instead of a fragile optimization.\n\n## Implementation Phases\n\n1. Land the keepers: atomic gensym, `pmapv`, lock-free `Var.Deref`\u2014correct independent of any cache.\n2. Land deterministic naming: build-args by inst-id, strip gensym suffixes, sort imports.\n3. Prototype the type cache: content-key + join-merge + fixpoint driver; measure convergence on `core`.\n4. If convergence is cheap, wire lowering to read it, drop the wall-clock budget, and turn on `pmapv` for the speedup.\n\n# Citations\n\n[1] **Design findings**: Parallel lowering investigation and cache proposal  \nhttps://github.com/nooga/let-go/blob/main/docs/design/parallel-lowering-and-type-cache.md\n\n[2] **pkg/rt/parallel.go**: `pmap`, `pmapv`, and binding propagation  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/parallel.go\n\n[3] **pkg/vm/var.go**: `Var.Deref`, lock-free atomics  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/var.go\n\n[4] **Lowering**: The IR-to-Go code generation step  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg\n\n[5] **Type inference**: The typeinfer pass in the lowering pipeline  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/passes/typeinfer.lg\n\n---\n\nSee also: [IR Pipeline](concepts/ir-pipeline/), [Bytecode Compiler](concepts/bytecode-compiler/), [Indexed-RPN IR](concepts/indexed-rpn-ir/)\n", "concepts/value-representation": "\n# Value Representation and Numeric Performance\n\nThe let-go runtime represents all values using a unified `Value` interface. This design trades off direct representation for homogeneity: every let-go value can be stored in an interface, enabling uniform collection semantics. Numeric performance depends on how efficiently the runtime can unbox and operate on the most common type, `Int`.\n\n## Value Representation\n\nThe core abstraction is simple:\n\n- **`Value` interface** (`pkg/vm/value.go`): defines `Type() ValueType`, `Unbox() interface{}`, and `String()` methods.\n- **Numeric type `Int`** (`pkg/vm/int.go`): defined as `type Int int` and implements `Value` using value receivers.\n\nWhen an `Int` is stored in an interface, Go does **not allocate**\u2014the int is stored directly in the interface data word. This is the key: small scalars are cheap to box and unbox.\n\n## Boxing and Unboxing Paths\n\n- **`Int.Unbox()`** returns `int(l)`; **`Int.Type()`** returns the shared `IntType`.\n- **`BoxValue`** in `value.go` uses reflection to convert unknown Go values into `Value` instances; it routes `reflect.Int` to `IntType.Box`.\n- **Runtime numeric ops** in `pkg/rt/lang.go` often use `v.Unbox().(int)` per operand\u2014each unbox is an interface method call plus a type assertion.\n\n## Performance Characteristics\n\nIn Go, value-receiver method calls on an interface are cheap, but **repeated `Unbox` + type-assert in tight loops** adds avoidable overhead:\n\n- Method dispatch is inlined and fast.\n- Reflection in `BoxValue` is expensive and should be avoided on hot paths; it is acceptable at interop boundaries.\n- `Int.String()` currently uses `fmt.Sprintf`, which is significantly slower than `strconv.Itoa`.\n\n## Optimization Strategy\n\nThe weak spots are:\n\n1. **Arithmetic via `Unbox`**: Replace `n += vs[i].Unbox().(int)` with direct `Int` assertion: `n += int(vs[i].(vm.Int))`. This removes an interface method call and a type assertion on the result.\n\n2. **Integer to string**: Replace `fmt.Sprintf(\"%d\", int(l))` with `strconv.Itoa(int(l))` in `Int.String()`.\n\n3. **Hot natives**: Ensure all hot natives in `pkg/rt/lang.go` (arithmetic, comparisons, `+`, `-`, `*`, `/`, `mod`, `gt`, `lt`, `max`, `min`) use direct `Int` assertions and avoid `Unbox` on the happy path.\n\n4. **Boxing at boundaries**: Prefer `NativeFnType.Wrap`/`WrapNoErr` to register natives (avoiding per-call reflection). Reserve `NativeFnType.Box` for rare interop.\n\n5. **Future structural equality/hash**: When adding `Equiv`/`Hash`, keep fast-path numeric equality and hash inlined.\n\n## Why It Matters\n\nLet-go code is compiled to a stack machine that executes millions of arithmetic operations. A single unbox call per operand in a tight loop adds up\u2014especially in programs that do numerical work. Moving from interface-based dispatch to direct `Int` assertions on common operations can reduce overhead by 10\u201330\u00d7 on numeric-heavy code, while maintaining the uniform `Value` interface for the rest of the runtime.\n\nThe optimization is local to numeric primitives; the rest of the VM continues to use the `Value` interface uniformly.\n\n# Citations\n\n[1] **pkg/vm/value.go**: Core `Value` interface and `BoxValue` reflection converter  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/value.go\n\n[2] **pkg/vm/int.go**: `Int` type and boxing implementation  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/int.go\n\n[3] **pkg/rt/lang.go**: Numeric primitives and hot natives  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/lang.go\n\n[4] **pkg/vm/native_func.go**: Native function registration and `Wrap`/`WrapNoErr`  \nhttps://github.com/nooga/let-go/blob/main/pkg/vm/native_func.go\n\n---\n\nSee also: [Stack VM](concepts/stack-vm/), [Bytecode Compiler](concepts/bytecode-compiler/)\n", "concepts/wasm-compilation": "\n# WASM Compilation\n\nlet-go compiles itself to WebAssembly, enabling programs to run in the browser from the same source as native binaries. A single `lg -w site app.lg` command produces a self-contained `index.html` file (~6MB, inlined and gzipped) that boots the let-go runtime and your bytecode in ~10ms\u2014well within a 60fps frame budget at 16ms per frame.\n\n## Build Process\n\n**Source \u2192 Bytecode \u2192 WASM Bundle**\n\n1. **Bytecode Compilation**: Source is compiled to bytecode using the standard [bytecode compiler](concepts/bytecode-compiler/) pipeline. The `.lgb` module is generated in-memory.\n\n2. **WASM Bundling** (`pkg/bundle`): The bytecode is embedded into the WASM blob. Resource files (templates, assets) specified by `-resource-paths` are collected and archived alongside the bytecode using the bundle trailer format.\n\n3. **HTML Generation**: The WASM binary (inlined and gzipped), the bytecode, and a `LetGoHost` JavaScript harness are embedded into a single `index.html` file. No external assets are required; the page is self-contained and can be copied anywhere (including served from GitHub Pages).\n\n4. **Service Worker**: A service worker is included to provide COOP/COEP headers needed for SharedArrayBuffer support (required by the let-go runtime for goroutines and channels). The service worker intercepts fetch requests transparently.\n\n## Runtime Environment\n\nWhen `index.html` loads, it:\n\n1. **Starts during `requestAnimationFrame`** (~10ms available at 60fps): The Go runtime boots, initializes the let-go VM, and loads the embedded bytecode. This tiny budget is why startup must be fast \u2014 the WASM runtime footprint is ~6MB compressed, but boot + init is designed to finish in milliseconds.\n\n2. **Initializes the VM**: The let-go stack VM (`pkg/vm`) comes up inside WASM. The bytecode is decoded and registered as functions. Core library (persistent data structures, `core.async`, etc.) is available via precompiled image or embedded bytecode.\n\n3. **Provides Terminal Emulation** (for `term`-using programs): The browser page includes xterm.js for full terminal emulation\u2014ANSI colors, cursor positioning, raw keyboard input, and screen clearing. Calls to `(term/...)` functions interact with the emulated terminal, not the browser console.\n\n4. **Sets up JavaScript Interop**: A global `Eval` function is exposed to JavaScript, allowing the browser to eval let-go code:\n   ```js\n   window.Eval(\"(+ 1 2)\") // returns \"3\"\n   ```\n   This enables live coding in the browser REPL and embedding let-go snippets in web pages.\n\n## Example: Roguelike Game\n\n[xsofy](https://github.com/nooga/xsofy) is a roguelike written in let-go that compiles to both native (terminal) and WASM (browser) from the same source. Run `lg -w www game.lg` and open `www/index.html` in your browser. The game window is a terminal emulation; all game logic runs in let-go bytecode inside the WASM VM.\n\n## Compile-Time Predicates\n\nPrograms can branch on compilation target:\n- `*compiling-aot*` is `true` while `lg` compiles with `-c`, `-b`, or `-w`, and `false` at runtime (useful for skipping side effects at compile time). It is set in `pkg/cli/cli.go` wherever any of the three output flags is given, so a guard written for WASM builds also fires for bytecode and bundle compiles.\n- `*in-wasm*` is `true` when running inside a WASM build; `false` for native.\n\nUse `:lg` reader conditionals to guard WASM-only or native-only code:\n```clojure\n#?(:lg (require '[let-go.wasm :as wasm]))  ; only when compiling for WASM\n```\n\n# Citations\n\n[1] **wasm/** \u2014 WASM entry point and build orchestration  \nhttps://github.com/nooga/let-go/tree/main/wasm\n\n[2] **pkg/bundle** \u2014 bytecode and resource bundling  \nhttps://github.com/nooga/let-go/tree/main/pkg/bundle\n\n[3] **docs/guide/usage.md** \u2014 `lg -w` build mode  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/usage.md\n\n[4] **README.md** \u2014 WASM web apps description  \nhttps://github.com/nooga/let-go#wasm-web-apps\n\n[5] **xsofy** \u2014 roguelike example  \nhttps://github.com/nooga/xsofy\n\n[6] **Bytecode Compiler** (this wiki)  \n[bytecode-compiler.md](concepts/bytecode-compiler/)\n\n[7] **Stack VM** (this wiki)  \n[stack-vm.md](concepts/stack-vm/)\n\n[8] **pkg/cli/cli.go** \u2014 sets `*compiling-aot*` when `-c`, `-b`, or `-w` is given  \nhttps://github.com/nooga/let-go/blob/main/pkg/cli/cli.go\n\n---\n\nSee also: [let-go](entities/let-go/)\n", "entities/let-go": "\n# let-go\n\nlet-go is a Clojure dialect implemented as a bytecode compiler and stack-based\nvirtual machine in Go. It produces a single ~12MB binary with ~8ms cold start,\nno JVM, and passes the jank-lang Clojure test suite. It supports AOT compilation\nto standalone binaries and self-contained WASM web pages, two-way Go interop, and\nmost of Clojure (persistent data structures, lazy seqs, transducers, protocols,\nrecords, multimethods, core.async, BigInts).\n\nSee the [stack VM](concepts/stack-vm/) for how compiled bytecode executes.\n\n# Citations\n\n[1] [let-go repository](https://github.com/nooga/let-go)\n", "ideas/bytecode-to-go-translation": "\n# Bytecode-to-Go Translation\n\n## What It Is\n\nTranslate let-go **bytecode** (`.lgb` binary format) into idiomatic Go source code. This is separate from and complementary to [lg-compile](concepts/lg-compile/), which AOT-compiles `.lg` **source** files to Go. This idea targets the other direction: take a pre-compiled `.lgb` file and emit Go code that directly executes the same bytecode instructions.\n\nThe result is a `.go` file (or package) with Go functions that inline the bytecode dispatch logic, allowing the compiled form to run natively without the [Stack VM](concepts/stack-vm/) interpreter overhead.\n\n## Why It Matters\n\n- **Performance**: Bytecode interpretation has inherent dispatch overhead. Native Go code for tight loops can be substantially faster.\n- **Integration**: Go projects can ship precompiled `.lgb` artifacts and generate Go bindings at build time, bridging compiled Clojure and native Go without requiring the VM.\n- **Optimization opportunity**: The Go compiler can inline, branch-predict, and apply escape analysis to the generated code, further accelerating hot paths.\n- **Single-binary deployment**: A let-go project can be AOT-compiled to `.lgb`, then translated to Go and bundled as a native binary with no runtime layer.\n\n## Building Blocks in Place\n\n- **[Bytecode Compiler](concepts/bytecode-compiler/)**: The `.lg` \u2192 `.lgb` pipeline exists and produces a well-defined bytecode format. The bytecode instruction set is stable and documented.\n- **[Stack VM](concepts/stack-vm/)**: The reference interpreter (dispatch loop in Go) implements every bytecode opcode. The VM semantics define what the translated code must replicate.\n- **[IR Pipeline](concepts/ir-pipeline/)** and existing **Go lowering** (`pkg/rt/core/ir/lower_go.lg`): The IR framework already has a `lower_go` path that emits Go code from the intermediate representation. This leg of the pipeline is a related building block for reference.\n- **[lg-compile](concepts/lg-compile/)**: Existing tool that emits Go from `.lg` source. The infrastructure for Go code generation (Go AST, formatting, packages) is proven.\n\n## Key Distinction from lg-compile\n\n| Aspect | lg-compile | Bytecode-to-Go |\n|--------|-----------|-----------------|\n| **Input** | `.lg` source files | `.lgb` bytecode binary |\n| **Compilation stage** | Source \u2192 IR \u2192 Go (skips bytecode) | Bytecode \u2192 Go (post-compile) |\n| **Use case** | Reusable let-go libraries in Go projects | Deployment-time artifact \u2192 native binary |\n| **Line-level source info** | Available (source forms) | Lost (only bytecode remains) |\n\n## Open Questions\n\n- **Instruction translation strategy**: Inline each bytecode op as Go code (switch + case per op), or generate a custom dispatch loop?\n- **Value representation**: Reuse let-go's runtime `Value` type, or generate specialized Go types (for known numeric, string, or data types)?\n- **Error handling**: How to map bytecode exception handling to Go panics / error returns?\n- **Module/function boundaries**: Does each bytecode function become a Go function, or is the entire module one Go function?\n- **Debuggability**: Without source locations in bytecode, how can the generated Go code preserve stack traces or source maps?\n\n## Roadmap Motivation\n\nFrom the README Goals: `[ ] Stretch: let-go bytecode \u2192 Go translation`. Marked as \"Stretch\" because it requires both understanding the full bytecode semantics and engineering a non-trivial code generator, but it unlocks a powerful deployment mode.\n\n---\n\n# Citations\n\n[1] **README Goals** \u2014 the unchecked roadmap item  \nhttps://github.com/nooga/let-go#goals\n\n[2] **Bytecode Compiler** (this wiki)  \n[bytecode-compiler.md](concepts/bytecode-compiler/)\n\n[3] **Stack VM** (this wiki)  \n[stack-vm.md](concepts/stack-vm/)\n\n[4] **IR Pipeline** (this wiki)  \n[ir-pipeline.md](concepts/ir-pipeline/)\n\n[5] **lg-compile** (this wiki)  \n[lg-compile.md](concepts/lg-compile/)\n\n[6] **pkg/rt/core/ir/lower_go.lg** \u2014 existing Go lowering in the IR pipeline  \nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/ir/lower_go.lg\n\n[7] **pkg/compiler** \u2014 bytecode compiler  \nhttps://github.com/nooga/let-go/tree/main/pkg/compiler\n\n[8] **let-go** (this wiki)  \n[let-go.md](entities/let-go/)\n\n---\n\nSee also: [let-go](entities/let-go/), [Bytecode Compiler](concepts/bytecode-compiler/), [Stack VM](concepts/stack-vm/), [lg-compile](concepts/lg-compile/)\n", "ideas/clojure-at-your-go-dayjob": "\n# Clojure at Your Go Dayjob\n\n## What It Is\n\nThe north-star aspiration for let-go: enable developers to write idiomatic Clojure within Go organizations and codebases, without requiring special approval, separate JVM processes, or language/deployment friction. A Go shop should be able to embed let-go for scripting, business logic, or data processing, and have Clojure code execute as fast, simple single-binary deployments as the rest of the Go application.\n\n## Why It Matters\n\n- **Language expressiveness**: Clojure's immutable data structures, higher-order functions, and macro system are powerful tools for certain domains (data transformation, configuration, rule engines). Developers should not have to choose between these tools and the simplicity of Go deployment.\n- **Hiring and retention**: Teams that use multiple languages can often attract talent more easily. A Go shop with Clojure capability doesn't require all logic to be written in Go, opening space for polyglot teams.\n- **Pragmatism**: Not all problems are best solved in Go. Being able to reach for Clojure for specific tasks (e.g., a complex ETL pipeline, a domain-specific language interpreter) without operational overhead makes Go projects more flexible.\n- **Single binary**: The absence of JVM dependencies means Clojure code can coexist in a Go binary and be deployed with the same simplicity and speed as native Go code.\n\n## Building Blocks in Place\n\n- **[Go Interop](concepts/go-interop/)**: let-go has two-way Go interoperability. Clojure code can call Go functions, and Go code can embed the let-go VM and call Clojure functions.\n- **[Embedding in Go](https://github.com/nooga/let-go/blob/main/docs/guide/embedding-in-go.md)**: let-go can be embedded as a scripting and extension layer in Go programs. Go structs roundtrip as records, channels are first-class, and functions are callable in both directions.\n- **[Single-Binary Deployment](concepts/wasm-compilation/)** (partial): let-go compiles to standalone binaries (native or WASM). A Go app that embeds let-go can ship the VM and user-supplied Clojure code as one binary.\n- **[Clojure Compatibility](entities/let-go/)**: let-go passes the jank-lang Clojure test suite and supports most of Clojure (persistent data structures, lazy seqs, transducers, protocols, multimethods, core.async, BigInts). Idiomatic Clojure code often runs unmodified.\n\n## Remaining Gaps\n\nThe vision is not yet complete; realization requires:\n\n- **Library ecosystem**: Most real Clojure projects depend on libraries. let-go can load Babashka pods, but reaching parity with the JVM ecosystem is not feasible. Developers must adapt or write new implementations.\n- **Familiarity in Go teams**: Clojure is not mainstream in Go-centric teams. Adoption requires education, mentorship, and cultural willingness to use another language.\n- **Organizational policy**: Some organizations have explicit rules against certain languages. let-go's embedding story must be compelling enough that teams advocate for policy changes.\n- **Debugging and observability**: Let-go's debugging experience (especially in embedded scenarios) lags the JVM. Better nREPL integration, stack traces, and profiling would help.\n\n## Roadmap Motivation\n\nFrom the README Goals: `[ ] Make it legal to write Clojure at your Go dayjob`. This is the project's guiding aspiration, reflecting the author's original joke-turned-useful goal: \"an elaborate excuse to write Clojure while pretending to write Go.\"\n\nAchieving this goal makes let-go not just a language implementation, but a tool for cultural and organizational shift within Go shops\u2014proving that systems languages and expressive, functional languages can coexist in production.\n\n---\n\n# Citations\n\n[1] **README Goals** \u2014 the unchecked roadmap item and project vision  \nhttps://github.com/nooga/let-go#goals\n\n[2] **docs/guide/embedding-in-go.md** \u2014 embedding let-go as a scripting layer  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/embedding-in-go.md\n\n[3] **docs/guide/clojure-compatibility.md** \u2014 compatibility and gaps  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/clojure-compatibility.md\n\n[4] **Go Interop** (this wiki)  \n[go-interop.md](concepts/go-interop/)\n\n[5] **let-go** (this wiki)  \n[let-go.md](entities/let-go/)\n\n---\n\nSee also: [let-go](entities/let-go/), [Go Interop](concepts/go-interop/)\n", "ideas/clojurelike-refactor": "\n# Rewriting Internals in let-go (Clojure-like Refactor)\n\n**Status**: Phases 1\u20133 (PersistentVector, PersistentHashMap/Set, Equiv/Hash interfaces) are shipped. Phase 4 (transducers, ChunkedSeq, Reducible fast path) is in progress.\n\n**Aligning let-go's runtime with Clojure's collection semantics and persistence model** is an ongoing refactor: replace mutable Go maps with persistent data structures (vectors, hash maps, sets), introduce correct seq-tower semantics, add transients for efficient bulk building, and implement transducers for lazy, composable transformations. This improves both semantics correctness and performance while maintaining interoperability with existing Go code.\n\n## Current state: gaps and antipatterns\n\nToday's let-go deviates from Clojure in several key ways:\n\n- **Collections implement `Seq` directly** instead of `Seqable`, causing `first`/`next`/`rest` to skip proper `seq` coercion. Non-sequence types (maps, sets) cannot be treated uniformly.\n- **Mutable Go maps and sets** back `Map` and `Set` types via copy-on-write assoc/dissoc; no structural sharing, no persistent versions.\n- **`PersistentVector` exists but deviates** from Clojure's canonical 32-ary bit-partitioned trie in node width, edge-case handling, and chunked seqs.\n- **No equality/hash abstractions**: `=` uses raw Go equality; no `Equiv`/`Hash` for value-based key lookups in maps/sets; no structural equality across types.\n- **Reader builds `ArrayVector`** for vector literals; maps are mutable copies.\n\nThese gaps mean user code must work around Clojure-like idioms or accept silent correctness bugs when using collections as keys or relying on structural equality.\n\n## Target design: interface hierarchy and semantics\n\nThe refactor introduces a Clojure-aligned interface hierarchy:\n\n**Core abstractions:**\n- `Equivable` and `Hashable` for structural equality and stable hashing across all value types (numbers by value, sequences element-wise, maps/sets by entries).\n- `Seq` (for sequence values only), `Seqable` (for all collections) to enforce proper coercion via `seq`.\n\n**Collections:**\n- `Indexed` for vectors: `Nth(i)`, `NthOr(i, default)`.\n- `Stack` for lists/vectors: `Peek()`, `Pop()`.\n- `IMapEntry` to abstract key-value pairs (replacing the current 2-vector convention).\n\n**Transients (performance-friendly mutability):**\n- `Editable` \u2192 `AsTransient()` to convert persistent to mutable.\n- `TransientCollection`, `TransientAssociative` APIs: `conj!`, `assoc!`, `dissoc!`, `persistent!`.\n- Edit tokens stored in nodes to enforce single-owner semantics and refuse operations after `persistent!`.\n\n**Reductions and transducers:**\n- `Reducible` fast path for `reduce` to avoid intermediate seqs.\n- `Reduced` wrapper for early termination.\n\n## Migration strategy: phased approach\n\n**Shipped phases (Phases 1\u20133):**\n\n### Phase 1: PersistentVector correctness \u2713\nCanonical 32-ary BPTR with correct `Pop`, `Peek`, and seq traversal, `TransientVector` with edit tokens. Reader vector literals switched to persistent.\n- **Shipped**: `pkg/vm/persistent_vector.go`, transient builtins in `pkg/rt/lang.go:4410`\n\n### Phase 2: Persistent maps and sets \u2713\n`Equivable`/`Hash` for core value types. `PersistentHashMap` (HAMT) and `PersistentHashSet` with structural sharing. Constructors and reader updated to persistent versions.\n- **Shipped**: `pkg/vm/persistent_map.go`, `PersistentHashSet` with transient variants\n\n### Phase 3: Equality and hashing in core \u2713\nStructural `Equiv` replacing raw equality; `contains?` and `get` use new semantics.\n- **Shipped**: `pkg/vm/hash.go:15` with Hashable interface and Equiv on core value types\n\n**In-progress phase:**\n\n### Phase 4: Transducers and performance (ongoing)\nAdd `ChunkedSeq` for vectors/ranges. Implement `Reducible` fast path for `reduce`. Introduce `transduce`, `eduction`, `sequence`, `completing`. Refit `into`, `mapv`, `keep`, `group-by` to use transducers. Benchmarks verify no intermediate allocations and improved throughput.\n\n**Note on Phase 0**: Interfaces and adapters (seq coercion, `nil` handling, `MapEntry`) were folded into the shipped phases where applicable.\n\n## Testing philosophy\n\nHigh-value test coverage includes:\n- **Seq coercion**: `(first [])`, `(next {})`, `(more nil)` correctness.\n- **Conj semantics** across list/vector/map/set; map `conj` accepting `IMapEntry`.\n- **Vector boundaries**: exact multiples of 32, assoc/pop at edges, random access.\n- **Map correctness**: deep updates/removals, collision nodes, insertion-order independence.\n- **Transients**: error on use-after-persistent, persistent result equivalence, bulk-build efficiency.\n- **Transducers**: `transduce (map inc)` equivalence, `into` composability, `eduction` laziness.\n\n## Compatibility and rollout\n\n- Maintain `ArrayVector` and current map/set types during transition; builtins accept both via interfaces.\n- Flip reader for vectors/maps/sets only when persistent implementations pass comprehensive tests.\n- No changes to public function arities or semantics; only expansion to support `nil`/`Seqable` coercion and new features.\n- Clear error messages for transient misuse.\n\nThe dogfooding push: moving runtime/compiler internals from Go into let-go itself (self-hosting). This refactor is a prerequisite: persistent data structures and correct semantics enable let-go to be bootstrapped from let-go source, not hand-written Go.\n\n# Citations\n\n[1] **docs/clojurelike-refactor-plan.md**: Full refactor plan with phases, interface definitions, and work items  \nhttps://github.com/nooga/let-go/blob/main/docs/clojurelike-refactor-plan.md\n\n[2] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n[3] **IR pipeline** (this wiki)  \n[../concepts/ir-pipeline.md](concepts/ir-pipeline/)\n\n[4] **Runtime image** (this wiki)  \n[../concepts/runtime-image.md](concepts/runtime-image/)\n\n[5] **Value representation** (this wiki)  \n[../concepts/value-representation.md](concepts/value-representation/)\n\n---\n\nSee also: [self-hosting-aot](ideas/self-hosting-aot/), [master-plan-roadmap](ideas/master-plan-roadmap/)\n", "ideas/compiler-namespace-architecture": "\n# Compiler Namespace Architecture (`lg.compiler`)\n\nIssue #786 (Norman, open as of 2026-09-05) is a proposal, not shipped code: it argues that the compiler's namespaces should be settled before more compiler services are added. It is recorded here as an idea because it names the target shape that several in-flight pieces are supposed to converge on.\n\n## The seams as they are\n\nThe compiler implementation spans four places that grew separately:\n\n- `ir.*` owns the IR, analyses, optimization passes, and the lowering pipeline (see [IR pipeline](concepts/ir-pipeline/)).\n- `gogen` owns Go source construction and emission, embedded as an auxiliary source behind the `!bootstrap` tag (see [generated artifacts](concepts/generated-artifacts/) and [Go backend](concepts/go-backend/)).\n- `scripts/lg-compile` owns program-level AOT orchestration (see [lg-compile](concepts/lg-compile/)).\n- #735 extracts that orchestration into a namespace of its own as groundwork for #596, the first-class `lg compile` command. It proposed `lg.aotdriver`; after the review below it now lands as `lg.compiler`.\n\nThe objection was not to the extraction but to the destination: `lg.aotdriver` would have been a second permanent compiler architecture beside `ir.*`, and it treated `gogen`'s auxiliary embed as where the Go backend lives. That embed solved shipped-binary self-containment (#557); it was never meant to be the permanent home of a backend that is intended to become bootstrapped.\n\n## The proposed shape\n\n| Namespace | Role |\n|---|---|\n| `lg.compiler` | stable compilation API and program-level orchestration |\n| `lg.compiler.ir` | IR model and construction |\n| `lg.compiler.ir.passes.*` | analyses, optimization, legalization, lowering passes |\n| `lg.compiler.backend.go` | the bootstrapped Go backend, today `gogen` plus the Go-emission code |\n| `lg.commands.compile` | a thin CLI adapter: parse arguments, call `lg.compiler`, map results to diagnostics and exit status |\n\n`scripts/lg-compile` stays as a compatibility shim over the same API while external users depend on its path, output, and exit-code contracts. The existing top-level modes (`lg script.lg`, `lg -e`, bare `lg`) are explicitly preserved; subcommands are not made mandatory.\n\n## Migration order\n\n1. Inventory every consumer of `ir.*` and `gogen`: generated Go, bootstrap manifests, tests, scripts, downstream tools.\n2. Define the `lg.compiler` API boundary and move program-level AOT orchestration behind it.\n3. Migrate `ir.*` to `lg.compiler.ir.*`, with compatibility namespaces only where the inventory finds supported external consumers that cannot move atomically.\n4. Move Go emission under `lg.compiler.backend.go` and complete the intended `gogen` bootstrap path. The issue is specific that this is not enrolling the current file in the bootstrap universe: the cold/hot lowering fixpoint and determinism constraints #557 documented have to be resolved first.\n5. Add `lg.commands.compile` for #596.\n6. Regenerate and verify every persisted compiler artifact the moves touch.\n\nEach slice can land separately, but each must preserve the complete destination rather than narrowing to the current auxiliary-embed architecture.\n\n## Acceptance criteria (abridged)\n\nProgram-level AOT exposed through `lg.compiler` and nowhere else; IR namespaces under `lg.compiler.ir.*`; Go generation under `lg.compiler.backend.go` and part of the bootstrap design; `lg.commands.compile` containing only CLI adaptation; `scripts/lg-compile` keeping its contract until an explicit deprecation; script, one-liner, and REPL invocation unchanged; cold/hot bootstrap output deterministic; generated manifests regenerated intentionally and passing their content gates; default and `bootstrap` suites green; cross-build and AOT end-to-end matrices green; any temporary compatibility namespace carrying tracked removal criteria.\n\n## The decisions on #735 (2026-08-26 and 2026-09-02)\n\nThe issue was written against Matt's #735, and Norman's review there is where the direction was actually set, in two comments:\n\n- **2026-08-26:** reusable program compilation belongs behind `lg.compiler`; IR implementation under `lg.compiler.ir.*`; `lg.commands.compile` stays a thin adapter. The broader migration and the `gogen` bootstrap can be follow-ups, but the PR must not establish `lg.aotdriver` as the permanent seam or treat the auxiliary `!bootstrap` embed as the destination.\n- **2026-09-02, \"Architecture decision\":** enroll `lg.compiler` immediately in the standard embedded and generated namespace set (`EmbeddedNSNames` plus the genmanifest source specs), with no temporary auxiliary-embed exception; keep `scripts/lg-compile` as the compatibility shim; add the promised contract test pinning `EMIT-FAIL` stdout and its non-fatal exit status; then rebase and rerun the default, `bootstrap`, AOT, and native-entry checks.\n\nSo the one exception in the tree today, `gogen`'s auxiliary embed, is not to be copied: a new compiler namespace goes into the bootstrap universe from the start. What remains gated on the fixpoint work is moving `gogen` itself, not `lg.compiler`.\n\n#735 was revised to match, Norman approved it on 2026-09-08, and at head `ab699061` it satisfies both. The driver is `lg.compiler` at `pkg/rt/core/lg/compiler.lg`; `EmbeddedNSNames` walks `core/` only, so living there is what enrolls it, and the genmanifest sweep picks it up from the same location. `pkg/rt/aotdriver/` is gone. `gogen` stays outside `core/` and so stays out of `EmbeddedNSNames`: the PR drops its `!bootstrap` build gate so lgbgen can *resolve* it while compiling `lg.compiler`, which is not the same as enrolling it, and leaves step 4's fixpoint work untouched.\n\nOne decision the issue does not cover is bundle membership, which is a separate axis from embedded-source enrollment. On `main`, `cmd/lgbgen`'s `isIRBundleSkipped` keeps `ir.*` out of the bytecode bundle (see [IR pipeline](concepts/ir-pipeline/)); #735 renames it `isBundleSkippedTool` and adds `lg.compiler`, both families matched by prefix so the `lg.compiler.ir.*` rename in step 3 does not silently drop the exclusion. Both load from embedded source on demand. Whether to bundle the driver eagerly instead was put to Norman on #735, and the numbers behind the question changed on 2026-09-08: the 23 ms boot figure from 2026-09-02, which also sits in `docs/design/go-aot-backend.md`, did not reproduce and was withdrawn. Measured interleaved on the current head, bundling takes the driver's require closure with it (the `ir.*` pipeline and `gogen`, 937 to 2,164 chunks) and costs about 3.2 times the boot, 1.9 ms to 6.0 ms median on a quiet host, inside the 8 ms budget there and over it on a loaded one. So eager bundling is a few milliseconds and a gate question, not a categorical failure, and it reverses the `ir.*` skip as a side effect. Norman answered on 2026-09-09 that he is fine with `gogen` and the compiler in the bundle, and in the bootstrap universe, and had removed them only for the size bump at the time. The PR has not yet moved on that answer.\n\nMatt's step-1 inventory (comment on #786, 2026-08-28, against `0003a0bb`): 33 `ir.*` namespaces under `pkg/rt/core/ir/`, 58 `.lg` files outside that tree referencing one, 64 Go files referencing `core/ir` or `gogen`, and 137 manifest lines naming `ir` paths, so the manifest moves with the rename rather than after it. A second comment (2026-09-08) gives step 5 its starting point, `lg.compiler/main-from-args` plus `exit-code` being the whole surface `lg.commands.compile` takes over, and warns that step 3 can silently regress boot time if either prefix in the bundle skip is narrowed to an exact name during the move; the boot figure quoted in that comment is the withdrawn one.\n\n## Non-goals\n\nFixing existing lowering or optimization gaps in the migration; removing `scripts/lg-compile` as part of the rename; replacing the scripting CLI with mandatory subcommands.\n\n## Citations\n\n- [nooga/let-go#786](https://github.com/nooga/let-go/issues/786): the proposal, with the step-1 inventory in its comments\n- [nooga/let-go#735](https://github.com/nooga/let-go/pull/735): the review and the two decision comments\n- Related: [#735](https://github.com/nooga/let-go/pull/735), [#596](https://github.com/nooga/let-go/issues/596), [#425](https://github.com/nooga/let-go/issues/425), [#557](https://github.com/nooga/let-go/pull/557)\n\nSee also: [Compile Paths](concepts/compile-paths/), [Self-hosting AOT](ideas/self-hosting-aot/), [Master Plan Roadmap](ideas/master-plan-roadmap/), [let-go](entities/let-go/)\n", "ideas/ir-representation-roadmap": "\n# IR Representation Roadmap (EPIC-017 and EPIC-018)\n\nNorman made two internal epics visible upstream as #574 and #575 (companions; the dates in them refer to an internal iteration log). Together they say where the IR's representation is going and why. The finding that drives both: an execution spike (ITER-0057) showed that the IR's representation mechanics, not the execution model, dominate interpreted performance. Removing string dispatch, per-instruction guards, and dead-parameter edge writes moved the numeric slice from 0.88\u00d7 to about 1.04\u00d7 geomean (1.23\u00d7 to 1.28\u00d7 at scale).\n\n## EPIC-017: normalization and the structural level\n\n**Root cause, as the epic states it.** The design already has the right levels: [structurize](concepts/structurize/) captures a target-independent control tree and `lower_go` consumes it. Two holes break the layering: `:try` is not a structural node, so try/catch leaks to the op level; and the bytecode backend never adopted the structural level, going straight from the low CFG to stack bytecode. That second hole is the single root cause behind the cross-block splice rejection and `:try` being unlowerable on the bytecode path. Supporting evidence from 2026-07-18: the junk-below accounting proved fragile (per-predecessor disagreement corrupting `OP_RECUR` drop counts), and IR-lowered bytecode measured about twice the instruction count of the direct compiler on branch-heavy code, roughly 67% of the excess being branch-arg `DUP_NTH` shuffle.\n\n**Ranked physical-layout findings**, from an audit against Carbon's SemIR and indexed RPN:\n\n1. Packed instruction records: instructions are boxed persistent vectors with nested refs vectors, against roughly 16-byte tagged unions with inline operand words and a side table for spills. The top measured cost; #558's type side table is the interim step.\n2. Canonicalization and interning (STORY-0058): `:gt` to `:lt` normalization is cheap now; `:inc`/`:dec` respecialization is gated on the structural level.\n3. Mutation by tombstone replaced with freeze-after-construction (STORY-0059, done as a pre-execution cleanup pass).\n4. Blocks as `(start, len)` spans via post-optimize dense renumbering.\n5. Frame width (STORY-0060): hybrid framing, slot reuse for single-use values and stable indexed slots for multi-use and cross-block values. This gates the EPIC-018 tail.\n6. Typed handles over raw index ints (low priority).\n\nUnscheduled stories: `structurize-:try` (capture the guarded region once) and `bytecode-adopts-structurize` (retire the junk-below machinery). The [op catalog](concepts/op-catalog/) work is the canonicalization half of this epic, finished rather than deleted per #528.\n\n## EPIC-018: block interface as shared liveness metadata\n\nThe cross-block and locals half; [block interface and liveness](concepts/block-interface-and-liveness/) covers the mechanism and the story table. Done: shared per-block liveness, relocation of ad-hoc reachability helpers, the single-value resolver, and the block-arg classification census. Pending, backend-coupled: `OP_LOAD_LOCAL`/`OP_STORE_LOCAL` in the stack VM, lowering cross-block refs through locals (retiring `check-cross-block!`), and retiring the fold-outline workaround so the general inliner works on the bytecode path.\n\n## The gate\n\nBoth epics feed the EPIC-016 re-check: whether an index-RPN VM that executes the IR directly should become the mainline. The pending EPIC-018 tail holds until that verdict, because if it flips to go the stack-VM half is superseded; the index-to-stack-depth conversion that generates the not-on-stack failures does not get fixed in that design, it ceases to exist. #580's comparison with fmpl (which executes indexed IR directly with `values[i]` as the result of instruction `i`) is the public statement of that argument, along with the traps either design must carry: closures snapshot captured values not slot references, `OP_RECUR` writes parameter slots explicitly, catch handlers get their own slot scope. #528's proposal to delete the RPN spike is held (or pin-and-delete) until the verdict.\n\n## Adjacent open issues\n\n- #620: constant-space tail calls on the explicit-frame VM (closures, multi-arity, `apply`).\n- #665: zero-allocation instruction iteration for `.lg` pipeline walks, recovering the alloc cost the contribution model accepted.\n- #664: merge-side copy cascades in lowered output that escape DCE and CSE.\n- #519: capability unlocks for writing more of let-go in let-go and lowering it.\n\n## Citations\n\n- [nooga/let-go#574](https://github.com/nooga/let-go/issues/574) EPIC-017, [#575](https://github.com/nooga/let-go/issues/575) EPIC-018\n- [#580](https://github.com/nooga/let-go/pull/580): the fmpl comparison and the \"why the 535 exist\" analysis\n- [#712](https://github.com/nooga/let-go/pull/712): the accessor seam the representation change depends on\n- [#620](https://github.com/nooga/let-go/issues/620), [#665](https://github.com/nooga/let-go/issues/665), [#664](https://github.com/nooga/let-go/issues/664), [#519](https://github.com/nooga/let-go/issues/519)\n\nSee also: [Indexed-RPN IR](concepts/indexed-rpn-ir/), [Bytecode Lowering](concepts/bytecode-lowering/), [Stack VM](concepts/stack-vm/), [Master Plan Roadmap](ideas/master-plan-roadmap/), [let-go](entities/let-go/)\n", "ideas/jvm-compat": "\n## Overview\n\nThe goal is to load real-world Clojure libraries (hiccup, fipp, medley, and others) from source without forking them. Rather than embedding Java or running on the JVM, the plan maps *symbol shapes* that libraries use into let-go [runtime](references/clojure-compat/) values\u2014allowing pure-Clojure code to run unmodified.\n\nThe success metric is `test/compat/run.lg`, the compatibility regression suite. After each implementation phase, corpus pass rate reveals what works.\n\n---\n\n## The Concrete Wall\n\nThe clearest blocker emerges from hiccup's `util.clj`, which uses four JVM-shaped constructs that the current runtime cannot represent:\n\n1. **Class-symbol resolution** \u2014 code like `clojure.lang.Keyword` needs to map to a known type.\n2. **Protocol fallback to `Object`** \u2014 `extend-protocol` with an `Object` clause for default dispatch.\n3. **Method invocation** \u2014 `(.startsWith p \"/\")` syntax and delegation.\n4. **Constructor sugar** \u2014 `(URI. s)` syntax for instantiating types.\n\nThese four form the spine; the rest of the corpus uses subsets of the same patterns.\n\n---\n\n## Non-goals\n\nThe plan explicitly does not:\n- Run on the JVM or embed Java; we map *symbol shapes* libraries use into let-go runtime values.\n- Support reflection (`Class/forName`, `.getClass`).\n- Achieve full clojure.core parity\u2014only what the corpus actually touches.\n- Support `cljs/*` namespaces. (`.cljc` with `:clj` reader conditionals is in scope; `.cljs` is not.)\n\n---\n\n## Layered Architecture\n\nThe solution is three independent layers, each useful alone and shippable separately:\n\n### Layer 1: Class Symbol \u2192 ValueType Registry\n\nPopulate namespaces like `clojure.lang`, `java.lang`, and `java.net` with vars that root to let-go `ValueType`s:\n\n| Clojure symbol | let-go value |\n|---|---|\n| `clojure.lang.Keyword` | `KeywordType` |\n| `clojure.lang.Symbol` | `SymbolType` |\n| `clojure.lang.Ratio` | `RatioType` |\n| `clojure.lang.PersistentVector` | `PersistentVectorType` |\n| `clojure.lang.PersistentHashMap` | `PersistentMapType` |\n| `clojure.lang.IPersistentCollection` | `AnyCollType` (sentinel) |\n| `clojure.lang.IFn` | `FnType` |\n| `java.lang.String` | `StringType` |\n| `java.lang.Object` | `AnyType` (sentinel) |\n| `java.lang.Throwable` | `ErrorType` |\n| `java.lang.Number` | `NumberType` (sentinel) |\n| `java.lang.Long` / `Integer` | `IntType` |\n| `java.lang.Double` | `FloatType` |\n\nSentinel types act as dispatch keys and are handled specially by protocol lookup. Cost: one shim namespace, ~50 vars, plus 1\u20132 sentinel types. Unblocks most `extend-protocol`/`extend-type` failures.\n\n### Layer 2: Protocol Fallback Dispatch\n\nExtend `Protocol.Lookup` to walk registered \"interface\" sentinels when a direct type hit misses:\n\n1. Direct hit on `target.Type()` (current behavior).\n2. Check sentinel predicates (`NumberType`, `AnyCollType`) for satisfaction.\n3. Fall back to `AnyType` impl if registered.\n4. nil \u2014 current `nilImpl` path.\n\nCost: ~50 lines in protocol dispatch. Unblocks `Object`-fallback `extend-protocol` clauses.\n\n### Layer 3: Method Invocation and Constructor Syntax\n\nThe compiler already rewrites `(.member instance args)` to `instance.InvokeMethod(member, args)` and `(Class. args)` to constructor form. What's missing is populating the implementations:\n\n1. Built-in value types (`String`, `PersistentVector`, etc.) need `InvokeMethod` implementations with a small method table delegating to existing builtins.\n2. Shim \"Java types\" (`URI`, `URLEncoder`) need tiny defrecord-shaped wrappers in shim namespaces, exposing methods like `.getHost` via `InvokeMethod`.\n\nCost: ~50 lines per built-in type; ~30 total corpus methods. Reflection is explicitly out of scope\u2014the registry is hand-curated. Unblocks nearly all interop usage in the corpus.\n\n---\n\n## Phasing Strategy\n\nEach phase is shippable and measurable:\n\n**Phase A** \u2014 Layer 1 (class registry). Add `pkg/rt/jvm_shim.go` defining `clojure.lang` + `java.lang` shim namespaces. Mark non-existing types with stub sentinels. Run corpus \u2192 expect fixable shifts and new passes.\n\n**Phase B** \u2014 Layer 2 (protocol fallback). Add sentinels and extend `Protocol.Lookup` walk. Wire sentinel resolution. Run corpus \u2192 expect hiccup/util.clj to load if Layer 3 isn't needed (it is).\n\n**Phase C** \u2014 Layer 3 (Receiver implementations). Add `InvokeMethod` to built-in types and shim Java types. Hand-register the ~30 methods the corpus uses. Run corpus \u2192 hiccup loads end-to-end.\n\nStop after Phase C and re-evaluate. Layer 4 (deftype Java method bodies) only if remaining failures still pin on it.\n\n---\n\n## Test Strategy\n\n- `test/compat/run.lg` is the regression suite; diff histograms before/after each phase.\n- Per-phase: focused `.lg` integration tests (e.g., `test/jvm_shim_test.lg`) exercising the mechanism without third-party code.\n- No mocks; real types and protocols.\n- Bench load-string of a representative file (medley/core.cljc) to ensure no meaningful performance regression.\n\n---\n\n## Implementation Constraints\n\nWe explicitly will not:\n- Auto-generate the class registry from JVM reflection. Hand-curated is faster and more honest about what we actually support.\n- Attempt to make let-go a Clojure replacement. The bar is \"load and run pure-Clojure libraries\", not \"be Clojure\".\n- Support multi-arity Java method overloading. Pick the most common signature; reject the rest.\n\nSee [Clojure Compatibility](references/clojure-compat/) for the broader scope of what is in view.\n\n---\n\n## Estimate\n\nPhase A: 1 day. Phase B: 1 day. Phase C: 1\u20132 days (compiler dispatch already exists; only receiver tables remain). Total: **~3\u20135 working days** to land the spine, plus ongoing work each time the corpus surfaces a new method/class.\n\n---\n\n# Citations\n\n**Primary source:**\n- GitHub: https://github.com/nooga/let-go/blob/main/docs/jvm-compat-plan.md (status: active, last-verified 2026-06-05)\n", "ideas/malli-on-let-go": "\n# malli on let-go\n\n[**malli**](https://github.com/metosin/malli) is metosin's popular data-schema library for Clojure: schemas for validation, generation, transformation, and serialization of structured data. Running **stock, released malli** (no fork) on let-go is feasible \u2014 and far cheaper than building a custom schema system \u2014 because malli already ships Babashka reader branches that sidestep JVM-internal assumptions.\n\n## Why feasible\n\nmalli's maintainers wrote `:bb` (Babashka) reader conditionals specifically for non-JVM hosts. let-go, also non-JVM, can leverage these fallbacks:\n\n- **No JAR loading needed**: malli is pure Clojure; load `.cljc` source directly.\n- **Zero external runtime deps**: core malli (validation, transformation) depends only on core Clojure.\n- **`:bb` reader branches avoid JVM internals**: malli uses conditional branches like:\n  ```clojure\n  #?(:bb (vec arr)           ; Babashka fallback\n     :clj (LazilyPersistentVector/createOwning ...))  ; JVM path\n  ```\n  let-go can match the `:bb` feature to load these branches.\n\n## Core validation works unmodified\n\nScalar, collection, and map schemas work with minimal shims:\n\n```clojure\n(require '[malli.core :as m])\n\n(m/validate :int 42)                              ; \u2705 scalar\n(m/validate [:map [:x :int] [:y :string]] \n            {:x 1 :y \"hi\"})                       ; \u2705 collection/map\n(m/validate [:cat :int :string] [1 \"a\"])          ; \u26a0\ufe0f  sequence (regex engine)\n```\n\n## Implementation roadmap (v1: core validation)\n\n### 1. Reader: match `:bb` feature (keystone)\n- Add `:bb` to let-go's reader feature set (alongside existing `:clj`).\n- Surgical change in `pkg/compiler/reader.go`.\n- **Impact**: malli's non-JVM fallbacks activate automatically.\n\n### 2. Smoke test & shims\n- Load `(require '[malli.core :as m])`.\n- Install small shims for host constructors that malli assumes:\n  - `clojure.lang.MapEntry.` \u2192 return a let-go map-entry.\n  - `hash-combine` \u2192 trivial Clojure/Go shim.\n  - `compare-and-set!` \u2192 missing builtin (atoms have mutex; add as primitive).\n\n### 3. Regex engine (sequence schemas)\n- **Hard part**: malli's regex engine uses mutable `deftype` fields (`^:unsynchronized-mutable` + `set!`).\n- let-go `deftype` is currently immutable-only.\n- **Two paths**:\n  - **A**: Add mutable-field support to let-go `deftype` (more general; enables other ports).\n  - **B**: Fork `regex.cljc` to use `volatile!` (atoms) instead of mutable fields.\n  - Both are doable; A is cleaner.\n\n### 4. Extended features (v2+)\n- Error messages, transformers, generators (test.check), `:fn` schemas (SCI evaluation).\n- These are separable follow-ups.\n\n## Interop strategy: three layers\n\n### Layer 1: `:bb` reader lens\nmalli automatically takes Babashka-compatible code paths. No interop code needed.\n\n### Layer 2: Native shims\nSmall let-go implementations:\n- `MapEntry` constructor (already a first-class value type in let-go).\n- `hash-combine` (numeric operation).\n- `compare-and-set!` (atomic compare-and-swap).\n\n### Layer 3: Go-backed constructors\nFor Java classes that malli constructs at runtime:\n- Use `gojava` (Go reimplementations of `java.*` classes).\n- Only needed if malli calls `(java.util.ArrayDeque.)` or similar (tied to regex engine).\n\n## Effort estimate\n\n- **Scalar + map/collection schemas**: 2\u20134 days\n  - Reader `:bb` matching\n  - Three shims (MapEntry, hash-combine, compare-and-set!)\n  - Smoke tests\n  \n- **Full core incl. sequence schemas**: +3\u20135 days\n  - Regex engine mutable-deftype work (dominant cost)\n  - Comprehensive tests\n  \n- **Generators/`:fn`/error formatting**: separate, deferred efforts\n\n## Why this matters\n\n- **Ecosystem reuse**: malli is battle-tested, maintained, and widely used in production Clojure.\n- **Data validation**: let-go can validate configurations, API schemas, and domain data without rolling custom.\n- **Honest port**: stock malli (zero forks) means upstream compatibility and low maintenance burden.\n- **Precedent for other libraries**: proof that Babashka-compatible libraries work on let-go; opens doors to plumatic/schema, spec-tools, and others.\n\n## Risks and mitigations\n\n- **Reader branches drift**: malli's `:bb` path could diverge from let-go needs. Mitigation: stay close to Babashka; upstream liaison if branch coverage gaps emerge.\n- **Mutable deftype complexity**: if letting let-go support mutable fields, must not break immutability guarantees for persistent collections. Mitigation: isolate to `^:unsynchronized-mutable` annotation; comprehensive tests.\n- **Performance**: regex engine is hot path. Mitigation: profile and optimize after core is working; Go-backed fallbacks available if needed.\n\n# Citations\n\n[1] **docs/superpowers/MALLI_PORT_ANALYSIS.md**: Feasibility analysis (local source)  \n/Users/ndn/development/let-go/docs/superpowers/MALLI_PORT_ANALYSIS.md\n\n[2] **docs/superpowers/specs/2026-05-30-malli-on-let-go-design.md**: Design document (local source)  \n/Users/ndn/development/let-go/docs/superpowers/specs/2026-05-30-malli-on-let-go-design.md\n\n[3] **metosin/malli**: GitHub repository  \nhttps://github.com/metosin/malli\n\n[4] **Babashka pods & reader** (this wiki)  \n[../concepts/pods.md](concepts/pods/)\n\n[5] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n---\n\nSee also: [lginterop](concepts/lginterop/), [clojure-compat](references/clojure-compat/)\n", "ideas/master-plan-roadmap": "\n# let-go Master Roadmap\n\nThe master plan consolidates let-go's existing strategic initiatives into a single, sequenced roadmap: VM performance, Clojure-like collections, numeric and value representation, and runtime images. It defines 9 phases with staged milestones and success criteria to deliver the fastest and most useful Clojure-on-Go implementation.\n\n> **Note on authoritative sources:** This plan is marked `status: active` in its source document (master-plan.md). On direction questions \u2014 particularly the status of Phase 7 (Go AOT backend) \u2014 [contribution-policy.md](https://github.com/nooga/let-go/blob/main/docs/contribution-policy.md) is authoritative and supersedes this plan. Contribution-policy clarifies that Phase 7 is the committed deployment path (not optional), and establishes design contracts for interop, performance tracking, and the self-hosted compiler direction.\n\n## Vision and success criteria\n\nBy the end of this roadmap:\n\n- **Startup**: cold start with stdlib image < 50 ms on a typical laptop; warm start < 5 ms.\n- **Throughput**: 2\u20133x improvement on core functional pipelines (`map`/`filter`/`reduce`) over current baseline; zero-regression guardrails in CI.\n- **Allocation profile**: O(1) allocations for transducer-based pipelines over vectors and ranges; no unbounded retention from calling convention.\n- **Semantics**: Clojure-aligned collections and seq tower; structural equality and hashing; transients and transducers.\n- **Deployability**: precompiled stdlib image by default; app/runtime images supported and versioned; deterministic serialization.\n\n## Guiding principles\n\n- **Correctness first**: codify Clojure semantics via interfaces and tests before aggressive optimizations.\n- **Tight hot paths**: specialize VM call paths and numeric primitives; avoid reflection and unnecessary boxing.\n- **Incremental rollout**: adapters and compatibility layers to avoid big-bang rewrites; keep REPL usable throughout.\n- **Benchmark-driven**: every phase ships microbenchmarks and end-to-end scenarios, with perf budgets enforced in CI.\n\n## Phases overview\n\nThe roadmap is organized into nine phases, each with clear scope, dependencies, and acceptance criteria:\n\n### Phases 0\u20131: Foundations (semantics and VM optimization)\n\n**Phase 0** introduces core interfaces (`Equivable`, `Hashable`, `Indexed`, `Stack`, `IMapEntry`, `Reducible`, `Reduced`) and updates builtins to align with Clojure semantics (`seq` coercion, `nil` handling). It establishes the benchmark harness and CI performance gates.\n\n**Phase 1** fixes VM calling conventions: argument slice copies, tail-call optimization (including closures), frame/stack pooling, and small-arity opcodes (`INVOKE_0/1/2/3`, `TAIL_CALL_0/1/2/3`).\n\n### Phases 2\u20134: Collections and transduction\n\n**Phase 2** replaces vectors with a canonical 32-ary [BPTR persistent vector](concepts/indexed-rpn-ir/), adds transients, and switches the reader to produce persistent types. **Phase 3** implements persistent hash maps/sets (HAMT-based) with structural equality and hashing. **Phase 4** adds transducer APIs (`transduce`, `eduction`, `sequence`) and chunked sequences, enabling O(1) allocation for reduction pipelines.\n\n### Phases 5\u20136: Deployment and tooling\n\n**Phase 5** defines runtime image schema and versioning, implements serialization for values/code/vars, and pre-builds a `stdlib.img` for fast boot. **Phase 6** polishes nREPL, audits interop patterns, and ships WASM support with instant startup.\n\n### Phase 7: Go AOT backend
