lue-representation](concepts/value-representation/)\n\n# Citations\n\n> **Source**: https://github.com/nooga/let-go/blob/main/docs/design/value-representation-and-numeric-performance.md\n>\n> Design document authored by the let-go team; status `active` and `human-verified` for `numeric-representation` and `int-unbox-paths` concerns (last verified 2026-06-05).\n", "sources/design-vm-performance": "\n## About this source\n\nThis document is an audit and optimization plan for the let-go VM interpreter ([stack-vm](concepts/stack-vm/)) and its calling convention. Authored by the let-go team and last verified on 2026-06-05, it identifies concrete performance bottlenecks in function calls and proposes a three-phase rollout to reduce memory retention, GC pressure, and call overhead.\n\n## Key contributions\n\n- **Identified hotspots**: Frame/stack allocation per call, argument slices retaining caller stack backing arrays, TCO limited to `*Func` (not `*Closure`), and generic invocation overhead.\n- **Retention bug**: Argument slices created in `OP_INVOKE` reference the caller's `f.stack` array, causing the callee frame to retain the entire stack for its lifetime\u2014a significant memory leak in call-heavy workloads.\n- **Phased optimization roadmap**:\n  - **Phase A** (correctness): Copy args before bytecode calls; extend TCO to closures.\n  - **Phase B** (throughput): Introduce frame/stack pools; add `INVOKE_0/1/2/3` and `TAIL_CALL_0/1/2/3` opcodes; ensure native functions use direct wrappers.\n  - **Phase C** (iteration): Add `Reducible` interface and chunked seqs for collection fast paths.\n- **Concrete file pointers** to `pkg/vm/vm.go`, `pkg/vm/func.go`, `pkg/vm/native_func.go`, and `pkg/rt/lang.go`, with specific line references and implementation checklist.\n\n## Relevant concepts\n\n- [stack-vm](concepts/stack-vm/) \u2014 The bytecode interpreter loop and calling convention.\n- [ir-optimizations](concepts/ir-optimizations/) \u2014 Compiler and [ir-pipeline](concepts/ir-pipeline/) optimizations that complement VM-level improvements.\n\n## Derived pages\n\n- [stack-vm](concepts/stack-vm/) \u2014 Bytecode interpreter architecture and calling convention.\n- [ir-optimizations](concepts/ir-optimizations/) \u2014 IR-level compilation optimizations.\n\n# Citations\n\n```bibtex\n@inproceedings{let-go-vm-perf,\n  title={VM performance and calling convention \u2014 audit and optimization plan},\n  author={let-go team},\n  journal={let-go design docs},\n  year={2026},\n  url={https://github.com/nooga/let-go/blob/main/docs/design/vm-performance-optimization.md},\n  note={Last verified: 2026-06-05}\n}\n```\n", "sources/docs-known-divergences": "\n## What this source is\n\n`docs/known-divergences.md` is the ledger of known behavioral differences between let-go and Clojure JVM. Each entry is classified as an intentional language decision or a temporary compatibility mismatch: intentional entries say why let-go does not follow Clojure and how portable code should behave; temporary entries state the intended contract and what resolves them. It is separate from the engine-differential ledgers (`test/parity-divergence.txt` for bytecode-versus-gogen output, `test/gogen_aot_xfail.txt` for gogen fixture divergences), which compare let-go with itself. Added to let-go by #771 on 2026-09-06 as `KNOWN_DIVERGENCES.md`; renamed to the lowercase path by #825 on 2026-09-08; the array-map entry narrowed to its residual by #826 on 2026-09-09.\n\n## Key takeaways\n\n**Intrinsic map traversal order** (intentional). Traversal order for map literals and `hash-map` is unspecified at every size, on purpose: a generic map should not acquire an ordering contract because its current representation happens to be small, and the insertion-order side table was removed while optimizing the AOT/IR pipeline in #397. Order comes from an explicitly ordered type: `sorted-map` today, `array-map` once the mismatch below is resolved. The order-independent `:lg` expectations in the shared suite (`cons`, `cycle`, `mapcat` tests) entered through jank-lang/clojure-test-suite#927.\n\n**\"Temporary `array-map` mismatch\"** (temporary). Since #826 the entry records what #764 delivered (array-backed up to eight entries, `assoc` of a ninth promotes, #763 resolved) and names the residual: `(array-map ...)` with more than eight pairs is built through the same transient and promotes during construction, so it traverses in hash order where Clojure keeps a directly constructed array map ordered at any size. Resolution is a constructor that does not promote on size, with the `assoc` rule unchanged; #827 tracks it. Before #826 the entry described `array-map` as routed through the unordered map outright and noted that #763's acceptance criteria did not match the intended contract.\n\n**Character model for supplementary Unicode** (intentional). A let-go character is one Unicode scalar value (Go's rune model), so `(char 65895)` yields U+10167 where JVM Clojure throws, and supplementary characters are single characters rather than surrogate pairs. Valid ranges are U+0000 to U+D7FF and U+E000 to U+10FFFF. Two validation defects are recorded as temporary: surrogate-range `Int`/`BigInt` inputs pass `char`'s range check, and a `BigInt` is truncated with `Int64()` before validation, so `(int (char 18446744073709551681N))` gives `65`. No issue tracks them; the ledger is the record. The shared-suite override is jank-lang/clojure-test-suite#939.\n\n**Possible compatibility controls.** A sketch, not a design: runtime features could turn on strict randomized traversal for unspecified-order collections as a diagnostic, and build features could opt into heavyweight compatibility such as a JVM bridge, keeping the default binary lean.\n\n**Maintenance rule.** Every `:lg` override in the pinned shared suite must map to an entry here; the ledger is updated in the same let-go change that consumes the override, and resolved temporary entries are removed. Audit with `git -C test/clojure-test-suite grep -n ':lg' -- '*.cljc'`.\n\n## Since the ledger was written\n\nBetween #771 and #826 the ledger was not edited apart from the rename, while two things moved; #826 (2026-09-09) then brought the array-map entry up to date, and the in-doc `last-verified` is now 2026-09-08.\n\n- **#764 merged on 2026-09-07 (`638b4a6a`), resolving #763.** `PersistentMap` gained an array-map mode behind the same `MapType`: maps with at most eight entries keep insertion order in a paired key/value slice, the ninth `assoc` promotes to the HAMT, and `dissoc` never demotes a non-empty map. Map literals, `array-map`, `assoc` chains, `zipmap`, `merge`, `select-keys`, and `into` preserve insertion order up to eight entries; `hash-map` order stays unspecified by contract and is incidentally insertion-ordered when small. `test/map_order_test.lg` pins this. It narrows the \"Temporary `array-map` mismatch\" entry rather than closing it: `(array-map ...)` with more than eight pairs is built through the same transient and promotes during construction, so `(keys (array-map :i 1 :h 2 :g 3 :f 4 :e 5 :d 6 :c 7 :b 8 :a 9))` comes back in hash order on `a6763e77` where Clojure keeps a directly constructed array map ordered at any size. nooga/let-go#826 rewrote the entry to that residual on 2026-09-09, and nooga/let-go#827 tracks the constructor fix. The intentional entry above it stands: the contract is still \"unspecified\", and the small-map order is an implementation detail that #764 happens to make match Clojure's.\n- **#812 closed as not planned on 2026-09-06.** Norman's report that `(count \"\ud83d\ude00\")` is 1 in let-go and 2 in JVM Clojure was confirmed by the project owner as the accepted rune-counting divergence. That is the character-model entry applied to `count`, and a concrete example the ledger's entry lacks.\n\n## Pages derived from this source\n\n- [Clojure Compatibility](references/clojure-compat/), \"Behavioral differences\"\n\n## Citations\n\n[1] **docs/known-divergences.md** \u2014 the ledger  \nhttps://github.com/nooga/let-go/blob/main/docs/known-divergences.md\n\n[2] **PR #771** \u2014 docs: catalog known Clojure divergences (merged 2026-09-06)  \nhttps://github.com/nooga/let-go/pull/771\n\n[3] **PR #764** \u2014 feat(vm): insertion-ordered small maps matching Clojure array-map semantics (merged 2026-09-07)  \nhttps://github.com/nooga/let-go/pull/764\n\n[4] **Issue #812** \u2014 supplementary Unicode string count differs from JVM (closed, not planned, 2026-09-06)  \nhttps://github.com/nooga/let-go/issues/812\n\n[5] **test/map_order_test.lg** \u2014 the small-map ordering contract as tests  \nhttps://github.com/nooga/let-go/blob/main/test/map_order_test.lg\n", "sources/docs-perf-ratchet": "\n# Benchmark Ratchet (docs/perf/ratchet.md)\n\nActive doc (last-verified 2026-08-04). Its one idea: report every benchmark as a multiple of a frozen CPU loop so a baseline captured on one machine still flags regressions on another.\n\n## Key takeaways\n\n- **Phases:** capture streams `.jsonl` (fsynced per line); aggregate normalizes and writes `baseline.json`; `check`/`update`/`show` wrap them; `snapshot` writes immutable timeline files.\n- **Check:** `delta = current.ratio / baseline.ratio - 1`, 5% default budget; `MISSING` and `NEW` flagged.\n- **Scope:** narrow by default (anchor, suite, IR compile); `-full` adds the `pkg/vm` fleet; the doc warns that `gogen_ir` numbers show native dispatch working, not native being fast, because lowered code still boxes most calls.\n- **Baseline:** seeded from a window of the five most recent CI amd64 snapshots per machine key, reduced to a median in ratio space (#684, 2026-09-07; before that, the newest snapshot alone), M3 preserved locally, M1 virtual excluded after #651; `update` takes the per-metric minimum; `-force` needs a paper trail and must not ride with the change being measured.\n- **Stale spots noticed on 2026-09-05, still present at `a6763e77`:** the JSON example names `pkg/api` for the anchor (it is `pkg/vm`), and the Components table says `perf-timeline.yml` regenerates the page (it is `pages.yml`).\n\n## Derived pages\n\n[perf-ratchet](concepts/perf-ratchet/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/blob/main/docs/perf/ratchet.md\n", "sources/docs-regenerating-generated-artifacts": "\n# Regenerating generated artifacts after .lg edits\n\nActive doc (last-verified 2026-06-13). Editing any `pkg/rt/core/**/*.lg` file requires regenerating the artifacts the runtime loads instead of source; skip it and the edit silently has no effect.\n\n## Key takeaways\n\n- **Two artifacts from one command:** `core_compiled.lgb` (default runtime) and `core_go_lowered/` (`-tags gogen_ir`); `make generate` refreshes both plus the manifest, `make check-generated` verifies.\n- **Why not mtimes:** VCS checkouts write arbitrary mtimes, so a stale bundle can look newer than its sources; `pkg/genmanifest` hashes content into `generated.sums` instead.\n- **Where staleness is caught:** `TestGeneratedArtifactsAreFresh`, `make check-generated`, and an optional pre-commit hook (`scripts/pre-commit`, symlinked by hand; `jj` runs no git hooks).\n- **Merge drivers:** `make install-hooks` registers `merge.lgb` and `merge.sums` so a rebase touching `core.lg` regenerates rather than conflicting on binary.\n- **`go build` cannot regenerate:** only `make generate` or `go generate ./cmd/lgbgen` do.\n\n## Derived pages\n\n[generated-artifacts](concepts/generated-artifacts/) \u00b7 [runtime-image](concepts/runtime-image/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/blob/main/docs/regenerating-generated-artifacts.md\n", "sources/epic-574-ir-normalization": "\n# Epic: IR normalization + execution-form cleanup (EPIC-017, issue #574)\n\nOpen epic by Norman Nunley, making an internal roadmap visible upstream (companion of #575). Its premise comes from an index-RPN execution spike (ITER-0057): the IR's representation mechanics, not the execution model, dominate interpreted performance.\n\n## Key takeaways\n\n- **Root cause:** `structurize` is incomplete (`:try` is not a structural node) and the bytecode backend never adopted the structural level; that one gap explains the cross-block splice rejection and `:try` being unlowerable on the bytecode path.\n- **Evidence (2026-07-18):** the stack lowering's junk-below accounting proved fragile, and IR-lowered bytecode runs about twice the direct compiler's instruction count on branch-heavy code, roughly 67% of the excess being branch-arg `DUP_NTH` shuffle.\n- **Ranked findings:** packed instruction records (top cost; #558's side table is the interim step), canonicalization and interning, freeze-after-construction (done), blocks as spans, frame width (gates the EPIC-018 tail), typed handles.\n- **Unscheduled stories:** `structurize-:try`, `bytecode-adopts-structurize`.\n- **Relationships:** feeds the EPIC-016 index-RPN VM re-check; the op-catalog work is the canonicalization half; #528's RPN-spike deletion is held until the verdict.\n\n## Derived pages\n\n[ir-representation-roadmap](ideas/ir-representation-roadmap/) \u00b7 [structurize](concepts/structurize/) \u00b7 [bytecode-lowering](concepts/bytecode-lowering/) \u00b7 [op-catalog](concepts/op-catalog/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/issues/574\n", "sources/epic-575-block-interface": "\n# Epic: block interface as shared liveness metadata + block-arg erasure (EPIC-018, issue #575)\n\nOpen epic by Norman Nunley, companion of #574. Block-args are the stack VM's accommodation for missing locals: every cross-block value is threaded through branch-target arguments, and `lower.lg` rejects any direct cross-block reference (`check-cross-block!`).\n\n## Key takeaways\n\n- **Done (backend-independent):** STORY-0068 shared per-block liveness (`ir.passes.liveness`), 0069 relocating ad-hoc reachability helpers onto it (`lower_go`'s `live-nids` was the one real duplicate), 0070 the single-value resolver, 0071 block-arg classification and census.\n- **Pending (backend-coupled):** 0072 `OP_LOAD_LOCAL`/`OP_STORE_LOCAL`, 0073 resolver lowering that retires `check-cross-block!` and the junk-below class, 0074 retiring the fold-outline workaround so the general inliner unblocks on bytecode.\n- **Gate:** held until the EPIC-016 index-RPN VM re-check; a go verdict supersedes the stack-VM half.\n- **Why now:** the DUP shuffle is about 67% of the 2\u00d7 instruction bloat, and the junk-below bookkeeping is the source of a class of latent miscompiles now guarded by fallback at the cost of coverage.\n\n## Derived pages\n\n[block-interface-and-liveness](concepts/block-interface-and-liveness/) \u00b7 [ir-representation-roadmap](ideas/ir-representation-roadmap/) \u00b7 [bytecode-lowering](concepts/bytecode-lowering/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/issues/575\n", "sources/guide-clojure-compatibility": "\n# Clojure Compatibility Guide\n\nGuide documenting let-go's relationship to JVM Clojure: a compatible dialect rather than a drop-in replacement. Establishes compatibility via conformance testing against jank-lang's test suite (5621/5621 assertions passing across 232 files), then catalogs supported and missing features, and behavioral divergences.\n\n## Key takeaways\n\n- **Conformance**: 5621 assertions pass with the `:clj` reader lens; no known failures, compile skips, panic skips, or runtime skips\n- **Standard namespaces**: `clojure.core`, `clojure.string`, `clojure.set`, `clojure.walk`, `clojure.edn`, `clojure.pprint`, `clojure.test`, and `clojure.core.async` are broadly supported; additional namespaces (`io`, `http`, `json`, `transit`, `os`, `System`, `syscall`, `pods`) extend capability beyond JVM baseline\n- **Key omissions**: STM coordination (`ref`, `dosync`), asynchronous agents, chunked sequences, custom tagged literals, Java-style `deftype` host methods, `Spec`, and sorted-collection range queries (`subseq`, `rsubseq`)\n- **Behavioral shifts**: Numeric tower is pragmatic (int64, float64, BigInt, ratios, BigDecimal); base arithmetic throws on overflow; regex uses Go flavor (re2); `go` blocks are real goroutines (not IOC); channels always block\n\n## Derived pages\n\n- [clojure-compat](references/clojure-compat/)\n\n# Citations\n\n- nooga/let-go: [Clojure compatibility and differences](https://github.com/nooga/let-go/blob/main/docs/guide/clojure-compatibility.md)\n", "sources/guide-embedding-in-go": "\n# Embedding let-go in Go\n\nThis guide documents how let-go integrates cleanly as a scripting layer within Go programs via the [go-interop](concepts/go-interop/) layer.\n\n## What the source is\n\nAn official let-go guide covering practical embedding patterns: defining Go values and functions via the `api` package, executing let-go code against Go data, and roundtripping Go structs and channels through the VM.\n\n## Key takeaways\n\n- **VM initialization**: `api.NewLetGo()` bootstraps a runtime context; `Def()` binds Go values and functions into the let-go namespace.\n- **Struct integration**: Registered Go structs become records in let-go; unmodified values unbox back to Go types for free via field accessors like `:name`.\n- **Channel first-class**: Go `chan` and `vm.Chan` integrate directly into `go`, `<!`, and `>!` primitives for async coordination.\n- **Function calls**: Go functions become callable from let-go expressions with automatic type marshaling.\n\nThe guide anchors practical [go-interop](concepts/go-interop/) patterns and points to the full test suite in `pkg/api/interop_test.go`.\n\n## Derived pages\n\n- [go-interop](concepts/go-interop/)\n\n# Citations\n\nResource: https://github.com/nooga/let-go/blob/main/docs/guide/embedding-in-go.md\n", "sources/guide-resources-and-source-paths": "\n## Overview\n\nThis guide documents two path-list mechanisms in [let-go](entities/let-go/) that control file loading: resource roots (for non-source data) and source roots (for `require`d namespaces). Both accept `:` (Unix) or `;` (Windows) separated paths, and support embedding into bundled binaries.\n\n## Key takeaways\n\n- **`io/resource`** reads templates, assets, and data files from configured resource roots; returns `nil` if absent\n- **Resource roots** are set via `-resource-paths` flag or `LG_RESOURCE_PATHS` env var; multiple roots use first-match semantics\n- **Binary bundling** (`-b`) embeds all resource-root files into the binary; a bundled binary reads only embedded resources (no filesystem fallback)\n- **Source paths** resolve `require`d namespaces; default is `.` (current directory) unless overridden\n- **Source path configuration** via `-source-paths` or `LG_SOURCE_PATHS`; explicit paths are complete (`.` not implicit unless listed); empty value means \"no source paths\"\n- **Search path independence**: the script passed on the command line always loads by its literal path\n\nThis mechanism enables self-contained, predictable deployments and controls the namespace search hierarchy.\n\n## Derived pages\n\n[let-go](sources/let-go-readme/) \u00b7 [runtime-image](sources/design-runtime-image/)\n\n## Citations\n\n\u2014\n", "sources/guide-usage": "\n# guide-usage\n\nOfficial documentation covering how to run, compile, and distribute [let-go](entities/let-go/) programs.\n\n## What this covers\n\nThe guide documents the complete lifecycle of a let-go program:\n- **Running programs**: REPL, expression evaluation, file execution with arguments\n- **Bytecode and standalone binaries**: Compiling to [bytecode-compiler](concepts/bytecode-compiler/) format and bundling self-contained executables\n- **WASM compilation**: Generating web apps with full terminal emulation via xterm.js and COOP/COEP headers for SharedArrayBuffer\n- **Compile-time evaluation**: Controlling side effects via `*compiling-aot*` and `*in-wasm*` flags\n- **Project management**: Using [lgx](projects/lgx/) as a dependency resolver, build tool, and test runner\n\n## Key takeaways\n\n- let-go supports interactive (REPL) and compiled (-c bytecode, -b binary, -w WASM) distribution modes\n- Standalone binaries are portable copies of the `lg` runtime with bytecode appended\u2014no let-go installation required at runtime\n- WASM output includes a service worker for GitHub Pages compatibility and xterm.js for terminal programs\n- The `*compiling-aot*` flag separates compile-time setup from runtime execution\n- lgx provides a git-based, multi-file project workflow with scaffolding and task running\n\n## Derived pages\n\n[bytecode-compiler](concepts/bytecode-compiler/) \u00b7 [let-go](entities/let-go/) \u00b7 [wasm-compilation](concepts/wasm-compilation/) \u00b7 [lgx](projects/lgx/)\n\n## Citations\n\nSource: https://github.com/nooga/let-go/blob/main/docs/guide/usage.md (verified 2026-07-03)\n", "sources/issue-786-compiler-namespaces": "\n# Compiler namespaces: consolidate IR, AOT orchestration, and the Go backend under lg.compiler (issue #786)\n\nOpen issue by Norman Nunley (nnunley), filed 2026-09 against #735's proposed `lg.aotdriver` extraction. It argues that the compiler currently spans four seams that grew separately (`ir.*`, `gogen` behind its `!bootstrap` auxiliary embed, `scripts/lg-compile`, and the proposed `lg.aotdriver`) and that a permanent namespace layout should be settled before more compiler services are added.\n\n## Key takeaways\n\n- **Target shape:** `lg.compiler` (API and program-level orchestration), `lg.compiler.ir` and `lg.compiler.ir.passes.*`, `lg.compiler.backend.go` (the bootstrapped Go backend that `gogen` is meant to become), `lg.commands.compile` (CLI adaptation only).\n- **`gogen` is not enrolled, it is bootstrapped:** moving Go emission under the compiler must first resolve the cold/hot lowering fixpoint and determinism constraints #557 documented.\n- **Compatibility:** `scripts/lg-compile` stays as a shim until an explicit deprecation; `lg script.lg`, `lg -e`, and bare `lg` keep working; subcommands are not made mandatory.\n- **Six migration steps** that may land as separate PRs but each preserve the whole destination.\n- **Non-goals:** fixing lowering gaps, removing `lg-compile`, replacing the scripting CLI.\n- **Refined on #735 (2026-09-02):** `lg.compiler` enrolls in the standard embedded and generated set immediately, no temporary auxiliary-embed exception; the shim stays; a contract test pins `EMIT-FAIL`.\n- **#735 approved (2026-09-08)** at head `ab699061`. On bundle membership, which the issue does not cover, Norman said on 2026-09-09 he is fine with `gogen` and the compiler in the bundle and in the bootstrap universe.\n- **Second inventory comment (2026-09-08):** step 5's surface is `lg.compiler/main-from-args` plus `exit-code`; step 3 must keep both bundle-skip prefixes as prefixes.\n\n## Derived pages\n\n[compiler-namespace-architecture](ideas/compiler-namespace-architecture/) \u00b7 [generated-artifacts](concepts/generated-artifacts/) \u00b7 [go-backend](concepts/go-backend/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/issues/786\n", "sources/let-go-readme": "\n# let-go README\n\n## What this source is\n\nThe official let-go project README, serving as the authoritative entry point. Covers project goals, implementation status, benchmarks against comparable Clojure runtimes (Babashka, Joker, go-joker, gloat, JVM), language compatibility (5621/5621 test assertions passing), compilation to bytecode/binaries/WASM, embedding in Go, nREPL support, and known limitations vs. Clojure JVM.\n\n## Key takeaways\n\n**let-go is a pragmatic Clojure dialect targeting Go environments.** It trades perfect JVM compatibility for portability: a 12MB native binary with 8.2ms cold startup (vs. Babashka's 17.7ms, Joker's 11.5ms, JVM's 360ms), passes the jank-lang test suite, and runs on Plan 9. Implements persistent data structures, lazy seqs, transducers, protocols, multimethods, BigInt, core.async, and Babashka pods. Go interop is two-way: define Go structs/functions/channels, invoke them from let-go; compile programs to standalone binaries or self-contained WASM web pages.\n\n**Design pragmatism over purity.** No coordinated STM or async agents (`ref`/`agent` are atom-backed aliases); channels are real goroutines and always-blocking; regex uses re2 (not Java); numeric tower is simplified. Projects without external JVM dependencies (or willing to port them to Go interop) see idiomatic Clojure unmodified.\n\n## Derived pages\n\n[let-go](entities/let-go/) \u00b7 [bytecode-compiler](concepts/bytecode-compiler/) \u00b7 [wasm-compilation](concepts/wasm-compilation/) \u00b7 [nrepl-in-browser](ideas/nrepl-in-browser/)\n\n# Citations\n\n- [https://github.com/nooga/let-go#readme](https://github.com/nooga/let-go#readme)\n", "sources/let-go-source-code": "\nThe let-go project is a Clojure dialect compiled to bytecode and executed on a stack-based virtual machine, all written in Go. The source tree in `pkg/` contains the core compilation and runtime infrastructure.\n\n## What the source is\n\nThe `/pkg` directory holds thirteen main packages forming the compilation pipeline and runtime:\n\n**Compilation pipeline:**\n- **`compiler/`** \u2014 the Clojure/Lisp reader and compiler. Parses source code into an AST, performs variable scoping and closure analysis, compiles forms to bytecode instructions emitted into code chunks. Handles macros, special forms, and error reporting.\n\n- **`ir/`** \u2014 the intermediate representation (IR) layer: an SSA (static single-assignment) form with block-arg-style branches, sitting between the source compiler and bytecode VM. Includes IR optimization passes (in subdirectories and Lisp DSL files) for constant folding, common-subexpression elimination (CSE), dead-code elimination (DCE), loop-invariant code motion (LICM), and type inference. Passes run after IR is built and before lowering to bytecode.\n\n- **`bytecode/`** \u2014 serialization and deserialization of compiled bytecode to/from `.lgb` binary format. The encoder and decoder handle the module format that bundles code chunks, constants, and metadata.\n\n**Runtime:**\n- **`vm/`** \u2014 the bytecode virtual machine. Defines opcodes, the stack-based execution engine, code chunks (instruction streams), constants tables, and runtime values (nil, symbols, keywords, numbers, collections).\n\n- **`rt/`** \u2014 the core runtime and standard library. Includes `rt/core/` (.lg Clojure source stubs and Go-lowered implementations) for persistent data structures, lazy sequences, transducers, protocols, records, multimethods, `core.async`. Also contains native implementations in Go (http.go, json.go, os.go, pods.go, etc.) that are registered as built-in functions. The architecture is primarily Go-lowered: `core.lg` explicitly notes it has been compiled to Go, reducing Lisp implementation burden while retaining bootstrappable Clojure-like semantics.\n\n**Distribution and tools:**\n- **`bundle/`** \u2014 the standalone-binary format. Defines the trailer appended to `lg` executables when bundling programs with `lg -b`: contains the bytecode payload and optional resource archive, enabling self-contained distribution.\n\n- **`nrepl/`** \u2014 an nREPL server for editor integration (Emacs/Calva/Neovim). Listens on a TCP port, processes evaluation requests, and routes output back to clients.\n\n**Infrastructure and support packages:**\n- **`api/`** \u2014 public Go API for embedding let-go in Go programs. Provides interfaces for running bytecode, managing execution contexts, and interoperating with Go functions and types.\n\n- **`buildmeta/`** \u2014 build metadata and versioning. Captures compiler version, build timestamp, and other metadata embedded in compiled artifacts.\n\n- **`errors/`** \u2014 error types and error handling utilities for compilation and runtime.\n\n- **`genmanifest/`** \u2014 manifest generation for deployed programs. Tracks compiled artifacts, dependencies, and deployment metadata.\n\n- **`perfdata/`** \u2014 performance profiling and metrics collection. Captures runtime statistics for optimization and debugging.\n\n- **`resolver/`** \u2014 namespace and module resolution. Resolves imports, manages load paths, and handles module dependencies during compilation.\n\n## Key takeaways\n\n1. **Two-phase compilation**: source is first compiled to an intermediate IR representation for optimization, then lowered to bytecode instructions.\n\n2. **IR-first optimization**: the IR layer includes optimization passes for constant folding, CSE, DCE, LICM, and type inference. Passes are implemented in Lisp (`.lg` DSL files in `rt/core/ir/passes/`) and as Go tests, keeping the compiler extensible.\n\n3. **Go-lowered runtime**: the architecture is primarily Go-implemented. Core.lg has been Go-lowered for performance; most stdlib namespaces (http, json, os, pods, async, etc.) are implemented as native Go functions at the `/pkg/rt/` level and registered as built-ins. A small number of Clojure source stubs remain in `rt/core/` for code that benefits from Clojure semantics.\n\n4. **Serializable bytecode**: the `bytecode` and `bundle` packages enable AOT compilation to `.lgb` files and standalone binaries, supporting distribution without the `lg` binary.\n\n5. **nREPL integration**: the `nrepl` server bridges the VM to mainstream editors, unifying the REPL experience with Clojure tooling.\n\n## Derived pages\n\n[stack-vm](concepts/stack-vm/) \u00b7 [bytecode-compiler](concepts/bytecode-compiler/) \u00b7 [ir-pipeline](concepts/ir-pipeline/) \u00b7 [nrepl-server](concepts/nrepl-server/) \u00b7 [exec-context](concepts/exec-context/)\n\n## Citations\n\n**Resource**: https://github.com/nooga/let-go/tree/main/pkg  \n**Repo path**: `/pkg` (13 main packages)  \n**Date accessed**: 2026-07-03\n", "sources/plan-clojurelike-refactor": "\n## What this is\n\nThe canonical five-phase refactor plan for let-go's collection semantics, authored by the maintainer. Captures the current gaps (ad-hoc collections, incorrect seq behavior, no structural equality), target interface hierarchy (proper Seq/Seqable separation, Indexed/Stack abstractions, MapEntry), and detailed migration strategy to minimize breakage while delivering Clojure semantics incrementally.\n\n## Key takeaways\n\n- **Seq tower alignment**: Collections should implement `Seqable` (expose a seq view), not `Seq` directly; builtins coerce via `seq()` and handle `nil`.\n- **Persistent data structures**: Replace Go map-backed `Map`/`Set` with HAMT-backed `PersistentHashMap`/`Set`; rework `PersistentVector` to canonical 32-ary bit-partitioned trie with fixed-width nodes.\n- **Structural equality & hashing**: Add `Equivable` { `Equiv(Value) bool` } and `Hashable` { `Hash() int` } interfaces; implement consistently across scalars, collections for map/set key safety.\n- **Transients & transducers**: Introduce `Editable`/`TransientCollection` for high-performance bulk mutations (copy-free via edit tokens); add `Reducible` fast path and transducer functions (`transduce`, `eduction`, `sequence`, `completing`).\n- **Four staged phases**: Phase 0 (interfaces + coercion), Phase 1 (PersistentVector), Phase 2 (maps/sets + equality), Phase 3 (replace core equality), Phase 4 (chunked seq + performance).\n\n## Derived pages\n\n- [clojurelike-refactor](ideas/clojurelike-refactor/)\n\n---\n\n## Citations\n\n[Resource link](https://github.com/nooga/let-go/blob/main/docs/clojurelike-refactor-plan.md)\n", "sources/plan-jvm-compat": "\n# JVM Compatibility Shim \u2014 Source\n\nThis document is the canonical plan for adding JVM interop shims to let-go, enabling unforked use of real-world Clojure libraries (hiccup, fipp, medley) that depend on JVM-specific language constructs.\n\n## Key contribution\n\nThe plan defines a pragmatic three-layer architecture to support class-symbol resolution, protocol fallback dispatch, and method invocation:\n\n**Layer 1: Class symbol \u2192 ValueType registry**  \nMap JVM class symbols (`clojure.lang.Keyword`, `java.lang.String`, `java.lang.Object`, etc.) to let-go runtime value types via shim namespaces (`clojure.lang`, `java.lang`). Sentinel types like `AnyType` and `NumberType` serve as dispatch keys, not real types.\n\n**Layer 2: Protocol fallback dispatch**  \nExtend `Protocol.Lookup` to check sentinel types when direct type lookup fails, enabling `Object`-keyed `extend-protocol` clauses that provide fallback implementations for any type satisfying a predicate.\n\n**Layer 3: Receiver method dispatch**  \nPopulate `InvokeMethod` on built-in value types and create shim constructors to handle `.method obj args` syntax and `(Class. args)` constructor sugar for a curated set (~30 total) of methods actually used by the corpus.\n\nEach layer is independently shippable; Phase C completes the critical path (estimated 3\u20135 working days total).\n\n## Concrete gap addressed\n\nThe hiccup library's `util.clj` blocks 7 of 9 hiccup files due to four JVM-shaped constructs: `extend-protocol` with `Object` fallback, `.method` invocation, `(Class. args)` constructor calls, and class-symbol resolution. This plan unblocks all four via a hand-curated registry (no reflection).\n\n## Explicit non-goals\n\n- Running on the JVM or embedding Java\n- Supporting reflection (`Class/forName`, `.getClass`)\n- Full clojure.core parity (only corpus-required subsets)\n- ClojureScript (`.cljs` namespaces; `.cljc` reader conditionals are in scope)\n\n## Derived pages\n\n[jvm-compat](ideas/jvm-compat/) \u00b7 [clojure-compat](references/clojure-compat/)\n\n# Citations\n\n- **Resource**: /Users/ndn/development/let-go/docs/jvm-compat-plan.md ([GitHub](https://github.com/nooga/let-go/blob/main/docs/jvm-compat-plan.md))\n- **Status in source**: active, last verified 2026-06-05\n", "sources/plan-master": "\n## What this source is\n\nThe authoritative master plan for let-go development, last verified on 2026-06-05. It consolidates existing plans for VM performance, Clojure-like collections, numeric representation, and runtime images into a single staged roadmap with success metrics, acceptance criteria, and dependency management.\n\n## Key contribution\n\nDefines **9 cumulative phases** (Phases 0\u20139) to achieve the goal: \"fastest and most useful Clojure-on-Go.\"\n\n- **Vision metrics**: startup < 50 ms (cold), < 5 ms (warm); 2\u20133\u00d7 throughput improvement on functional pipelines; O(1) allocations for transducers; Clojure-aligned semantics and deployability.\n- **Guiding principles**: correctness first, tight hot paths, incremental rollout, benchmark-driven.\n- **Phases**: Phase 0 (baseline semantics, numeric fast paths), Phase 1 (VM calling convention), Phase 2 (PersistentVector + transients), Phase 3 (HashMap/Set + equality), Phase 4 (transducers), Phase 5 (runtime images), Phase 6 (tooling), Phase 7 (Go AOT backend), Phase 8 (advanced polish), Phase 9 (register VM).\n- **CI discipline**: micro and end-to-end benchmarks with >10% regression alerts; pprof sampling; deterministic image serialization.\n- **Cross-cuttings**: comprehensive testing strategy (conformance, property tests, fuzzing), file index mapping phases to code locations, immediate workboard for next actions.\n\nThis plan is **authoritative for** Phase skeleton, success metrics, and cross-cutting benchmarks/CI. It is **superseded on direction** by `contribution-policy.md`, which commits Phase 7 Go AOT as the deployment path (not optional).\n\n## Derived pages\n\n- [master-plan-roadmap](ideas/master-plan-roadmap/) \u2014 detailed expansion of phases and milestones\n\n## Citations\n\n**Resource**: https://github.com/nooga/let-go/blob/main/docs/master-plan.md\n", "sources/pr-catalog-dispatch": "\n# Catalog-driven dispatch (PRs #612, #666, #667, #712)\n\nFour PRs by Norman Nunley under the consolidation epic #268, merged 2026-07-22 to 2026-08-12.\n\n## Key takeaways\n\n- **#612:** `local-carrying?` as a catalog column, reified infer facets with `:try` lowering re-homed, and a generated `opByKeywordExact` string switch: canonical `OpByKeyword` from 57 ns to 2.1 ns and allocation-free.\n- **#667:** the 14 special-form heads catalogued in `form_heads.lg`; `build-list` dispatches by catalog lookup; `free-vars` and `captures-of` derive membership from it; bidirectional load-time coherence check that names the missing form. Corpus at 99.55%, parity 6311 assertions identical.\n- **#666:** `function-needs-rt?` consolidated into a per-op contribution rule (`op-contributes-rt?`) with gates that go red if either conditional is flattened.\n- **#712:** thirteen sites that read `(:insts @f)` / `(:blocks @f)` moved onto accessors (`all-insts`, `raw-blocks`, `all-types` added); no `@f` outside the data layer; the intern-block trap documented; `ir.passes.legalize` given its missing `(:require [ir.data])`.\n\n## Derived pages\n\n[op-catalog](concepts/op-catalog/) \u00b7 [ir-representation-roadmap](ideas/ir-representation-roadmap/)\n\n# Citations\n\n- [PR #612 \u2014 catalog-driven op dispatch](https://github.com/nooga/let-go/pull/612)\n- [PR #666 \u2014 per-op runtime contribution rules](https://github.com/nooga/let-go/pull/666)\n- [PR #667 \u2014 catalog-driven form-head dispatch](https://github.com/nooga/let-go/pull/667)\n- [PR #712 \u2014 IR function accessors](https://github.com/nooga/let-go/pull/712)\n", "sources/pr-ir-lowering-seams": "\n# IR lowering seams and census (PRs #579, #580, #647, #648, #649)\n\nFive PRs by Norman Nunley, merged 2026-07-22 to 2026-08-18.\n\n## Key takeaways\n\n- **#579:** ordinary `:load-var` re-emitted per use (only `set!` targets materialise once); ir-stress failures 20 to 11, the `:validate/cross-block-ref` bucket retired; `fib` 24 to 23 instructions; a stack-discipline test pins the emitted shape. Names the missing structural level as the residual cause.\n- **#580:** `*ir-compile-strict*` (throw instead of silent fallback); a `:lower` census mode with its own baseline; first measurement of the bytecode path at 70.7% versus 99.5% for Go; the 535 not-on-stack failures traced to discarding instruction indices for stack depths; comparison with fmpl's direct execution of indexed IR.\n- **#647:** `(def x (name* ... (fn ...)))` routed through the IR path, proven by a strict-mode throw.\n- **#648:** every fall-through predecessor must agree on junk-below (mismatch aborts and falls back); RPO block order; 223 newly lowering forms, 79 more in the block-arg bucket.\n- **#649:** a single-use `:call` in return position emits `TAIL_CALL`; ratchet within noise.\n\n## Derived pages\n\n[bytecode-lowering](concepts/bytecode-lowering/) \u00b7 [compile-paths](concepts/compile-paths/) \u00b7 [block-interface-and-liveness](concepts/block-interface-and-liveness/) \u00b7 [perf-ratchet](concepts/perf-ratchet/)\n\n# Citations\n\n- [PR #579 \u2014 var-load re-emission and lowering-shape ratchet](https://github.com/nooga/let-go/pull/579)\n- [PR #580 \u2014 strict IR compilation and bytecode-path census](https://github.com/nooga/let-go/pull/580)\n- [PR #647 \u2014 the `def` + `name*` IR seam](https://github.com/nooga/let-go/pull/647)\n- [PR #648 \u2014 block-junk agreement and RPO order](https://github.com/nooga/let-go/pull/648)\n- [PR #649 \u2014 tail-call fusion](https://github.com/nooga/let-go/pull/649)\n", "sources/pr-lgb-format-evolution": "\n# .lgb format evolution (PRs #443, #608, #622, #501, #502, #745, #624)\n\nSeven PRs by Matt Parrett (mparrett), merged 2026-07-11 to 2026-09-04.\n\n## Key takeaways\n\n- **#443:** `CapOpcodeSet`: the bundle carries the producer's opcode count and an FNV-64a signature; a mismatch fails at decode with a message naming the cause instead of `unknown instruction op=37` deep in execution.\n- **#608 and #622:** actionable capability-reject messages, a capability registry with `since` versions, and `lg -v` printing format, capabilities, and the opcode signature.\n- **#501 and #502:** `-z` writes a version-3 bundle whose body is one raw DEFLATE stream behind a plaintext header; declared size capped at 256 MiB; the embedded core can be compressed at `lgbgen` time, off by default.\n- **#745:** function constants bind to chunks by the builder's live pointer index, not by scanning for identical bytecode, so identical functions keep their own source maps.\n- **#624:** `-strip` moves source maps and local-variable tables into a SHA-256-bound `.debug` companion loaded from beside the artifact or `LG_DEBUG_FILE`; fib sample 1,565 to 1,421 bytes plus a 201-byte companion.\n\n## Derived pages\n\n[lgb-bytecode-format](concepts/lgb-bytecode-format/) \u00b7 [debug-info](concepts/debug-info/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/pull/624\n", "sources/pr-native-entry-gate": "\n# Native-entry lowering gate and frame fix (PR #729)\n\nMerged 2026-08-13. Before it, an `--entry-frame` binary could silently drop every namespace-level definition and nothing in the test suite would notice.\n\n## Key takeaways\n\n- **The defect:** for a single-file program `lg -c` emits a bundle with an empty NS table, so `LoadProgramNamespaces` iterated nothing; the binary was correct only when every reachable callee lowered to a direct call, and otherwise panicked on a nil var.\n- **The fix:** `entry_frame.lg` emits `rt.RunProgramMainChunk(unit)` after `LoadProgramNamespaces`, idempotent so a bundle with NS entries still runs top-level forms once.\n- **The gate:** `make native-entry-gate` discovers `test/native-entry/*.lg`; each fixture needs an exact `.expect` and a structural `.goexpect.json`, and a missing sidecar fails rather than skips; it proves the fixture's `defn` exists as a Go function of the expected shape exactly once.\n- **Follow-up:** #783 reports a related nil var for lambda-lifted `__lifted0` names in entry-frame binaries.\n\n## Derived pages\n\n[go-backend](concepts/go-backend/) \u00b7 [compile-paths](concepts/compile-paths/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/pull/729\n", "sources/pr-native-hoist-stack": "\n# The //lg:native hoist stack (PRs #627, #639, #640, #641)\n\nA stack by Norman Nunley, merged between 2026-07-27 and 2026-08-16. #627 (alias resolution in `LookupOrRegisterNSNoLoad`) was closed in favour of the same fix landing inside #639.\n\n## Key takeaways\n\n- **#639, hoist 222 primitives:** a codemod (`cmd/hoist-natives`) lifted 222 of 292 inline closures in `lang.go` into named `//lg:native` functions; the rest were skipped by a five-category safety analysis. Also the runtime-free `lgprimgen` generator, `LG_REGPRIM_DEBUG` and `LG_GUARD_DEBUG` diagnostics, and the `native-prims-intact?` gate. Surface unchanged at 807 publics at the time.\n- **#640, per-package registrar surface:** any Go package can expose primitives by annotation and commit a self-registering registrar; contribute mode (metadata only) versus own mode (`//lg:bind`, also binds vars); `corefns` migrated off its hand-written module; `BindGeneratedPrimitive` exported but not yet wired.\n- **#641, provenance manifest:** a content-hash dependency manifest maps each generated output to its inputs and generator sources, so `make generate` reruns only stale stages; generator closure from `go list -deps -json -tags bootstrap ./cmd/lgbgen`; torn lowered trees detected.\n\n## Derived pages\n\n[native-primitives](concepts/native-primitives/) \u00b7 [generated-artifacts](concepts/generated-artifacts/) \u00b7 [namespaces-and-vars](concepts/namespaces-and-vars/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/pull/639\n", "sources/ref-block-param-irs": "\n# Block-Parameter SSA Family\n\nThree compiler intermediate representations \u2014 **Swift SIL**, **Cranelift**, and **MLIR** \u2014 share a common approach to control flow: they use **block parameters** to express SSA-style value threading across block boundaries, rather than explicit phi nodes.\n\n## Shared Concept\n\nTraditional SSA uses phi functions as merge points at block entries to reconcile values from multiple predecessors. The block-parameter family instead expresses this structurally: a block declares an entry parameter sequence, and each branching predecessor passes arguments to that block. The values are bound as parameters at block entry, accessed within the block as `OpBlockArg` or similar. This approach is SSA-equivalent (single-assignment, producer\u2013consumer tracking) but avoids the explicit renaming overhead and is more naturally aligned with instruction-stream encodings (like indexed-RPN or linear IR).\n\n## Design Contribution\n\nBy decoupling intra-block computation (value numbering on a postfix stack or linear sequence) from inter-block value flow (block parameters), this family achieves:\n\n- **Compact representation**: Values flowing between blocks are bound structurally, not via intermediate rename maps.\n- **Direct analysis**: A block's entry parameters directly reveal its dependencies, and dominance/control-flow analysis works on the block graph without resolving phi functions.\n- **SSA equivalence**: Each value has exactly one definition point and may be consumed anywhere reachable from that definition, maintaining single-assignment semantics.\n\nLet-go's indexed-RPN IR adopts the same pattern: indexed-RPN handles intra-block computation, and block parameters handle inter-block value flow.\n\n## Derived pages\n\n- [Indexed-RPN IR](concepts/indexed-rpn-ir/)\n\n## Citations\n\n[1] **Swift SIL** (Apple)  \nhttps://github.com/apple/swift  \nSwift's compiler intermediate representation that employs block parameters for SSA-form control flow.\n\n[2] **Cranelift** (Bytecode Alliance)  \nhttps://docs.wasmtime.dev/  \nA code generator for WebAssembly (embedded in Wasmtime) that uses block parameters as the foundation of its IR's SSA representation.\n\n[3] **MLIR** (LLVM)  \nhttps://mlir.llvm.org/docs/LangRef/  \nThe Multi-Level Intermediate Representation framework, which uses block arguments (block parameters) as a central structural element across its dialects for SSA-form control flow.\n", "sources/ref-carbon-sem-ir": "\n# Carbon Language Semantic IR\n\nCarbon's Semantic IR (SEM_IR) is a compiler intermediate representation that uses **block parameters** to handle SSA-style value flow across block boundaries. Instead of explicit \u03c6-functions, values produced in one block and consumed in another are threaded as formal parameters on entry blocks and bound by branch arguments from predecessors.\n\n## Relevance to let-go\n\nThe block-parameter control-flow design in let-go's [indexed-rpn-ir](concepts/indexed-rpn-ir/) draws on this approach: intra-block computation is encoded as indexed-RPN (postfix notation with positional value numbering), while inter-block value flow uses block parameters\u2014cleanly separating value threading from the linear sequence of operations within each block. Carbon's SEM_IR serves as a reference implementation of this pattern.\n\n## Derived pages\n\n- [indexed-rpn-ir](concepts/indexed-rpn-ir/)\n\n## Citations\n\n[1] **Carbon Language Project**  \nhttps://github.com/carbon-language/carbon-lang  \nThe Carbon programming language and its toolchain.\n", "sources/ref-indexed-rpn-emir": "\n# Indexed Reverse Polish Notation\n\nBurak Emir's work on **indexed reverse Polish notation (indexed-RPN)** introduces a compact intermediate representation where values are identified by their position on an evaluation stack, rather than by explicit names or SSA renaming. In indexed-RPN, a sequence of postfix operations pop operands and push results; each value's identity is the index of the instruction that produced it. This encoding is SSA-equivalent (each value flows exactly once from producer to consumer) while avoiding the naming overhead of traditional SSA form.\n\nThe key insight is that in a linear walk through a program's operations, positional indexing provides implicit producer-consumer links: a consumer simply references the stack position of its operand. This makes indexed-RPN particularly attractive for compact IR design, program analysis, and bytecode generation.\n\n## Relevance to let-go\n\nlet-go's [indexed-rpn-ir](concepts/indexed-rpn-ir/) adopts this design as its core IR representation. Each operation in let-go's IR catalogue (defined in `pkg/ir/ir_ops.lg`) encodes stack arity (operands popped, results pushed) and purity metadata. Values produced by operations are referenced by their instruction index, enabling SSA-like analysis without explicit renaming. Block-parameter control flow extends this scheme across block boundaries, mirroring \u03c6 functions while maintaining the structural clarity of indexed-RPN encoding.\n\n## Derived pages\n\n- [indexed-rpn-ir](concepts/indexed-rpn-ir/) \u2014 let-go's instantiation of indexed-RPN IR with block-parameter control flow\n\n## Citations\n\n[1] **Burak Emir, \"Indexed Reverse Polish Notation, an Alternative to AST\"** [2025-12-12]  \nhttps://burakemir.ch/post/indexed-rpn/\n", "sources/testing-and-conformance": "\n## What is this source\n\nThe **Testing and Conformance** documents define let-go's testing strategy across three layers:\n\n1. **Test Framework**: A `clojure.test`-compatible API (deftest, testing, is, are, use-fixtures) with a `lg test` CLI supporting namespace globs, --watch mode, JUnit/TAP output, and test selectors (focus/skip).\n\n2. **Conformance Suite**: A curated subset of `clojure.core` behavior ported to let-go-compatible tests, with imports from Babashka/Joker test suites where semantics overlap. The suite covers reader/printer (EDN roundtrips), collections (vectors, maps, sets), seq tower, transients/transducers, numeric edge cases, and round-trip tests with runtime images and Go AOT embedding.\n\n3. **Clojure Test Suite Integration**: The [jank-lang/clojure-test-suite](https://github.com/jank-lang/clojure-test-suite) as a git submodule tests ~230 clojure.core functions with ~5000 assertions. The test runner (`test/zz_compat_test.go`) iterates `.cljc` files, compiles through let-go, and reports results. Key safety features: 5s timeouts, 512MB memory guards, panic recovery, and a `knownFailing` list that auto-checks for graduated tests.\n\n## Key takeaways\n\n- **Familiar testing UX**: Users write tests in `clojure.test` style; the framework uses Go encoders (JUnit, TAP) for CI performance rather than re-implementing in let-go.\n\n- **Conformance by scope**: Rather than emulate all of Clojure, the strategy publishes a spec of supported subset and deviations, imports battle-tested test cases, and uses property testing and fuzzing to catch edge cases.\n\n- **High-value fix prioritization**: Reader fixes unlock the most test files (number literals, reader conditionals, symbolic values); then namespace/resolver fixes; then missing builtins (ranked by assertions unlocked); then behavioral fixes. The workflow doc provides diagnostic queries to rank blockers.\n\n- **Safety and determinism**: Property tests use seeding; benchmarks enforce >10% regression thresholds; CI matrix spans macOS/Linux/Windows and Go versions; fuzz smoke tests run on PRs.\n\n- **Gotchas documented**: BigDecimal M suffix parsed as Float, PersistentSet incorrectly implements Seq, nth bounds return nil (can't throw), drop/drop-while nil returns nil not (), reader conditionals need balanced-delimiter counting for dialect-specific syntax.\n\n## Derived pages\n\n- [testing-conformance](references/testing-conformance/)\n\n# Citations\n\n- **Testing framework & conformance strategy**: [docs/testing-and-conformance.md](https://github.com/nooga/let-go/blob/main/docs/testing-and-conformance.md)\n- **Clojure test suite workflow & pitfalls**: [docs/clojure-test-suite.md](https://github.com/nooga/let-go/blob/main/docs/clojure-test-suite.md)\n"}, "types": ["Concept", "Entity", "Function", "Idea", "Macro", "Project", "Reference", "Source"], "kinds": ["Entity", "Concept", "Reference", "Project", "Idea", "Source"], "palette": {"Entity": "#b45309", "Concept": "#2e7d80", "Reference": "#5f7a1f", "Function": "#5f7a1f", "Macro": "#5f7a1f", "Namespace": "#5f7a1f", "Package": "#3f4fae", "Project": "#3f4fae", "Idea": "#8a3d8f", "Source": "#a39477"}, "kindPalette": {"Entity": {"light": "#b45309", "dark": "#f5b041"}, "Concept": {"light": "#2e7d80", "dark": "#6cc0c3"}, "Reference": {"light": "#5f7a1f", "dark": "#a9c65c"}, "Project": {"light": "#3f4fae", "dark": "#93a0ea"}, "Idea": {"light": "#8a3d8f", "dark": "#d494d8"}, "Source": {"light": "#a39477", "dark": "#6b5f47"}}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — knowledge graph`;
  document.getElementById("graph-stats").textContent =
    `${bundle.nodes.length} pages, ${bundle.edges.length} links`;

  const isDark = window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches;
  const kindColor = (kind) => {
    const pal = (bundle.kindPalette || {})[kind];
    return pal ? (isDark ? pal.dark : pal.light) : (isDark ? "#6cc0c3" : "#2e7d80");
  };
  // Pick chip text from the fill's own luminance rather than the page theme:
  // the dark palette is not uniformly light (Source is #6b5f47), so a single
  // dark-theme foreground fell below 4.5:1 on it.
  const chipForeground = (hex) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return "#fff";
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16) / 255);
    const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return lum > 0.25 ? "#1a1610" : "#fff";
  };

  // Read the active theme (light/dark) from CSS variables so canvas-drawn
  // node labels match the page and stay legible against the background.
  const _css = getComputedStyle(document.documentElement);
  const _v = (name, fallback) => (_css.getPropertyValue(name).trim() || fallback);
  const THEME = {
    fg: _v("--fg", "#1d180f"),
    bg: _v("--bg", "#f4ecdb"),
    accent: _v("--accent", "#b45309"),
    rule: _v("--rule", "#d6c8a8"),
    muted: _v("--muted", "#877a5e"),
  };

  // Kind filter: the top-bar select and the legend drive the same state.
  const kinds = bundle.kinds || [];
  const kindCounts = {};
  for (const n of bundle.nodes) kindCounts[n.data.kind] = (kindCounts[n.data.kind] || 0) + 1;
  const typeSelect = document.getElementById("filter-type");
  for (const k of kinds) {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = `${k} (${kindCounts[k] || 0})`;
    typeSelect.appendChild(opt);
  }

  // Forward/backward link indexes for the detail panel.
  const backlinks = {};
  const outlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
    (outlinks[source] ||= []).push(target);
  }
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  // Mermaid for ```mermaid blocks rendered in the detail panel.
  // Theme-matched; securityLevel 'loose' so <br/> in node labels works.
  if (window.mermaid) {
    window.mermaid.initialize({
      startOnLoad: false, securityLevel: "loose",
      theme: isDark ? "dark" : "neutral",
    });
  }

  // Convert marked's ```mermaid code blocks into rendered diagrams.
  function renderMermaid(container) {
    if (!window.mermaid) return;
    const divs = [];
    container.querySelectorAll("code.language-mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent; // raw (unescaped) diagram source
      (code.closest("pre") || code).replaceWith(div);
      divs.push(div);
    });
    if (divs.length) {
      try { window.mermaid.run({ nodes: divs }); } catch (_e) { /* bad diagram */ }
    }
  }

  // Register the fcose force layout (self-registers in most builds; the guarded
  // use() covers builds that don't, and swallows a double-registration error).
  if (window.cytoscapeFcose) {
    try { cytoscape.use(window.cytoscapeFcose); } catch (_e) { /* already registered */ }
  }
  const _hasFcose = !!window.cytoscapeFcose;

  // Per-layout options. fcose is the default force layout; nodeSeparation and
  // idealEdgeLength are tuned for ~75 nodes with 10px labels below each node.
  function layoutOpts(name) {
    if (name === "fcose" && _hasFcose) {
      return {
        name: "fcose", animate: false, quality: "proof", randomize: true,
        padding: 48, nodeSeparation: 140, idealEdgeLength: 100,
        nodeRepulsion: 12000, gravity: 0.2, gravityRange: 3.5, numIter: 4000,
        // Pull heavily cited pages to the middle; leaves drift outward.
        nodeDimensionsIncludeLabels: true,
      };
    }
    if (name === "fcose") name = "cose"; // fallback if the extension failed to load
    if (name === "cose") return { name: "cose", animate: false, padding: 40 };
    if (name === "concentric") {
      // Rings by citation count, bucketed so no ring holds a single node
      // (one-node rings all sit at the same angle and read as a column).
      return {
        name, animate: false, padding: 40, minNodeSpacing: 24,
        concentric: (n) => Math.min(n.data("citedBy") || 0, 5), levelWidth: () => 1,
      };
    }
    if (name === "breadthfirst") {
      // Undirected: the hub links out to one page, so a directed walk from it
      // would leave nearly every node as its own root. Depth rings rather than
      // rows, because a star graph puts most nodes on one row.
      const root = bundle.nodes.find((n) => n.data.kind === "Entity");
      return { name, animate: false, padding: 40, directed: false, circle: true,
               roots: root ? `#${CSS.escape(root.data.id)}` : undefined };
    }
    if (name === "grid") {
      return { name, animate: false, padding: 40, avoidOverlapPadding: 24,
               nodeDimensionsIncludeLabels: true };
    }
    return { name, animate: false, padding: 40 };
  }

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": (n) => kindColor(n.data("kind")),
          "shape": (n) => (n.data("kind") === "Source" ? "round-rectangle" : "ellipse"),
          "label": "data(label)",
          // Foreground-colored text with a background-colored halo: readable on
          // any node fill and in both light and dark themes.
          "color": THEME.fg,
          "text-outline-color": THEME.bg,
          "text-outline-width": 2,
          "text-outline-opacity": 0.95,
          "font-family": "JetBrains Mono, ui-monospace, Menlo, monospace",
          "font-size": 10,
          "font-weight": 500,
          "min-zoomed-font-size": 7, // labels drop out when zoomed far out
          "text-valign": "bottom",
          "text-margin-y": 5,
          "text-wrap": "wrap",
          "text-max-width": 110,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": THEME.bg,
          "transition-property": "opacity",
          "transition-duration": 120,
        },
      },
      {
        // Agent drafts not yet checked against the code: dashed outline.
        selector: "node[status = 'speculative']",
        style: {
          "border-width": 1.5,
          "border-style": "dashed",
          "border-color": THEME.muted,
          "background-opacity": 0.55,
        },
      },
      {
        selector: "node[kind = 'Source']",
        style: {
          "font-size": 9,
          "color": THEME.muted,
          "text-max-width": 90,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": THEME.accent,
          "background-opacity": 1,
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1,
          "line-color": THEME.rule,
          "target-arrow-color": THEME.rule,
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.7,
          "transition-property": "opacity",
          "transition-duration": 120,
        },
      },
      {
        selector: "edge.lit",
        style: {
          "line-color": THEME.accent,
          "target-arrow-color": THEME.accent,
          "width": 1.8,
          "z-index": 5,
        },
      },
      { selector: "node.lit", style: { "z-index": 6 } },
      { selector: ".dim", style: { "opacity": 0.12 } },
    ],
    layout: layoutOpts("fcose"),
    wheelSensitivity: 0.2,
  });

  // Legend: one toggle per kind, plus the dashed-outline hint.
  const legend = document.getElementById("legend");
  function buildLegend() {
    legend.innerHTML = "";
    for (const k of kinds) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.kind = k;
      b.setAttribute("aria-pressed", "false");
      const sw = document.createElement("span");
      sw.className = "swatch" + (k === "Source" ? " square" : "");
      sw.style.background = kindColor(k);
      const name = document.createElement("span");
      name.textContent = k;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = kindCounts[k] || 0;
      b.append(sw, name, count);
      b.addEventListener("click", () => setKindFilter(filterKind === k ? "" : k));
      legend.appendChild(b);
    }
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.innerHTML = "<i></i>dashed: not yet checked against the code";
    legend.appendChild(hint);
  }
  buildLegend();

  // --- Filtering ----------------------------------------------------------
  // Two independent dimming sources (kind filter, search) plus the focus
  // neighbourhood of the selected node; recompute .dim from all three.
  let filterKind = "";
  let query = "";
  let focusId = null;

  function applyDim() {
    const q = query;
    cy.batch(() => {
      cy.nodes().forEach((n) => {
        const d = n.data();
        let hidden = false;
        if (filterKind && d.kind !== filterKind) hidden = true;
        if (q) {
          const hay = `${d.label || ""} ${d.id} ${(d.tags || []).join(" ")}`.toLowerCase();
          if (!hay.includes(q)) hidden = true;
        }
        if (focusId && !hidden) {
          const f = cy.getElementById(focusId);
          hidden = !(n.id() === focusId || f.neighborhood().nodes().anySame(n));
        }
        n.toggleClass("dim", hidden);
      });
      cy.edges().forEach((e) => {
        e.toggleClass("dim", e.source().hasClass("dim") || e.target().hasClass("dim"));
      });
    });
  }

  function setKindFilter(k) {
    filterKind = k;
    typeSelect.value = k;
    legend.querySelectorAll("button[data-kind]").forEach((b) => {
      const on = b.dataset.kind === k;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    applyDim();
  }

  typeSelect.addEventListener("change", (e) => setKindFilter(e.target.value));
  document.getElementById("search").addEventListener("input", (e) => {
    query = e.target.value.trim().toLowerCase();
    // A search replaces the focus neighbourhood; combining the two hides
    // matches the reader is looking for.
    focusId = null;
    cy.elements().removeClass("lit");
    applyDim();
  });
  // Pages outside the main component (mostly stdlib reference stubs that only
  // link to each other) have nothing to hold them near the graph, so force
  // layouts fling them to the edges and the fitted view shrinks. Park each
  // minor component in a grid of cells beside the main one.
  function packOrphans() {
    const comps = cy.elements().components()
      .map((c) => c.nodes()).filter((c) => c.length)
      .sort((a, b) => b.length - a.length);
    if (comps.length < 2) return;
    const main = comps[0];
    const minors = comps.slice(1);
    const bb = main.boundingBox({ includeLabels: true });
    const cell = 130;
    const cols = Math.max(1, Math.ceil(Math.sqrt(minors.length)));
    const rows = Math.ceil(minors.length / cols);
    const x0 = bb.x2 + 120;
    const y0 = bb.y1 + (bb.h - rows * cell) / 2 + cell / 2;
    minors.forEach((nodes, i) => {
      const cx = x0 + (i % cols) * cell;
      const cy_ = y0 + Math.floor(i / cols) * cell;
      const cb = nodes.boundingBox({ includeLabels: false });
      const scale = Math.min(1, (cell - 50) / Math.max(cb.w, cb.h, 1));
      nodes.forEach((n) => {
        const p = n.position();
        n.position({
          x: cx + (p.x - (cb.x1 + cb.w / 2)) * scale,
          y: cy_ + (p.y - (cb.y1 + cb.h / 2)) * scale,
        });
      });
    });
  }
  function runLayout(name) {
    const l = cy.layout(layoutOpts(name));
    l.one("layoutstop", () => { packOrphans(); cy.fit(null, 40); });
    l.run();
  }
  document.getElementById("layout").addEventListener("change", (e) => runLayout(e.target.value));
  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 40);
  });

  window.cyViz = cy; // handy for debugging and browser automation
  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") clearSelection();
  });

  function clearSelection() {
    cy.elements().unselect();
    cy.elements().removeClass("lit");
    focusId = null;
    applyDim();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function linkList(listEl, sectionEl, ids) {
    listEl.innerHTML = "";
    if (!ids.length) { sectionEl.hidden = true; return; }
    sectionEl.hidden = false;
    for (const id of ids) {
      const d = nodeIndex[id];
      const li = document.createElement("li");
      const dot = document.createElement("span");
      dot.className = "kind-dot";
      dot.style.background = kindColor(d ? d.kind : "");
      const a = document.createElement("a");
      a.textContent = d ? d.label : id;
      a.href = "javascript:void(0)";
      a.addEventListener("click", (e) => { e.preventDefault(); showDetail(id); });
      li.append(dot, a);
      listEl.appendChild(li);
    }
  }

  function showDetail(conceptId, { pan = true, focus = true } = {}) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    cy.elements().removeClass("lit");
    const node = cy.getElementById(conceptId);
    node.select();
    if (focus) {
      node.addClass("lit");
      node.connectedEdges().addClass("lit");
      focusId = conceptId;
    }
    applyDim();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = kindColor(data.kind);
    chip.style.color = chipForeground(kindColor(data.kind));

    const status = document.getElementById("detail-status");
    status.textContent = data.status || "";
    status.className = "status-chip " + (data.status || "");

    document.getElementById("detail-title").textContent = data.label;

    const titleContainer = document.querySelector(".detail-header");
    const existingLink = titleContainer.querySelector(".open-page");
    if (existingLink) existingLink.remove();
    if (data.url) {
      const openPageLink = document.createElement("a");
      openPageLink.className = "open-page";
      openPageLink.href = data.url;
      openPageLink.target = "_top";
      openPageLink.textContent = "Open page ↗";
      titleContainer.appendChild(openPageLink);
    }

    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource.replace(/^https?:\/\/(www\.)?/, "");
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);
    renderMermaid(bodyEl);

    linkList(document.getElementById("links-list"),
             document.getElementById("detail-links"), outlinks[conceptId] || []);
    linkList(document.getElementById("backlinks-list"),
             document.getElementById("detail-backlinks"), backlinks[conceptId] || []);

    document.getElementById("detail").scrollTop = 0;
    if (!pan) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) },
               { duration: reduce ? 0 : 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      // Body links were rewritten to MkDocs URLs ("concepts/stack-vm/") by the
      // generator; when one names a node, open it in the panel instead.
      if (!href.includes("://") && !href.startsWith("#")) {
        const target = href.replace(/\/$/, "").replace(/#.*$/, "").replace(/\.md$/, "");
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      if (!href.startsWith("#")) {
        a.className = "external";
        if (!href.includes("://")) {
          a.setAttribute("target", "_top");
        } else {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener");
        }
      }
    });
  }

  // Open on the hub entity (the wiki's subject) when there is one.
  // First impression is the whole graph, undimmed, with the hub's page open;
  // focus dimming starts with the reader's first click.
  const initial =
    bundle.nodes.find((n) => n.data.kind === "Entity") || bundle.nodes[0];
  if (initial) showDetail(initial.data.id, { pan: false, focus: false });
  packOrphans();
  cy.fit(null, 40);
})();

</script>
</body>
</html>
