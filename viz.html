 (optional, high-impact)\n\nPhase 7 adds a **second backend** that compiles let-go code to Go (see [Self-hosting AOT](ideas/self-hosting-aot/)). It starts with an embedding tier (bytecode/consts as Go data in `Var`s), progresses to native lowering of hot functions, and preserves dynamic `eval` via shared `Var`s. This enables mixed compiled+interpreted execution and eliminates interpreter overhead.\n\n*Note: While this plan marks Phase 7 as optional, [contribution-policy.md](https://github.com/nooga/let-go/blob/main/docs/contribution-policy.md) (authoritative on direction) clarifies that the Go AOT backend (`gogen_ir` tags and native lowering) is the committed deployment path for the self-hosted compiler.*\n\n### Phases 8\u20139: Polish and experimental optimization\n\n**Phase 8** finishes `ChunkedSeq` across collections, optimizes iteration utilities with `Reducible`, and investigates specialized opcodes for common sequence ops. **Phase 9** (experimental) explores a register-based bytecode alongside the stack VM for further performance gains.\n\n## Cross-cutting: benchmarks and CI\n\nEvery phase ships microbenchmarks (call overhead, TCO, vector/map ops, numeric arithmetic, transducer pipelines) and end-to-end scenarios (image load, HTTP JSON via natives, REPL cold/warm start). CI gates enforce <10% regressions on hot paths. Risks are managed through exhaustive tests for opcode variants, property tests for data structures, and versioned image schemas with migration paths.\n\n## Immediate workboard\n\n**Phase 0** focuses on core interfaces and `MapEntry` semantics, numeric fast paths via direct `vm.Int` assertions, and initial benchmarks. **Phase 1** implements arg copies, closure TCO, frame/stack pools, and small-arity opcodes. **Phases 2\u20134** are sequential: persistent vectors + transients, then maps/sets, then transducers. **Phase 5** builds the image schema and stdlib pre-compilation. **Phase 7** (once phases 0\u20134 stabilize) adds the Go AOT backend, starting with embedding tier and progressing to native lowering and self-hosting.\n\n# Citations\n\n[1] **docs/master-plan.md**: Master plan with full phase descriptions, dependencies, and immediate workboard (status: active)  \nhttps://github.com/nooga/let-go/blob/main/docs/master-plan.md\n\n[1a] **docs/contribution-policy.md**: Design contracts, regression checkpoints, and deployment direction (supersedes master-plan.md on direction; clarifies Phase 7 as committed deployment path)  \nhttps://github.com/nooga/let-go/blob/main/docs/contribution-policy.md\n\n[2] **Self-hosting AOT** (this wiki)  \n[./self-hosting-aot.md](ideas/self-hosting-aot/)\n\n[3] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n[4] **Value representation and numeric performance** (this wiki)  \n[../concepts/value-representation.md](concepts/value-representation/)\n\n[5] **Runtime image** (this wiki)  \n[../concepts/runtime-image.md](concepts/runtime-image/)\n\n---\n\nSee also: [clojure-like-refactor](ideas/clojurelike-refactor/), [jvm-compat](ideas/jvm-compat/)\n", "ideas/nrepl-in-browser": "\n# nREPL in the Browser\n\n## What It Is\n\nExpose an nREPL server from the [let-go VM](concepts/stack-vm/) running in WASM inside the browser, connected to editors via WebSocket. This allows a developer to run `lg -n` (or equivalent) on a live in-browser runtime, then connect CIDER, Calva, or Conjure over WebSocket to evaluate Clojure forms directly against that browser-hosted VM.\n\n## Why It Matters\n\nToday, let-go's nREPL server only runs locally (native process), forcing developers to choose: either native development with REPL tooling, or browser-based work without live connection. Making nREPL available over WebSocket in the browser enables:\n\n- **Live coding in the browser**: Developers can connect their editor to a running web app and iterate without page reloads.\n- **Debugging web scripts**: Inspect and modify let-go code running inside a game, canvas app, or simulator in real time.\n- **Unified workflow**: Same editor setup (Emacs, VS Code, Neovim) works whether the runtime is native or in-browser.\n- **Bridge to web workflows**: Brings REPL-driven development to pure web environments (GitHub Codespaces, Gitpod, cloud IDEs).\n\n## Building Blocks in Place\n\n- **[WASM Compilation](concepts/wasm-compilation/)**: let-go already compiles to WASM and boots the VM in the browser (~10ms). The runtime is fully functional.\n- **[nREPL Server](concepts/nrepl-server/)** (native): let-go ships an nREPL server (`lg -n`, `lgx nrepl`) that works with standard editors. The protocol layer and operations (eval, describe, completions) are proven.\n- **Browser Inspector / nREPL Bridge**: A request/response bridge from the browser JS layer to the in-WASM runtime (JSON frames, sequential form evaluation) is being designed internally; it extends the public [nREPL server](concepts/nrepl-server/) seam and can grow to stream nREPL operations.\n- **[LetGoHost Glue](https://github.com/nooga/let-go/blob/main/wasm/main.go)**: Browser-to-WASM JavaScript interop is already wired. A WebSocket layer and nREPL adapter are the main additions.\n\n## Open Questions\n\n- **WebSocket transport**: How does the browser JavaScript open a WebSocket to itself? (Answer: typically a Node.js dev server or a shared worker; or reverse: the WASM runtime pushes frames to a listener registered in JS.)\n- **Multi-tab / multi-session isolation**: Do separate browser tabs get isolated nREPL sessions, or do they share state? (Likely per-tab for simplicity in the first cut.)\n- **Backward compatibility**: Keep `LetGoHost.eval()` (the current browser eval hook) working unchanged while adding streamed nREPL ops on top.\n- **Editor discovery**: How do editors discover an in-browser nREPL? (Likely manual connection or a bookmarklet / local proxy.)\n\n## Roadmap Motivation\n\nFrom the README Goals: `[ ] nREPL in the browser (let-go VM in WASM, editor over WebSocket)`. This is a high-leverage feature for bringing Clojure REPL workflows to pure web development and single-page applications.\n\n---\n\n# Citations\n\n[1] **README Goals** \u2014 the unchecked roadmap item  \nhttps://github.com/nooga/let-go#goals\n\n[2] **docs/guide/nrepl.md** \u2014 native nREPL server  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/nrepl.md\n\n[3] **pkg/nrepl/server.go** \u2014 the native nREPL server the browser bridge extends  \nhttps://github.com/nooga/let-go/blob/main/pkg/nrepl/server.go\n\n[4] **wasm/main.go** \u2014 LetGoHost browser/WASM glue the bridge builds on  \nhttps://github.com/nooga/let-go/blob/main/wasm/main.go\n\n[5] **WASM Compilation** (this wiki)  \n[wasm-compilation.md](concepts/wasm-compilation/)\n\n[6] **Stack VM** (this wiki)  \n[stack-vm.md](concepts/stack-vm/)\n\n[7] **let-go** (this wiki)  \n[let-go.md](entities/let-go/)\n\n---\n\nSee also: [nREPL Server](concepts/nrepl-server/), [let-go](entities/let-go/), [WASM Compilation](concepts/wasm-compilation/), [Stack VM](concepts/stack-vm/)\n", "ideas/self-hosting-aot": "\n# Self-hosting AOT\n\n**Self-hosting ahead-of-time (AOT) compilation** \u2014 let-go compiling itself to native Go \u2014 is a strategic goal: eliminating the interpreter's overhead and reducing the runtime to pure Go code. The path is clear: a Go AOT backend compiles bytecode to Go functions; combining that with the [Indexed-RPN IR](concepts/indexed-rpn-ir/) and [IR pipeline](concepts/ir-pipeline/) enables bootstrapping a self-hosted runtime.\n\n## Vision\n\n1. **Current state**: let-go is an interpreter (`pkg/vm`) that reads bytecode and executes it. Adding a Go backend means compiling bytecode to Go functions instead of executing them.\n\n2. **Bootstrap**: once the Go backend is mature, compile let-go's own runtime (currently written in Go and Clojure in `pkg/rt/core`) to a Go-based version. This eliminates the last dependency on the interpreter loop for core functionality.\n\n3. **Result**: a pure Go runtime with zero interpreter overhead, while maintaining full Clojure semantics and dynamic `eval` capability.\n\n## Architecture: two-tier approach\n\n### Tier 1: Embedding (quick win)\n- Compile bytecode to Go *data* (const pools, instruction arrays).\n- Register compiled functions as `NativeFn` instances in their `Var`s at `init()`.\n- Still uses the interpreter loop for execution.\n- **Benefit**: removes image I/O; Go linker can optimize; equivalent to a built-in runtime image.\n- **Timeline**: achievable in Phase 7 of the master plan.\n\n### Tier 2: Native lowering (performance)\n- Compile let-go functions to actual Go functions that implement the same logic without bytecode.\n- Each compiled function has signature `func(env *vm.Env, args []vm.Value) (vm.Value, error)` or smaller fixed-arity wrappers.\n- Implement logic via translating bytecode operations to Go control flow and direct runtime calls.\n- **Benefit**: massive performance uplift; call overhead eliminated; TCO via loops.\n- **Timeline**: follows Tier 1; incremental rollout on hot functions.\n\n## Self-hosting strategy\n\nOnce Tier 2 is working for user code, apply it to let-go's own runtime:\n\n1. **Identify hot runtime paths** (e.g., `core/map`, `core/filter`, `core/reduce`, numeric ops).\n2. **Compile to Go** using the same backend.\n3. **Register compiled functions** as `NativeFn` instances, replacing the old bytecode/interpreter invocations.\n4. **Preserve dynamic `eval`** by keeping `Var` indirection: compiled code calls through `Var` pointers, so redefined functions are observed.\n\n**Result**: a runtime that is entirely Go-generated, with no hard-coded Go functions. The bootstrap is complete: let-go's runtime compiled from let-go source.\n\n## Key properties\n\n### Semantics preserved\n- Compiled functions use the same `Value` and `Fn` interfaces as the interpreter.\n- Interpreted and compiled code interoperate through shared `Var`s.\n- Dynamic `eval` continues to compile to bytecode and install into the same `Var`s.\n- Var redefinition is observed by compiled code (unless annotated `^:const` or `^:inline` for AOT-only optimization).\n\n### Mixed execution\n- Startup: load and execute a stdlib image (or embedding tier) instantly.\n- Long-running: hot functions (identified by sampling or heuristics) are compiled to Go on demand or at build time.\n- Interop: compiled code calls interpreted functions (e.g., user-defined fns) via `Var`; interpreted code calls compiled builtins normally.\n\n### Build workflow\n```bash\n# Build let-go with self-hosted AOT runtime\n$ lg build --runtime aot --output lg-aot\n\n# Or: compile an app to Go, then build with go build\n$ lg build --target go --output myapp/main.go\n$ cd myapp && go build -o myapp\n```\n\n## Implementation phases (Phase 7 onward)\n\n### Phase 7a: Embedding tier + prototype native lowering\n- Compile bytecode to Go data + register in `Var`s.\n- Prototype: compile a few small functions (`+`, `inc`, `conj`) to Go by hand.\n- Verify: interop with interpreted code; performance gains.\n- **Acceptance**: mixed execution works; measurable speedup on call-heavy microbenchmarks.\n\n### Phase 7b: Native lowering at scale\n- Codegen for all non-variadic functions (arity 0\u20133, no closures initially).\n- Self-tail recursion elimination (to loops).\n- Calls via `Var` indirection (no devirtualization yet).\n- Error wrapping with source location.\n- **Acceptance**: real programs mixed compiled+interpreted; perf tests pass.\n\n### Phase 7c: Self-hosting bootstrap\n- Compile `core/map`, `core/filter`, `core/reduce`, numeric ops to Go.\n- Replace bytecode invocations with compiled versions.\n- Verify: stdlib tests still pass; startup and throughput improve.\n- **Acceptance**: stdlib image optional (embedding tier sufficient); performance targets hit.\n\n### Phase 8 onwards: Optimization and polish\n- Closures and variadics.\n- Direct-call devirtualization for known-final vars.\n- Inline constant/const-vars.\n- Source maps and improved error stack traces.\n\n## Relationship to runtime images\n\n- **Runtime images** (Phase 5 of master plan) pre-serialize the stdlib to `.img` format for fast boot.\n- **Self-hosting AOT** (Phase 7+) eliminates the interpreter's execution overhead entirely.\n- **Together**, they provide: fast startup (image) + fast execution (AOT). Embedding tier provides the former; native lowering tier provides the latter.\n\n## Benefits\n\n1. **Performance**: eliminate interpreter overhead; achieve native-code speed.\n2. **Redistribution**: smaller binaries (no bytecode interpreter loop); faster cold-starts.\n3. **Transparency**: stack traces and profiling see Go function names directly.\n4. **Maintainability**: runtime logic stays in Clojure source; compiler generates the Go code automatically.\n\n## Risks\n\n- **Semantic divergence**: compiled and interpreted paths must stay in sync. Mitigation: single spec; comprehensive property tests; reuse runtime helpers.\n- **Compilation complexity**: native lowering is a substantial feature. Mitigation: start with Tier 1 (embedding); prove value before going to Tier 2.\n- **Mutual recursion**: self-tail recursion has cheap solution (loops); mutual tail recursion requires trampolines or dynamic indirection. Mitigation: optimize self-recursion first; mutual recursion falls back to `Var` indirection initially.\n\n## Success criteria\n\n- **Mixed execution**: compiled functions call interpreted functions (and vice versa) via shared `Var`s; semantics and errors match.\n- **Performance**: call-heavy microbenchmarks show >25% throughput improvement and >50% alloc reduction vs. optimized interpreter.\n- **Completeness**: stdlib compiles successfully; all tests pass.\n\n# Citations\n\n[1] **docs/design/go-aot-backend.md**: Go AOT backend design  \nhttps://github.com/nooga/let-go/blob/main/docs/design/go-aot-backend.md\n\n[2] **docs/master-plan.md**: Full master plan, including Phase 7 (Go AOT backend)  \nhttps://github.com/nooga/let-go/blob/main/docs/master-plan.md\n\n[3] **Indexed-RPN IR** (this wiki)  \n[../concepts/indexed-rpn-ir.md](concepts/indexed-rpn-ir/)\n\n[4] **IR pipeline** (this wiki)  \n[../concepts/ir-pipeline.md](concepts/ir-pipeline/)\n\n[5] **Bytecode compiler** (this wiki)  \n[../concepts/bytecode-compiler.md](concepts/bytecode-compiler/)\n\n[6] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n---\n\nSee also: [lg-compile](concepts/lg-compile/), [bytecode-compiler](concepts/bytecode-compiler/), [go-interop](concepts/go-interop/)\n", "projects/legmacs": "\n# legmacs\n\nlegmacs is a terminal text editor written entirely in [let-go](entities/let-go/), delivering Emacs-style editing in approximately 4,000 lines of Lisp code. The defining feature is that users configure and extend the editor using the same language that implements it\u2014no separate scripting API or plugin system exists.\n\n# Using let-go\n\nlegmacs demonstrates [let-go](entities/let-go/)'s suitability as both an implementation language and a user-facing scripting layer:\n\n- **Single-language stack** \u2014 implementation and configuration are indistinguishable; users modify behavior via `defcommand` and `bind-key!` functions identical to those the editor itself uses.\n- **In-process evaluation** \u2014 the editor includes a live REPL (`C-x C-e`, `C-j`) enabling real-time experimentation and configuration testing without restarting.\n- **Structural manipulation** \u2014 implements s-expression-aware editing (expand-region, kill-sexp) naturally in a Lisp-based editor where syntax and structure are unified.\n- **Compact footprint** \u2014 4,000 lines of let-go provide kill ring, regions, multi-buffer support, window splitting, syntax highlighting for 20+ languages, and extensible major/minor modes.\n\n# Idioms\n\n- **Homoiconicity as a feature** \u2014 because let-go code and let-go data are the same, configuration becomes a form of live programming; users don't \"configure an application\" but rather \"compose a program.\"\n- **Emacs idioms in let-go** \u2014 kill ring, regions, keymaps, and mode hierarchies (shadowing keymaps) translate directly from Emacs, showing how Lisp design patterns port cleanly across implementations.\n\n# Citations\n\n[1] [legmacs repository](https://github.com/nooga/legmacs)\n", "projects/let-go-lab": "\n# let-go-lab\n\nlet-go-lab is a collection of experimental projects exploring [let-go](entities/let-go/)'s capabilities for graphics, terminal UI, and WebAssembly. The flagship demo is an interactive Mandelbrot set visualization that renders via Sixel graphics in native terminals and via xterm.js in web browsers without any installation requirement.\n\n# Using let-go\n\nlet-go-lab showcases [let-go](entities/let-go/)'s versatility across rendering targets and interaction models:\n\n- **WASM compilation** \u2014 the Mandelbrot renderer compiles to self-contained WebAssembly, enabling real-time interactive graphics in a browser without JavaScript.\n- **Sixel graphics support** \u2014 leverages single-pass encoding to render fractals efficiently in terminal environments that support Sixel, bridging the gap between legacy terminals and modern graphical rendering.\n- **Cross-target deployment** \u2014 identical let-go code runs natively in terminals and compiles to WASM for browsers, eliminating the need for separate ports or JavaScript rewrites.\n- **Interactive I/O** \u2014 implements click/tap-to-recenter, keyboard pan/zoom, and iteration adjustment, demonstrating real-time interactivity in both terminal and browser contexts.\n\n# Idioms\n\n- **Sixel as a rendering substrate** \u2014 treating Sixel as a first-class rendering target rather than an afterthought shows how [let-go](entities/let-go/) can power tools that bridge terminal and graphical interfaces.\n- **WASM as a deployment target** \u2014 compiling graphics-heavy code to WASM keeps the implementation in a high-level language while maintaining performance in browser environments.\n\n# Citations\n\n[1] [let-go-lab repository](https://github.com/mparrett/let-go-lab)\n[2] [Mandelbrot demo (live browser)](https://mparrett.github.io/let-go-lab/)\n", "projects/lgcr": "\n# lgcr\n\nlgcr is a daemonless Linux container runtime written in [let-go](entities/let-go/), providing Docker-like command-line functionality while maintaining a remarkably compact codebase of approximately 3,000 lines. On Linux it bundles into a single executable; on macOS it acts as a native forwarder into a Lima VM, eliminating the need for wrapper scripts.\n\n# Using let-go\n\nlgcr demonstrates [let-go](entities/let-go/)'s capacity to implement systems-level programs with direct syscall access:\n\n- **Direct syscall bindings** \u2014 leverages [let-go](entities/let-go/)'s Go interop layer to bind Linux syscalls for namespace isolation, capability management, and filesystem operations without extra C code.\n- **Compact implementation** \u2014 3,000 lines of let-go code replace thousands of lines in traditional implementations, showing the language's expressiveness for low-level systems work.\n- **Single-executable deployment** \u2014 compiles to a standalone binary on Linux, simplifying distribution and eliminating runtime dependencies.\n- **Cross-platform abstraction** \u2014 the same codebase runs natively on Linux and as a forwarding client on macOS via Lima, demonstrating let-go's platform portability.\n\n# Idioms\n\n- **OCI registry integration** \u2014 lgcr pulls from Docker Hub and v2-compatible registries, implementing image authentication and partial blob resume without external libraries.\n- **Container lifecycle with init process** \u2014 manages PID 1 init process handling and signal forwarding, a critical systems-programming pattern that let-go handles cleanly via Go interop.\n\n# Citations\n\n[1] [lgcr repository](https://github.com/nooga/lgcr)\n", "projects/lgx": "\n# lgx\n\nlgx is the unified project manager and build system for [let-go](entities/let-go/), combining dependency management, task execution, testing, scaffolding, and REPL integration into a single binary. Projects configure their structure in EDN format via `lgx.edn` at the project root; lgx handles everything from fetching git-based dependencies to compiling and bundling standalone executables.\n\n## What lgx is\n\n**Dogfooding note:** lgx is itself written in let-go ([lgx.lg](https://github.com/abogoyavlensky/lgx/blob/master/lgx.lg)), showcasing let-go's readiness for systems tooling.\n\nlgx consolidates roles that would otherwise require separate tools:\n\n- **Build tool** \u2014 compiles [let-go](entities/let-go/) source via `lg -b` and bundles the result into standalone binaries (see [lgx-build-model](concepts/lgx-build-model/)).\n- **Dependency manager** \u2014 fetches git-based dependencies (pinned by tag or SHA), caches them under `$LGX_HOME/gitlibs/`, and resolves transitive deps breadth-first with first-wins conflict resolution.\n- **Test runner** \u2014 walks `test/` for `*_test.lg` / `*_test.cljc` / `*_test.clj` files, generates a one-shot test harness, and runs all `deftest` declarations against the project's resolved source paths.\n- **Task runner** \u2014 executes custom shell and let-go tasks from `lgx.edn`, with typed positional arguments, step chaining, and variable binding.\n- **Scaffolder** \u2014 `lgx new` creates projects from built-in templates (`base`, `cli`) or custom git URLs, using the `projectname` token to substitute project names.\n- **REPL integrator** \u2014 `lgx repl` starts `lg`'s built-in REPL; `lgx nrepl` starts an nREPL server for editor tooling (both auto-apply `:dev` and `:test` contexts).\n\n## Key capabilities\n\n**Configuration:** [lgx.edn](references/lgx-edn/) lives at the project root and defines `:paths`, `:main`, `:deps`, `:targets`, `:contexts`, and `:tasks`. See [references/lgx-edn](references/lgx-edn/) for the full annotated reference.\n\n**Common workflows:**\n- `lgx new myapp` \u2014 scaffold a project from a template.\n- `lgx install` \u2014 fetch all `:deps` into the gitlibs cache (idempotent, useful for editor navigation).\n- `lgx run [args...]` \u2014 resolve `:main`, fetch deps, and run it via `lg` with inherited stdio (for interactive programs).\n- `lgx test [file]` \u2014 run all tests, or a single file if specified.\n- `lgx build [args...]` \u2014 bundle `:main` into a binary at `:targets/:bin/:out`.\n- `lgx repl` / `lgx nrepl [--port N]` \u2014 start a REPL with the project's deps on the source path.\n- `lgx <task> [args...]` \u2014 run a custom task from `lgx.edn` with optional typed arguments.\n\nSee [references/lgx-commands](references/lgx-commands/) for the complete command reference and options.\n\n**Contexts and overlays:** Named `:contexts` (e.g., `:dev`, `:test`) apply environment-specific `:extra-paths`, `:extra-deps`, and `:extra-resource-paths`. Apply them with `lgx --with dev,test <cmd>` or a task's `:with`; `:dev` auto-applies to `run`, `:test` to `test`, and both to `nrepl`. This keeps dev/test dependencies out of release binaries.\n\n**Transitive dependencies:** After fetching a dep, lgx reads its `lgx.edn` and recursively resolves `:deps` (breadth-first, first-wins). A coord you list directly overrides the same lib pulled in transitively.\n\n**Task system:** Tasks replace ad-hoc Makefiles. Define them under `:tasks` with `:doc`, `:do` (steps), `:args` (typed positional params), `:with` (contexts), and task-private `:extra-*` overlays. Steps are `:sh` (shell) or `:run` (let-go with project basis); the first non-zero exit stops the chain.\n\n## Design philosophy\n\n- **Single binary, multiple roles** \u2014 consolidates build, test, dependency, and task management without spawning external tools for each concern, reducing cognitive load and toolchain complexity.\n- **Git-native dependencies** \u2014 uses git repositories directly (with optional `:deps/root` subdirectory) rather than a centralized registry, avoiding lock-in and enabling dependency on unreleased work or internal repos.\n- **Language-native config** \u2014 `lgx.edn` uses let-go data literals (EDN), keeping configuration close to the language itself.\n- **Zero package-manager bloat** \u2014 projects depend directly on what they need; no transitive explosion of unused packages, no registry uptime risks.\n\n## Build model and architecture\n\nFor details on how lgx compiles and bundles let-go programs, see [concepts/lgx-build-model](concepts/lgx-build-model/). For bytecode compilation and runtime details, see [concepts/lg-compile](concepts/lg-compile/), [concepts/bytecode-compiler](concepts/bytecode-compiler/), and [concepts/runtime-image](concepts/runtime-image/).\n\n# Citations\n\n[1] [lgx repository](https://github.com/abogoyavlensky/lgx) \u2014 README.md, 2026-07-05.\n", "projects/xsofy": "\n# Xs of Y (xsofy)\n\nxsofy is a roguelike written in [let-go](entities/let-go/), notable because\nits magic system *is* a Lisp. Every run generates a new title (*Gazebos of\nMounting Dread*), a new quest (*retrieve the Spatula of Futility*), and a new set\nof rune mappings \u2014 the runes are secretly symbols, and spells are s-expressions.\nYou have root access to the dungeon's reality engine, but the man pages are in a\ndead language that changes every boot. The power curve is inverted: early game is\ndesperate survival, late game is applied theology. It runs\n[in the browser](https://nooga.github.io/xsofy/) and in the terminal from the\nsame source, and its main visual inspiration is\n[Brogue](https://sites.google.com/site/broguegame/).\n\n# Using let-go\n\nxsofy is a substantial real program \u2014 a complete game \u2014 which makes it a strong\n\"using let-go in anger\" case study. It leans on let-go's core properties:\n\n- **Persistent data structures all the way down** \u2014 the game state model is\n  built on immutable, structurally-shared collections.\n- **No dependencies** \u2014 the whole game is written against let-go and its standard\n  library, with no external packages.\n- **~6ms startup** \u2014 fast enough to boot inside a single frame.\n- **Same source, two targets** \u2014 compiled to self-contained **WASM** for the\n  browser and run **natively** in the terminal from the identical codebase.\n\n# Idioms\n\n- **Same-source browser + terminal via WASM.** Because let-go compiles to a\n  self-contained WASM page *and* runs natively, a single program ships to both a\n  web page and a terminal without a separate port \u2014 a repeatable pattern for\n  let-go apps.\n- **Data-as-code as a game mechanic.** Spells are s-expressions and runes are\n  symbols: the game exposes the language's own homoiconicity to the player,\n  using let-go values (symbols, lists) directly as the spell substrate rather\n  than inventing a separate scripting layer.\n\n# Citations\n\n[1] [xsofy repository](https://github.com/nooga/xsofy)\n[2] [Play xsofy in the browser](https://nooga.github.io/xsofy/)\n", "references/clojure-compat": "\n# Clojure Compatibility\n\nlet-go is a Clojure dialect, not a drop-in JVM Clojure replacement. Most idiomatic Clojure code runs unmodified, but host-interop and concurrency models differ. let-go passes **5621 / 5621 assertions** across 232 test files from the [jank-lang/clojure-test-suite](https://github.com/jank-lang/clojure-test-suite) under the `:clj` reader lens with zero failures.\n\n## Standard namespaces\n\n| Namespace | Status |\n|-----------|--------|\n| `clojure.core` | Macros, destructuring, lazy sequences, transducers, protocols, records, `deftype`, `reify`, multimethods, hierarchies, atoms, regex, metadata, BigInt, BigDecimal |\n| `clojure.string` | Full implementation |\n| `clojure.set` | Full implementation |\n| `clojure.walk` | `prewalk`, `postwalk`, `keywordize-keys`, `stringify-keys`, `walk` |\n| `clojure.edn` | `read`, `read-string` |\n| `clojure.pprint` | `pprint`, `cl-format` |\n| `clojure.test` | `deftest`, `is`, `testing`, `are`, fixtures |\n| `clojure.core.async` | Channels, `go`/`go-loop`, `alts!`, `mult`/`pub`, `pipe`/`merge`/`split` (real goroutines, not IOC) |\n| `io` | Polymorphic readers/writers, `slurp`/`spit`, lazy line-seq, encoding, URLs, `with-open`, `resource` |\n| `http` | Ring-style server and client, streaming responses |\n| `json` | `read-json`, `write-json` (float-preserving, record-aware) |\n| `transit` | transit+json codec with rolling cache |\n| `os` | `sh`, `stat`, `ls`, `cwd`, `getenv`/`setenv`, `exit`, `os-name`, `arch`, `user-name`, `hostname` |\n| `System` | JVM-shaped API: `getProperty`, `getProperties`, `getenv`, `exit`, `currentTimeMillis`, `nanoTime` |\n| `syscall` | Direct Linux syscalls (mount, unshare, mknod, prctl, capset, seccomp, AppArmor) |\n| `pods` | [Babashka pods](concepts/pods/) over JSON/EDN/transit |\n\n## Not implemented\n\n| Feature | Reason |\n|---------|--------|\n| **STM coordination** (`ref`/`dosync`) | Atom-backed compatibility aliases; not coordinated STM |\n| **Asynchronous agents** (`agent`/`send`/`send-off`) | Synchronous atom-backed compatibility aliases |\n| **Chunked sequences** | Lazy seqs are unchunked |\n| **Custom tagged literals** | Built-in `#uuid` and `#inst` work; unknown tags read as payload; `*data-readers*` / `*default-data-reader-fn*` not implemented |\n| **Java-style `deftype`/`reify` method bodies** | Protocol implementations work; JVM host methods do not |\n| **`clojure.spec`** | Not ported |\n| **`subseq`/`rsubseq`** | Sorted collections work; range queries don't |\n\n## Behavioral differences\n\n### Concurrency and async\n\n- `<!` and `<!!` are identical; same for `>!` and `>!!` (Go channels always block).\n- `go` blocks are real goroutines, not IOC state machines (cheaper, can call blocking ops directly).\n\n### Numerics\n\n- Tower includes `int64`, `float64`, `BigInt`, ratios, and `BigDecimal` without JVM's full primitive/class model.\n- Base integer `+`/`-`/`*`/`inc`/`dec` throw on overflow; use `+'`/`-'`/`*'`/`inc'`/`dec'` for BigInt-promoting exact math.\n\n### String processing and regex\n\n- Regex is Go flavor (`re2`), not Java regex.\n  - Supports most common patterns.\n  - Lacks lookaround, backreferences, named capture groups, possessive quantifiers.\n  - Linear-time execution; no ReDoS risk (unless using extended regex engine).\n\n### Sequence operations\n\n- `concat*` (used internally by quasiquote) is eager; user-facing `concat` is lazy.\n\n### Maps and characters\n\n- Traversal order of map literals and `hash-map` is unspecified by contract. Since #764 (2026-09-07) maps of up to eight entries, `array-map`, and the builders on them (`assoc` chains, `into`, `zipmap`, `merge`, `select-keys`) keep insertion order, and the ninth `assoc` promotes to hash order. An `array-map` constructed with more than eight pairs promotes at construction, unlike Clojure's. Use `sorted-map` for comparator order.\n- A character is one Unicode scalar value (a Go rune), not a UTF-16 code unit: `(count \"\ud83d\ude00\")` is 1 where JVM Clojure gives 2, and `(char 65895)` yields U+10167 where the JVM throws. `char` does not yet reject surrogate-range integers. The ledger for these and their shared-suite overrides is [Known Clojure divergences](sources/docs-known-divergences/).\n\n## Reader-level feature detection\n\nlet-go supports `:clj` and `:lg` reader conditionals (in addition to `:default`). Libraries can use `#?(:lg ... :clj ...)` to provide let-go-specific code paths.\n\nBabashka-compatible libraries using `:bb` reader branches can be loaded in let-go by matching the `:bb` feature to avoid JVM-internal assumptions.\n\n## Test suite results\n\nlet-go's implementation is verified against 232 test files from jank's clojure-test-suite:\n- **5621 / 5621 assertions pass** under the `:clj` reader lens.\n- **Zero failures, skips, or panics**.\n- Coverage includes core functions, collection operations, destructuring, lazy sequences, protocols, and multimethods.\n\n## Interop story\n\nJAR loading and dynamic class loading are not supported; instead:\n\n- **Pods** provide access to external libraries via the [Babashka pods protocol](concepts/pods/).\n- **Go embedding** allows calling Go functions from let-go via `lginterop` and gogen-generated bindings.\n- **System calls** (`os`, `syscall` namespaces) provide OS-level interop for shell, file I/O, and Linux syscalls.\n\n# Citations\n\n[1] **docs/guide/clojure-compatibility.md**: Comprehensive compatibility reference  \nhttps://github.com/nooga/let-go/blob/main/docs/guide/clojure-compatibility.md\n\n[2] **docs/clojure-compat-roadmap.md**: Compatibility roadmap and known gaps  \nhttps://github.com/nooga/let-go/blob/main/docs/clojure-compat-roadmap.md\n\n[3] **jank-lang/clojure-test-suite**: Test suite source  \nhttps://github.com/jank-lang/clojure-test-suite\n\n[4] **Pods** (this wiki)  \n[../concepts/pods.md](concepts/pods/)\n\n[5] **let-go** (this wiki)  \n[../entities/let-go.md](entities/let-go/)\n\n---\n\nSee also: [lginterop](concepts/lginterop/), [go-interop](concepts/go-interop/), [stack-vm](concepts/stack-vm/)\n", "references/clojure.core/apply": "\n`apply` takes a function and a sequence of arguments, unpacking the sequence as the final arguments to the function. Use it when you have arguments collected in a list or vector and need to pass them to a function as individual parameters.\n\n# Signature\n\n```clojure\n(apply [f args] [f x args] [f x y args] [f x y z args] [f a b c d & args])\n```\n\n# Examples\n\n```clojure\n(apply + [1 2 3])\n;; => 6\n```\n\n```clojure\n(apply list 1 [2 3])\n;; => (1 2 3)\n```\n\n```clojure\n(apply str \"Hello\" [\" \" \"World\"])\n;; => \"Hello World\"\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/comp": "\nCreates a new [fn](references/clojure.core/fn/) from multiple functions such that the resulting function applies each function to the result of the previous one, working right-to-left. Useful for building complex transformations from simpler functions.\n\n# Signature\n\n```clojure\n(comp [] [f] [f g] [f g & fs])\n```\n\n# Examples\n\n```clojure\n((comp inc inc) 1)\n;; => 3\n```\n\n```clojure\n((comp #(* 2 %) inc) 3)\n;; => 8\n```\n\n```clojure\n((comp str +) 1 2)\n;; => \"3\"\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/defn": "\n`defn` defines a named function and binds it in the current namespace. Use it to create reusable functions that can be called by name throughout your program. It combines [fn](references/clojure.core/fn/) for function creation with binding to a name in the current scope.\n\n# Signature\n\n```clojure\n(defn name doc-string? [params*] body)\n(defn name doc-string? ([params*] body)+)\n```\n\n# Examples\n\n```clojure\n(do (defn square [x] (* x x)) (square 5))\n;; => 25\n```\n\n```clojure\n(do (defn add [x y] (+ x y)) (add 2 3))\n;; => 5\n```\n\n```clojure\n(do (defn greet [name] (str \"Hello, \" name \"!\")) (greet \"World\"))\n;; => \"Hello, World!\"\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/filter": "\nSelects elements from a collection based on a predicate [fn](references/clojure.core/fn/), returning a lazy sequence of only those elements for which the predicate returns a truthy value. Use filter when you need to retain only items matching specific criteria.\n\n# Signature\n\n```clojure\n(filter [pred] [f xs])\n```\n\n# Examples\n\n```clojure\n(filter even? [1 2 3 4 5])\n;; => (2 4)\n```\n\n```clojure\n(filter #(> % 2) [1 2 3 4])\n;; => (3 4)\n```\n\n```clojure\n(filter #(not (empty? %)) [\"\" \"hello\" \"\" \"world\"])\n;; => (\"hello\" \"world\")\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/fn": "\n`fn` creates an anonymous function or named function. Use it to define functions inline without assigning them to a name (useful for higher-order functions like [apply](references/clojure.core/apply/)), or define a named function for recursion. `fn` supports both single-arity and multi-arity definitions.\n\n# Signature\n\n```clojure\n(fn [params*] body)\n(fn name [params*] body)\n(fn ([params*] body) ([params*] body) ...)\n```\n\n# Examples\n\n```clojure\n((fn [x] (+ x 1)) 5)\n;; => 6\n```\n\n```clojure\n((fn [x y] (* x y)) 3 4)\n;; => 12\n```\n\n```clojure\n(let [adder (fn [x y] (+ x y))]\n  (adder 10 20))\n;; => 30\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/inc": "\nIncrements a number by adding 1 to it. A convenience [fn](references/clojure.core/fn/) commonly used with [map](references/clojure.core/map/) and other higher-order functions to transform sequences of numbers.\n\n# Signature\n\n```clojure\n(inc [x])\n```\n\n# Examples\n\n```clojure\n(inc 5)\n;; => 6\n```\n\n```clojure\n(map inc [1 2 3 4])\n;; => (2 3 4 5)\n```\n\n```clojure\n((comp inc inc) 10)\n;; => 12\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/let": "\n`let` creates a new lexical scope and binds symbols to values for use within that scope. Use it to define intermediate variables, break down complex expressions, or avoid repeating calculations.\n\n# Signature\n\n```clojure\n(let [bindings & body])\n```\n\n# Examples\n\n```clojure\n(let [x 5] (+ x 3))\n;; => 8\n```\n\n```clojure\n(let [a 2 b 3] (* a b))\n;; => 6\n```\n\n```clojure\n(let [x 10 y 20 sum (+ x y)] sum)\n;; => 30\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/map": "\nApplies a function to corresponding elements across one or more collections, returning a lazy sequence of results. When applied to a single collection, it transforms each element; when applied to multiple collections, it applies the [fn](references/clojure.core/fn/) to one element from each collection.\n\n# Signature\n\n```clojure\n(map [f] [f coll] [f c1 c2] [f c1 c2 & colls])\n```\n\n# Examples\n\n```clojure\n(map inc [1 2 3])\n;; => (2 3 4)\n```\n\n```clojure\n(map + [1 2] [10 20])\n;; => (11 22)\n```\n\n```clojure\n(map #(* % 2) [1 2 3 4 5])\n;; => (2 4 6 8 10)\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/mapv": "\nApplies a [fn](references/clojure.core/fn/) to elements of one or more collections, returning results as a vector rather than a lazy sequence. Use mapv when you need to eagerly realize all results immediately, such as when the result will be used multiple times or when side effects during evaluation matter.\n\n# Signature\n\n```clojure\n(mapv [f coll] [f c1 & colls])\n```\n\n# Examples\n\n```clojure\n(mapv inc [1 2 3])\n;; => [2 3 4]\n```\n\n```clojure\n(mapv + [1 2 3] [10 20 30])\n;; => [11 22 33]\n```\n\n```clojure\n(mapv #(* % 2) [1 2 3 4])\n;; => [2 4 6 8]\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/partial": "\nReturns a new [fn](references/clojure.core/fn/) with some arguments pre-filled, useful for creating specialized versions of existing functions. Partial application allows you to fix certain arguments and create reusable functions that accept the remaining arguments.\n\n# Signature\n\n```clojure\n(partial [f] [f arg1] [f arg1 arg2] [f arg1 arg2 arg3] [f arg1 arg2 arg3 & more])\n```\n\n# Examples\n\n```clojure\n((partial + 10) 5)\n;; => 15\n```\n\n```clojure\n((partial * 2 3) 4)\n;; => 24\n```\n\n```clojure\n(let [add10 (partial + 10)] (map add10 [1 2 3]))\n;; => (11 12 13)\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/clojure.core/when": "\n`when` is a conditional macro that evaluates its body only when the condition is truthy. Use it for single-branch conditionals where you want to execute side effects or return a value based on a condition, with nil as the implicit else case.\n\n# Signature\n\n```clojure\n(when test & body)\n```\n\n# Examples\n\n```clojure\n(when true 42)\n;; => 42\n```\n\n```clojure\n(when false 42)\n;; => nil\n```\n\n```clojure\n(let [x 5]\n  (when (> x 3)\n    (str \"x is greater than 3\")))\n;; => \"x is greater than 3\"\n```\n\n# Citations\n\nhttps://github.com/nooga/let-go/blob/main/pkg/rt/core/core.lg\n", "references/lgx-commands": "\n# lgx Commands\n\nlgx is a git-based package and project manager for [let-go](entities/let-go/), bundling dependency resolution, execution, REPL access, binary building, test running, scaffolding, and task automation into a single CLI. This reference documents the primary commands and their usage patterns.\n\n## Quickstart\n\nCreate a project from the default template, then run it:\n\n```sh\nlgx new hello\ncd hello\nlgx run\n```\n\n`lgx new` scaffolds from the built-in base template (see [`new` templates](#new-templates) below); `lgx run` resolves `:main` from `lgx.edn`, fetches dependencies into `$LGX_HOME/gitlibs/`, and runs the entry point through `lg`.\n\n## Commands Overview\n\n### `lgx new`\n\nScaffold a new let-go project into `./<name>` from a built-in template or a git URL.\n\n**Usage:**\n```sh\nlgx new <name> [-t <tpl>]\n```\n\n**Key flags:**\n- `-t`, `--template <tpl>` \u2014 select a template: a built-in name (`base`, `cli`) or a git HTTPS URL. Defaults to `base`.\n\n**Example:**\n```sh\nlgx new myapp              # scaffold with base template\nlgx new myapp -t cli       # use the cli template\nlgx new myapp -t https://github.com/user/my-template\n```\n\nTemplates substitute the token `projectname` with your chosen name (underscored in paths, hyphenated in file contents). URLs must use HTTPS; SSH forms are not supported.\n\n#### `new` Templates\n\nBuilt-in templates are pinned to a latest revision and cached under `$LGX_HOME/templates/`:\n\n| Name | Repo | Purpose |\n| --- | --- | --- |\n| `base` | [lgx-template-base](https://github.com/abogoyavlensky/lgx-template-base) | Minimal let-go app. |\n| `cli` | [lgx-template-cli](https://github.com/abogoyavlensky/lgx-template-cli) | Command-line app skeleton. |\n\nCustom templates live in HTTPS git repos and must place `projectname` as a literal token wherever the project name belongs.\n\n### `lgx run`\n\nRun the project's `:main` entrypoint (from `lgx.edn`) through `lg`, with project sources and dependencies on the path.\n\n**Usage:**\n```sh\nlgx run [args...]\n```\n\n**Key behaviors:**\n- With no `:main` defined and no explicit script, errors. Use [`lgx repl`](#lgx-repl) for an interactive session.\n- Sets `LGX_RUN=1` in the spawned process, so code can detect dev vs. bundled-binary mode.\n- Inherits lgx's stdio, so live output and interactive programs work.\n- Program arguments go after `--` and arrive in `*command-line-args*` (requires `lg` >= 1.11.0).\n\n**Examples:**\n```sh\nlgx run                    # run :main with no args\nlgx run -- foo bar         # run :main with args (\"foo\" \"bar\")\nlgx run other.lg           # run an explicit script instead of :main\nlgx run other.lg -- bar    # explicit script with an arg\nlgx run -e '(...)'         # eval a let-go expression\n```\n\n**Argument forms:**\n- `lgx run` \u2192 `lg <paths> <main>` (`*command-line-args*` is `nil`)\n- `lgx run -- foo bar` \u2192 `lg <paths> <main> foo bar` \u2192 `*command-line-args*` is `(\"foo\" \"bar\")`\n- `lgx run other.lg` \u2192 `lg <paths> other.lg` (no `:main` needed)\n- `lgx run other.lg -- bar` \u2192 `lg <paths> other.lg bar` \u2192 `*command-line-args*` is `(\"bar\")`\n- `lgx run -e '(...)'` \u2192 `lg <paths> -e '(...)'` (no `:main`)\n- `lgx run -- a -- b` \u2192 `*command-line-args*` is `(\"a\" \"--\" \"b\")` (first `--` is the separator)\n\n### `lgx repl`\n\nStart `lg`'s built-in REPL with the project's dependencies and source paths loaded, auto-applying the `:dev` and `:test` contexts when defined.\n\n**Usage:**\n```sh\nlgx repl\n```\n\n**Key behaviors:**\n- Zero-footprint REPL entry point; no port binding or `.nrepl-port` file.\n- Auto-applies `:dev` and `:test` contexts if defined in `lgx.edn`.\n- For a scratch script or `lg` flags with dependencies on the path, use `lgx run <script>` instead.\n\n**Example:**\n```sh\nlgx repl\n# (+ 1 2)\n# 3\n```\n\n### `lgx nrepl`\n\nStart an nREPL server on a free OS-assigned port (or a specified port), with project dependencies and source paths loaded, auto-applying the `:dev` and `:test` contexts when defined.\n\n**Usage:**\n```sh\nlgx nrepl [--port N]\n```\n\n**Key behaviors:**\n- Writes the bound port to `.nrepl-port` for editor tooling (e.g., Calva for Clojure) to discover.\n- Auto-applies `:dev` and `:test` contexts.\n- Ideal when an editor or IDE needs to connect to a REPL server.\n\n**Example:**\n```sh\nlgx nrepl --port 7888\n# Wrote port 7888 to .nrepl-port\n# nREPL server listening on 127.0.0.1:7888\n```\n\n### `lgx build`\n\nBundle `:main` into a standalone binary, written to the path specified in `lgx.edn`'s `:targets/:bin/:out`.\n\n**Usage:**\n```sh\nlgx build [args...]\n```\n\n**Key behaviors:**\n- Shortcut for `lg <paths> [extra-args...] -b <:out> <:main>`.\n- Both `:main` and `:targets/:bin` are required; errors otherwise.\n- Extra arguments go before `-b`, enabling cross-OS bundling (e.g., `-bundle-base /path/to/lg`).\n- Resource paths are embedded into the binary, so `(io/resource \"\u2026\")` works without external files.\n\n**Example:**\n```sh\nlgx build\n# => Building\u2026\n# bin/myapp\n\nlgx build -bundle-base /path/to/lg  # cross-compile\n```\n\nSee [lgx build model](concepts/lgx-build-model/) for details on what happens during build.\n\n### `lgx test`\n\nRun all `*_test.lg`, `*_test.cljc`, or `*_test.clj` files under `test/`, generating a one-shot test harness and printing summary results.\n\n**Usage:**\n```sh\nlgx test [file]\n```\n\n**Key behaviors:**\n- Walks `test/` recursively for test files.\n- With `<file>`, runs only that test file.\n- Auto-applies the `:test` context if defined.\n- Executes every `deftest` against the project's resolved source paths.\n\n**Example:**\n```sh\nlgx test\n# Running tests\u2026\n# Ran 5 tests: 5 passed, 0 failed\n\nlgx test test/core_test.lg   # run one file\n```\n\n## Global Options\n\nBoth `--with` and `--verbose` are placed before the subcommand.\n\n### `--with`\n\nApply one or more named contexts to the command. Contexts are overlays of extra paths, dependencies, and resource roots defined in `lgx.edn`.\n\n**Usage:**\n```sh\nlgx --with <a,b,...> <command>\n```\n\n**Works with:** `run`, `repl`, `nrepl`, `build`, `test`, `install`, and user tasks.\n\n**Example:**\n```sh\nlgx --with dev,test run     # apply dev and test contexts to run\nlgx --with dev build        # add dev dependencies during build\n```\n\nBy convention, `:dev` auto-applies to `lgx run`, `:test` to `lgx test`, and `lgx nrepl` applies both automatically\u2014no `--with` needed. See [lgx-edn](references/lgx-edn/) for context definition.\n\n### `--verbose`\n\nPrint the resolved `lg` invocation before running. Shows:\n\n1. A `+ lg <version> (<path>)` line naming the `lg` binary version and full path (reflects `LGX_LG` overrides).\n2. A `+ env \u2026` line listing environment variables lgx sets.\n\n**Works with:** `run`, `repl`, `nrepl`, `build`, `test`, and user tasks.\n\n**Example:**\n```sh\nlgx --verbose run\n# + lg 1.11.0 (/usr/local/bin/lg)\n# + env LGX_RUN=1\n# (program output follows)\n```\n\n## Environment Variables\n\n| Variable | Default | Purpose |\n| --- | --- | --- |\n| `LGX_LG` | `lg` on `PATH` | Path to the `lg` binary. Useful for testing unreleased builds. |\n| `LGX_RUN` | _(set by lgx)_ | Set to `1` by `lgx run`. Read it to detect dev mode vs. bundled binary. |\n| `LGX_HOME` | `~/.lgx` | State root: gitlibs cache, let-go source cache, template cache, test harness. |\n| `LGX_SKIP_VERSION_CHECK` | _(unset)_ | Set to any non-empty value to bypass `:lg-version` compatibility checks. |\n| `LGX_FETCH_LET_GO_SOURCE` | _(unset)_ | Set to `1` to make `lgx install` fetch the let-go source matching `:lg-version`. Feeds editor LSP diagnostics. |\n| `LGX_NO_COLOR` | _(unset)_ | Set to any non-empty value to disable colored status headers. |\n| `LGX_TEMPLATE_BASE_URL` | template repo URL | Override the source repo of the built-in `base` template. |\n| `LGX_TEMPLATE_BASE_SHA` | pinned sha | Override the revision of the built-in `base` template. |\n\n## Other Commands\n\n- `lgx install` \u2014 Fetch dependencies from `:deps` into the gitlibs cache. Idempotent; useful for editor navigation.\n- `lgx <task> [args...]` \u2014 Run a custom task defined under `:tasks` in `lgx.edn`, binding declared positional args.\n- `lgx help` or `lgx` \u2014 Show usage and project tasks.\n- `lgx version` \u2014 Print lgx version.\n- `lgx completion <shell>` \u2014 Print shell completions for bash, zsh, or fish.\n\n## Related Pages\n\n- [lgx Configuration (`lgx.edn`)](references/lgx-edn/) \u2014 Define projects, dependencies, contexts, and tasks.\n- [lgx Build Model](concepts/lgx-build-model/) \u2014 How `lgx build` bundles binaries.\n- [lg Compilation](concepts/lg-compile/) \u2014 Let-go compiler internals.\n- [let-go Project](entities/let-go/) \u2014 The let-go language and runtime.\n\n# Citations\n\n**Resource:** [lgx README.md](https://github.com/abogoyavlensky/lgx/blob/master/README.md) on GitHub, branch `master`.\n\nAll commands, flags, and behaviors sourced from the \"Quickstart\" and \"Commands\" sections of the README, including subsections \"lgx new templates\", \"lgx run details\", \"lgx repl details\", \"lgx build details\", and \"lgx test details\".\n", "references/lgx-edn": "\n# lgx.edn Configuration\n\n**lgx.edn** is the [Let-Go](entities/let-go/) project configuration file, placed at the project root. All keys are optional; a minimal valid file is `{}`. This reference covers all top-level keys, their types, and behavior.\n\nSee [lgx commands](references/lgx-commands/) for how to invoke `lgx` with these configurations, and [lgx build model](concepts/lgx-build-model/) for how they interact.\n\n## Structure Overview\n\nEach top-level key controls a different aspect of the project:\n\n```edn\n{:paths               [\"src\"]              ; source dirs\n :resource-paths     [\"resources\"]        ; embedded resource roots\n :main               \"main.lg\"            ; default entry point\n :lg-version         \"1.11.0\"             ; version constraint\n :deps               {...}                ; dependencies\n :targets            {:bin {:out \"...\"}}  ; build outputs\n :tasks              {...}                ; custom commands\n :contexts           {...}}               ; named overlays\n```\n\n## Top-Level Keys\n\n### `:paths`, `:main`, `:resource-paths`\n\n**`:paths`** \u2014 vector of source directory names (relative to project root). Prepended to dependency paths, so project namespaces shadow libraries with the same name. Prepended, not appended.\n\n```edn\n:paths [\"src\" \"src/main\"]\n```\n\nMissing entries print a warning. Default is effectively `[]`.\n\n**`:main`** \u2014 string name of the default entry point (relative to project root). Used by `lgx run` when no script is given, and bundled by `lgx build`. Does not need to be under `:paths`.\n\n```edn\n:main \"main.lg\"\n```\n\n**`:resource-paths`** \u2014 vector of resource directory names. Passed to `lg` as `-resource-paths` for run/test, and **embedded into the binary** by `lgx build`, so `(io/resource \"\u2026\")` works in bundled apps without the original files. Only comes from your project, never from dependencies.\n\n```edn\n:resource-paths [\"resources\" \"assets\"]\n```\n\nMissing entries print a warning.\n\n### `:lg-version`\n\nString pinning the [Let-Go](entities/let-go/) runtime version this project targets. When set:\n\n- On `lgx run` / `lgx nrepl` \u2014 warns if the `lg` on PATH differs.\n- On `lgx build` / `lgx test` \u2014 fails if versions mismatch (wrong runtime or test verdict matters).\n- A dev or unparseable installed version is skipped.\n- `LGX_SKIP_VERSION_CHECK` env var bypasses the check entirely.\n- With `LGX_FETCH_LET_GO_SOURCE=1`, `lgx install` also fetches matching let-go **source** (not binary) into `$LGX_HOME/let-go/source/<version>/` for editor diagnostics.\n\n```edn\n:lg-version \"1.11.0\"\n```\n\n### `:deps`\n\nMap of dependency coordinates. Each key is a qualified name (symbol), and the value specifies a source.\n\n**Git source** \u2014 fetch from a Git URL via HTTPS, pinned by tag or commit SHA:\n\n```edn\n:deps {\n  some-user/lib-a {:git/url \"https://github.com/some-user/lib-a\"\n                   :git/tag \"v0.2.0\"}\n  some-user/lib-b {:git/url \"https://github.com/some-user/lib-b\"\n                   :git/sha \"0123456789abcdef0123456789abcdef01234567\"}\n  org.example/lib-c {:git/url \"https://github.com/org-example/lib-c\"\n                     :git/tag \"v1.0\"\n                     :deps/root \"src/main/clojure\"}}\n```\n\n- `:git/url` (required) \u2014 HTTPS-only repository URL.\n- `:git/tag` or `:git/sha` (one required) \u2014 immutable pin.\n- `:deps/root` (optional) \u2014 source subdirectory inside the repo. Defaults to `src` if present, else repo root. Matches `tools.deps` behavior.\n\n**Local source** \u2014 reference a local directory (no gitlibs cache):\n\n```edn\n:deps {\n  my/lib {:local/root \"../my-lib\"}\n}\n```\n\nNever mix `:git/*` and `:local/root` on the same coord.\n\n**Transitive resolution** \u2014 lgx reads each dep's own `lgx.edn` and resolves its `:deps` recursively. Only `:deps` are inherited; a dep's `:paths`, `:main`, `:tasks` are ignored. Resolution is breadth-first, and **first-wins**: the first coord seen for a lib name wins, and a later differing coord is skipped with a warning. Your direct deps override transitively-pulled deps.\n\n### `:targets`\n\nMap of build output specifications. Currently only `:bin` is supported:\n\n```edn\n:targets {:bin {:out \"bin/myapp\"}}\n```\n\n- `:bin {:out \"path/to/binary\"}` \u2014 path relative to project root. Parent directories are created if missing. Invoked by `lgx build`.\n\n### `:tasks`\n\nMap of custom commands. Run with `lgx <name> [args...]`. A task defines one step (a bare map) or many steps (a vector); each step is `:sh` (shell) or `:run` (let-go script).\n\n**Simple task (single step):**\n\n```edn\n:tasks {\n  fmt {:doc \"Lint the project\"\n       :do  {:sh \"cljfmt fix\"}}\n}\n```\n\n**Multi-step task (stops at first failure):**\n\n```edn\n:tasks {\n  ci {:doc \"Lint, then test\"\n      :do  [{:sh  \"cljfmt check\"}\n            {:run \"scripts/check.lg\"}]}\n}\n```\n\n**Task with positional arguments:**\n\n```edn\n:tasks {\n  deploy {:doc \"Deploy the app\"\n          :args [{:name :env\n                  :type [:enum \"prod\" \"staging\"]}\n                 {:name    :version\n                  :type    :string\n                  :default \"latest\"}]\n          :do   [{:sh  [\"./deploy.sh\" :arg/env :arg/version]}\n                 {:run [\"notify.lg\" :arg/env]}\n                 {:sh  \"echo deploying v{{version}}\"}]}\n}\n```\n\n**Arguments** (`:args`):\n\n- `:name` \u2014 required, an unqualified keyword. Placeholder is `:arg/<name>`.\n- `:type` \u2014 `:string` (default), `:int`, or `[:enum \"v1\" \"v2\" ...]`.\n- `:default` \u2014 optional; if present, all later args must also have defaults.\n- Arity is strict: missing required arg, wrong type, or surplus args prints usage and exits 1.\n\nReference args two ways:\n- **`:arg/<name>` keywords** in vector-form steps (quoted in `:sh` for shell safety, verbatim in `:run`).\n- **`{{name}}` templates** in any step string (raw splice; quote if spaces).\n\n**Step formats:**\n\n- `:sh` \u2014 shell command, string or vector. Vector form is more precise.\n  ```edn\n  {:sh \"cljfmt fix\"}\n  {:sh [\"sh\" \"-c\" \"echo $HOME\"]}\n  ```\n- `:run` \u2014 let-go script with this project's basis. String splits on whitespace; vector is explicit argv.\n  ```edn\n  {:run \"scripts/check.lg\"}\n  {:run [\"scripts/check.lg\" \"--verbose\"]}\n  ```\n\n**Task-level overlays** \u2014 `:extra-paths`, `:extra-resource-paths`, `:extra-deps` (same grammar as project-level). Applied to `:run` steps only; `:sh` steps are plain shell. Appended after project-level and de-duplicated.\n\n```edn\n:tasks {\n  console {:doc \"Custom REPL with dev tooling\"\n           :with [:dev]\n           :extra-paths [\"repl\"]\n           :extra-deps {some-extra {:git/url \"...\" :git/tag \"v1\"}}\n           :do [{:run \"dev/repl.lg\"}]}\n}\n```\n\n**Constraints:** Task names are symbols and cannot shadow built-ins (`install`, `run`, `nrepl`, `build`, `test`, `new`, `help`, `version`, plus reserved `add`, `update`, `tasks`). Only keys `:doc`, `:args`, `:do`, `:with`, `:extra-paths`, `:extra-resource-paths`, `:extra-deps` are allowed; typos (e.g. `:extra-dep`) fail loudly.\n\n### `:contexts`\n\nNamed, reusable overlays of `:extra-paths`, `:extra-resource-paths`, and `:extra-deps`. Applied globally via `lgx --with <names>` or per-task via `:with`. Deduplication and layering rules apply.\n\n```edn\n:contexts {\n  :dev  {:extra-paths [\"dev\"]\n         :extra-resource-paths [\"dev-resources\"]\n         :extra-deps {nrepl {:git/url \"https://github.com/x/nrepl\"\n                             :git/tag \"v1\"}}}\n  :test {:extra-paths [\"test-support\"]}\n}\n```\n\n**Default contexts (auto-applied):**\n\n- `:dev` auto-applies to `lgx run` and `lgx nrepl`.\n- `:test` auto-applies to `lgx test` and `lgx nrepl`.\n- `lgx build` and `lgx install` never auto-apply contexts (keep dev/test deps out of binaries).\n- Task `:run` steps don't inherit contexts unless the task explicitly `:with` them.\n\n**Layering precedence** (lowest to highest; most specific wins):\n\n1. Project `:deps`, `:paths`, `:resource-paths`\n2. Auto-applied contexts (`:dev`, `:test`)\n3. Task `:with` contexts (in order)\n4. CLI `--with` contexts (in order)\n5. Task inline `:extra-deps`, `:extra-paths`, `:extra-resource-paths`\n\nSource and resource paths concatenate project-first (project shadows libraries) and de-duplicate. Resource paths never pick up dependency directories.\n\n## Minimal Example\n\n```edn\n{}\n```\n\nA completely empty file is valid; all keys default to sensible values.\n\n## Real-World Example\n\n```edn\n{:paths [\"src\"]\n :resource-paths [\"resources\"]\n :main \"main.lg\"\n :lg-version \"1.11.0\"\n :targets {:bin {:out \"bin/myapp\"}}\n\n :deps\n {askonomm/ruuter {:git/url \"https://git.nmm.ee/asko/ruuter\"\n                   :git/tag \"v2.1.1\"}}\n\n :contexts\n {:dev  {:extra-paths [\"dev\"]}\n  :test {:extra-paths [\"test\"]}}\n\n :tasks\n {fmt   {:doc \"Format code\"\n         :do  {:sh \"cljfmt fix\"}}\n  test  {:doc \"Run tests\"\n         :do  {:run \"test/runner.lg\"}}}}\n```\n\n## Related\n\n- [Let-Go](entities/let-go/) \u2014 the runtime and language.\n- [lgx Commands](references/lgx-commands/) \u2014 command-line interface (`lgx run`, `lgx build`, etc.).\n- [lgx Build Model](concepts/lgx-build-model/) \u2014 how configuration drives builds.\n- [Let-Go Projects](projects/lgx/) \u2014 example projects using lgx.\n\n# Citations\n\n**Resource:** [lgx README.md \u2014 Configuration: lgx.edn](https://github.com/abogoyavlensky/lgx/blob/master/README.md)\n\nLines 191\u2013385 cover all top-level keys (`:paths`, `:main`, `:resource-paths`, `:lg-version`, `:deps`, `:tasks`, `:targets`, `:contexts`), their shapes, and behavior.\n\nExamples in `/examples/hello/lgx.edn`, `/examples/server/lgx.edn`, and the root `lgx.edn` illustrate minimal and real-world configurations.\n", "references/testing-conformance": "\n## Testing and Conformance Strategy\n\n[let-go](entities/let-go/) is designed to validate correctness through a multi-layer testing approach: a `clojure.test`-compatible test layer for user code, conformance measured against the jank-lang clojure-test-suite (~230 core functions, ~5000 assertions), property testing with shrinking, and CI-gated performance benchmarks. The goal is to prove Clojure compatibility across core semantics, persistent data structures, seq behavior, and runtime stability.\n\n## Test Framework and CLI\n\nlet-go will provide a `clojure.test`-compatible API (macros like `deftest`, `testing`, `is`, `are`, `use-fixtures`) with output formats including human-readable logs, TAP, and JUnit XML for CI integration. The `lg test` command will support namespace globs, file selection, `--watch` for file changes, `--fail-fast`, and `--seed` for randomized/property tests. Implementation targets core test macros under `pkg/rt/core/test.lg` with the runner in Go (`pkg/rt/lang.go`) for performance, exposing JUnit/TAP encoders to let-go code via native functions.\n\n## Conformance: The Clojure Test Suite\n\nlet-go's conformance strategy targets running the [jank-lang/clojure-test-suite](https://github.com/jank-lang/clojure-test-suite), a cross-dialect test suite with ~105 test files and ~5000 assertions. The planned test runner (`test/zz_compat_test.go`) will compile upstream `.cljc` files through let-go and execute assertions, with safety guards: 5-second timeout per test, 512MB memory limit, and panic recovery. Portability shims in `test/compat/clojure/core-test/portability.lg` will provide predicates like `when-var-exists` and `thrown?` that the upstream tests expect. Namespace aliases (e.g., `clojure.test` \u2192 `test`) and resolver improvements (`.cljc` extension support, underscore\u2192hyphen path mapping) will enable upstream code to load transparently.\n\nThe runner will track expected failures in a `knownFailing` list; tests that pass but are listed are flagged as \"graduated\" so contributors can remove them. When complete, the suite will track 105 files with pass/fail/skipped metrics to guide priority fixes (reader issues unlock the most assertions, followed by resolver fixes, then missing builtins and behavioral corrections).\n\n## Property Testing, Fuzzing, and Guardrails\n\nlet-go is designed to include a minimal `test.check`-style property-testing library with generators and `prop/for-all` for properties like vector append/assoc invariants, HAMT idempotence, and equality/hash consistency. Planned fuzzing will occur at two levels: reader fuzzing with Go's `testing/fuzz` for literals and nested collections, and differential tests comparing VM vs Go AOT results on random inputs. Performance tests will use `go test -bench` microbenchmarks covering VM call arities, TCO recursion, vector/HAMT ops, numeric arithmetic, transducers, and image load time. Benchstat thresholds in CI will alert on >10% regressions; baselines will be stored per branch and refreshed with manual approval.\n\n## Phase 0\u20131 Acceptance Criteria\n\nThe Phase 0\u20131 goals include: a working `clojure.test`-compatible layer and `lg test` CLI with human-readable and JUnit output; a conformance seed suite running in CI for core semantics (seq coercion, `count nil`, `conj` semantics, basic equality); initial property tests for vectors and numeric operations; and a bench harness wired with call-arity and numeric microbenchmarks. CI will run a matrix across macOS/Linux/Windows and the latest two Go versions, including `go vet`, `staticcheck`, unit/integration/property/fuzz tests, and benchmarks, with artifacts (JUnit XML, TAP logs, coverage, perf CSV) published for review.\n\n# Citations\n\n**Resource (Public)**: [docs/testing-and-conformance.md](https://github.com/nooga/let-go/blob/main/docs/testing-and-conformance.md) \u2014 Testing and Conformance \u2014 framework, CI, and compatibility strategy.\n\n**Sources**:\n- `/Users/ndn/development/let-go/docs/testing-and-conformance.md` \u2014 goals, test framework, conformance strategy, property testing, performance guardrails, CI integration, and Phase 0\u20131 acceptance.\n- `/Users/ndn/development/let-go/docs/clojure-test-suite.md` \u2014 Clojure Test Suite workflow, runner architecture, safety, knownFailing list, coverage prioritization, and common pitfalls.\n", "sources/design-exec-context": "\n# Threading an execution context (off goid)\n\nThis design note, marked active as a gating decision for the dynamic-binding refactor, proposes eliminating goroutine-ID keying by unifying two separate ambient context mechanisms into a single **`ExecContext`** that is explicitly threaded through execution rather than looked up by goroutine ID.\n\nThe let-go [runtime](entities/let-go/) currently maintains two parallel, goroutine-ID-keyed structures: the Scope GLS (carrying structured concurrency and cancellation context) and the dynamic-var binding store. Both resolve \"current\" by parsing `runtime.Stack` output to extract the goroutine ID, which creates a hazard: goroutine ID reuse can leak dead bindings into later goroutines, maps grow unbounded, and the ambient lookup duplicates mechanism across two codebases. The design gates the [concurrency-model](concepts/concurrency-model/) and binding isolation needed for deterministic parallel lowering.\n\n## Key takeaways\n\n- **Problem:** Two parallel goroutine-ID-keyed mechanisms (Scope GLS and dynamic-var binding store) create the goid footgun, redundancy, and performance cost.\n\n- **Goal:** Eliminate goid by introducing a single `ExecContext` struct carrying both Scope and binding stack, explicitly threaded through execution (via the VM [Frame](concepts/stack-vm/)) rather than ambient lookup.\n\n- **Design:** ExecContext lives on the interpreter Frame; child frames inherit the pointer; goroutine spawns capture a snapshot; no map entry is left to forget, no goid reuse hazard.\n\n- **NativeFn convention (bounded dig-in):** Only ~17 builtins + Scope ops need context; add an additive `CtxFn` interface (`InvokeCtx(ec, args)`) with fallback to `Invoke(args)` for pure builtins. Three chokepoints\u2014`WriteToOut`, `WriteToErr`, `resolveIOHandleVar`\u2014consolidate IO-family derefs (the bulk of context-dependent sites).\n\n- **Three surfaces:** interpreter eval loop (threading `ec` on Frame, no IR artifact), hand-written NativeFns (~17, additive convention), and lowered gogen_ir functions (threading `ec` through emitted signatures, an IR-lowering artifact).\n\n- **Migration:** Eight-step sequence starting from clean `main@upstream` (incorporating #206's `WriteToOut` routing by construction), introducing `ExecContext`, wiring `CtxFn`, migrating builtins, threading `ec` through lowered-fn signatures, and finally deleting goid-keyed structures.\n\n- **Determinism preserved:** Concurrency isolation for `pmap`, `parallel`, and lgbgen workers is achieved via per-goroutine binding snapshots, keeping deterministic lowering intact without a global stack.\n\n## Derived pages\n\n[exec-context](concepts/exec-context/) \u00b7 [concurrency-model](concepts/concurrency-model/)\n\n# Citations\n", "sources/design-go-aot-backend": "\n## What this source is\n\nAn architectural design document proposing a second compilation backend that generates Go code from let-go bytecode. Rather than shipping only a bytecode interpreter ([../concepts/bytecode-compiler.md](concepts/bytecode-compiler/)), this backend compiles let-go functions directly to Go while keeping the runtime (`pkg/vm` and `pkg/rt`) intact, enabling mixed compiled+interpreted systems and zero-I/O distribution via Go binaries.\n\n## Key contributions\n\n**Two-tier staged approach:**\n1. Embedding tier: Emit Go that holds const pools and bytecode as static data, registering functions at `init()` without I/O.\n2. Native lowering tier: Translate let-go operations to structured Go code (loops, direct calls) eliminating the bytecode interpreter for hot functions.\n\n**Var-based interop boundary:** Compiled and interpreted code communicate via the same `Var` indirection mechanism, allowing dynamic redefinition and seamless calling in both directions. This is the critical design choice underlying mixed compiled+interpreted execution, central to [../ideas/self-hosting-aot.md](ideas/self-hosting-aot/).\n\n**Code generation strategy:** Use Go's `ast` package to safely lower bytecode to Go functions with signatures `func f(env *vm.Env, args []vm.Value) (vm.Value, error)`, translating bytecode ops to control flow and calls to runtime helpers. Stack slots become local variables; tail-calls transform to loops preserving TCO semantics.\n\n**Mixed execution semantics:** Compiled functions can call interpreted functions (and vice versa) through `Var` dereferencing, maintaining dynamic var semantics while extracting compilation benefits where profitable.\n\n## Derived pages\n\n[self-hosting-aot](ideas/self-hosting-aot/) \u00b7 [bytecode-to-go-translation](ideas/bytecode-to-go-translation/) \u00b7 [lg-compile](concepts/lg-compile/)\n\n## Citations\n\n- [../concepts/value-representation.md](concepts/value-representation/) \u2014 reuses `Value`/`Fn` interfaces and `vm.Int` fast paths\n- [../concepts/runtime-image.md](concepts/runtime-image/) \u2014 embedding tier is a Go-native alternative to image I/O\n- [../concepts/go-interop.md](concepts/go-interop/) \u2014 `NativeFn` registration and `Var` boundary design\n- [../sources/design-value-representation.md](sources/design-value-representation/) \u2014 numeric performance design referenced for fast paths\n", "sources/design-io-host-decoupling": "\n## What this is\n\nA design document from the let-go project articulating the architecture for separating I/O operations (output, input, event emit) from the concrete runtime host. It covers the problem (runtime reaching directly for `os.Stdout`, `syscall/js`, and host-specific shims), the solution (I/O seams as dynamic bindings over thin interfaces), and the shipping status across three platforms: native binary, Go embedder (`pkg/api`), and WebAssembly. Status is active; the design rationale stands as shipped PRs (#206, #207, #223, #231, #241, #244) landed the implementation.\n\n## Key takeaways\n\n- **The core abstraction:** The runtime exposes *I/O seams*\u2014dynamic variables (`*out*`, `*err*`, `*in*`) holding abstract handles over `io.Writer`, `io.Reader`, and capability interfaces. The host binds the concrete destination/source at construction; guest code names the capability (`println`, `read-key`, `emit`), and the host supplies the backend.\n\n- **One contract, three bindings:** Native CLI wraps `os.Stdout` / `os.Stdin`; Go embedder via `pkg/api` pushes per-`Run` bindings (e.g. `WithStdout`); WASM uses adapter bridges (`HostWriter`, `HostReader`) forwarding to the JS host. All three reach the same seam.\n\n- **Design principle:** \"Host-bound capabilities live in `pkg/rt`, never `pkg/vm`.\" The VM core remains free of host assumptions (no `syscall/js`, no file-descriptor interception). The seam is as thin as the operation allows\u2014output is a plain byte stream; input needs a slightly richer set (keystroke reading, pending-key check, terminal size, raw mode) because cross-platform semantics diverge.\n\n- **Status:** Shipped. All three streams now route through host-bound seams, eliminating the shim layer. The browser bundle no longer intercepts file descriptors. Client-owned shells launch via `-w-shell none` (#245), wiring peer capabilities through the same seam pattern.\n\n- **Open work:** Peer capabilities (graphics via sixel/canvas, audio, controller input) extend the model into #255. The cross-platform wake protocol for unblocking WASM reads without a real keystroke remains unresolved.\n\n## Derived pages\n\n- [io-host-decoupling](concepts/io-host-decoupling/)\n\n# Citations\n\n- `resource`: https://github.com/nooga/let-go/blob/main/docs/design/runtime-io-host-decoupling.md\n", "sources/design-ir-dynamic-vars": "\n# IR pipeline dynamic vars (design reference)\n\nDesign reference added in #555 (last-verified 2026-07-19). The pipeline is configured almost entirely through dynamic vars scattered across `core.lg`, `passes/pipeline.lg`, `passes/inline.lg`, `passes/fusion.lg`, `passes/typeinfer.lg`, and `lower_go.lg`; only `*strict-structured?*` has an environment seed. The page is the index.\n\n## Key takeaways\n\n- **Mode control:** `*ir-compile*`, `*ir-compile-verbose*`, `*ir-compile-fallback-log*`, `*target*` (`:bytecode` or `:go`).\n- **Cost of `*ir-compile*`:** pays back only on allocation-bound work (5 to 12 times fewer allocations, about 13% wall-clock, break-even near 64 runs on persistent-map); a net loss on compute-bound code. Figures from a single-machine gctrace proxy, directional not a contract.\n- **Pass toggles:** `*enable-fusion*` (on, measured about 20% fewer allocations across the test suite), `*enable-inline*` (off), `*max-unroll*`, `*typeinfer-max-drains*`, `*strict-structured?*`, `*direct-calls-disabled?*`, `*pass-trace*`.\n- **Cross-package lowering:** `*emit-exported-wrappers*`, `*cross-pkg-registry*`, `*wrapper-target-names*`, `*export-name-overrides*`, `*deftype-ctor-types*`.\n- **Verification:** any default flip is a coverage change until `make ir-stress` / `ir-stress-gate` / `jank-stress` / `parity-full` say otherwise; diff bucket tallies, rebaseline with the tool, never hand-edit the EDN.\n\n## Derived pages\n\n[compile-paths](concepts/compile-paths/) \u00b7 [ir-optimizations](concepts/ir-optimizations/) \u00b7 [go-backend](concepts/go-backend/)\n\n# Citations\n\n[1] https://github.com/nooga/let-go/blob/main/docs/design/ir-dynamic-vars.md\n", "sources/design-parallel-lowering": "\n# Parallel IR lowering, and a mergeable type-discovery cache\n\nA design note capturing the 2026-05-30 investigation into parallelizing the IR passes during `lgbgen --target=go`. The per-defn work (expand \u2192 build IR \u2192 optimize \u2192 typeinfer \u2192 lower) is embarrassingly parallel across function definitions in a namespace, but naive parallelization with `pmap` and `future` blocked on:\n\n1. **Binding spawn cost** \u2014 snapshots and reinstatement of dynamic bindings serialized the work; fixed via lock-free `Var.Deref` and a new eager `pmapv` primitive (1.24\u00d7 speedup, ~1.9 effective cores on the `core` namespace lowering).\n\n2. **Non-deterministic output** \u2014 gensym counters and wall-clock type-inference budgets introduced scheduling-dependent variation in generated code. Deterministic naming (strip gensym suffixes, sort imports) addresses symbol sources; the wall-clock budget remains the fundamental blocker.\n\n## Key contribution\n\nA **mergeable type-discovery cache** that decouples type inference results from execution pressure. Because type inference is monotone (types only move up the lattice), the cache can merge discoveries across parallel workers deterministically. The cache converges to a fixpoint via interprocedural iteration, is committed as a build artifact (like the `.lgb` bundle and lowered tree), and enables parallel lowering that is both fast and reproducible without capping inference precision.\n\n# Citations\n\n| Source | Date | Status |\n|--------|------|--------|\n| [Parallel IR lowering and type-discovery cache design](https://github.com/nooga/let-go/blob/main/docs/design/parallel-lowering-and-type-cache.md) | 2026-06-05 | Active |\n", "sources/design-pods": "\n## Pods \u2014 Babashka-compatible external process integration\n\nThis source proposes implementing Babashka-compatible pods to provide an industrial-strength extension mechanism without relying on Go plugins. Pods are external processes speaking a simple EDN-based RPC over stdio (or TCP). let-go acts as a host, enabling script-friendly access to system APIs, databases, and tools while staying safe and portable.\n\n### Key takeaways\n\n- **Protocol compatibility**: Pods follow the Babashka pod protocol with EDN-encoded, newline-delimited messages over stdio (or TCP). Operations include `:describe` (introspection), `:invoke` (function calls), and `:shutdown`.\n- **Host architecture**: Pod manager spawns processes, sends descriptors, materializes proxy namespaces, and maintains goroutines for request/response routing.\n- **Proxy functions**: Each described pod var becomes a let-go `Fn` that serializes args to EDN, sends an `:invoke` request with unique `:id`, awaits response, and maps results back to let-go values.\n- **Data mapping**: Scalars and collections (vectors, lists, maps, sets) map 1:1 between EDN and let-go types; future tagged literals for extensions.\n- **Concurrency & security**: Per-request contexts with timeouts; allowlist/denylist; resource limits on CPU, memory, and concurrent calls.\n- **Developer ergonomics**: Host API via `pods/load`, `pods/unload`, `pods/list`; CLI helpers for `describe` and `run`.\n- **MVP scope**: Load and invoke Babashka pods via stdio with structured args, error handling, and timeouts. Stretch goals include TCP, streaming, and binary/transit encoding.\n\n## Derived pages\n\n- [pods](concepts/pods/)\n\n## Citations\n\n- Babashka pod protocol (external standard; described in design)\n- let-go [runtime](concepts/runtime-image/) value representation\n- let-go [Go interop](concepts/go-interop/)\n", "sources/design-runtime-image": "\n## What This Source Is\n\nAuthoritative design document for runtime image serialization and caching in let-go. Specifies the mechanism for snapshotting bytecode, heap state, and namespaces to a binary image format, enabling cold-start performance, reproducible deployments, and embedded applications.\n\n## Key Contributions\n\n**Instant startup**: Images skip reader/analyzer/compiler phases on boot, eliminating heavy initialization.\n\n**Image scope**: Captures namespaces, vars, functions/closures with bytecode, constant pools, and intern tables; excludes non-serializable host pointers (Go values), channels, OS handles, and goroutines.\n\n**Layered architecture**: Base image (stdlib only) can be loaded independently; app-specific images layer atop without reloading stdlib.\n\n**Host binding**: Extern placeholders for native functions resolved at load-time via a configurable `HostRegistry`, with validation of signatures and arity.\n\n**Versioning and safety**: Images carry schema, runtime, and content hashes; loader rejects incompatible versions and treats images as untrusted input with hash/signature validation.\n\n**Serialization strategy**: Persistent encodings (BPTR, HAMT) for collections; deterministic symbol/keyword interning rebuilt during load; no serialized hash caches.\n\n## Derived pages\n\n- [runtime-image](concepts/runtime-image/)\n\n# Citations\n\nResource: https://github.com/nooga/let-go/blob/main/docs/design/runtime-image-and-stdlib-cache.md\n", "sources/design-value-representation": "\n## What this source is\n\nThis is a design document from the let-go repository that documents how values (especially numeric types) are represented in the let-go VM, their performance implications in Go, and a detailed checklist of actionable optimizations.\n\n## Key takeaways and contributions\n\n- **Current architecture**: Values are represented through a `Value` interface with `Type()`, `Unbox()`, and `String()` methods. The `Int` type is stored directly in interface words, avoiding heap allocation.\n\n- **Performance characteristics**: Method calls on value receivers are cheap, but repeated `Unbox()` + type assertion in tight loops adds unnecessary overhead. Reflection in `BoxValue` is expensive and should be reserved for interop boundaries only.\n\n- **Optimization opportunities**:\n  - Replace `Unbox().(int)` patterns with direct `Int` assertions in numeric natives to eliminate redundant method calls and type assertions\n  - Change `Int.String()` from `fmt.Sprintf` to `strconv.Itoa` for faster string conversion\n  - Prefer `Wrap`/`WrapNoErr` over `Box` for native function registration in hot paths\n  - Avoid calling `BoxValue` in loops; convert inputs once before iteration\n\n- **Specific action items**: The document provides concrete optimizations for `pkg/vm/value.go`, `pkg/vm/int.go`, `pkg/rt/lang.go`, and `pkg/vm/native_func.go`, plus a checklist of microbenchmarks to validate improvements.\n\n## Derived pages\n\n- [va
